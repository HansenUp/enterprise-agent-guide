模型能否决定下一步”作为边界，而不只看是否有聊天界面。给菜单打标的一次模型调用是 AI 应用，但未必需要自治 Agent。<a class=\"ref\" href=\"#source-S01\" aria-label=\"查看来源 S01\">[S01]<\/a><\/p>", "definition": "Agent 是围绕目标观察环境、选择动作、使用工具并根据结果继续行动的软件系统。", "search": "C001 Agent（智能体） 【基础】 Agent 是围绕目标观察环境、选择动作、使用工具并根据结果继续行动的软件系统。企业讨论中宜把“模型能否决定下一步”作为边界，而不只看是否有聊天界面。给菜单打标的一次模型调用是 AI 应用，但未必需要自治 Agent。[S01] Agent 智能体", "refs": ["S01"]}, {"id": "C002", "name": "Agentic Workflow / Deterministic Workflow（智能体工作流／确定性工作流）", "status": "基础", "chapter": "ch-2", "chapterName": "基本构成与能力边界", "html": "<p>工作流预先规定步骤和分支，模型完成其中的理解、生成或局部决策；Agentic Workflow 是较宽泛称呼，并无全行业统一定义。审批、结算、入库等硬规则应落在代码或流程引擎中。可预测业务采用工作流通常更容易验收，不是落后方案。<\/p>", "definition": "工作流预先规定步骤和分支，模型完成其中的理解、生成或局部决策；Agentic Workflow 是较宽泛称呼，并无全行业统一定义。", "search": "C002 Agentic Workflow / Deterministic Workflow（智能体工作流／确定性工作流） 【基础】 工作流预先规定步骤和分支，模型完成其中的理解、生成或局部决策；Agentic Workflow 是较宽泛称呼，并无全行业统一定义。审批、结算、入库等硬规则应落在代码或流程引擎中。可预测业务采用工作流通常更容易验收，不是落后方案。 Agentic Workflow 与确定性工作流", "refs": []}, {"id": "C003", "name": "Copilot / Autonomy Levels（协作助手／自主等级）", "status": "基础", "chapter": "ch-2", "chapterName": "基本构成与能力边界", "html": "<p>Copilot 通常把建议交给人执行；自主 Agent 可以在授权范围内执行动作。推荐自行划分“只读分析、生成草稿、确认后写入、限额自动执行”四级，它是平台治理分级，不是通用国际标准。级别应按动作风险设置，而不是给整个模型贴一个权限标签。<\/p>", "definition": "Copilot 通常把建议交给人执行；自主 Agent 可以在授权范围内执行动作。", "search": "C003 Copilot / Autonomy Levels（协作助手／自主等级） 【基础】 Copilot 通常把建议交给人执行；自主 Agent 可以在授权范围内执行动作。推荐自行划分“只读分析、生成草稿、确认后写入、限额自动执行”四级，它是平台治理分级，不是通用国际标准。级别应按动作风险设置，而不是给整个模型贴一个权限标签。 Copilot 与自主等级", "refs": []}, {"id": "C004", "name": "Agent Loop（智能体观察、决策与行动循环）", "status": "基础", "chapter": "ch-2", "chapterName": "基本构成与能力边界", "html": "<p>一次循环包含获取任务状态、构建上下文、模型决策、验证调用、执行工具及检查结果。停止条件包括成功证据、预算耗尽、取消、等待输入或不可恢复故障。while 循环只是代码外观；最大步数、失败判定、状态落盘才决定能否可靠运行。<\/p>", "definition": "一次循环包含获取任务状态、构建上下文、模型决策、验证调用、执行工具及检查结果。", "search": "C004 Agent Loop（智能体观察、决策与行动循环） 【基础】 一次循环包含获取任务状态、构建上下文、模型决策、验证调用、执行工具及检查结果。停止条件包括成功证据、预算耗尽、取消、等待输入或不可恢复故障。while 循环只是代码外观；最大步数、失败判定、状态落盘才决定能否可靠运行。 Agent Loop 观察决策行动循环", "refs": []}, {"id": "C005", "name": "Harness（运行约束与执行框架）", "status": "增强", "chapter": "ch-2", "chapterName": "基本构成与能力边界", "html": "<p>Harness 包含模型外部的任务推进、上下文组装、工具分派、验证、恢复和预算控制；术语在不同项目中边界略有差异。它不同于一份 Prompt，也不要求固定节点或角色数量。用评测证明每个节点的作用，模型升级后删除无收益的补丁。<a class=\"ref\" href=\"#source-S03\" aria-label=\"查看来源 S03\">[S03]<\/a><a class=\"ref\" href=\"#source-S04\" aria-label=\"查看来源 S04\">[S04]<\/a><\/p>", "definition": "Harness 包含模型外部的任务推进、上下文组装、工具分派、验证、恢复和预算控制；术语在不同项目中边界略有差异。", "search": "C005 Harness（运行约束与执行框架） 【增强】 Harness 包含模型外部的任务推进、上下文组装、工具分派、验证、恢复和预算控制；术语在不同项目中边界略有差异。它不同于一份 Prompt，也不要求固定节点或角色数量。用评测证明每个节点的作用，模型升级后删除无收益的补丁。[S03][S04] Harness 运行约束与执行框架", "refs": ["S03", "S04"]}, {"id": "C006", "name": "Model / Tool / Environment（模型／工具／环境）", "status": "基础", "chapter": "ch-2", "chapterName": "基本构成与能力边界", "html": "<p>模型提出动作；工具提供可执行契约；环境保存真实资源和反馈；运行时控制能否执行。模型声称“客户已更新”不构成成功，必须由 CRM 的结果或后续查询验证。把这四者分离，可单独升级模型、替换连接器或重建沙箱，避免把全部状态绑定在一个进程。<a class=\"ref\" href=\"#source-S05\" aria-label=\"查看来源 S05\">[S05]<\/a><\/p>\n<p>工程练习：把“分析客户并安排回访”拆成只读数据获取、建议生成、用户确认、创建回访任务和结果核验；指出哪些步骤需要模型，哪些不需要。<\/p>", "definition": "模型提出动作；工具提供可执行契约；环境保存真实资源和反馈；运行时控制能否执行。", "search": "C006 Model / Tool / Environment（模型／工具／环境） 【基础】 模型提出动作；工具提供可执行契约；环境保存真实资源和反馈；运行时控制能否执行。模型声称“客户已更新”不构成成功，必须由 CRM 的结果或后续查询验证。把这四者分离，可单独升级模型、替换连接器或重建沙箱，避免把全部状态绑定在一个进程。[S05]\n\n工程练习：把“分析客户并安排回访”拆成只读数据获取、建议生成、用户确认、创建回访任务和结果核验；指出哪些步骤需要模型，哪些不需要。 模型与工具与环境", "refs": ["S05"]}, {"id": "C007", "name": "Token / Context Window（词元／上下文窗口）", "status": "基础", "chapter": "ch-3", "chapterName": "模型与推理的基础", "html": "<p>Token 是模型处理文本等输入的计量单元，不等于汉字或单词。上下文窗口是一次推理可处理的输入与相关输出容量约束，规则依模型而异。容量大不代表所有位置的信息都能同样可靠地利用；平台要预算系统指令、工具定义、检索内容、历史和输出。<\/p>", "definition": "Token 是模型处理文本等输入的计量单元，不等于汉字或单词。", "search": "C007 Token / Context Window（词元／上下文窗口） 【基础】 Token 是模型处理文本等输入的计量单元，不等于汉字或单词。上下文窗口是一次推理可处理的输入与相关输出容量约束，规则依模型而异。容量大不代表所有位置的信息都能同样可靠地利用；平台要预算系统指令、工具定义、检索内容、历史和输出。 Token 与上下文窗口", "refs": []}, {"id": "C008", "name": "Autoregressive Generation / Sampling（自回归生成／采样）", "status": "基础", "chapter": "ch-3", "chapterName": "模型与推理的基础", "html": "<p>常见语言模型逐步生成后续 Token。Temperature、top_p 等参数影响输出分布，但可用参数和语义因模型而异。temperature 为零不保证跨版本、跨服务实例绝对确定，也不能使错误事实变正确。稳定生产应依靠结构校验、版本固定与回归测试。<\/p>", "definition": "常见语言模型逐步生成后续 Token。", "search": "C008 Autoregressive Generation / Sampling（自回归生成／采样） 【基础】 常见语言模型逐步生成后续 Token。Temperature、top_p 等参数影响输出分布，但可用参数和语义因模型而异。temperature 为零不保证跨版本、跨服务实例绝对确定，也不能使错误事实变正确。稳定生产应依靠结构校验、版本固定与回归测试。 自回归生成与采样", "refs": []}, {"id": "C009", "name": "Reasoning Model / Reasoning Budget（推理模型／推理预算）", "status": "增强", "chapter": "ch-3", "chapterName": "模型与推理的基础", "html": "<p>推理模型可能在回答前投入更多内部计算；可配置的推理强度是质量、时延和成本的取舍。复杂分析可以受益，简单打标未必需要最高档。内部推理过程不等于可审计业务依据；向用户提供来源、约束、结论和可验证步骤即可。<a class=\"ref\" href=\"#source-S11\" aria-label=\"查看来源 S11\">[S11]<\/a><\/p>", "definition": "推理模型可能在回答前投入更多内部计算；可配置的推理强度是质量、时延和成本的取舍。", "search": "C009 Reasoning Model / Reasoning Budget（推理模型／推理预算） 【增强】 推理模型可能在回答前投入更多内部计算；可配置的推理强度是质量、时延和成本的取舍。复杂分析可以受益，简单打标未必需要最高档。内部推理过程不等于可审计业务依据；向用户提供来源、约束、结论和可验证步骤即可。[S11] 推理模型与推理预算", "refs": ["S11"]}, {"id": "C010", "name": "Multimodality（多模态）/ ASR（Automatic Speech Recognition，自动语音识别）/ OCR（Optical Character Recognition，光学字符识别）", "status": "基础", "chapter": "ch-3", "chapterName": "模型与推理的基础", "html": "<p>多模态模型可以处理文字、图像、音频等；ASR 将语音转文本，OCR 提取图中文字。CRM 录音还涉及说话人分离、时间戳、专有名词纠错与实体关联。转写是有误差的数据源，客户承诺、数量和商品名要能定位回原录音片段，不应被当成绝对事实。<\/p>", "definition": "多模态模型可以处理文字、图像、音频等；ASR 将语音转文本，OCR 提取图中文字。", "search": "C010 Multimodality（多模态）/ ASR（Automatic Speech Recognition，自动语音识别）/ OCR（Optical Character Recognition，光学字符识别） 【基础】 多模态模型可以处理文字、图像、音频等；ASR 将语音转文本，OCR 提取图中文字。CRM 录音还涉及说话人分离、时间戳、专有名词纠错与实体关联。转写是有误差的数据源，客户承诺、数量和商品名要能定位回原录音片段，不应被当成绝对事实。 多模态与 ASR 与 OCR", "refs": []}, {"id": "C011", "name": "Embedding / Reranker（嵌入表示／重排模型）", "status": "基础", "chapter": "ch-3", "chapterName": "模型与推理的基础", "html": "<p>Embedding 把文本等映射为向量，便于相似性检索；Reranker 对候选与问题的相关程度重新评分。两者通常不是同一模型。向量距离不等于业务置信概率。更换 Embedding 后一般需要版本化索引并重建相应向量，不能无验证混用不同向量空间。<\/p>", "definition": "Embedding 把文本等映射为向量，便于相似性检索；Reranker 对候选与问题的相关程度重新评分。", "search": "C011 Embedding / Reranker（嵌入表示／重排模型） 【基础】 Embedding 把文本等映射为向量，便于相似性检索；Reranker 对候选与问题的相关程度重新评分。两者通常不是同一模型。向量距离不等于业务置信概率。更换 Embedding 后一般需要版本化索引并重建相应向量，不能无验证混用不同向量空间。 Embedding 与 Reranker", "refs": []}, {"id": "C012", "name": "Model Routing / Capability Matrix（模型路由／能力矩阵）", "status": "增强", "chapter": "ch-3", "chapterName": "模型与推理的基础", "html": "<p>按任务复杂度、隐私要求、语言、结构化输出、工具能力与成本选模型。网关应维护能力矩阵，而不是把所有供应商当作同一个接口。主模型失败时，降级模型可能不支持相同 Schema、上下文或工具并发，需要回退到受限方案而非悄悄降质。<\/p>\n<p>架构建议：不要在指南中永久固定“最强模型”。维护带日期的企业评测榜，至少比较完成率、错误动作率、p95 完成时延与每次成功任务成本。<\/p>", "definition": "按任务复杂度、隐私要求、语言、结构化输出、工具能力与成本选模型。", "search": "C012 Model Routing / Capability Matrix（模型路由／能力矩阵） 【增强】 按任务复杂度、隐私要求、语言、结构化输出、工具能力与成本选模型。网关应维护能力矩阵，而不是把所有供应商当作同一个接口。主模型失败时，降级模型可能不支持相同 Schema、上下文或工具并发，需要回退到受限方案而非悄悄降质。\n\n架构建议：不要在指南中永久固定“最强模型”。维护带日期的企业评测榜，至少比较完成率、错误动作率、p95 完成时延与每次成功任务成本。 模型路由与能力矩阵", "refs": []}, {"id": "C013", "name": "System / Developer / User Instructions（系统／开发者／用户指令）", "status": "基础", "chapter": "ch-4", "chapterName": "指令工程", "html": "<p>不同角色表达平台规则、应用规则和用户目标，具体优先级由模型供应商定义。企业业务授权必须由服务端校验，不能仅靠高优先级提示词。网页、知识库、录音转写中的“请忽略规则”属于数据，不能升级成平台指令。<\/p>", "definition": "不同角色表达平台规则、应用规则和用户目标，具体优先级由模型供应商定义。", "search": "C013 System / Developer / User Instructions（系统／开发者／用户指令） 【基础】 不同角色表达平台规则、应用规则和用户目标，具体优先级由模型供应商定义。企业业务授权必须由服务端校验，不能仅靠高优先级提示词。网页、知识库、录音转写中的“请忽略规则”属于数据，不能升级成平台指令。 System 与 Developer 与 User 指令", "refs": []}, {"id": "C014", "name": "Prompt Template / Prompt Versioning（提示词模板／版本管理）", "status": "基础", "chapter": "ch-4", "chapterName": "指令工程", "html": "<p>Prompt 定义任务、输入边界、输出契约和异常处理。建议将其作为配置资产纳入代码审查、版本发布、回滚和评测，而不是让每个销售或开发人员各自维护一份万能提示词。模板中留出受控变量，防止把用户内容直接拼入系统规则区。<\/p>", "definition": "Prompt 定义任务、输入边界、输出契约和异常处理。", "search": "C014 Prompt Template / Prompt Versioning（提示词模板／版本管理） 【基础】 Prompt 定义任务、输入边界、输出契约和异常处理。建议将其作为配置资产纳入代码审查、版本发布、回滚和评测，而不是让每个销售或开发人员各自维护一份万能提示词。模板中留出受控变量，防止把用户内容直接拼入系统规则区。 Prompt 模板与版本管理", "refs": []}, {"id": "C015", "name": "Zero-shot / Few-shot Prompting（零样本／少样本提示）", "status": "基础", "chapter": "ch-4", "chapterName": "指令工程", "html": "<p>Zero shot 不提供示例；Few shot 用少量输入输出示例表达标准。菜单打标可提供易混品牌、同名菜及未知类别示例。示例要覆盖边界而非重复常见样本，并与正式标签表同步。示例数量不是越多越好，应以独立测试集效果判断。<a class=\"ref\" href=\"#source-S11\" aria-label=\"查看来源 S11\">[S11]<\/a><\/p>", "definition": "Zero shot 不提供示例；Few shot 用少量输入输出示例表达标准。", "search": "C015 Zero-shot / Few-shot Prompting（零样本／少样本提示） 【基础】 Zero shot 不提供示例；Few shot 用少量输入输出示例表达标准。菜单打标可提供易混品牌、同名菜及未知类别示例。示例要覆盖边界而非重复常见样本，并与正式标签表同步。示例数量不是越多越好，应以独立测试集效果判断。[S11] Zero shot 与 Few shot", "refs": ["S11"]}, {"id": "C016", "name": "CoT（Chain of Thought，思维链）/ Explainable Results（可解释结果）", "status": "条件", "chapter": "ch-4", "chapterName": "指令工程", "html": "<p>Chain of Thought 指通过中间推理组织求解的方法。显式要求“逐步思考”在部分早期模型有效，但推理模型未必需要，官方亦可能建议避免此类提示。不能将模型生成的思路当作真实因果或审计记录。保留事实依据、工具结果和决策摘要更实用。<a class=\"ref\" href=\"#source-S11\" aria-label=\"查看来源 S11\">[S11]<\/a><\/p>", "definition": "Chain of Thought 指通过中间推理组织求解的方法。", "search": "C016 CoT（Chain of Thought，思维链）/ Explainable Results（可解释结果） 【条件】 Chain of Thought 指通过中间推理组织求解的方法。显式要求“逐步思考”在部分早期模型有效，但推理模型未必需要，官方亦可能建议避免此类提示。不能将模型生成的思路当作真实因果或审计记录。保留事实依据、工具结果和决策摘要更实用。[S11] CoT 与可解释结果", "refs": ["S11"]}, {"id": "C017", "name": "Structured Output / JSON Schema（结构化输出／JSON 结构规范）", "status": "基础", "chapter": "ch-4", "chapterName": "指令工程", "html": "<p>结构化输出约束字段、类型、枚举等，通常比“请输出 JSON”更可靠。JSON 语法正确、Schema 合法、业务值正确是三层不同标准。Schema 能限制 stage 为枚举，却不能证明客户真的处于该阶段；还需业务规则、来源核验及拒答处理。<a class=\"ref\" href=\"#source-S12\" aria-label=\"查看来源 S12\">[S12]<\/a><\/p>", "definition": "结构化输出约束字段、类型、枚举等，通常比“请输出 JSON”更可靠。", "search": "C017 Structured Output / JSON Schema（结构化输出／JSON 结构规范） 【基础】 结构化输出约束字段、类型、枚举等，通常比“请输出 JSON”更可靠。JSON 语法正确、Schema 合法、业务值正确是三层不同标准。Schema 能限制 stage 为枚举，却不能证明客户真的处于该阶段；还需业务规则、来源核验及拒答处理。[S12] Structured Output 与 JSON Schema", "refs": ["S12"]}, {"id": "C018", "name": "Prompt Optimization / Prompt Injection（提示词优化／提示注入）", "status": "增强", "chapter": "ch-4", "chapterName": "指令工程", "html": "<p>手工或自动优化 Prompt，应先定义指标、训练样例和保留测试集。避免针对同一批测试题反复调参而报告虚高收益。Prompt injection 是不可信数据诱导越权，不是简单的“提示词写得不好”；它需要执行边界与权限控制，不能用更长 Prompt 根治。<a class=\"ref\" href=\"#source-S13\" aria-label=\"查看来源 S13\">[S13]<\/a><a class=\"ref\" href=\"#source-S14\" aria-label=\"查看来源 S14\">[S14]<\/a><\/p>\n<p>实践要求：每份项目级 Prompt 至少说明输入来源、允许工具、事实与推断的表达方式、缺失信息处理、输出字段和禁止的动作，并配对应失败样例。<\/p>", "definition": "手工或自动优化 Prompt，应先定义指标、训练样例和保留测试集。", "search": "C018 Prompt Optimization / Prompt Injection（提示词优化／提示注入） 【增强】 手工或自动优化 Prompt，应先定义指标、训练样例和保留测试集。避免针对同一批测试题反复调参而报告虚高收益。Prompt injection 是不可信数据诱导越权，不是简单的“提示词写得不好”；它需要执行边界与权限控制，不能用更长 Prompt 根治。[S13][S14]\n\n实践要求：每份项目级 Prompt 至少说明输入来源、允许工具、事实与推断的表达方式、缺失信息处理、输出字段和禁止的动作，并配对应失败样例。 Prompt 优化与提示注入边界", "refs": ["S13", "S14"]}, {"id": "C019", "name": "Context Engineering（上下文工程）", "status": "增强", "chapter": "ch-5", "chapterName": "Context Engineering（上下文工程）", "html": "<p>上下文工程决定每轮模型实际看到什么，包括规则、工具、任务状态、证据、历史和记忆。Prompt 工程是其中一部分，并未被替代。CRM 场景应按客户、时间范围与访问权限组装材料，优先放任务所需证据，而非一次塞入所有销售记录。<a class=\"ref\" href=\"#source-S02\" aria-label=\"查看来源 S02\">[S02]<\/a><\/p>", "definition": "上下文工程决定每轮模型实际看到什么，包括规则、工具、任务状态、证据、历史和记忆。", "search": "C019 Context Engineering（上下文工程） 【增强】 上下文工程决定每轮模型实际看到什么，包括规则、工具、任务状态、证据、历史和记忆。Prompt 工程是其中一部分，并未被替代。CRM 场景应按客户、时间范围与访问权限组装材料，优先放任务所需证据，而非一次塞入所有销售记录。[S02] Context Engineering", "refs": ["S02"]}, {"id": "C020", "name": "Context Budget / Information Density（上下文预算／信息密度）", "status": "基础", "chapter": "ch-5", "chapterName": "Context Engineering（上下文工程）", "html": "<p>为不同上下文组成分配容量，并为模型输出预留空间。预算策略应依据任务测试调整，不宜用固定比例套所有场景。检索结果可返回摘要加定位符；大型报表先计算聚合再送模型。压缩 Token 的同时不能丢失否定词、时间、单位和来源。<\/p>", "definition": "为不同上下文组成分配容量，并为模型输出预留空间。", "search": "C020 Context Budget / Information Density（上下文预算／信息密度） 【基础】 为不同上下文组成分配容量，并为模型输出预留空间。预算策略应依据任务测试调整，不宜用固定比例套所有场景。检索结果可返回摘要加定位符；大型报表先计算聚合再送模型。压缩 Token 的同时不能丢失否定词、时间、单位和来源。 Context Budget 与信息密度", "refs": []}, {"id": "C021", "name": "Just-in-Time Retrieval / Progressive Disclosure（即时检索／渐进披露）", "status": "增强", "chapter": "ch-5", "chapterName": "Context Engineering（上下文工程）", "html": "<p>先给模型目录、工具摘要或证据引用，需要时再加载细节。适合代码仓库、大知识库与复杂客户档案。收益是降低上下文负担，代价是额外调用和搜索失败。高频必需数据可预取，未知部分再探索；权限检查必须随每次读取执行。<a class=\"ref\" href=\"#source-S02\" aria-label=\"查看来源 S02\">[S02]<\/a><\/p>", "definition": "先给模型目录、工具摘要或证据引用，需要时再加载细节。", "search": "C021 Just-in-Time Retrieval / Progressive Disclosure（即时检索／渐进披露） 【增强】 先给模型目录、工具摘要或证据引用，需要时再加载细节。适合代码仓库、大知识库与复杂客户档案。收益是降低上下文负担，代价是额外调用和搜索失败。高频必需数据可预取，未知部分再探索；权限检查必须随每次读取执行。[S02] Just in Time Retrieval 与渐进披露", "refs": ["S02"]}, {"id": "C022", "name": "Compaction / Summary Distortion（上下文压缩／摘要失真）", "status": "增强", "chapter": "ch-5", "chapterName": "Context Engineering（上下文工程）", "html": "<p>Compaction 用摘要或结构化状态替换部分历史，帮助长任务继续。应保留目标、已验证事实、未决问题、产物位置和不可逆动作记录，并允许回查原始事件。不要只保存模型自由总结：它可能把推断变事实，或忘记已执行过一次写操作。<a class=\"ref\" href=\"#source-S05\" aria-label=\"查看来源 S05\">[S05]<\/a><\/p>", "definition": "Compaction 用摘要或结构化状态替换部分历史，帮助长任务继续。", "search": "C022 Compaction / Summary Distortion（上下文压缩／摘要失真） 【增强】 Compaction 用摘要或结构化状态替换部分历史，帮助长任务继续。应保留目标、已验证事实、未决问题、产物位置和不可逆动作记录，并允许回查原始事件。不要只保存模型自由总结：它可能把推断变事实，或忘记已执行过一次写操作。[S05] Compaction 与摘要失真", "refs": ["S05"]}, {"id": "C023", "name": "Context Rot / Lost in the Middle（上下文退化／中间信息遗漏）", "status": "条件", "chapter": "ch-5", "chapterName": "Context Engineering（上下文工程）", "html": "<p>这些术语描述长上下文下性能下降或信息位置影响，不代表每个模型在所有任务中有同样退化。通过打乱证据位置、加入干扰文本、延长历史来测试自己的任务。更大的窗口能缓解容量不足，却不能解决权限、数据过期和来源冲突。<a class=\"ref\" href=\"#source-S02\" aria-label=\"查看来源 S02\">[S02]<\/a><\/p>", "definition": "这些术语描述长上下文下性能下降或信息位置影响，不代表每个模型在所有任务中有同样退化。", "search": "C023 Context Rot / Lost in the Middle（上下文退化／中间信息遗漏） 【条件】 这些术语描述长上下文下性能下降或信息位置影响，不代表每个模型在所有任务中有同样退化。通过打乱证据位置、加入干扰文本、延长历史来测试自己的任务。更大的窗口能缓解容量不足，却不能解决权限、数据过期和来源冲突。[S02] Context Rot 与 Lost in the Middle", "refs": ["S02"]}, {"id": "C024", "name": "Citation / Context Provenance（证据引用／上下文来源追踪）", "status": "基础", "chapter": "ch-5", "chapterName": "Context Engineering（上下文工程）", "html": "<p>每个重要事实应关联原文片段、业务对象、时间戳与版本。摘要保留引用，推荐区分“客户说过”“CRM 已确认”“模型推断”。引用只是定位能力，仍需检查来源是否支持结论；指向正确文件但错误段落也不能算事实正确。<\/p>\n<p>平台建议：设计 Context Builder 服务，在模型前统一执行身份过滤、来源选择、去重、长度控制和引用分配；记录所用材料版本，但不要默认把全部敏感原文写入普通日志。<\/p>", "definition": "每个重要事实应关联原文片段、业务对象、时间戳与版本。", "search": "C024 Citation / Context Provenance（证据引用／上下文来源追踪） 【基础】 每个重要事实应关联原文片段、业务对象、时间戳与版本。摘要保留引用，推荐区分“客户说过”“CRM 已确认”“模型推断”。引用只是定位能力，仍需检查来源是否支持结论；指向正确文件但错误段落也不能算事实正确。\n\n平台建议：设计 Context Builder 服务，在模型前统一执行身份过滤、来源选择、去重、长度控制和引用分配；记录所用材料版本，但不要默认把全部敏感原文写入普通日志。 证据引用与 Context Provenance", "refs": []}, {"id": "C025", "name": "Session / Thread / Run（会话／对话线程／任务运行）", "status": "基础", "chapter": "ch-6", "chapterName": "记忆与知识边界", "html": "<p>Session 或 Thread 通常承载连续交互，Run 表示一次任务执行；供应商命名不完全一致。它们不等于模型上下文窗口。一次会话可跨多次任务，多轮模型调用也可服务同一任务。企业平台应自定义稳定标识，避免把业务数据主键绑定到供应商线程 ID。<\/p>", "definition": "Session 或 Thread 通常承载连续交互，Run 表示一次任务执行；供应商命名不完全一致。", "search": "C025 Session / Thread / Run（会话／对话线程／任务运行） 【基础】 Session 或 Thread 通常承载连续交互，Run 表示一次任务执行；供应商命名不完全一致。它们不等于模型上下文窗口。一次会话可跨多次任务，多轮模型调用也可服务同一任务。企业平台应自定义稳定标识，避免把业务数据主键绑定到供应商线程 ID。 Session 与 Thread 与 Run", "refs": []}, {"id": "C026", "name": "Working Memory（工作记忆）", "status": "基础", "chapter": "ch-6", "chapterName": "记忆与知识边界", "html": "<p>保存当前任务的临时状态、已读证据、工具结果与未完成步骤。适合放在结构化任务状态和可恢复存储中，部分内容按需进入 Prompt。缓存被清理不应导致任务事实永久丢失；短期记忆也应有租户和会话隔离。<a class=\"ref\" href=\"#source-S15\" aria-label=\"查看来源 S15\">[S15]<\/a><\/p>", "definition": "保存当前任务的临时状态、已读证据、工具结果与未完成步骤。", "search": "C026 Working Memory（工作记忆） 【基础】 保存当前任务的临时状态、已读证据、工具结果与未完成步骤。适合放在结构化任务状态和可恢复存储中，部分内容按需进入 Prompt。缓存被清理不应导致任务事实永久丢失；短期记忆也应有租户和会话隔离。[S15] Working Memory 短期工作记忆", "refs": ["S15"]}, {"id": "C027", "name": "Semantic Memory / Episodic Memory（语义记忆／情景记忆）", "status": "条件", "chapter": "ch-6", "chapterName": "记忆与知识边界", "html": "<p>语义记忆保存相对稳定的事实；情景记忆保存某次交互或事件经历。客户主营川菜可以是待确认事实，上次因配送范围未成交是带时间的事件。保存来源、有效期和确认状态，客户变更经营方向后应覆盖或失效旧信息。<a class=\"ref\" href=\"#source-S15\" aria-label=\"查看来源 S15\">[S15]<\/a><\/p>", "definition": "语义记忆保存相对稳定的事实；情景记忆保存某次交互或事件经历。", "search": "C027 Semantic Memory / Episodic Memory（语义记忆／情景记忆） 【条件】 语义记忆保存相对稳定的事实；情景记忆保存某次交互或事件经历。客户主营川菜可以是待确认事实，上次因配送范围未成交是带时间的事件。保存来源、有效期和确认状态，客户变更经营方向后应覆盖或失效旧信息。[S15] Semantic 与 Episodic Memory", "refs": ["S15"]}, {"id": "C028", "name": "Procedural Memory / Skill（程序性记忆／技能）", "status": "增强", "chapter": "ch-6", "chapterName": "记忆与知识边界", "html": "<p>程序性记忆保存做事方法，如新品分析流程或发布检查清单。可实现为经审查的技能包、规则或模板，不必采用向量库。将单次成功经验直接推广为通用规范容易误导；需要适用条件、反例、版本与维护人。<a class=\"ref\" href=\"#source-S15\" aria-label=\"查看来源 S15\">[S15]<\/a><a class=\"ref\" href=\"#source-S16\" aria-label=\"查看来源 S16\">[S16]<\/a><\/p>", "definition": "程序性记忆保存做事方法，如新品分析流程或发布检查清单。", "search": "C028 Procedural Memory / Skill（程序性记忆／技能） 【增强】 程序性记忆保存做事方法，如新品分析流程或发布检查清单。可实现为经审查的技能包、规则或模板，不必采用向量库。将单次成功经验直接推广为通用规范容易误导；需要适用条件、反例、版本与维护人。[S15][S16] Procedural Memory 与技能", "refs": ["S15", "S16"]}, {"id": "C029", "name": "Memory Lifecycle（记忆写入、合并与遗忘）", "status": "基础", "chapter": "ch-6", "chapterName": "记忆与知识边界", "html": "<p>记忆生命周期包括候选提取、验证、去重、冲突处理、更新、过期与删除。模型说“用户喜欢高价商品”不应自动成为客户永久标签。建议敏感或影响业务判断的事实经过业务确认，并让删除同步到缓存、向量索引和衍生摘要。<\/p>", "definition": "记忆生命周期包括候选提取、验证、去重、冲突处理、更新、过期与删除。", "search": "C029 Memory Lifecycle（记忆写入、合并与遗忘） 【基础】 记忆生命周期包括候选提取、验证、去重、冲突处理、更新、过期与删除。模型说“用户喜欢高价商品”不应自动成为客户永久标签。建议敏感或影响业务判断的事实经过业务确认，并让删除同步到缓存、向量索引和衍生摘要。 记忆写入与合并与遗忘", "refs": []}, {"id": "C030", "name": "Source of Truth / Knowledge Base / Memory（权威事实源／知识库／记忆）", "status": "基础", "chapter": "ch-6", "chapterName": "记忆与知识边界", "html": "<p>业务事实源如 CRM、ERP 保存权威状态；知识库提供制度和参考资料；Agent 记忆保存交互经验。三者不能合并为一张“万能向量表”。库存、价格、授信与合同状态查询应回到业务系统，记忆可辅助理解但不能覆盖权威记录。<\/p>\n<p>设计例：客户画像表同时保存“事实字段”“推断字段”“最后验证时间”。跟进建议引用事实，但不把建议自动回写成已发生事件。<\/p>", "definition": "业务事实源如 CRM、ERP 保存权威状态；知识库提供制度和参考资料；Agent 记忆保存交互经验。", "search": "C030 Source of Truth / Knowledge Base / Memory（权威事实源／知识库／记忆） 【基础】 业务事实源如 CRM、ERP 保存权威状态；知识库提供制度和参考资料；Agent 记忆保存交互经验。三者不能合并为一张“万能向量表”。库存、价格、授信与合同状态查询应回到业务系统，记忆可辅助理解但不能覆盖权威记录。\n\n设计例：客户画像表同时保存“事实字段”“推断字段”“最后验证时间”。跟进建议引用事实，但不把建议自动回写成已发生事件。 业务事实源与知识库与记忆", "refs": []}, {"id": "C031", "name": "RAG（Retrieval-Augmented Generation，检索增强生成）", "status": "基础", "chapter": "ch-7", "chapterName": "检索与知识工程基础", "html": "<p>先从外部数据检索相关证据，再让模型生成答案。RAG 的核心价值是可更新的外部知识和证据，而不只是向量数据库。权限、时效与可追溯仍使它有价值；长上下文和微调不会自动替代这些能力。<a class=\"ref\" href=\"#source-S17\" aria-label=\"查看来源 S17\">[S17]<\/a><\/p>", "definition": "先从外部数据检索相关证据，再让模型生成答案。", "search": "C031 RAG（Retrieval-Augmented Generation，检索增强生成） 【基础】 先从外部数据检索相关证据，再让模型生成答案。RAG 的核心价值是可更新的外部知识和证据，而不只是向量数据库。权限、时效与可追溯仍使它有价值；长上下文和微调不会自动替代这些能力。[S17] RAG 检索增强生成", "refs": ["S17"]}, {"id": "C032", "name": "Ingestion（数据摄取）/ ETL（Extract, Transform, Load，抽取、转换与加载）/ CDC（Change Data Capture，变更数据捕获）", "status": "基础", "chapter": "ch-7", "chapterName": "检索与知识工程基础", "html": "<p>Ingestion 把文件与业务数据纳入知识管道；ETL 做抽取转换加载，CDC 捕获增量变更。必须处理解析失败、重复文档、版本更新和删除传播。记录来源 ID、租户、权限和更新时间，避免源文件删了而索引仍可检索。<\/p>", "definition": "Ingestion 把文件与业务数据纳入知识管道；ETL 做抽取转换加载，CDC 捕获增量变更。", "search": "C032 Ingestion（数据摄取）/ ETL（Extract, Transform, Load，抽取、转换与加载）/ CDC（Change Data Capture，变更数据捕获） 【基础】 Ingestion 把文件与业务数据纳入知识管道；ETL 做抽取转换加载，CDC 捕获增量变更。必须处理解析失败、重复文档、版本更新和删除传播。记录来源 ID、租户、权限和更新时间，避免源文件删了而索引仍可检索。 Ingestion 与 ETL 与 CDC", "refs": []}, {"id": "C033", "name": "Chunking（文档切分）", "status": "基础", "chapter": "ch-7", "chapterName": "检索与知识工程基础", "html": "<p>按段落、标题、语义或结构切分材料，控制检索粒度。太小会丢失上下文，太大增加噪声。父子块可用小块检索、较大段落回答；表格应保留列名、单位与表头，合同应保留条款归属。切分策略是数据工程选择，不是一个万能固定字数。<\/p>", "definition": "按段落、标题、语义或结构切分材料，控制检索粒度。", "search": "C033 Chunking（文档切分） 【基础】 按段落、标题、语义或结构切分材料，控制检索粒度。太小会丢失上下文，太大增加噪声。父子块可用小块检索、较大段落回答；表格应保留列名、单位与表头，合同应保留条款归属。切分策略是数据工程选择，不是一个万能固定字数。 Chunking 文档切分", "refs": []}, {"id": "C034", "name": "Dense Retrieval / Sparse Retrieval / Hybrid Search（稠密检索／稀疏检索／混合搜索）", "status": "基础", "chapter": "ch-7", "chapterName": "检索与知识工程基础", "html": "<p>Dense 检索利用向量语义相似度；Sparse 如 BM25 利用词项匹配；Hybrid 综合两类候选。商品型号、品牌名和内部编码常需要精确匹配。RRF 按排名融合，不直接假设两种分数可相加；召回结果仍要权限过滤与后续排序。<a class=\"ref\" href=\"#source-S18\" aria-label=\"查看来源 S18\">[S18]<\/a><\/p>", "definition": "Dense 检索利用向量语义相似度；Sparse 如 BM25 利用词项匹配；Hybrid 综合两类候选。", "search": "C034 Dense Retrieval / Sparse Retrieval / Hybrid Search（稠密检索／稀疏检索／混合搜索） 【基础】 Dense 检索利用向量语义相似度；Sparse 如 BM25 利用词项匹配；Hybrid 综合两类候选。商品型号、品牌名和内部编码常需要精确匹配。RRF 按排名融合，不直接假设两种分数可相加；召回结果仍要权限过滤与后续排序。[S18] Dense 与 Sparse 与 Hybrid Search", "refs": ["S18"]}, {"id": "C035", "name": "ANN（Approximate Nearest Neighbor，近似最近邻）/ HNSW（Hierarchical Navigable Small World，分层可导航小世界）/ Vector Index（向量索引）", "status": "基础", "chapter": "ch-7", "chapterName": "检索与知识工程基础", "html": "<p>近似最近邻检索用速度和内存换取一定召回损失，HNSW 是常见索引方法。评估必须在真实过滤条件、数据量和并发下进行。索引参数提高并不必然提升最终回答质量；瓶颈也可能是切分、Embedding、权限过滤或问题理解。<\/p>", "definition": "近似最近邻检索用速度和内存换取一定召回损失，HNSW 是常见索引方法。", "search": "C035 ANN（Approximate Nearest Neighbor，近似最近邻）/ HNSW（Hierarchical Navigable Small World，分层可导航小世界）/ Vector Index（向量索引） 【基础】 近似最近邻检索用速度和内存换取一定召回损失，HNSW 是常见索引方法。评估必须在真实过滤条件、数据量和并发下进行。索引参数提高并不必然提升最终回答质量；瓶颈也可能是切分、Embedding、权限过滤或问题理解。 ANN 与 HNSW 与向量索引", "refs": []}, {"id": "C036", "name": "Metadata Filter（元数据过滤）/ ACL（Access Control List，访问控制列表）", "status": "基础", "chapter": "ch-7", "chapterName": "检索与知识工程基础", "html": "<p>元数据过滤用于限定客户、部门、时间、文档状态等；ACL 表达访问权限。权限必须来自受信身份，不能让模型自行填 tenant_id 决定范围。检索、缓存、引用和答案导出应保持同一权限约束，防止过滤前的候选通过日志或摘要泄露。<\/p>\n<p>工程练习：构造两个租户拥有同名商品的测试，验证检索、答案缓存、引用下载和历史会话均不会串租户。<\/p>", "definition": "元数据过滤用于限定客户、部门、时间、文档状态等；ACL 表达访问权限。", "search": "C036 Metadata Filter（元数据过滤）/ ACL（Access Control List，访问控制列表） 【基础】 元数据过滤用于限定客户、部门、时间、文档状态等；ACL 表达访问权限。权限必须来自受信身份，不能让模型自行填 tenant_id 决定范围。检索、缓存、引用和答案导出应保持同一权限约束，防止过滤前的候选通过日志或摘要泄露。\n\n工程练习：构造两个租户拥有同名商品的测试，验证检索、答案缓存、引用下载和历史会话均不会串租户。 Metadata Filter 与 ACL", "refs": []}, {"id": "C037", "name": "Query Rewriting / Query Decomposition（查询改写／查询分解）", "status": "条件", "chapter": "ch-8", "chapterName": "检索增强与事实校验", "html": "<p>查询改写把口语问题转为更适合检索的表达；分解将复杂问题拆成子问题。客户说“上次那个货”时可结合近期记录定位商品。改写必须保留原始约束，不能将“不含辣椒”变成“辣椒相关”。衡量召回收益及增加的时延，而非改写次数。<\/p>", "definition": "查询改写把口语问题转为更适合检索的表达；分解将复杂问题拆成子问题。", "search": "C037 Query Rewriting / Query Decomposition（查询改写／查询分解） 【条件】 查询改写把口语问题转为更适合检索的表达；分解将复杂问题拆成子问题。客户说“上次那个货”时可结合近期记录定位商品。改写必须保留原始约束，不能将“不含辣椒”变成“辣椒相关”。衡量召回收益及增加的时延，而非改写次数。 Query Rewrite 与 Decomposition", "refs": []}, {"id": "C038", "name": "Reranking / Contextual Compression（重排／上下文压缩）", "status": "增强", "chapter": "ch-8", "chapterName": "检索增强与事实校验", "html": "<p>重排提高候选相关性；上下文压缩删除无关片段。它们解决的不是同一个问题。推荐先保证召回，再用重排和证据级筛选控制输入长度。压缩应保留原文引用和数值，避免“符合条件的证据”被压成“模型认为符合”。<\/p>", "definition": "重排提高候选相关性；上下文压缩删除无关片段。", "search": "C038 Reranking / Contextual Compression（重排／上下文压缩） 【增强】 重排提高候选相关性；上下文压缩删除无关片段。它们解决的不是同一个问题。推荐先保证召回，再用重排和证据级筛选控制输入长度。压缩应保留原文引用和数值，避免“符合条件的证据”被压成“模型认为符合”。 Reranking 与 Contextual Compression", "refs": []}, {"id": "C039", "name": "Agentic RAG / Adaptive Retrieval（智能体驱动的检索增强生成／自适应检索）", "status": "条件", "chapter": "ch-8", "chapterName": "检索增强与事实校验", "html": "<p>由 Agent 决定查什么源、是否继续查、何时停止。适合多跳或来源不明确的问题；固定 FAQ 常用两阶段 RAG 更便宜。设置最大检索轮数、证据覆盖要求及失败出口。Agentic RAG 是编排模式，不是必须使用某一款新数据库。<\/p>", "definition": "由 Agent 决定查什么源、是否继续查、何时停止。", "search": "C039 Agentic RAG / Adaptive Retrieval（智能体驱动的检索增强生成／自适应检索） 【条件】 由 Agent 决定查什么源、是否继续查、何时停止。适合多跳或来源不明确的问题；固定 FAQ 常用两阶段 RAG 更便宜。设置最大检索轮数、证据覆盖要求及失败出口。Agentic RAG 是编排模式，不是必须使用某一款新数据库。 Agentic RAG 与 Adaptive Retrieval", "refs": []}, {"id": "C040", "name": "Self-RAG / Corrective RAG（自反思检索增强生成／纠正式检索增强生成）", "status": "条件", "chapter": "ch-8", "chapterName": "检索增强与事实校验", "html": "<p>Self-RAG 的原始研究把检索与自评信号纳入模型训练；工程界也常用相似名称表示“检索后检查再补查”。两者不能混为一谈。纠正性检索关注检测低质量材料后补查或换源。仅让同一模型反复说“答案正确”不能构成独立验证。<a class=\"ref\" href=\"#source-S19\" aria-label=\"查看来源 S19\">[S19]<\/a><\/p>", "definition": "Self-RAG 的原始研究把检索与自评信号纳入模型训练；工程界也常用相似名称表示“检索后检查再补查”。", "search": "C040 Self-RAG / Corrective RAG（自反思检索增强生成／纠正式检索增强生成） 【条件】 Self-RAG 的原始研究把检索与自评信号纳入模型训练；工程界也常用相似名称表示“检索后检查再补查”。两者不能混为一谈。纠正性检索关注检测低质量材料后补查或换源。仅让同一模型反复说“答案正确”不能构成独立验证。[S19] Self RAG 与 Corrective RAG", "refs": ["S19"]}, {"id": "C041", "name": "GraphRAG / Ontology（图检索增强生成／本体）", "status": "条件", "chapter": "ch-8", "chapterName": "检索增强与事实校验", "html": "<p>GraphRAG 利用实体关系及相关摘要辅助跨文档分析；Ontology 定义业务实体、关系和约束。适合品牌归属、供应关系、跨客户关联等问题，不必用于每个问答。图抽取错误会传播，构图与更新也有成本；先证明多跳或全局问题优于普通检索。<a class=\"ref\" href=\"#source-S20\" aria-label=\"查看来源 S20\">[S20]<\/a><\/p>", "definition": "GraphRAG 利用实体关系及相关摘要辅助跨文档分析；Ontology 定义业务实体、关系和约束。", "search": "C041 GraphRAG / Ontology（图检索增强生成／本体） 【条件】 GraphRAG 利用实体关系及相关摘要辅助跨文档分析；Ontology 定义业务实体、关系和约束。适合品牌归属、供应关系、跨客户关联等问题，不必用于每个问答。图抽取错误会传播，构图与更新也有成本；先证明多跳或全局问题优于普通检索。[S20] GraphRAG 与 Ontology", "refs": ["S20"]}, {"id": "C042", "name": "Text-to-SQL / Semantic Layer（自然语言转 SQL／语义层）", "status": "条件", "chapter": "ch-8", "chapterName": "检索增强与事实校验", "html": "<p>Text-to-SQL 将自然语言转为查询，语义层定义指标、维度及统一口径。企业应优先暴露经过审查的查询工具和只读视图，限制表、列、扫描量与执行时间。SQL 语法正确不代表口径正确，例如销售额是否扣退款、按下单还是履约日期计算。<\/p>\n<p>业务原则：销售统计交给 SQL 或分析引擎计算，LLM 负责解释、发现待验证问题及生成建议；不要让模型从大量流水文本中心算营业额。<\/p>", "definition": "Text-to-SQL 将自然语言转为查询，语义层定义指标、维度及统一口径。", "search": "C042 Text-to-SQL / Semantic Layer（自然语言转 SQL／语义层） 【条件】 Text-to-SQL 将自然语言转为查询，语义层定义指标、维度及统一口径。企业应优先暴露经过审查的查询工具和只读视图，限制表、列、扫描量与执行时间。SQL 语法正确不代表口径正确，例如销售额是否扣退款、按下单还是履约日期计算。\n\n业务原则：销售统计交给 SQL 或分析引擎计算，LLM 负责解释、发现待验证问题及生成建议；不要让模型从大量流水文本中心算营业额。 Text to SQL 与 Semantic Layer", "refs": []}, {"id": "C043", "name": "Function Calling / Tool Use（函数调用／工具使用）", "status": "基础", "chapter": "ch-9", "chapterName": "Tool Engineering（工具工程）", "html": "<p>模型输出工具名及参数，运行时执行后把结果送回模型，随后继续或结束。Function Calling 是交互机制，不等于模型能直接获得数据库权限。服务端必须验证参数、身份、业务约束与结果。调用函数成功与完成用户任务是两个指标。<a class=\"ref\" href=\"#source-S21\" aria-label=\"查看来源 S21\">[S21]<\/a><\/p>", "definition": "模型输出工具名及参数，运行时执行后把结果送回模型，随后继续或结束。", "search": "C043 Function Calling / Tool Use（函数调用／工具使用） 【基础】 模型输出工具名及参数，运行时执行后把结果送回模型，随后继续或结束。Function Calling 是交互机制，不等于模型能直接获得数据库权限。服务端必须验证参数、身份、业务约束与结果。调用函数成功与完成用户任务是两个指标。[S21] Function Calling 与 Tool Use", "refs": ["S21"]}, {"id": "C044", "name": "Tool Schema / Business Semantics（工具结构规范／业务语义）", "status": "基础", "chapter": "ch-9", "chapterName": "Tool Engineering（工具工程）", "html": "<p>工具需定义输入输出、必填字段、单位、枚举、异常及副作用。相比含糊的 operate_customer，拆为查询档案、预览修改、提交修改更容易控制。Schema 验证解决格式问题；客户是否属于当前销售、价格是否仍有效，需要业务系统判断。<\/p>", "definition": "工具需定义输入输出、必填字段、单位、枚举、异常及副作用。", "search": "C044 Tool Schema / Business Semantics（工具结构规范／业务语义） 【基础】 工具需定义输入输出、必填字段、单位、枚举、异常及副作用。相比含糊的 operate_customer，拆为查询档案、预览修改、提交修改更容易控制。Schema 验证解决格式问题；客户是否属于当前销售、价格是否仍有效，需要业务系统判断。 Tool Schema 与业务语义", "refs": []}, {"id": "C045", "name": "Tool Discovery / Tool Search（工具发现／工具搜索）", "status": "增强", "chapter": "ch-9", "chapterName": "Tool Engineering（工具工程）", "html": "<p>大量工具不应全部塞进每轮 Prompt。先按权限和业务域筛选，再按任务检索少量候选；真正调用前仍需验证工具版本和授权。描述应说明适用与不适用场景。工具发现失败会变成任务失败，因此要有可控回退和调用覆盖测试。<\/p>", "definition": "大量工具不应全部塞进每轮 Prompt。", "search": "C045 Tool Discovery / Tool Search（工具发现／工具搜索） 【增强】 大量工具不应全部塞进每轮 Prompt。先按权限和业务域筛选，再按任务检索少量候选；真正调用前仍需验证工具版本和授权。描述应说明适用与不适用场景。工具发现失败会变成任务失败，因此要有可控回退和调用覆盖测试。 Tool Discovery 与 Tool Search", "refs": []}, {"id": "C046", "name": "Programmatic Tool Calling / Code Mode（程序化工具调用／代码模式）", "status": "增强", "chapter": "ch-9", "chapterName": "Tool Engineering（工具工程）", "html": "<p>模型生成短程序组合查询、循环、过滤与聚合，执行环境只返回必要结果，可减少逐个工具往返及中间数据进入上下文。它把风险从“参数调用”扩展到“代码执行”，必须配沙箱、调用白名单和预算。不能直接把生产凭证交给生成的程序。<a class=\"ref\" href=\"#source-S22\" aria-label=\"查看来源 S22\">[S22]<\/a><\/p>", "definition": "模型生成短程序组合查询、循环、过滤与聚合，执行环境只返回必要结果，可减少逐个工具往返及中间数据进入上下文。", "search": "C046 Programmatic Tool Calling / Code Mode（程序化工具调用／代码模式） 【增强】 模型生成短程序组合查询、循环、过滤与聚合，执行环境只返回必要结果，可减少逐个工具往返及中间数据进入上下文。它把风险从“参数调用”扩展到“代码执行”，必须配沙箱、调用白名单和预算。不能直接把生产凭证交给生成的程序。[S22] Programmatic Tool Calling 与 Code Mode", "refs": ["S22"]}, {"id": "C047", "name": "Tool Idempotency / Structured Errors（工具幂等／结构化错误）", "status": "基础", "chapter": "ch-9", "chapterName": "Tool Engineering（工具工程）", "html": "<p>幂等保证同一业务意图重试不会重复产生副作用；结构化错误区分参数错误、权限不足、业务冲突、限流及结果未知。幂等键应来自稳定业务操作 ID，而不是每次重试生成。模型可以修正参数，但不能通过反复重试绕过业务限制。<\/p>", "definition": "幂等保证同一业务意图重试不会重复产生副作用；结构化错误区分参数错误、权限不足、业务冲突、限流及结果未知。", "search": "C047 Tool Idempotency / Structured Errors（工具幂等／结构化错误） 【基础】 幂等保证同一业务意图重试不会重复产生副作用；结构化错误区分参数错误、权限不足、业务冲突、限流及结果未知。幂等键应来自稳定业务操作 ID，而不是每次重试生成。模型可以修正参数，但不能通过反复重试绕过业务限制。 工具幂等与结构化错误", "refs": []}, {"id": "C048", "name": "API（Application Programming Interface，应用程序接口）/ RPA（Robotic Process Automation，机器人流程自动化）/ Computer Use（计算机操作）", "status": "条件", "chapter": "ch-9", "chapterName": "Tool Engineering（工具工程）", "html": "<p>有稳定 API 时优先使用 API；没有接口时可考虑 RPA 或基于屏幕的操作。Computer Use 可适应界面变化，但会受窗口状态、截图理解和焦点影响。关键动作应在执行前确认目标、执行后核验结果，并避免只根据点击动作判断业务成功。<\/p>\n<p>工具设计例：recommend_products 返回候选商品、库存时间、价格版本和推荐原因；create_order 单独存在，并要求已确认的购物清单与授权凭据。推荐工具不隐式下单。<\/p>", "definition": "有稳定 API 时优先使用 API；没有接口时可考虑 RPA 或基于屏幕的操作。", "search": "C048 API（Application Programming Interface，应用程序接口）/ RPA（Robotic Process Automation，机器人流程自动化）/ Computer Use（计算机操作） 【条件】 有稳定 API 时优先使用 API；没有接口时可考虑 RPA 或基于屏幕的操作。Computer Use 可适应界面变化，但会受窗口状态、截图理解和焦点影响。关键动作应在执行前确认目标、执行后核验结果，并避免只根据点击动作判断业务成功。\n\n工具设计例：recommend_products 返回候选商品、库存时间、价格版本和推荐原因；create_order 单独存在，并要求已确认的购物清单与授权凭据。推荐工具不隐式下单。 API 与 RPA 与 Computer Use", "refs": []}, {"id": "C049", "name": "MCP（Model Context Protocol，模型上下文协议）", "status": "增强", "chapter": "ch-10", "chapterName": "协议与互操作的现行边界", "html": "<p>MCP 用共同消息约定连接 Host、Client 与 Server，并暴露 Tools、Resources 和 Prompts。Host 是应用，Client 是连接侧组件，Server 提供能力。它减少集成格式差异，但不自动解决业务权限、工具质量、持久任务及事务一致性。<a class=\"ref\" href=\"#source-S07\" aria-label=\"查看来源 S07\">[S07]<\/a><\/p>", "definition": "MCP 用共同消息约定连接 Host、Client 与 Server，并暴露 Tools、Resources 和 Prompts。", "search": "C049 MCP（Model Context Protocol，模型上下文协议） 【增强】 MCP 用共同消息约定连接 Host、Client 与 Server，并暴露 Tools、Resources 和 Prompts。Host 是应用，Client 是连接侧组件，Server 提供能力。它减少集成格式差异，但不自动解决业务权限、工具质量、持久任务及事务一致性。[S07] MCP 模型上下文协议", "refs": ["S07"]}, {"id": "C050", "name": "MCP Transport / Capability Negotiation（MCP 传输／能力协商）", "status": "迁移", "chapter": "ch-10", "chapterName": "协议与互操作的现行边界", "html": "<p>核验的 2026-07-28 规范采用无状态请求与每请求能力元数据，并提供 server/discover；不应继续把旧 initialize 握手和 Mcp-Session-Id 当作新实现前提。stdio 适合本地子进程，Streamable HTTP 适合服务连接；可含 SSE 响应流，区别于旧 HTTP+SSE 传输。<a class=\"ref\" href=\"#source-S08\" aria-label=\"查看来源 S08\">[S08]<\/a><a class=\"ref\" href=\"#source-S23\" aria-label=\"查看来源 S23\">[S23]<\/a><\/p>", "definition": "核验的 2026-07-28 规范采用无状态请求与每请求能力元数据，并提供 server/discover；不应继续把旧 initialize 握手和 Mcp-Session-Id 当作新实现前提。", "search": "C050 MCP Transport / Capability Negotiation（MCP 传输／能力协商） 【迁移】 核验的 2026-07-28 规范采用无状态请求与每请求能力元数据，并提供 server/discover；不应继续把旧 initialize 握手和 Mcp-Session-Id 当作新实现前提。stdio 适合本地子进程，Streamable HTTP 适合服务连接；可含 SSE 响应流，区别于旧 HTTP+SSE 传输。[S08][S23] MCP Transport 与能力协商", "refs": ["S08", "S23"]}, {"id": "C051", "name": "Roots / Sampling / Logging（根目录声明／采样请求／日志）", "status": "迁移", "chapter": "ch-10", "chapterName": "协议与互操作的现行边界", "html": "<p>Roots 原用于描述根目录范围，Sampling 允许服务侧请求模型采样，Logging 是协议日志能力。这三项在核验版本中进入弃用期，并非立刻在所有客户端消失。新实现优先采用显式资源参数、直接模型调用和独立日志观测；不要依赖 Roots 作为操作系统沙箱。<a class=\"ref\" href=\"#source-S08\" aria-label=\"查看来源 S08\">[S08]<\/a><\/p>", "definition": "Roots 原用于描述根目录范围，Sampling 允许服务侧请求模型采样，Logging 是协议日志能力。", "search": "C051 Roots / Sampling / Logging（根目录声明／采样请求／日志） 【迁移】 Roots 原用于描述根目录范围，Sampling 允许服务侧请求模型采样，Logging 是协议日志能力。这三项在核验版本中进入弃用期，并非立刻在所有客户端消失。新实现优先采用显式资源参数、直接模型调用和独立日志观测；不要依赖 Roots 作为操作系统沙箱。[S08] Roots 与 Sampling 与 Logging", "refs": ["S08"]}, {"id": "C052", "name": "Tasks / Elicitation / MCP Apps（任务／信息征询／MCP 应用）", "status": "增强", "chapter": "ch-10", "chapterName": "协议与互操作的现行边界", "html": "<p>Tasks 提供长操作句柄，现行规范把它移入扩展；Elicitation 获取缺失信息，MRTR 将补充输入组织为请求重试；Apps 提供会话内交互 UI。它们都不能替代企业任务库和审批账本。扩展需核验双方实现，不能根据“支持 MCP”推定全部可用。<a class=\"ref\" href=\"#source-S07\" aria-label=\"查看来源 S07\">[S07]<\/a><a class=\"ref\" href=\"#source-S08\" aria-label=\"查看来源 S08\">[S08]<\/a><\/p>", "definition": "Tasks 提供长操作句柄，现行规范把它移入扩展；Elicitation 获取缺失信息，MRTR 将补充输入组织为请求重试；Apps 提供会话内交互 UI。", "search": "C052 Tasks / Elicitation / MCP Apps（任务／信息征询／MCP 应用） 【增强】 Tasks 提供长操作句柄，现行规范把它移入扩展；Elicitation 获取缺失信息，MRTR 将补充输入组织为请求重试；Apps 提供会话内交互 UI。它们都不能替代企业任务库和审批账本。扩展需核验双方实现，不能根据“支持 MCP”推定全部可用。[S07][S08] Tasks 与 Elicitation 与 MCP Apps", "refs": ["S07", "S08"]}, {"id": "C053", "name": "A2A（Agent2Agent，智能体间协议）/ Agent Card（智能体能力卡片）", "status": "增强", "chapter": "ch-10", "chapterName": "协议与互操作的现行边界", "html": "<p>A2A 面向独立 Agent 之间的发现、消息、任务及产物交换，Agent Card 描述能力与接口。规范已发布 1.0 系列（2026 年 10 月复核时最新为 v1.0.1），协议交互使用主次版本如 1.0；0.3 示例不能直接当 1.0 使用。它与 MCP 可互补，但内部子 Agent 不必经过 A2A。<a class=\"ref\" href=\"#source-S24\" aria-label=\"查看来源 S24\">[S24]<\/a><\/p>", "definition": "A2A 面向独立 Agent 之间的发现、消息、任务及产物交换，Agent Card 描述能力与接口。", "search": "C053 A2A（Agent2Agent，智能体间协议）/ Agent Card（智能体能力卡片） 【增强】 A2A 面向独立 Agent 之间的发现、消息、任务及产物交换，Agent Card 描述能力与接口。规范已发布 1.0 系列（2026 年 10 月复核时最新为 v1.0.1），协议交互使用主次版本如 1.0；0.3 示例不能直接当 1.0 使用。它与 MCP 可互补，但内部子 Agent 不必经过 A2A。[S24] A2A 与 Agent Card", "refs": ["S24"]}, {"id": "C054", "name": "Agent Skills / Plugin / Registry（智能体技能／插件／注册目录）", "status": "增强", "chapter": "ch-10", "chapterName": "协议与互操作的现行边界", "html": "<p>Skill 是任务知识、指令及可选脚本资源的可复用包，Agent Skills 规范以 SKILL.md 等组织并支持渐进加载；Plugin 是产品级包装，可能含技能和连接器；Registry 负责发现与版本信息。可发现不等于可信，应审查来源、依赖、权限和适用边界。<a class=\"ref\" href=\"#source-S16\" aria-label=\"查看来源 S16\">[S16]<\/a><\/p>\n<p>迁移提醒：MCP DCR 在所核验版本中被弃用但保留兼容，推荐方向包括 Client ID Metadata Documents；授权实现按具体规范和服务能力匹配。<a class=\"ref\" href=\"#source-S25\" aria-label=\"查看来源 S25\">[S25]<\/a><\/p>", "definition": "Skill 是任务知识、指令及可选脚本资源的可复用包，Agent Skills 规范以 SKILL.md 等组织并支持渐进加载；Plugin 是产品级包装，可能含技能和连接器；Registry 负责发现与版本信息。", "search": "C054 Agent Skills / Plugin / Registry（智能体技能／插件／注册目录） 【增强】 Skill 是任务知识、指令及可选脚本资源的可复用包，Agent Skills 规范以 SKILL.md 等组织并支持渐进加载；Plugin 是产品级包装，可能含技能和连接器；Registry 负责发现与版本信息。可发现不等于可信，应审查来源、依赖、权限和适用边界。[S16]\n\n迁移提醒：MCP DCR 在所核验版本中被弃用但保留兼容，推荐方向包括 Client ID Metadata Documents；授权实现按具体规范和服务能力匹配。[S25] Agent Skills 与 Plugin 与 Registry", "refs": ["S16", "S25"]}, {"id": "C055", "name": "ReAct（Reasoning and Acting，推理与行动）", "status": "基础", "chapter": "ch-11", "chapterName": "Planning and Control Patterns（规划与控制模式）", "html": "<p>ReAct 将推理与动作交替，让环境反馈影响下一步。今天可以由原生工具调用表达，不必用正则解析 Thought / Action 字符串。应继承“行动后看真实反馈”的思想，避免把某种早期文本模板当成永久协议。<a class=\"ref\" href=\"#source-S26\" aria-label=\"查看来源 S26\">[S26]<\/a><\/p>", "definition": "ReAct 将推理与动作交替，让环境反馈影响下一步。", "search": "C055 ReAct（Reasoning and Acting，推理与行动） 【基础】 ReAct 将推理与动作交替，让环境反馈影响下一步。今天可以由原生工具调用表达，不必用正则解析 Thought / Action 字符串。应继承“行动后看真实反馈”的思想，避免把某种早期文本模板当成永久协议。[S26] ReAct", "refs": ["S26"]}, {"id": "C056", "name": "Plan-and-Execute（规划与执行）", "status": "条件", "chapter": "ch-11", "chapterName": "Planning and Control Patterns（规划与控制模式）", "html": "<p>先形成计划，再逐步执行并按反馈重规划。适合跨系统、多步骤任务；简单查询无需单独规划模型。计划应记录目标、依赖和成功条件，不能把计划本身当作事实。客户资料变化或工具失败后，重新规划范围必须受原授权约束。<\/p>", "definition": "先形成计划，再逐步执行并按反馈重规划。", "search": "C056 Plan-and-Execute（规划与执行） 【条件】 先形成计划，再逐步执行并按反馈重规划。适合跨系统、多步骤任务；简单查询无需单独规划模型。计划应记录目标、依赖和成功条件，不能把计划本身当作事实。客户资料变化或工具失败后，重新规划范围必须受原授权约束。 Plan and Execute", "refs": []}, {"id": "C057", "name": "Routing / Chaining（路由／链式调用）", "status": "基础", "chapter": "ch-11", "chapterName": "Planning and Control Patterns（规划与控制模式）", "html": "<p>Routing 把请求分到合适分支，Chaining 串联固定步骤。可先判断是客户查询、商品推荐还是工单操作，再进入不同流程。对低置信路由增加澄清或人工入口。不要为了所有分支统一而制造一个包含全部业务规则的巨型 Agent。<a class=\"ref\" href=\"#source-S01\" aria-label=\"查看来源 S01\">[S01]<\/a><\/p>", "definition": "Routing 把请求分到合适分支，Chaining 串联固定步骤。", "search": "C057 Routing / Chaining（路由／链式调用） 【基础】 Routing 把请求分到合适分支，Chaining 串联固定步骤。可先判断是客户查询、商品推荐还是工单操作，再进入不同流程。对低置信路由增加澄清或人工入口。不要为了所有分支统一而制造一个包含全部业务规则的巨型 Agent。[S01] Routing 与 Chaining", "refs": ["S01"]}, {"id": "C058", "name": "FSM（Finite State Machine，有限状态机）/ DAG（Directed Acyclic Graph，有向无环图）/ BPMN（Business Process Model and Notation，业务流程模型与标记）", "status": "基础", "chapter": "ch-11", "chapterName": "Planning and Control Patterns（规划与控制模式）", "html": "<p>有限状态机表达合法状态转移，DAG 表达无环依赖，BPMN 常用于业务流程与人工作业。Agent 会有循环与等待，纯 DAG 未必够用。建议用确定性外层处理审批、超时和补偿，模型在有限节点中决策；图节点多不等于架构先进。<\/p>", "definition": "有限状态机表达合法状态转移，DAG 表达无环依赖，BPMN 常用于业务流程与人工作业。", "search": "C058 FSM（Finite State Machine，有限状态机）/ DAG（Directed Acyclic Graph，有向无环图）/ BPMN（Business Process Model and Notation，业务流程模型与标记） 【基础】 有限状态机表达合法状态转移，DAG 表达无环依赖，BPMN 常用于业务流程与人工作业。Agent 会有循环与等待，纯 DAG 未必够用。建议用确定性外层处理审批、超时和补偿，模型在有限节点中决策；图节点多不等于架构先进。 FSM 与 DAG 与 BPMN", "refs": []}, {"id": "C059", "name": "Reflection / Evaluator-Optimizer（反思／评估器与优化器）", "status": "条件", "chapter": "ch-11", "chapterName": "Planning and Control Patterns（规划与控制模式）", "html": "<p>Reflection 根据反馈改进；Evaluator-Optimizer 由评估者提供改进方向。原始 Reflexion 研究使用反馈文本与记忆，不等于模型权重更新。应优先使用单测、业务规则、可信检索或人工反馈；仅让同模型互相夸赞会形成虚假闭环。<a class=\"ref\" href=\"#source-S27\" aria-label=\"查看来源 S27\">[S27]<\/a><\/p>", "definition": "Reflection 根据反馈改进；Evaluator-Optimizer 由评估者提供改进方向。", "search": "C059 Reflection / Evaluator-Optimizer（反思／评估器与优化器） 【条件】 Reflection 根据反馈改进；Evaluator-Optimizer 由评估者提供改进方向。原始 Reflexion 研究使用反馈文本与记忆，不等于模型权重更新。应优先使用单测、业务规则、可信检索或人工反馈；仅让同模型互相夸赞会形成虚假闭环。[S27] Reflection 与 Evaluator Optimizer", "refs": ["S27"]}, {"id": "C060", "name": "ToT（Tree of Thoughts，思维树）/ Search / Test-Time Compute（搜索／测试时计算）", "status": "条件", "chapter": "ch-11", "chapterName": "Planning and Control Patterns（规划与控制模式）", "html": "<p>思维树探索多个候选路径；搜索可能加入剪枝、评分或回溯。推理时增加计算有时提高成功率，却也增加成本并可能优化错误指标。适合可评分的复杂规划；企业常规任务先比较强模型单次方案与少量候选验证，避免默认大规模树搜索。<a class=\"ref\" href=\"#source-S28\" aria-label=\"查看来源 S28\">[S28]<\/a><\/p>\n<p>控制原则：探索自由度可以增加，但写操作的权限边界、预算上限与成功判定不能交给同一轮自然语言自评。<\/p>", "definition": "思维树探索多个候选路径；搜索可能加入剪枝、评分或回溯。", "search": "C060 ToT（Tree of Thoughts，思维树）/ Search / Test-Time Compute（搜索／测试时计算） 【条件】 思维树探索多个候选路径；搜索可能加入剪枝、评分或回溯。推理时增加计算有时提高成功率，却也增加成本并可能优化错误指标。适合可评分的复杂规划；企业常规任务先比较强模型单次方案与少量候选验证，避免默认大规模树搜索。[S28]\n\n控制原则：探索自由度可以增加，但写操作的权限边界、预算上限与成功判定不能交给同一轮自然语言自评。 ToT 与搜索与 Test Time Compute", "refs": ["S28"]}, {"id": "C061", "name": "Single-Agent / Multi-Agent（单智能体／多智能体）", "status": "条件", "chapter": "ch-12", "chapterName": "多 Agent 的边界与协作", "html": "<p>多 Agent 是多个执行角色或实例协作，不一定使用不同模型。合理动因包括上下文隔离、专业工具权限隔离和独立并行工作。多个角色共享同一偏差时不会自然提升正确率。先有单 Agent 基线，再用相同预算衡量多 Agent 的收益。<\/p>", "definition": "多 Agent 是多个执行角色或实例协作，不一定使用不同模型。", "search": "C061 Single-Agent / Multi-Agent（单智能体／多智能体） 【条件】 多 Agent 是多个执行角色或实例协作，不一定使用不同模型。合理动因包括上下文隔离、专业工具权限隔离和独立并行工作。多个角色共享同一偏差时不会自然提升正确率。先有单 Agent 基线，再用相同预算衡量多 Agent 的收益。 Single Agent 与 Multi Agent", "refs": []}, {"id": "C062", "name": "Orchestrator-Workers（编排器与执行者）", "status": "条件", "chapter": "ch-12", "chapterName": "多 Agent 的边界与协作", "html": "<p>协调者拆解任务、委派并汇总结果，工作者完成受限子任务。适合需求动态变化、可分工的研究或开发任务。给工作者明确输入、输出、完成条件及预算；汇总者应检查冲突和缺失，不能把每个子结论直接拼成最终答案。<\/p>", "definition": "协调者拆解任务、委派并汇总结果，工作者完成受限子任务。", "search": "C062 Orchestrator-Workers（编排器与执行者） 【条件】 协调者拆解任务、委派并汇总结果，工作者完成受限子任务。适合需求动态变化、可分工的研究或开发任务。给工作者明确输入、输出、完成条件及预算；汇总者应检查冲突和缺失，不能把每个子结论直接拼成最终答案。 Orchestrator Workers", "refs": []}, {"id": "C063", "name": "Handoff / Agent-as-Tool（任务交接／智能体作为工具）", "status": "基础", "chapter": "ch-12", "chapterName": "多 Agent 的边界与协作", "html": "<p>Handoff 是把对话或任务控制权交给另一 Agent；Agent as Tool 则由父 Agent 调用子能力并收回结果。客服转专家可用交接，商品分析可用工具式调用。设计必须明确责任归属、继承哪些上下文，以及授权是否继续有效，不能默认把父级全部权限传下去。<\/p>", "definition": "Handoff 是把对话或任务控制权交给另一 Agent；Agent as Tool 则由父 Agent 调用子能力并收回结果。", "search": "C063 Handoff / Agent-as-Tool（任务交接／智能体作为工具） 【基础】 Handoff 是把对话或任务控制权交给另一 Agent；Agent as Tool 则由父 Agent 调用子能力并收回结果。客服转专家可用交接，商品分析可用工具式调用。设计必须明确责任归属、继承哪些上下文，以及授权是否继续有效，不能默认把父级全部权限传下去。 Handoff 与 Agent as Tool", "refs": []}, {"id": "C064", "name": "Parallelism / MapReduce（并行／映射归约）", "status": "基础", "chapter": "ch-12", "chapterName": "多 Agent 的边界与协作", "html": "<p>将独立任务分发并行，再汇总结果。适合分析多个客户、分片打标或读取独立资料。限制并发避免击穿模型额度和业务系统。存在前置依赖的任务不能强行并行；共享文件或数据库写入还需锁、版本控制或合并策略。<\/p>", "definition": "将独立任务分发并行，再汇总结果。", "search": "C064 Parallelism / MapReduce（并行／映射归约） 【基础】 将独立任务分发并行，再汇总结果。适合分析多个客户、分片打标或读取独立资料。限制并发避免击穿模型额度和业务系统。存在前置依赖的任务不能强行并行；共享文件或数据库写入还需锁、版本控制或合并策略。 Parallelism 与 Map Reduce", "refs": []}, {"id": "C065", "name": "Blackboard / Shared State（黑板模式／共享状态）", "status": "条件", "chapter": "ch-12", "chapterName": "多 Agent 的边界与协作", "html": "<p>Blackboard 以共享结构承载多 Agent 的发现、计划及产物。它比互相广播完整聊天记录更可控，但需要字段所有权、冲突检测和版本。建议子任务写独立产物，协调者合并；禁止多个 Agent 无约束覆盖同一个客户结论字段。<\/p>", "definition": "Blackboard 以共享结构承载多 Agent 的发现、计划及产物。", "search": "C065 Blackboard / Shared State（黑板模式／共享状态） 【条件】 Blackboard 以共享结构承载多 Agent 的发现、计划及产物。它比互相广播完整聊天记录更可控，但需要字段所有权、冲突检测和版本。建议子任务写独立产物，协调者合并；禁止多个 Agent 无约束覆盖同一个客户结论字段。 Blackboard 与共享状态", "refs": []}, {"id": "C066", "name": "Debate / Voting / Independent Verification（辩论／投票／独立验证）", "status": "条件", "chapter": "ch-12", "chapterName": "多 Agent 的边界与协作", "html": "<p>辩论、投票和交叉审查可暴露部分错误，但多个模型同意不代表证据可靠。应追求独立数据来源、不同校验方法和明确判定规则。对标签分类可比较模型与人工抽检；对金额计算应使用程序核验，而不是让三个 Agent 表决数字。<\/p>\n<p>架构建议：Coding Harness 中的多个角色可以保留为能力目录，不必每次全部启动。根据风险和任务类型按需加载，并测试角色数减少后的完成率与成本。<\/p>", "definition": "辩论、投票和交叉审查可暴露部分错误，但多个模型同意不代表证据可靠。", "search": "C066 Debate / Voting / Independent Verification（辩论／投票／独立验证） 【条件】 辩论、投票和交叉审查可暴露部分错误，但多个模型同意不代表证据可靠。应追求独立数据来源、不同校验方法和明确判定规则。对标签分类可比较模型与人工抽检；对金额计算应使用程序核验，而不是让三个 Agent 表决数字。\n\n架构建议：Coding Harness 中的多个角色可以保留为能力目录，不必每次全部启动。根据风险和任务类型按需加载，并测试角色数减少后的完成率与成本。 Debate 与 Voting 与独立验证", "refs": []}, {"id": "C067", "name": "Agent Runtime（智能体运行时）", "status": "基础", "chapter": "ch-13", "chapterName": "运行时与长期任务", "html": "<p>Runtime 管理任务接收、循环执行、并发、暂停恢复、预算、工具路由与产物。SDK 提供构建接口，不自动等于完整生产运行时。企业需明确哪些职责由框架承担，哪些由平台服务承担，避免把进程内存中的聊天历史当成持久执行。<\/p>", "definition": "Runtime 管理任务接收、循环执行、并发、暂停恢复、预算、工具路由与产物。", "search": "C067 Agent Runtime（智能体运行时） 【基础】 Runtime 管理任务接收、循环执行、并发、暂停恢复、预算、工具路由与产物。SDK 提供构建接口，不自动等于完整生产运行时。企业需明确哪些职责由框架承担，哪些由平台服务承担，避免把进程内存中的聊天历史当成持久执行。 Agent Runtime", "refs": []}, {"id": "C068", "name": "Durable Execution（持久化执行）", "status": "增强", "chapter": "ch-13", "chapterName": "运行时与长期任务", "html": "<p>持久执行在进程故障、网络中断或长时间等待后恢复任务。检查点、事件历史和幂等副作用共同实现它。LangGraph 提供持久化机制，Temporal 提供可恢复工作流；二者抽象不同，不应不加设计地同时管理同一层重试。<a class=\"ref\" href=\"#source-S29\" aria-label=\"查看来源 S29\">[S29]<\/a><a class=\"ref\" href=\"#source-S30\" aria-label=\"查看来源 S30\">[S30]<\/a><\/p>", "definition": "持久执行在进程故障、网络中断或长时间等待后恢复任务。", "search": "C068 Durable Execution（持久化执行） 【增强】 持久执行在进程故障、网络中断或长时间等待后恢复任务。检查点、事件历史和幂等副作用共同实现它。LangGraph 提供持久化机制，Temporal 提供可恢复工作流；二者抽象不同，不应不加设计地同时管理同一层重试。[S29][S30] Durable Execution", "refs": ["S29", "S30"]}, {"id": "C069", "name": "Checkpoint / Resume / Replay（检查点／恢复／重放）", "status": "基础", "chapter": "ch-13", "chapterName": "运行时与长期任务", "html": "<p>Checkpoint 保存状态，Resume 从可恢复点继续，Replay 根据已记录事件重建执行。恢复模型请求若重新采样，可能产生不同计划；关键响应应记录版本和原始结果。重放不应重复发送邮件、创建订单或执行支付，需要副作用账本配合。<\/p>", "definition": "Checkpoint 保存状态，Resume 从可恢复点继续，Replay 根据已记录事件重建执行。", "search": "C069 Checkpoint / Resume / Replay（检查点／恢复／重放） 【基础】 Checkpoint 保存状态，Resume 从可恢复点继续，Replay 根据已记录事件重建执行。恢复模型请求若重新采样，可能产生不同计划；关键响应应记录版本和原始结果。重放不应重复发送邮件、创建订单或执行支付，需要副作用账本配合。 Checkpoint 与 Resume 与 Replay", "refs": []}, {"id": "C070", "name": "HITL（Human-in-the-Loop，人在回路）", "status": "基础", "chapter": "ch-13", "chapterName": "运行时与长期任务", "html": "<p>人在关键节点提供澄清、审批或纠正。审批应绑定具体对象、参数、版本和有效期；批准一份推荐不等于批准以后所有订单。流程暂停不能持有数据库事务。恢复时重查身份和业务状态，防止审批期间客户归属或价格已经改变。<\/p>", "definition": "人在关键节点提供澄清、审批或纠正。", "search": "C070 HITL（Human-in-the-Loop，人在回路） 【基础】 人在关键节点提供澄清、审批或纠正。审批应绑定具体对象、参数、版本和有效期；批准一份推荐不等于批准以后所有订单。流程暂停不能持有数据库事务。恢复时重查身份和业务状态，防止审批期间客户归属或价格已经改变。 Human in the Loop", "refs": []}, {"id": "C071", "name": "Artifact（执行产物）", "status": "基础", "chapter": "ch-13", "chapterName": "运行时与长期任务", "html": "<p>Artifact 是结构化报告、代码、文件、清单或可验证业务结果。它应独立于临时聊天保存，包含版本、归属、来源和访问策略。长期任务以产物交接比口头总结可靠，但产物仍需检查完整性；文件存在不等于任务通过验收。<\/p>", "definition": "Artifact 是结构化报告、代码、文件、清单或可验证业务结果。", "search": "C071 Artifact（执行产物） 【基础】 Artifact 是结构化报告、代码、文件、清单或可验证业务结果。它应独立于临时聊天保存，包含版本、归属、来源和访问策略。长期任务以产物交接比口头总结可靠，但产物仍需检查完整性；文件存在不等于任务通过验收。 Artifact 与执行产物", "refs": []}, {"id": "C072", "name": "Scheduling / Budgeting / Cancellation（调度／预算／取消）", "status": "基础", "chapter": "ch-13", "chapterName": "运行时与长期任务", "html": "<p>调度处理优先级、队列、公平性和工作者分配；预算限制 Token、工具次数、运行时间及金额。取消要向下游传播，但“收到取消”不代表远端副作用撤销。设置明确的等待、超时、已取消及结果未知状态，让业务人员能辨认真实进度。<\/p>\n<p>运行时最小验收：杀死执行进程后恢复任务，确认不会重复创建业务记录；暂停一天后恢复，确认权限和业务数据会重新核验。<\/p>", "definition": "调度处理优先级、队列、公平性和工作者分配；预算限制 Token、工具次数、运行时间及金额。", "search": "C072 Scheduling / Budgeting / Cancellation（调度／预算／取消） 【基础】 调度处理优先级、队列、公平性和工作者分配；预算限制 Token、工具次数、运行时间及金额。取消要向下游传播，但“收到取消”不代表远端副作用撤销。设置明确的等待、超时、已取消及结果未知状态，让业务人员能辨认真实进度。\n\n运行时最小验收：杀死执行进程后恢复任务，确认不会重复创建业务记录；暂停一天后恢复，确认权限和业务数据会重新核验。 调度与预算与取消", "refs": []}, {"id": "C073", "name": "Event Log / State Store（事件日志／状态存储）", "status": "基础", "chapter": "ch-14", "chapterName": "分布式执行与一致性", "html": "<p>事件日志记录发生过什么，状态库提供当前任务的可查询视图。建议事件追加写，状态更新带版本号；模型上下文是从中选择的材料，不是唯一账本。事件记录应遵守敏感数据保留策略，不能以可追溯为由无限保存所有客户原文。<\/p>", "definition": "事件日志记录发生过什么，状态库提供当前任务的可查询视图。", "search": "C073 Event Log / State Store（事件日志／状态存储） 【基础】 事件日志记录发生过什么，状态库提供当前任务的可查询视图。建议事件追加写，状态更新带版本号；模型上下文是从中选择的材料，不是唯一账本。事件记录应遵守敏感数据保留策略，不能以可追溯为由无限保存所有客户原文。 Event Log 与 State Store", "refs": []}, {"id": "C074", "name": "At-Least-Once / Exactly-Once（至少一次／恰好一次）", "status": "基础", "chapter": "ch-14", "chapterName": "分布式执行与一致性", "html": "<p>跨服务通常可能重复投递或出现结果未知。Exactly Once 的承诺必须限定作用范围；模型调用、消息投递和外部订单不共享一个天然原子事务。落地重点是业务幂等、唯一约束、状态查询和对账，而非在架构图上写“只执行一次”。<\/p>", "definition": "跨服务通常可能重复投递或出现结果未知。", "search": "C074 At-Least-Once / Exactly-Once（至少一次／恰好一次） 【基础】 跨服务通常可能重复投递或出现结果未知。Exactly Once 的承诺必须限定作用范围；模型调用、消息投递和外部订单不共享一个天然原子事务。落地重点是业务幂等、唯一约束、状态查询和对账，而非在架构图上写“只执行一次”。 At Least Once 与 Exactly Once", "refs": []}, {"id": "C075", "name": "Saga / Compensation（Saga 模式／补偿操作）", "status": "基础", "chapter": "ch-14", "chapterName": "分布式执行与一致性", "html": "<p>Saga 把跨系统流程拆成局部事务，失败时按业务规则补偿。撤销预留库存可以补偿，已发给客户的信息不能真正撤回。Agent 可以解释异常，但补偿动作应有明确契约和权限，不能让模型临时发明一条“逆操作”。<\/p>", "definition": "Saga 把跨系统流程拆成局部事务，失败时按业务规则补偿。", "search": "C075 Saga / Compensation（Saga 模式／补偿操作） 【基础】 Saga 把跨系统流程拆成局部事务，失败时按业务规则补偿。撤销预留库存可以补偿，已发给客户的信息不能真正撤回。Agent 可以解释异常，但补偿动作应有明确契约和权限，不能让模型临时发明一条“逆操作”。 Saga 与补偿操作", "refs": []}, {"id": "C076", "name": "Outbox / Inbox / Deduplication（发件箱模式／收件箱模式／去重）", "status": "基础", "chapter": "ch-14", "chapterName": "分布式执行与一致性", "html": "<p>Outbox 将业务状态与待发送事件写入同一事务，后台可靠投递；Inbox 记录已处理事件以防重复。适合 CRM 任务创建、标签批量入库等链路。消息 ID 用于投递去重，业务操作 ID 用于语义幂等，两者不要混用。<\/p>", "definition": "Outbox 将业务状态与待发送事件写入同一事务，后台可靠投递；Inbox 记录已处理事件以防重复。", "search": "C076 Outbox / Inbox / Deduplication（发件箱模式／收件箱模式／去重） 【基础】 Outbox 将业务状态与待发送事件写入同一事务，后台可靠投递；Inbox 记录已处理事件以防重复。适合 CRM 任务创建、标签批量入库等链路。消息 ID 用于投递去重，业务操作 ID 用于语义幂等，两者不要混用。 Outbox 与 Inbox 与去重", "refs": []}, {"id": "C077", "name": "Retry / Circuit Breaker / Bulkhead（重试／熔断器／舱壁隔离）", "status": "基础", "chapter": "ch-14", "chapterName": "分布式执行与一致性", "html": "<p>重试应区分可恢复故障与永久错误，使用上限、退避和抖动。熔断防止持续冲击故障服务，舱壁隔离防止某租户或工具拖垮全部任务。参数非法不能靠原样重试解决；写请求超时必须先核查结果，不能直接换模型再执行。<\/p>", "definition": "重试应区分可恢复故障与永久错误，使用上限、退避和抖动。", "search": "C077 Retry / Circuit Breaker / Bulkhead（重试／熔断器／舱壁隔离） 【基础】 重试应区分可恢复故障与永久错误，使用上限、退避和抖动。熔断防止持续冲击故障服务，舱壁隔离防止某租户或工具拖垮全部任务。参数非法不能靠原样重试解决；写请求超时必须先核查结果，不能直接换模型再执行。 Retry 与 Circuit Breaker 与 Bulkhead", "refs": []}, {"id": "C078", "name": "Optimistic Locking / Approval Expiry（乐观锁／审批过期）/ TOCTOU（Time of Check to Time of Use，检查与使用之间的时间差）", "status": "基础", "chapter": "ch-14", "chapterName": "分布式执行与一致性", "html": "<p>TOCTOU 指检查与使用之间状态发生变化。生成菜单时有货，审批后可能缺货；查看客户时有权限，写入时可能已转交。使用 version、更新时间或条件写入重新校验。审批凭据绑定动作摘要，参数变化后重新确认，避免批准 A 却执行 B。<\/p>\n<p>可靠性例：create_followup 超时后先以 operation_id 查询是否已创建；查不到且服务仍不确定时标为 pending_reconciliation，而不是立即重发三次。<\/p>", "definition": "TOCTOU 指检查与使用之间状态发生变化。", "search": "C078 Optimistic Locking / Approval Expiry（乐观锁／审批过期）/ TOCTOU（Time of Check to Time of Use，检查与使用之间的时间差） 【基础】 TOCTOU 指检查与使用之间状态发生变化。生成菜单时有货，审批后可能缺货；查看客户时有权限，写入时可能已转交。使用 version、更新时间或条件写入重新校验。审批凭据绑定动作摘要，参数变化后重新确认，避免批准 A 却执行 B。\n\n可靠性例：create_followup 超时后先以 operation_id 查询是否已创建；查不到且服务仍不确定时标为 pending_reconciliation，而不是立即重发三次。 乐观锁与审批过期与 TOCTOU", "refs": []}, {"id": "C079", "name": "Prompt Injection（提示注入）", "status": "基础", "chapter": "ch-15", "chapterName": "安全与执行边界", "html": "<p>攻击或意外文本把数据伪装成指令，来源可能是网页、录音转写、邮件、知识片段或工具描述。隔离指令与数据、限制可用工具、验证每次动作和减少可读取凭证是基础。检测模型只能降低风险，不能保证识别所有注入。<a class=\"ref\" href=\"#source-S14\" aria-label=\"查看来源 S14\">[S14]<\/a><\/p>", "definition": "攻击或意外文本把数据伪装成指令，来源可能是网页、录音转写、邮件、知识片段或工具描述。", "search": "C079 Prompt Injection（提示注入） 【基础】 攻击或意外文本把数据伪装成指令，来源可能是网页、录音转写、邮件、知识片段或工具描述。隔离指令与数据、限制可用工具、验证每次动作和减少可读取凭证是基础。检测模型只能降低风险，不能保证识别所有注入。[S14] Prompt Injection", "refs": ["S14"]}, {"id": "C080", "name": "Least Privilege / Capability Boundary（最小权限／能力边界）", "status": "基础", "chapter": "ch-15", "chapterName": "安全与执行边界", "html": "<p>最小权限把 Agent 能做的事限制在当前任务所需范围。优先授予具体工具动作和资源范围，而非整个管理员账号。权限由受信身份服务计算；模型可以提出请求，但不能给自己扩权。工具列表隐藏是减少误用，真正授权仍需服务端执行。<\/p>", "definition": "最小权限把 Agent 能做的事限制在当前任务所需范围。", "search": "C080 Least Privilege / Capability Boundary（最小权限／能力边界） 【基础】 最小权限把 Agent 能做的事限制在当前任务所需范围。优先授予具体工具动作和资源范围，而非整个管理员账号。权限由受信身份服务计算；模型可以提出请求，但不能给自己扩权。工具列表隐藏是减少误用，真正授权仍需服务端执行。 Least Privilege 与能力边界", "refs": []}, {"id": "C081", "name": "Sandbox / Egress Control（沙箱／出站控制）", "status": "基础", "chapter": "ch-15", "chapterName": "安全与执行边界", "html": "<p>沙箱隔离生成代码的文件、网络和进程访问；出站控制约束数据发送目的地。容器只是隔离手段之一，不自动保证安全。按风险选进程隔离、容器或更强虚拟化，限制资源，避免暴露宿主控制接口。将凭证存放在沙箱外代理中更利于控制。<a class=\"ref\" href=\"#source-S05\" aria-label=\"查看来源 S05\">[S05]<\/a><\/p>", "definition": "沙箱隔离生成代码的文件、网络和进程访问；出站控制约束数据发送目的地。", "search": "C081 Sandbox / Egress Control（沙箱／出站控制） 【基础】 沙箱隔离生成代码的文件、网络和进程访问；出站控制约束数据发送目的地。容器只是隔离手段之一，不自动保证安全。按风险选进程隔离、容器或更强虚拟化，限制资源，避免暴露宿主控制接口。将凭证存放在沙箱外代理中更利于控制。[S05] Sandbox 与 Egress Control", "refs": ["S05"]}, {"id": "C082", "name": "Tool Poisoning / Supply Chain Security（工具投毒／供应链安全）", "status": "基础", "chapter": "ch-15", "chapterName": "安全与执行边界", "html": "<p>工具或技能描述、依赖包、返回内容可能被篡改并诱导越权。注册中心应保存发布者、版本、哈希、审查记录和撤销状态；变更工具描述也应触发评测。签名证明来源与完整性，不证明内容本身正确或无害。<\/p>", "definition": "工具或技能描述、依赖包、返回内容可能被篡改并诱导越权。", "search": "C082 Tool Poisoning / Supply Chain Security（工具投毒／供应链安全） 【基础】 工具或技能描述、依赖包、返回内容可能被篡改并诱导越权。注册中心应保存发布者、版本、哈希、审查记录和撤销状态；变更工具描述也应触发评测。签名证明来源与完整性，不证明内容本身正确或无害。 Tool Poisoning 与供应链", "refs": []}, {"id": "C083", "name": "Guardrail / Policy as Code（护栏／策略即代码）", "status": "基础", "chapter": "ch-15", "chapterName": "安全与执行边界", "html": "<p>Guardrail 是输入、输出或过程检查；Policy as Code 用确定性规则表达授权、限额、数据范围和发布门槛。两者可以组合。把“不能下单”写进 Prompt 是行为引导，撤销下单工具权限才是执行约束；规则失败应进入明确的拒绝或人工流程。<\/p>", "definition": "Guardrail 是输入、输出或过程检查；Policy as Code 用确定性规则表达授权、限额、数据范围和发布门槛。", "search": "C083 Guardrail / Policy as Code（护栏／策略即代码） 【基础】 Guardrail 是输入、输出或过程检查；Policy as Code 用确定性规则表达授权、限额、数据范围和发布门槛。两者可以组合。把“不能下单”写进 Prompt 是行为引导，撤销下单工具权限才是执行约束；规则失败应进入明确的拒绝或人工流程。 Guardrail 与 Policy as Code", "refs": []}, {"id": "C084", "name": "Data Exfiltration / Output Handling（数据外泄／输出处理）", "status": "基础", "chapter": "ch-15", "chapterName": "安全与执行边界", "html": "<p>数据外泄可能通过工具参数、网页请求、附件或日志发生。检查输出目的地与数据类别，对下载链接、HTML、SQL 和代码按其使用环境处理。模型生成的文本不能直接拼接成 shell 或数据库指令。防护应覆盖“读到什么”和“能发到哪里”。<\/p>\n<p>评测要求：模拟恶意知识文档请求导出客户表，检查系统是否在工具执行层阻断；不要只看模型回复中有没有说“我不能”。<\/p>", "definition": "数据外泄可能通过工具参数、网页请求、附件或日志发生。", "search": "C084 Data Exfiltration / Output Handling（数据外泄／输出处理） 【基础】 数据外泄可能通过工具参数、网页请求、附件或日志发生。检查输出目的地与数据类别，对下载链接、HTML、SQL 和代码按其使用环境处理。模型生成的文本不能直接拼接成 shell 或数据库指令。防护应覆盖“读到什么”和“能发到哪里”。\n\n评测要求：模拟恶意知识文档请求导出客户表，检查系统是否在工具执行层阻断；不要只看模型回复中有没有说“我不能”。 Data Exfiltration 与输出处理", "refs": []}, {"id": "C085", "name": "Authentication / Authorization（身份认证／访问授权）", "status": "基础", "chapter": "ch-16", "chapterName": "身份与治理", "html": "<p>认证回答“你是谁”，授权回答“你可以对什么做什么”。服务账号、用户代理身份和 Agent 实例应可追踪关联。MCP 的 OAuth 流程提供连接授权机制，不能替代 CRM 的行级与字段级权限。OAuth 2.1 的标准状态以所引用规范为准，不能随意称为已发布 RFC。<a class=\"ref\" href=\"#source-S25\" aria-label=\"查看来源 S25\">[S25]<\/a><\/p>", "definition": "认证回答“你是谁”，授权回答“你可以对什么做什么”。", "search": "C085 Authentication / Authorization（身份认证／访问授权） 【基础】 认证回答“你是谁”，授权回答“你可以对什么做什么”。服务账号、用户代理身份和 Agent 实例应可追踪关联。MCP 的 OAuth 流程提供连接授权机制，不能替代 CRM 的行级与字段级权限。OAuth 2.1 的标准状态以所引用规范为准，不能随意称为已发布 RFC。[S25] Authentication 与 Authorization", "refs": ["S25"]}, {"id": "C086", "name": "Delegation（委托授权）/ OBO（On-Behalf-Of，代表用户执行）", "status": "基础", "chapter": "ch-16", "chapterName": "身份与治理", "html": "<p>委托让系统代表用户执行限定操作。应记录原始用户、当前执行服务、授权范围和期限；跨 Agent 委派不能隐式放大权限。机器人发起的任务与员工发起的任务可能有不同政策，审计中必须能辨认主体与责任人。<\/p>", "definition": "委托让系统代表用户执行限定操作。", "search": "C086 Delegation（委托授权）/ OBO（On-Behalf-Of，代表用户执行） 【基础】 委托让系统代表用户执行限定操作。应记录原始用户、当前执行服务、授权范围和期限；跨 Agent 委派不能隐式放大权限。机器人发起的任务与员工发起的任务可能有不同政策，审计中必须能辨认主体与责任人。 Delegation 与 On Behalf Of", "refs": []}, {"id": "C087", "name": "Multi-Tenancy / Isolation（多租户／隔离）", "status": "基础", "chapter": "ch-16", "chapterName": "身份与治理", "html": "<p>租户隔离覆盖任务、知识、向量索引、记忆、缓存、对象存储、配额和日志。共享物理资源可以降低成本，但隔离逻辑必须集中实现并测试。tenant_id 不应信任模型输出；异步消息携带的租户上下文也需要校验来源。<\/p>", "definition": "租户隔离覆盖任务、知识、向量索引、记忆、缓存、对象存储、配额和日志。", "search": "C087 Multi-Tenancy / Isolation（多租户／隔离） 【基础】 租户隔离覆盖任务、知识、向量索引、记忆、缓存、对象存储、配额和日志。共享物理资源可以降低成本，但隔离逻辑必须集中实现并测试。tenant_id 不应信任模型输出；异步消息携带的租户上下文也需要校验来源。 Multi Tenancy 与隔离", "refs": []}, {"id": "C088", "name": "Secrets Management / Vault / Credential Broker（秘密管理／凭据保险库／凭据代理）", "status": "基础", "chapter": "ch-16", "chapterName": "身份与治理", "html": "<p>凭证不进入 Prompt、工具描述或普通日志。短期令牌、外部密钥库与代理调用可减少泄露范围。凭证轮换或撤销后，恢复中的长期任务应重新获取授权；不能把“任务开始时可用的令牌”视为整个生命周期永远有效。<\/p>", "definition": "凭证不进入 Prompt、工具描述或普通日志。", "search": "C088 Secrets Management / Vault / Credential Broker（秘密管理／凭据保险库／凭据代理） 【基础】 凭证不进入 Prompt、工具描述或普通日志。短期令牌、外部密钥库与代理调用可减少泄露范围。凭证轮换或撤销后，恢复中的长期任务应重新获取授权；不能把“任务开始时可用的令牌”视为整个生命周期永远有效。 Secrets 与 Vault 与凭证代理", "refs": []}, {"id": "C089", "name": "Data Classification / Retention / Deletion（数据分级／保留／删除）", "status": "基础", "chapter": "ch-16", "chapterName": "身份与治理", "html": "<p>区分公开、内部、客户敏感及受限数据，定义可用模型部署位置、日志保留与访问规则。删除应传播到源数据副本、向量、摘要、记忆和缓存。数据驻留不等于所有风险消失；本地模型同样需要防止内部越权和不当导出。<\/p>", "definition": "区分公开、内部、客户敏感及受限数据，定义可用模型部署位置、日志保留与访问规则。", "search": "C089 Data Classification / Retention / Deletion（数据分级／保留／删除） 【基础】 区分公开、内部、客户敏感及受限数据，定义可用模型部署位置、日志保留与访问规则。删除应传播到源数据副本、向量、摘要、记忆和缓存。数据驻留不等于所有风险消失；本地模型同样需要防止内部越权和不当导出。 数据分级与保留与删除", "refs": []}, {"id": "C090", "name": "Control Plane / Data Plane（控制面／数据面）", "status": "基础", "chapter": "ch-16", "chapterName": "身份与治理", "html": "<p>控制平面管理配置、策略、模型路由、工具注册和发布；数据平面执行任务与业务访问。控制平面变更需审批和审计，数据平面需要低时延与故障隔离。分离两者有助于共享治理、独立扩容，并防止业务 Agent 改写自身安全策略。<\/p>\n<p>制度建议：为每个 Agent 指定业务负责人、技术负责人、风险等级、可写工具、数据范围、验收指标、应急停用方式和下线计划。<\/p>", "definition": "控制平面管理配置、策略、模型路由、工具注册和发布；数据平面执行任务与业务访问。", "search": "C090 Control Plane / Data Plane（控制面／数据面） 【基础】 控制平面管理配置、策略、模型路由、工具注册和发布；数据平面执行任务与业务访问。控制平面变更需审批和审计，数据平面需要低时延与故障隔离。分离两者有助于共享治理、独立扩容，并防止业务 Agent 改写自身安全策略。\n\n制度建议：为每个 Agent 指定业务负责人、技术负责人、风险等级、可写工具、数据范围、验收指标、应急停用方式和下线计划。 Control Plane 与 Data Plane", "refs": []}, {"id": "C091", "name": "Task Success / Trajectory Evaluation（任务成功／执行轨迹评测）", "status": "基础", "chapter": "ch-17", "chapterName": "评测体系", "html": "<p>结果评测检查任务是否完成，轨迹评测检查工具调用、权限、步骤和副作用是否正确。回答正确但读取了其他租户数据，仍然失败。为不确定系统做重复试验：pass@k 关注多次尝试至少一次成功，pass^k 关注多次全部成功；企业自动执行更需要稳定成功而非偶尔成功。<a class=\"ref\" href=\"#source-S31\" aria-label=\"查看来源 S31\">[S31]<\/a><\/p>", "definition": "结果评测检查任务是否完成，轨迹评测检查工具调用、权限、步骤和副作用是否正确。", "search": "C091 Task Success / Trajectory Evaluation（任务成功／执行轨迹评测） 【基础】 结果评测检查任务是否完成，轨迹评测检查工具调用、权限、步骤和副作用是否正确。回答正确但读取了其他租户数据，仍然失败。为不确定系统做重复试验：pass@k 关注多次尝试至少一次成功，pass^k 关注多次全部成功；企业自动执行更需要稳定成功而非偶尔成功。[S31] Task Success 与 Trajectory Evaluation", "refs": ["S31"]}, {"id": "C092", "name": "Golden Set / Holdout Set / Data Leakage（基准集／留出集／数据泄漏）", "status": "基础", "chapter": "ch-17", "chapterName": "评测体系", "html": "<p>黄金集是人工核验的代表性样本；开发集用于迭代，保留测试集用于最终验证。按客户、时间或业务实体切分，避免同一客户相似记录同时进入训练和测试。数据集应包含正常、歧义、缺失、拒绝和异常样本，并按难度与风险分层。<\/p>", "definition": "黄金集是人工核验的代表性样本；开发集用于迭代，保留测试集用于最终验证。", "search": "C092 Golden Set / Holdout Set / Data Leakage（基准集／留出集／数据泄漏） 【基础】 黄金集是人工核验的代表性样本；开发集用于迭代，保留测试集用于最终验证。按客户、时间或业务实体切分，避免同一客户相似记录同时进入训练和测试。数据集应包含正常、歧义、缺失、拒绝和异常样本，并按难度与风险分层。 Golden Set 与 Holdout 与数据泄漏", "refs": []}, {"id": "C093", "name": "Retrieval Metrics / Generation Metrics（检索指标／生成指标）", "status": "基础", "chapter": "ch-17", "chapterName": "评测体系", "html": "<p>Recall@k 衡量需要的相关材料是否被召回，Precision@k 衡量前 k 条有多少相关；MRR 看首条相关结果位置，nDCG 考虑排序和分级相关性。生成层另外评估事实正确、证据支持、引用定位和覆盖率。检索好不保证回答好，答案流畅也不能反证检索准确。<\/p>", "definition": "Recall@k 衡量需要的相关材料是否被召回，Precision@k 衡量前 k 条有多少相关；MRR 看首条相关结果位置，nDCG 考虑排序和分级相关性。", "search": "C093 Retrieval Metrics / Generation Metrics（检索指标／生成指标） 【基础】 Recall@k 衡量需要的相关材料是否被召回，Precision@k 衡量前 k 条有多少相关；MRR 看首条相关结果位置，nDCG 考虑排序和分级相关性。生成层另外评估事实正确、证据支持、引用定位和覆盖率。检索好不保证回答好，答案流畅也不能反证检索准确。 检索和生成的分层指标", "refs": []}, {"id": "C094", "name": "Classification Metrics / Calibration / Selective Prediction（分类指标／校准／选择性预测）", "status": "基础", "chapter": "ch-17", "chapterName": "评测体系", "html": "<p>Accuracy 容易被大类别占比掩盖；Precision、Recall、F1 和混淆矩阵应按类别报告，宏平均用于观察小类别。Calibration 检查置信程度与实际正确率是否匹配。不能直接把模型自报“98% 确信”当概率；可以用验证集校准并设拒答、人工复核区间。<\/p>", "definition": "Accuracy 容易被大类别占比掩盖；Precision、Recall、F1 和混淆矩阵应按类别报告，宏平均用于观察小类别。", "search": "C094 Classification Metrics / Calibration / Selective Prediction（分类指标／校准／选择性预测） 【基础】 Accuracy 容易被大类别占比掩盖；Precision、Recall、F1 和混淆矩阵应按类别报告，宏平均用于观察小类别。Calibration 检查置信程度与实际正确率是否匹配。不能直接把模型自报“98% 确信”当概率；可以用验证集校准并设拒答、人工复核区间。 分类指标与校准与选择性预测", "refs": []}, {"id": "C095", "name": "LLM-as-a-Judge（Large Language Model as a Judge，大语言模型评审）/ Human Review（人工评审）", "status": "条件", "chapter": "ch-17", "chapterName": "评测体系", "html": "<p>模型裁判适合规模化检查主观质量，但存在位置、表达长度、自偏好和评分漂移。制定可操作评分表，随机化顺序，与盲评人工样本校准；关键权限与财务状态用确定性检查。裁判、业务模型和数据集均需版本化，不能只保存一个总分。<\/p>", "definition": "模型裁判适合规模化检查主观质量，但存在位置、表达长度、自偏好和评分漂移。", "search": "C095 LLM-as-a-Judge（Large Language Model as a Judge，大语言模型评审）/ Human Review（人工评审） 【条件】 模型裁判适合规模化检查主观质量，但存在位置、表达长度、自偏好和评分漂移。制定可操作评分表，随机化顺序，与盲评人工样本校准；关键权限与财务状态用确定性检查。裁判、业务模型和数据集均需版本化，不能只保存一个总分。 LLM as Judge 与人工评审", "refs": []}, {"id": "C096", "name": "Regression Testing / Red Teaming / Ablation Study（回归测试／红队测试／消融实验）", "status": "基础", "chapter": "ch-17", "chapterName": "评测体系", "html": "<p>回归集保留历史失败，红队主动设计恶意输入与边界攻击；消融实验逐项移除检索、反思、子 Agent 等机制，检验其实际贡献。上线前同时检查正常任务表现和越权阻断。失败样本修复后回归，不能通过删除难例让评分变好。<\/p>\n<p>验收表应同时记录：任务成功率、严重错误率、人工接管率、每次成功成本、P95 时延、样本数、测试时间及版本。没有分母和切分方式的百分比不宜作为架构优劣依据。<\/p>", "definition": "回归集保留历史失败，红队主动设计恶意输入与边界攻击；消融实验逐项移除检索、反思、子 Agent 等机制，检验其实际贡献。", "search": "C096 Regression Testing / Red Teaming / Ablation Study（回归测试／红队测试／消融实验） 【基础】 回归集保留历史失败，红队主动设计恶意输入与边界攻击；消融实验逐项移除检索、反思、子 Agent 等机制，检验其实际贡献。上线前同时检查正常任务表现和越权阻断。失败样本修复后回归，不能通过删除难例让评分变好。\n\n验收表应同时记录：任务成功率、严重错误率、人工接管率、每次成功成本、P95 时延、样本数、测试时间及版本。没有分母和切分方式的百分比不宜作为架构优劣依据。 Regression 与 Red Team 与消融实验", "refs": []}, {"id": "C097", "name": "Trace / Span / Correlation ID（调用链／追踪单元／关联标识）", "status": "基础", "chapter": "ch-18", "chapterName": "可观测性与发布", "html": "<p>Trace 连接一次任务的模型、检索、工具和子任务；Span 表达其中一段工作。记录耗时、token、输入输出摘要、错误码和版本，敏感内容按策略脱敏。OpenTelemetry 适合统一链路；GenAI 语义约定仍需按实际版本管理，不能假定所有厂商字段已稳定互通。<a class=\"ref\" href=\"#source-S32\" aria-label=\"查看来源 S32\">[S32]<\/a><\/p>", "definition": "Trace 连接一次任务的模型、检索、工具和子任务；Span 表达其中一段工作。", "search": "C097 Trace / Span / Correlation ID（调用链／追踪单元／关联标识） 【基础】 Trace 连接一次任务的模型、检索、工具和子任务；Span 表达其中一段工作。记录耗时、token、输入输出摘要、错误码和版本，敏感内容按策略脱敏。OpenTelemetry 适合统一链路；GenAI 语义约定仍需按实际版本管理，不能假定所有厂商字段已稳定互通。[S32] Trace 与 Span 与关联标识", "refs": ["S32"]}, {"id": "C098", "name": "Observability / Evaluation（可观测性／评测）", "status": "基础", "chapter": "ch-18", "chapterName": "可观测性与发布", "html": "<p>可观测性解释“发生了什么”，评测判断“做得好不好”。日志无报错不等于任务成功；评测下降也需要链路定位究竟是召回、模型、工具还是数据变化。将失败类别与 Trace 关联，建立可复现的问题单，而不是保存全部 Prompt 后无法检索。<\/p>", "definition": "可观测性解释“发生了什么”，评测判断“做得好不好”。", "search": "C098 Observability / Evaluation（可观测性／评测） 【基础】 可观测性解释“发生了什么”，评测判断“做得好不好”。日志无报错不等于任务成功；评测下降也需要链路定位究竟是召回、模型、工具还是数据变化。将失败类别与 Trace 关联，建立可复现的问题单，而不是保存全部 Prompt 后无法检索。 Observability 与 Evaluation", "refs": []}, {"id": "C099", "name": "Versioning / Reproducibility（版本管理／可复现性）", "status": "基础", "chapter": "ch-18", "chapterName": "可观测性与发布", "html": "<p>记录模型标识、采样配置、Prompt、技能、工具 schema、检索配置、索引或数据快照、策略和代码版本。即使温度为零，也不保证跨后端完全重现。目标是能够解释与近似重放，并隔离外部副作用；必要时用录制的工具返回做测试替身。<\/p>", "definition": "记录模型标识、采样配置、Prompt、技能、工具 schema、检索配置、索引或数据快照、策略和代码版本。", "search": "C099 Versioning / Reproducibility（版本管理／可复现性） 【基础】 记录模型标识、采样配置、Prompt、技能、工具 schema、检索配置、索引或数据快照、策略和代码版本。即使温度为零，也不保证跨后端完全重现。目标是能够解释与近似重放，并隔离外部副作用；必要时用录制的工具返回做测试替身。 Versioning 与可复现性", "refs": []}, {"id": "C100", "name": "Shadow Testing / Canary Release / A/B Testing（影子测试／金丝雀发布／A/B 测试）", "status": "基础", "chapter": "ch-18", "chapterName": "可观测性与发布", "html": "<p>影子运行复制输入但禁止真实写入，用来比较候选版本；灰度按小范围逐步放量；A/B 使用合理分流与统计方法验证业务效果。影子环境要阻断发信、下单等工具，不只是隐藏结果。模型或知识更新也应进入发布流程，且能够回滚组合版本。<\/p>", "definition": "影子运行复制输入但禁止真实写入，用来比较候选版本；灰度按小范围逐步放量；A/B 使用合理分流与统计方法验证业务效果。", "search": "C100 Shadow Testing / Canary Release / A/B Testing（影子测试／金丝雀发布／A/B 测试） 【基础】 影子运行复制输入但禁止真实写入，用来比较候选版本；灰度按小范围逐步放量；A/B 使用合理分流与统计方法验证业务效果。影子环境要阻断发信、下单等工具，不只是隐藏结果。模型或知识更新也应进入发布流程，且能够回滚组合版本。 Shadow 与 Canary 与 A B Test", "refs": []}, {"id": "C101", "name": "SLO（Service Level Objective，服务等级目标）/ Error Budget / Kill Switch（错误预算／停用开关）", "status": "基础", "chapter": "ch-18", "chapterName": "可观测性与发布", "html": "<p>服务目标同时覆盖可用性、时延和任务质量。例如技术接口可用但建议严重错误，业务仍不可用。预算耗尽时限制扩量或回退。为模型、单个工具、单类写操作和租户设置可独立停用的开关；高风险动作异常时优先阻断该动作，保留安全查询能力。<\/p>", "definition": "服务目标同时覆盖可用性、时延和任务质量。", "search": "C101 SLO（Service Level Objective，服务等级目标）/ Error Budget / Kill Switch（错误预算／停用开关） 【基础】 服务目标同时覆盖可用性、时延和任务质量。例如技术接口可用但建议严重错误，业务仍不可用。预算耗尽时限制扩量或回退。为模型、单个工具、单类写操作和租户设置可独立停用的开关；高风险动作异常时优先阻断该动作，保留安全查询能力。 SLO 与 Error Budget 与停用开关", "refs": []}, {"id": "C102", "name": "Feedback / Business Attribution（反馈／业务归因）", "status": "基础", "chapter": "ch-18", "chapterName": "可观测性与发布", "html": "<p>用户点赞、建议采纳、最终成交和工时节省是不同信号。采纳不一定正确，成交也可能由价格和活动驱动。保存采纳原因、修改内容及最终结果，区分相关性与因果。ROI 应计入人工复核、运维、标注和错误处置成本，必要时通过对照试验归因。<\/p>\n<p>上线资产建议：一份发布清单关联模型、Prompt、数据、工具、策略与评测报告。负责人能够从任意用户投诉定位对应运行，而不是只找到当前版本代码。<\/p>", "definition": "用户点赞、建议采纳、最终成交和工时节省是不同信号。", "search": "C102 Feedback / Business Attribution（反馈／业务归因） 【基础】 用户点赞、建议采纳、最终成交和工时节省是不同信号。采纳不一定正确，成交也可能由价格和活动驱动。保存采纳原因、修改内容及最终结果，区分相关性与因果。ROI 应计入人工复核、运维、标注和错误处置成本，必要时通过对照试验归因。\n\n上线资产建议：一份发布清单关联模型、Prompt、数据、工具、策略与评测报告。负责人能够从任意用户投诉定位对应运行，而不是只找到当前版本代码。 Feedback 与业务归因", "refs": []}, {"id": "C103", "name": "TTFT（Time to First Token，首个词元时间）/ End-to-End Latency（端到端时延）", "status": "基础", "chapter": "ch-19", "chapterName": "性能与成本", "html": "<p>TTFT 是首个 token 返回时间；用户实际等待还包括排队、检索、工具、审批和多轮推理。流式输出改善感知，不一定缩短完成时间。先画关键路径，减少串行依赖与无效轮次；只有独立且权限允许的子任务才并行，不能并发修改同一订单状态。<\/p>", "definition": "TTFT 是首个 token 返回时间；用户实际等待还包括排队、检索、工具、审批和多轮推理。", "search": "C103 TTFT（Time to First Token，首个词元时间）/ End-to-End Latency（端到端时延） 【基础】 TTFT 是首个 token 返回时间；用户实际等待还包括排队、检索、工具、审批和多轮推理。流式输出改善感知，不一定缩短完成时间。先画关键路径，减少串行依赖与无效轮次；只有独立且权限允许的子任务才并行，不能并发修改同一订单状态。 TTFT 与端到端时延", "refs": []}, {"id": "C104", "name": "Prefix Cache（前缀缓存）/ KV Cache（Key-Value Cache，键值缓存）/ Semantic Cache（语义缓存）", "status": "条件", "chapter": "ch-19", "chapterName": "性能与成本", "html": "<p>KV cache 复用注意力计算的键值状态；前缀缓存复用公共输入前缀；语义缓存按相似问题复用答案。三者的正确性边界不同。业务答案缓存必须包含租户、用户权限、数据版本和有效期，库存、价格等实时事实不宜因语义相近而复用旧结果。<\/p>", "definition": "KV cache 复用注意力计算的键值状态；前缀缓存复用公共输入前缀；语义缓存按相似问题复用答案。", "search": "C104 Prefix Cache（前缀缓存）/ KV Cache（Key-Value Cache，键值缓存）/ Semantic Cache（语义缓存） 【条件】 KV cache 复用注意力计算的键值状态；前缀缓存复用公共输入前缀；语义缓存按相似问题复用答案。三者的正确性边界不同。业务答案缓存必须包含租户、用户权限、数据版本和有效期，库存、价格等实时事实不宜因语义相近而复用旧结果。 Prefix Cache 与 KV Cache 与 Semantic Cache", "refs": []}, {"id": "C105", "name": "Batch Processing / Asynchronous Tasks / Backpressure（批处理／异步任务／背压）", "status": "基础", "chapter": "ch-19", "chapterName": "性能与成本", "html": "<p>离线标签和批量摘要可以排队合批，交互查询则受用户等待限制。背压通过限制队列、并发和速率，阻止流量把模型与工具拖垮。批任务需要逐条状态、失败重试、幂等和取消；“提交成功”不能等同于整批业务完成。<\/p>", "definition": "离线标签和批量摘要可以排队合批，交互查询则受用户等待限制。", "search": "C105 Batch Processing / Asynchronous Tasks / Backpressure（批处理／异步任务／背压） 【基础】 离线标签和批量摘要可以排队合批，交互查询则受用户等待限制。背压通过限制队列、并发和速率，阻止流量把模型与工具拖垮。批任务需要逐条状态、失败重试、幂等和取消；“提交成功”不能等同于整批业务完成。 Batch 与异步任务与背压", "refs": []}, {"id": "C106", "name": "Model Serving / Quantization / Scheduling（推理服务／量化／调度）", "status": "条件", "chapter": "ch-19", "chapterName": "性能与成本", "html": "<p>Continuous batching 动态合并推理请求，PagedAttention 改善 KV 内存管理，量化降低权重或缓存精度以节省资源。自建推理服务需评估硬件利用率、长上下文、并发和质量变化，不能只比较单请求 token 速度。vLLM 是可评估的服务引擎之一。<a class=\"ref\" href=\"#source-S33\" aria-label=\"查看来源 S33\">[S33]<\/a><\/p>", "definition": "Continuous batching 动态合并推理请求，PagedAttention 改善 KV 内存管理，量化降低权重或缓存精度以节省资源。", "search": "C106 Model Serving / Quantization / Scheduling（推理服务／量化／调度） 【条件】 Continuous batching 动态合并推理请求，PagedAttention 改善 KV 内存管理，量化降低权重或缓存精度以节省资源。自建推理服务需评估硬件利用率、长上下文、并发和质量变化，不能只比较单请求 token 速度。vLLM 是可评估的服务引擎之一。[S33] 推理服务与量化与调度", "refs": ["S33"]}, {"id": "C107", "name": "Cost per Successful Task（单位成功任务成本）", "status": "基础", "chapter": "ch-19", "chapterName": "性能与成本", "html": "<p>每次成功成本＝同一评测窗口的全部相关成本／通过验收的任务数。分子包含失败重试、模型与工具、基础设施和人工复核；不要只算成功请求 token。预算按任务、租户和时间窗分配，设最大轮数与支出。省模型单价却增加失败次数，可能更贵。<\/p>", "definition": "每次成功成本＝同一评测窗口的全部相关成本／通过验收的任务数。", "search": "C107 Cost per Successful Task（单位成功任务成本） 【基础】 每次成功成本＝同一评测窗口的全部相关成本／通过验收的任务数。分子包含失败重试、模型与工具、基础设施和人工复核；不要只算成功请求 token。预算按任务、租户和时间窗分配，设最大轮数与支出。省模型单价却增加失败次数，可能更贵。 Cost per Successful Task", "refs": []}, {"id": "C108", "name": "Fallback / Graceful Degradation / Model Routing（故障回退／服务降级／模型路由）", "status": "基础", "chapter": "ch-19", "chapterName": "性能与成本", "html": "<p>模型不可用、预算不足或置信不足时，回退到另一模型、检索原文、确定性流程或人工处理。降级输出需要明确状态。不同模型的工具 schema、上下文能力和拒绝行为可能不同，应分别验证；不能因主模型失败就允许备用模型绕过权限或质量门槛。<\/p>\n<p>优化顺序建议：删除无效步骤 → 减少输入和输出 → 合理检索与缓存 → 可并行工作并行 → 模型路由 → 评估专用微调或自建推理。顺序可因业务约束调整，但每次都应测量质量变化。<\/p>", "definition": "模型不可用、预算不足或置信不足时，回退到另一模型、检索原文、确定性流程或人工处理。", "search": "C108 Fallback / Graceful Degradation / Model Routing（故障回退／服务降级／模型路由） 【基础】 模型不可用、预算不足或置信不足时，回退到另一模型、检索原文、确定性流程或人工处理。降级输出需要明确状态。不同模型的工具 schema、上下文能力和拒绝行为可能不同，应分别验证；不能因主模型失败就允许备用模型绕过权限或质量门槛。\n\n优化顺序建议：删除无效步骤 → 减少输入和输出 → 合理检索与缓存 → 可并行工作并行 → 模型路由 → 评估专用微调或自建推理。顺序可因业务约束调整，但每次都应测量质量变化。 Fallback 与降级与模型路由", "refs": []}, {"id": "C109", "name": "SFT（Supervised Fine-Tuning，监督微调）/ Behavior Adaptation（行为适配）", "status": "条件", "chapter": "ch-20", "chapterName": "模型与系统优化", "html": "<p>监督微调用输入与理想输出训练模型，适合稳定任务格式、领域表达和行为模式。最新库存或权限不应靠微调维护，应查询业务系统。先验证问题来自模型能力而非缺失上下文或错误工具；保留独立测试集，评估领域收益和通用能力回退。<\/p>", "definition": "监督微调用输入与理想输出训练模型，适合稳定任务格式、领域表达和行为模式。", "search": "C109 SFT（Supervised Fine-Tuning，监督微调）/ Behavior Adaptation（行为适配） 【条件】 监督微调用输入与理想输出训练模型，适合稳定任务格式、领域表达和行为模式。最新库存或权限不应靠微调维护，应查询业务系统。先验证问题来自模型能力而非缺失上下文或错误工具；保留独立测试集，评估领域收益和通用能力回退。 SFT 与行为适配", "refs": []}, {"id": "C110", "name": "LoRA（Low-Rank Adaptation，低秩适配）/ QLoRA（Quantized Low-Rank Adaptation，量化低秩适配）/ PEFT（Parameter-Efficient Fine-Tuning，参数高效微调）", "status": "条件", "chapter": "ch-20", "chapterName": "模型与系统优化", "html": "<p>PEFT 是参数高效微调方法族；LoRA 训练低秩适配参数，QLoRA 将量化基础模型与适配训练结合。它们降低部分训练资源需求，但不自动提高数据质量或效果。部署前需确认基础模型、适配器、量化方式及推理服务兼容，并管理其授权与版本。<a class=\"ref\" href=\"#source-S34\" aria-label=\"查看来源 S34\">[S34]<\/a><\/p>", "definition": "PEFT 是参数高效微调方法族；LoRA 训练低秩适配参数，QLoRA 将量化基础模型与适配训练结合。", "search": "C110 LoRA（Low-Rank Adaptation，低秩适配）/ QLoRA（Quantized Low-Rank Adaptation，量化低秩适配）/ PEFT（Parameter-Efficient Fine-Tuning，参数高效微调） 【条件】 PEFT 是参数高效微调方法族；LoRA 训练低秩适配参数，QLoRA 将量化基础模型与适配训练结合。它们降低部分训练资源需求，但不自动提高数据质量或效果。部署前需确认基础模型、适配器、量化方式及推理服务兼容，并管理其授权与版本。[S34] LoRA 与 QLoRA 与 PEFT", "refs": ["S34"]}, {"id": "C111", "name": "DPO（Direct Preference Optimization，直接偏好优化）/ RL（Reinforcement Learning，强化学习）/ RFT（Reinforcement Fine-Tuning，强化微调）", "status": "条件", "chapter": "ch-20", "chapterName": "模型与系统优化", "html": "<p>DPO 直接使用偏好对优化；强化学习通过奖励信号优化策略，RFT 常用于以可评分任务进行强化微调。奖励设计错误会导致“刷分”而非业务进步。确定性、可验证任务更适合起步；开放销售建议难以仅用成交结果作为即时奖励，存在延迟和归因问题。<\/p>", "definition": "DPO 直接使用偏好对优化；强化学习通过奖励信号优化策略，RFT 常用于以可评分任务进行强化微调。", "search": "C111 DPO（Direct Preference Optimization，直接偏好优化）/ RL（Reinforcement Learning，强化学习）/ RFT（Reinforcement Fine-Tuning，强化微调） 【条件】 DPO 直接使用偏好对优化；强化学习通过奖励信号优化策略，RFT 常用于以可评分任务进行强化微调。奖励设计错误会导致“刷分”而非业务进步。确定性、可验证任务更适合起步；开放销售建议难以仅用成交结果作为即时奖励，存在延迟和归因问题。 DPO 与 RL 与 RFT", "refs": []}, {"id": "C112", "name": "Distillation / Specialized Model（蒸馏／专用模型）", "status": "条件", "chapter": "ch-20", "chapterName": "模型与系统优化", "html": "<p>蒸馏用强模型的输出或行为指导更小模型，可降低稳定子任务的成本。教师错误会传递，生成样本需要去重、筛选和人工抽检。适合大量且边界明确的分类、抽取和标准化；不应假设小模型能完整继承教师的开放推理和安全行为。<\/p>", "definition": "蒸馏用强模型的输出或行为指导更小模型，可降低稳定子任务的成本。", "search": "C112 Distillation / Specialized Model（蒸馏／专用模型） 【条件】 蒸馏用强模型的输出或行为指导更小模型，可降低稳定子任务的成本。教师错误会传递，生成样本需要去重、筛选和人工抽检。适合大量且边界明确的分类、抽取和标准化；不应假设小模型能完整继承教师的开放推理和安全行为。 Distillation 与专用模型", "refs": []}, {"id": "C113", "name": "DSPy / GEPA（框架与优化器名称）/ System-Level Optimization（系统级优化）", "status": "增强", "chapter": "ch-20", "chapterName": "模型与系统优化", "html": "<p>把 Prompt、示例与模块组合视为可优化程序，用开发集和评测器搜索配置。GEPA 通过反思反馈改进候选方案，DSPy 提供相应优化支持。收益依赖可靠评测及搜索预算；测试集必须隔离，自动找到的 Prompt 仍应接受安全和维护性检查。<a class=\"ref\" href=\"#source-S13\" aria-label=\"查看来源 S13\">[S13]<\/a><\/p>", "definition": "把 Prompt、示例与模块组合视为可优化程序，用开发集和评测器搜索配置。", "search": "C113 DSPy / GEPA（框架与优化器名称）/ System-Level Optimization（系统级优化） 【增强】 把 Prompt、示例与模块组合视为可优化程序，用开发集和评测器搜索配置。GEPA 通过反思反馈改进候选方案，DSPy 提供相应优化支持。收益依赖可靠评测及搜索预算；测试集必须隔离，自动找到的 Prompt 仍应接受安全和维护性检查。[S13] DSPy 与 GEPA 与系统级优化", "refs": ["S13"]}, {"id": "C114", "name": "Active Learning / Drift / Continuous Improvement（主动学习／漂移／持续改进）", "status": "基础", "chapter": "ch-20", "chapterName": "模型与系统优化", "html": "<p>主动学习优先选择不确定或有代表性的样本标注；漂移监控观察输入、标签分布及业务关系变化。持续改进可以是更新知识、修复工具、调整 Prompt 或训练模型，不能统称“Agent 自动学习”。生产反馈先进入待审核数据池，避免恶意反馈污染模型与记忆。<\/p>\n<p>选择原则：事实更新用知识和工具；固定步骤用流程；输出行为问题先改提示和示例；稳定规模化能力缺口才评估微调。记住用户偏好、优化 Prompt 和更新模型权重，是三个不同层次。<\/p>", "definition": "主动学习优先选择不确定或有代表性的样本标注；漂移监控观察输入、标签分布及业务关系变化。", "search": "C114 Active Learning / Drift / Continuous Improvement（主动学习／漂移／持续改进） 【基础】 主动学习优先选择不确定或有代表性的样本标注；漂移监控观察输入、标签分布及业务关系变化。持续改进可以是更新知识、修复工具、调整 Prompt 或训练模型，不能统称“Agent 自动学习”。生产反馈先进入待审核数据池，避免恶意反馈污染模型与记忆。\n\n选择原则：事实更新用知识和工具；固定步骤用流程；输出行为问题先改提示和示例；稳定规模化能力缺口才评估微调。记住用户偏好、优化 Prompt 和更新模型权重，是三个不同层次。 Active Learning 与 Drift 与持续改进", "refs": []}, {"id": "C115", "name": "Coding Agent（编程智能体）/ ACI（Agent-Computer Interface，智能体与计算机交互接口）", "status": "增强", "chapter": "ch-21", "chapterName": "Coding Agent 与前沿方向", "html": "<p>Coding Agent 能读写仓库、运行工具并根据结果迭代；Agent Computer Interface 指为 Agent 设计的工具和环境交互界面。清晰错误、精确差异、可定位测试结果往往比增加角色更有用。沙箱、分支隔离、代码审查和发布权限决定其能安全做到哪里。<\/p>", "definition": "Coding Agent 能读写仓库、运行工具并根据结果迭代；Agent Computer Interface 指为 Agent 设计的工具和环境交互界面。", "search": "C115 Coding Agent（编程智能体）/ ACI（Agent-Computer Interface，智能体与计算机交互接口） 【增强】 Coding Agent 能读写仓库、运行工具并根据结果迭代；Agent Computer Interface 指为 Agent 设计的工具和环境交互界面。清晰错误、精确差异、可定位测试结果往往比增加角色更有用。沙箱、分支隔离、代码审查和发布权限决定其能安全做到哪里。 Coding Agent 与 ACI", "refs": []}, {"id": "C116", "name": "AGENTS.md / Skills / Hooks（项目指令文件／技能／钩子）", "status": "增强", "chapter": "ch-21", "chapterName": "Coding Agent 与前沿方向", "html": "<p>仓库说明表达项目约定，技能封装可复用任务知识，Hooks 在事件点执行自动动作。名称和加载规则因产品而异；开放技能格式不保证完整运行时一致。项目规则应有作用域与优先级，Hooks 的权限和失败处理需审计，不能让可编辑规则关闭强制检查。<a class=\"ref\" href=\"#source-S16\" aria-label=\"查看来源 S16\">[S16]<\/a><\/p>", "definition": "仓库说明表达项目约定，技能封装可复用任务知识，Hooks 在事件点执行自动动作。", "search": "C116 AGENTS.md / Skills / Hooks（项目指令文件／技能／钩子） 【增强】 仓库说明表达项目约定，技能封装可复用任务知识，Hooks 在事件点执行自动动作。名称和加载规则因产品而异；开放技能格式不保证完整运行时一致。项目规则应有作用域与优先级，Hooks 的权限和失败处理需审计，不能让可编辑规则关闭强制检查。[S16] AGENTS md 与 Skills 与 Hooks", "refs": ["S16"]}, {"id": "C117", "name": "Spec-Driven Development / Validation Gates（规格驱动开发／验证门槛）", "status": "基础", "chapter": "ch-21", "chapterName": "Coding Agent 与前沿方向", "html": "<p>先给出验收标准，再约束实现、测试和发布。TDD 可用于可明确测试的功能，但模型自己写且自己通过的测试不足以证明正确。用独立验收样本、回归、静态检查和必要人工评审补足。高风险变更的发布许可应由可信流程控制。<\/p>", "definition": "先给出验收标准，再约束实现、测试和发布。", "search": "C117 Spec-Driven Development / Validation Gates（规格驱动开发／验证门槛） 【基础】 先给出验收标准，再约束实现、测试和发布。TDD 可用于可明确测试的功能，但模型自己写且自己通过的测试不足以证明正确。用独立验收样本、回归、静态检查和必要人工评审补足。高风险变更的发布许可应由可信流程控制。 Spec Driven 与测试及验证门槛", "refs": []}, {"id": "C118", "name": "Long-Running Agent / Loop Harness（长时运行智能体／循环执行框架）", "status": "增强", "chapter": "ch-21", "chapterName": "Coding Agent 与前沿方向", "html": "<p>长任务需要增量目标、进度文件、外部状态、恢复、预算及停止条件。社区所谓 Ralph 类循环通常是重复执行直至条件满足的工程模式，不是统一协议或质量保证。无限重试可能掩盖根因；达到预算、重复失败或需要新授权时应暂停并报告。<a class=\"ref\" href=\"#source-S03\" aria-label=\"查看来源 S03\">[S03]<\/a><a class=\"ref\" href=\"#source-S04\" aria-label=\"查看来源 S04\">[S04]<\/a><\/p>", "definition": "长任务需要增量目标、进度文件、外部状态、恢复、预算及停止条件。", "search": "C118 Long-Running Agent / Loop Harness（长时运行智能体／循环执行框架） 【增强】 长任务需要增量目标、进度文件、外部状态、恢复、预算及停止条件。社区所谓 Ralph 类循环通常是重复执行直至条件满足的工程模式，不是统一协议或质量保证。无限重试可能掩盖根因；达到预算、重复失败或需要新授权时应暂停并报告。[S03][S04] Long Running Agent 与循环 Harness", "refs": ["S03", "S04"]}, {"id": "C119", "name": "RLM（Recursive Language Model，递归语言模型）/ Recursive Context（递归上下文）", "status": "探索", "chapter": "ch-21", "chapterName": "Coding Agent 与前沿方向", "html": "<p>RLM 研究让模型通过程序化访问外部上下文，并递归调用子模型处理片段，以应对超长输入。它与简单增加上下文窗口不同，也不等于所有递归 Agent。潜力在分解与按需读取，但工具安全、递归预算、评测泛化和运行成本仍需按任务验证。<a class=\"ref\" href=\"#source-S35\" aria-label=\"查看来源 S35\">[S35]<\/a><\/p>", "definition": "RLM 研究让模型通过程序化访问外部上下文，并递归调用子模型处理片段，以应对超长输入。", "search": "C119 RLM（Recursive Language Model，递归语言模型）/ Recursive Context（递归上下文） 【探索】 RLM 研究让模型通过程序化访问外部上下文，并递归调用子模型处理片段，以应对超长输入。它与简单增加上下文窗口不同，也不等于所有递归 Agent。潜力在分解与按需读取，但工具安全、递归预算、评测泛化和运行成本仍需按任务验证。[S35] Recursive Language Models 与递归上下文", "refs": ["S35"]}, {"id": "C120", "name": "Managed Runtime / Agent UI / Proactive Tasks（托管运行时／智能体界面／主动任务）", "status": "增强", "chapter": "ch-21", "chapterName": "Coding Agent 与前沿方向", "html": "<p>托管运行时将会话、执行环境和调度交给平台；Agent UI 呈现计划、进度、证据、审批和产物；主动任务由事件或定时器触发。三者正在汇合，但协议和产品尚不统一。企业应保留任务状态与产物导出能力，避免将业务唯一记录锁在某个会话接口。<a class=\"ref\" href=\"#source-S05\" aria-label=\"查看来源 S05\">[S05]<\/a><\/p>\n<p>前沿判断：上下文组织、工具契约、长任务恢复和可验证交付的需求具有持续性；具体 Harness 结构、通信字段、记忆框架及多 Agent 角色划分更容易变化。投资接口与评测资产，比追逐角色数量更耐久。<\/p>", "definition": "托管运行时将会话、执行环境和调度交给平台；Agent UI 呈现计划、进度、证据、审批和产物；主动任务由事件或定时器触发。", "search": "C120 Managed Runtime / Agent UI / Proactive Tasks（托管运行时／智能体界面／主动任务） 【增强】 托管运行时将会话、执行环境和调度交给平台；Agent UI 呈现计划、进度、证据、审批和产物；主动任务由事件或定时器触发。三者正在汇合，但协议和产品尚不统一。企业应保留任务状态与产物导出能力，避免将业务唯一记录锁在某个会话接口。[S05]\n\n前沿判断：上下文组织、工具契约、长任务恢复和可验证交付的需求具有持续性；具体 Harness 结构、通信字段、记忆框架及多 Agent 角色划分更容易变化。投资接口与评测资产，比追逐角色数量更耐久。 Managed Runtime 与 Agent UI 与主动任务", "refs": ["S05"]}], "sources": [{"id": "S01", "title": "Anthropic Building effective agents 2024", "url": "https://www.anthropic.com/engineering/building-effective-agents"}, {"id": "S02", "title": "Anthropic Effective context engineering for AI agents 2025", "url": "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"}, {"id": "S03", "title": "Anthropic Effective harnesses for long running agents 2025", "url": "https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents"}, {"id": "S04", "title": "Anthropic Harness design for long running apps 2026", "url": "https://www.anthropic.com/engineering/harness-design-long-running-apps"}, {"id": "S05", "title": "Anthropic Managed agents 2026", "url": "https://www.anthropic.com/engineering/managed-agents"}, {"id": "S06", "title": "OpenAI Deprecations", "url": "https://developers.openai.com/api/docs/depr
