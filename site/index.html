, "url": "https://arxiv.org/abs/1706.03762"}, {"id": "S41", "title": "Wang et al Self Consistency 2022", "url": "https://arxiv.org/abs/2203.11171"}, {"id": "S42", "title": "Shao et al DeepSeekMath and GRPO 2024", "url": "https://arxiv.org/abs/2402.03300"}, {"id": "S43", "title": "AG-UI Introduction", "url": "https://docs.ag-ui.com/introduction"}, {"id": "S44", "title": "A2UI Documentation", "url": "https://a2ui.org/"}, {"id": "S45", "title": "LangGraph overview", "url": "https://docs.langchain.com/oss/python/langgraph/overview"}, {"id": "S46", "title": "Pydantic AI", "url": "https://pydantic.dev/docs/ai/overview/"}, {"id": "S47", "title": "pgvector", "url": "https://github.com/pgvector/pgvector"}, {"id": "S48", "title": "Qdrant documentation", "url": "https://qdrant.tech/documentation/"}, {"id": "S49", "title": "Docling", "url": "https://docling-project.github.io/docling/"}, {"id": "S50", "title": "LiteLLM documentation", "url": "https://docs.litellm.ai/"}, {"id": "S51", "title": "Langfuse self-hosting", "url": "https://langfuse.com/self-hosting"}, {"id": "S52", "title": "Keycloak documentation", "url": "https://www.keycloak.org/documentation"}, {"id": "S53", "title": "Open Policy Agent", "url": "https://www.openpolicyagent.org/docs"}, {"id": "S54", "title": "Kubernetes multi-tenancy", "url": "https://kubernetes.io/docs/concepts/security/multi-tenancy/"}, {"id": "S55", "title": "gVisor documentation", "url": "https://gvisor.dev/docs/"}, {"id": "S56", "title": "FastAPI", "url": "https://fastapi.tiangolo.com/"}, {"id": "S57", "title": "OpenSearch vector search", "url": "https://docs.opensearch.org/latest/vector-search/"}, {"id": "S58", "title": "OpenTelemetry documentation", "url": "https://opentelemetry.io/docs/"}, {"id": "S59", "title": "Ragas documentation", "url": "https://docs.ragas.io/en/stable/"}, {"id": "S60", "title": "Dify license", "url": "https://github.com/langgenius/dify/blob/main/LICENSE"}, {"id": "S61", "title": "n8n Sustainable Use License", "url": "https://docs.n8n.io/privacy-and-security/sustainable-use-license"}, {"id": "S62", "title": "SGLang documentation", "url": "https://docs.sglang.io/"}, {"id": "S63", "title": "MLflow documentation", "url": "https://mlflow.org/docs/latest/"}, {"id": "S64", "title": "RabbitMQ documentation", "url": "https://www.rabbitmq.com/docs"}, {"id": "S65", "title": "Argo CD", "url": "https://argo-cd.readthedocs.io/en/stable/"}, {"id": "S66", "title": "Prometheus overview", "url": "https://prometheus.io/docs/introduction/overview/"}, {"id": "S67", "title": "Valkey topics", "url": "https://valkey.io/topics/"}, {"id": "S68", "title": "Claude Agent SDK 概览", "url": "https://code.claude.com/docs/en/agent-sdk/overview"}], "interview": [{"id": "Q001", "category": "基础与边界", "level": "基础", "chapter": 2, "question": "什么是 Agent？它和普通大模型调用有什么区别？", "answer": "Agent 是围绕目标，利用模型选择动作、调用工具、观察结果并更新状态的执行系统。一次模型调用主要完成输入到输出的映射；Agent 还需要环境反馈、任务状态、终止条件和运行边界。工程上至少要说明目标、可用工具、权限、状态、预算及结果验收；自主性是程度问题，并非所有任务都要完全自主。", "follow": "一个固定顺序的检索问答流程一定是 Agent 吗？", "pitfall": "只说“LLM + Prompt + 工具”，却没有反馈、状态与停止机制。"}, {"id": "Q002", "category": "基础与边界", "level": "基础", "chapter": 2, "question": "什么时候用工作流，什么时候用 Agent？", "answer": "流程已知、规则明确且出错成本高时，优先确定性工作流；路径依赖未知信息、需要动态选工具时，采用有界 Agent。常见组合是外层流程控制审批与交易，内层 Agent 完成分析和方案生成。选型先用固定流程作为基线，再比较成功率、人工接管、延迟和单位成功成本。", "follow": "报销审核哪些步骤适合交给模型？", "pitfall": "认为 Agent 必然比规则灵活且效果更好，或把所有流程都改成自主规划。"}, {"id": "Q003", "category": "基础与边界", "level": "进阶", "chapter": 11, "question": "ReAct（Reasoning and Acting，推理与行动）、Plan-and-Execute（规划与执行）和 Reflection（反思）分别解决什么问题？", "answer": "ReAct 交替执行动作并吸收观察，适合需要逐步获取事实的任务；Plan-and-Execute 先分解目标再执行，适合较长任务，但计划必须允许更新；反思通过检查结果提出修正，适用于存在明确反馈或验证器的场景。三者可组合，均需限制迭代并检查实际增益。", "follow": "模型反思后更自信但仍然错误，怎么办？", "pitfall": "把自我评价当事实验证；只增加思考次数，不增加可靠反馈。"}, {"id": "Q004", "category": "基础与边界", "level": "基础", "chapter": 4, "question": "结构化输出能保证业务正确吗？", "answer": "不能。Schema 校验约束字段、类型和结构，不能证明事实、权限或业务规则正确。应分层验证：格式合法、字段范围、跨字段关系、事实来源、业务状态和动作授权。例如金额是数字不代表金额正确，工具参数合法也不代表用户有权执行。", "follow": "如何处理“结构正确但引用不存在”的回答？", "pitfall": "把 JSON 解析成功率当任务成功率。"}, {"id": "Q005", "category": "基础与边界", "level": "进阶", "chapter": 4, "question": "为什么不能把完整思维链作为审计依据？", "answer": "模型的自然语言推理不等于忠实的内部计算记录，也可能含有编造解释。审计应保存输入版本、检索证据、工具提案与结果、审批、状态变更和校验输出。可以要求简洁的结论依据与可核验引用，不能要求暴露隐藏思维链来证明系统可靠。", "follow": "如何让业务人员理解一个决策？", "pitfall": "把“解释得详细”视为可信，忽略真实行动日志。"}, {"id": "Q006", "category": "知识与上下文", "level": "基础", "chapter": 7, "question": "RAG 的完整链路是什么？", "answer": "离线链路包括授权采集、解析、清洗、分块、嵌入、索引和版本发布；在线链路包括身份过滤、查询处理、召回、融合或重排、上下文构造、生成和引用校验。评估时分别观察数据解析、召回、排序和回答，避免把所有错误归因于模型。", "follow": "文档更新或权限撤销后，如何同步到答案？", "pitfall": "只讲向量数据库和相似度，不讲权限、版本和证据定位。"}, {"id": "Q007", "category": "知识与上下文", "level": "进阶", "chapter": 7, "question": "Chunk 大小怎么选？", "answer": "按文档结构和任务粒度决定，不存在通用最佳长度。小块定位精准但容易失去上下文，大块更完整但噪声、成本和检索混淆增加。优先保留标题层级、表格结构与页码；比较不同切分方案在同一问题集上的召回、答案正确性和成本，必要时采用子块检索、父块补全。", "follow": "表格跨页或合同条款依赖前文时怎么办？", "pitfall": "直接背诵固定 token 数和重叠比例，没有验证方法。"}, {"id": "Q008", "category": "知识与上下文", "level": "进阶", "chapter": 8, "question": "为什么需要混合检索和重排？", "answer": "关键词检索擅长编号、专有名词和精确匹配，向量检索擅长语义近似；融合可补充各自短板。不同检索分数未必可直接相加，可采用排名融合；重排对候选集进行更精细的相关性判断。应衡量最终答案增益与额外延迟，若基线已满足需求，不必强制增加重排。", "follow": "Recall@k 很高但回答仍然差，可能是什么问题？", "pitfall": "把不同检索器分数直接混用，或只看召回不看上下文噪声。"}, {"id": "Q009", "category": "知识与上下文", "level": "高级", "chapter": 33, "question": "长上下文是否会替代 RAG？", "answer": "长上下文提高一次可处理的信息量，但不能自动解决更新、权限、证据定位和费用。小型稳定文档集可以测试直接放入上下文；大规模、持续变化或分级授权数据通常仍需要检索。用同一数据集比较答案质量、定位能力、首响应、费用和权限撤销效果，选择按任务混合使用。", "follow": "只需要分析一份短合同，还要建向量库吗？", "pitfall": "把上下文窗口上限等同于有效理解能力或可用知识库容量。"}, {"id": "Q010", "category": "知识与上下文", "level": "高级", "chapter": 8, "question": "什么时候采用 GraphRAG？", "answer": "当问题依赖实体关系、多跳连接或跨文档整体分析，且普通检索基线不足时再考虑。先明确图的实体、关系、更新和权限语义，再核算抽取、消歧、维护和查询成本。用关系型问题和普通问题分别测量收益；图并不保证抽取事实正确。", "follow": "知识图谱频繁变更时，如何维护来源与版本？", "pitfall": "因为“更高级”就默认引入图数据库，忽略构图错误和更新成本。"}, {"id": "Q011", "category": "知识与上下文", "level": "基础", "chapter": 6, "question": "上下文、记忆、知识库和业务数据库有什么区别？", "answer": "上下文是本次模型调用可见的信息；记忆是跨步骤或跨会话保存、按需取用的信息；知识库是带来源的可检索内容；业务数据库是订单、余额等事实的权威来源。摘要和向量记忆不能代替实时交易状态。长期记忆应有作用域、来源、更新时间、有效期和删除机制。", "follow": "用户角色变更后，旧会话摘要还能使用吗？", "pitfall": "把所有历史对话向量化就称为完整记忆体系。"}, {"id": "Q012", "category": "知识与上下文", "level": "高级", "chapter": 5, "question": "如何处理长任务上下文膨胀和压缩失真？", "answer": "先按任务相关性选择信息，再分配上下文预算，保留目标、约束、关键事实、未完成事项和产物引用。压缩摘要应带版本和来源，关键约束采用结构化状态单独保存；需要时从原始记录恢复证据。测试压缩前后约束遗漏、事实偏差和任务成功率，而不是只观察 token 下降。", "follow": "摘要错误被下一轮继续放大，如何定位与恢复？", "pitfall": "无限追加历史，或用一段摘要覆盖所有原始证据。"}, {"id": "Q013", "category": "工具与执行", "level": "基础", "chapter": 9, "question": "一个生产级工具接口需要包含什么？", "answer": "明确名称、用途、参数与返回 Schema、错误类型、超时、权限范围、副作用、幂等机制和版本。工具描述帮助模型选择，执行器负责真实授权和业务校验。返回结构化状态与证据引用，区分可重试错误、永久失败和结果未知。", "follow": "“工具调用超时”为什么不能直接作为失败重试？", "pitfall": "仅描述函数签名，没有副作用和失败语义。"}, {"id": "Q014", "category": "工具与执行", "level": "进阶", "chapter": 10, "question": "MCP（Model Context Protocol，模型上下文协议）、Tool Calling（工具调用）、A2A（Agent2Agent，智能体间协议）和 Skill（技能）怎么区分？", "answer": "Tool Calling 是模型提出调用结构化工具的机制；MCP 用于客户端与能力服务之间的标准化交互；A2A 面向独立 Agent 的任务与产物协作；Skill 封装可复用的操作知识和流程。它们不是层层必装的依赖链。实际能力与传输方式应按使用版本的规范确认，普通内部函数不必额外包装成 Agent。", "follow": "接入 MCP 后，企业权限体系是否可以省略？", "pitfall": "把协议互通当成业务授权或可靠执行保证。"}, {"id": "Q015", "category": "工具与执行", "level": "高级", "chapter": 14, "question": "工具执行超时，但业务可能已经成功，如何处理？", "answer": "把结果标记为未知而不是直接失败。以稳定的业务幂等键查询操作记录或下游状态；确认成功就复用结果，确认未发生再按策略重试，无法确认则进入对账或人工处理。首次调用前持久化操作意图，写操作账本与业务唯一约束共同控制重复。", "follow": "下游不支持幂等键，也没有状态查询接口怎么办？", "pitfall": "重试生成新幂等键，或声称“最多重试三次就安全”。"}, {"id": "Q016", "category": "工具与执行", "level": "高级", "chapter": 14, "question": "如何实现 Agent 的恰好一次业务效果？", "answer": "跨系统通常不能仅依靠消息投递或工作流框架保证恰好一次。常用至少一次投递配合稳定幂等键、唯一约束、操作账本、事务 outbox 和对账，实现特定业务范围内的效果去重。必须说明原子性边界和无法补偿的操作；下游能力不足时不能承诺通用保证。", "follow": "数据库提交成功但事件未发送，如何避免状态分叉？", "pitfall": "混淆消息恰好一次、函数只执行一次和业务效果只产生一次。"}, {"id": "Q017", "category": "工具与执行", "level": "进阶", "chapter": 13, "question": "长任务为什么需要检查点？恢复时要注意什么？", "answer": "检查点保存可恢复状态，避免进程丢失后从头推理；但状态恢复不代表外部动作可重放。必须区分纯计算、已完成动作和结果未知的动作，固定任务版本，并在恢复后重验权限、审批和业务状态。产物通常独立保存引用，不把全部大文件塞进检查点。", "follow": "任务运行过程中发布了新图结构，旧任务怎么办？", "pitfall": "将 checkpoint 等同于事务回滚或跨系统一致性。"}, {"id": "Q018", "category": "工具与执行", "level": "高级", "chapter": 31, "question": "LangGraph 与 Temporal 如何分工？", "answer": "在本指南参考组合中，LangGraph 管理 Agent 图内状态和上下文，Temporal 可管理外层长期业务任务、等待与恢复。若两者并用，应明确一个外层状态所有者，用稳定子任务 ID 调用有界 Agent，重试前查询完成记录；模型和外部动作放在受控执行单元。短任务可只用一种，不能让两套引擎重复拥有同一个动作的重试权。", "follow": "外层 Activity 重试时，怎样避免重新执行整个 Agent？", "pitfall": "按产品名叠加组件，却说不清谁负责恢复和重试。"}, {"id": "Q019", "category": "工具与执行", "level": "进阶", "chapter": 13, "question": "如何设计取消、预算和停止条件？", "answer": "设置任务期限、最大步骤、工具调用与费用预算、重复动作检测和结果验收条件。取消是状态转移：先记录 cancel_requested，再阻止新增工作，终止可中断的调用并清理资源；已提交副作用不一定能撤销。预算应预留并结算，避免并发调用都通过余额检查而超支。", "follow": "前端关闭页面是否应该取消后端任务？", "pitfall": "认为断开流式连接就停止任务，或把最大轮数当唯一停止条件。"}, {"id": "Q020", "category": "安全与治理", "level": "基础", "chapter": 15, "question": "什么是提示注入？为什么只加一句防御提示不够？", "answer": "攻击者把指令放入网页、文档或工具输出，试图让模型改变目标、泄露信息或执行越权动作。提示词本身不是可信执行边界，应限制可用工具、隔离不可信内容、执行前授权、控制网络出口，并对敏感操作审批。检测器可以辅助，但防护还要依赖系统权限和行为约束。", "follow": "合法网页要求将上下文发送到外部地址时，在哪一层拦截？", "pitfall": "认为过滤几个关键词或系统提示就能完全防御。"}, {"id": "Q021", "category": "安全与治理", "level": "高级", "chapter": 34, "question": "如何实现多租户隔离？", "answer": "服务端从可信身份确定租户，贯穿数据库查询、索引过滤、缓存键、文件路径、日志与任务权限。共享存储采用租户约束及对象级授权，高隔离场景使用独立数据库或部署。建立跨租户检索、缓存污染、任务 ID 枚举和产物下载测试；命名空间或 tenant_id 字段本身不构成完整隔离。", "follow": "向量索引已经按租户过滤，为什么还会泄漏？", "pitfall": "只检查检索，忽略缓存、摘要、日志和对象存储。"}, {"id": "Q022", "category": "安全与治理", "level": "高级", "chapter": 34, "question": "人工审批如何避免“审批时安全、执行时危险”？", "answer": "审批绑定具体动作、工具版本、参数哈希、资源、申请人与有效期；执行时重新校验权限、业务前置条件和提案是否变化。变更参数必须重新审批，审批令牌防重放并可撤销。审批记录还要区分“允许这次动作”与“扩大长期权限”。", "follow": "批准后订单金额变化，原审批还能使用吗？", "pitfall": "只保存一个 approved=true，没有参数绑定与执行时复验。"}, {"id": "Q023", "category": "安全与治理", "level": "进阶", "chapter": 34, "question": "运行模型生成的代码如何隔离？", "answer": "使用短生命周期沙箱，限制文件访问、网络出口、CPU、内存、时间和可用凭据；产物经过检查再回传。普通容器不应被默认视为对抗恶意代码的充分边界，需按威胁模型选择额外隔离。工具执行身份应比平台本身弱，依赖下载也要控制来源与外传风险。", "follow": "代码只能访问一个目录，还可能通过什么路径泄漏数据？", "pitfall": "让代码进程继承主服务环境变量、网络和长期云凭据。"}, {"id": "Q024", "category": "评测与优化", "level": "基础", "chapter": 17, "question": "如何评测 Agent？为什么只评最终回答不够？", "answer": "同时评估任务结果与执行过程：结果是否正确、证据是否支持、工具是否越权、是否重复写入、预算是否超限、能否恢复。固定任务集、环境和版本，加入边界、长尾及对抗样例。最终回答看似正确仍可能伴随危险动作，因此过程安全指标可作为独立门禁。", "follow": "任务完成率提升，但人工返工也增加，算优化吗？", "pitfall": "只测文本相似度或聊天满意度，不验证真实业务状态。"}, {"id": "Q025", "category": "评测与优化", "level": "进阶", "chapter": 17, "question": "LLM-as-a-Judge 有哪些问题？如何使用？", "answer": "自动评审可能受措辞、位置、长度、模型偏好和提示注入影响，也可能与被评模型共享盲点。先定义评分标准，用人工标注集校准，记录一致性和错误类型；高风险判断使用确定性验证与领域专家。比较版本时固定评审配置，对接近结果报告不确定性。", "follow": "使用更强模型当裁判就能消除偏差吗？", "pitfall": "把一个评分数字当客观事实，或让模型评判它自己编造的事实。"}, {"id": "Q026", "category": "评测与优化", "level": "进阶", "chapter": 35, "question": "如何防止 Prompt 或模型升级造成回归？", "answer": "把代码、提示、模型配置、工具 Schema、策略和知识版本组成不可变发布。先运行契约与离线评测，再做安全测试、影子运行和小流量灰度，按业务与系统指标决定扩大或回滚。长期任务保持原发布版本，或制定明确迁移方案；只回滚提示词可能不足以恢复原行为。", "follow": "知识库更新是否也需要回归？", "pitfall": "把 Prompt 当运营文案直接改生产，未保留版本和样例。"}, {"id": "Q027", "category": "评测与优化", "level": "高级", "chapter": 35, "question": "如何降低延迟与成本，同时保持质量？", "answer": "先拆解检索、排队、模型、工具和审批耗时，找到主导项。按任务使用合适模型、减少冗余上下文和循环、并行独立步骤、缓存可复用且权限一致的内容、对离线任务批处理。每项优化都与基线比较质量和单位成功成本，不能只看 token 费用；小模型导致返工可能更贵。", "follow": "为什么流式输出改善体验却未必降低总完成时间？", "pitfall": "直接换便宜模型或无限并行，不测失败成本与限流。"}, {"id": "Q028", "category": "评测与优化", "level": "进阶", "chapter": 20, "question": "RAG、微调和提示优化如何选择？", "answer": "事实频繁变化或需要来源追溯时优先 RAG/工具；稳定的输出行为、格式和领域任务适配可评估微调；任务描述与示例不清楚时先做提示和流程优化。先确认错误来源再选方法，构建独立测试集并比较总成本。微调不会自动获得实时事实，也不会代替授权。", "follow": "模型总是用错公司最新制度，应优先微调吗？", "pitfall": "把所有知识缺失都归因于模型训练不足。"}, {"id": "Q029", "category": "架构与选型", "level": "高级", "chapter": 12, "question": "多 Agent 什么时候有价值？如何证明？", "answer": "当子任务可独立并行、需要不同权限/上下文边界，或有明确专业验证收益时，多 Agent 可能有价值。设计任务交接和共享信息契约，控制协调成本与错误传播。与单 Agent、固定流程做消融对照，比较任务成功、延迟、费用和人工负担；角色数量不代表架构成熟度。", "follow": "多个 Agent 使用相同模型和来源，讨论能增加多少独立证据？", "pitfall": "把不同角色名当专业能力，认为辩论一定提升正确率。"}, {"id": "Q030", "category": "架构与选型", "level": "高级", "chapter": 30, "question": "从零建设企业 Agent 平台，你会如何划分架构？", "answer": "先明确场景、数据边界、风险和成功指标，再划分接入、控制面、执行面、模型/知识能力、工具、数据、质量与治理。默认只读场景起步，统一身份、任务、证据和发布，再引入受控写操作及恢复。优先模块化和复用已有基础设施，按隔离与负载拆分，最后以第二个场景的复用效果验证平台化价值。", "follow": "如果只有两名后端，第一阶段删掉哪些组件？", "pitfall": "一上来列十几个项目，未说明职责、交付顺序和运维负责人。"}, {"id": "Q031", "category": "架构与选型", "level": "进阶", "chapter": 32, "question": "Agent 开发必须使用 Python 吗？", "answer": "不必须。Python 在数据处理、模型实验和评测生态中常有便利；TypeScript 适合已有全栈团队；JVM 或 .NET 系统可保留业务控制与工具适配。按照团队维护能力、依赖生态、接口与运行需求决定边界，避免为统一语言重写成熟系统。", "follow": "现有团队全部使用 Java，是否仍要拆 Python 服务？", "pitfall": "用语言流行程度决定架构，不计算组织和运维成本。"}, {"id": "Q032", "category": "架构与选型", "level": "高级", "chapter": 32, "question": "如何选择向量数据库和 Agent 框架？", "answer": "先定义硬门槛和真实工作负载。检索系统比较过滤后召回、更新删除、延迟、备份和运维；框架比较状态、工具接口、恢复、测试和退出成本。小规模可用现有 PostgreSQL 扩展做基线，复杂需求再测独立检索服务。产品列表只是候选，最终决定应有同任务集 PoC 和 ADR。", "follow": "为什么不能按文档数量直接决定换向量数据库？", "pitfall": "只按星标数、演示效果或单次性能测试选型。"}, {"id": "Q033", "category": "架构与选型", "level": "高级", "chapter": 33, "question": "企业应使用商业模型 API 还是私有化部署？", "answer": "先过数据位置、许可和必要能力门槛，再比较企业任务质量、吞吐延迟、可用性与总成本。商业 API 降低推理运维负担，私有化提供部署控制但需要 GPU、升级、容量和模型质量保障；混合路由须遵循数据分级。不要仅按 token 单价与 GPU 购买价格做静态对比。", "follow": "模型 API 故障时，是否能自动切换任何备用厂商？", "pitfall": "认为私有化天然安全、便宜，或忽略权重许可证与数据处理条款。"}, {"id": "Q034", "category": "故障与实战", "level": "高级", "chapter": 8, "question": "RAG 回答错误，你会怎样逐层排查？", "answer": "先固定问题、身份、知识和模型版本，查看权威文档是否存在且有效；再查解析与切分是否保留关键信息、ACL 是否错误过滤、召回与重排是否命中、最终上下文是否截断。若证据正确，再查生成约束、引用与拒答。用可复现样例分离各阶段指标，避免边调参数边换数据。", "follow": "文档能检索到，但模型引用了旧版本，如何处理？", "pitfall": "只调 top-k 或提示词，没有读取实际检索与上下文轨迹。"}, {"id": "Q035", "category": "故障与实战", "level": "高级", "chapter": 13, "question": "Agent 陷入重复调用或死循环怎么办？", "answer": "检查是否缺少终止条件、工具结果不可理解、错误未分类或状态未更新。加入最大步数、重复动作指纹、无进展检测、预算和期限；对可恢复错误有界重试，对缺信息情况请求澄清，对永久失败停止或转人工。用失败轨迹修复工具契约，不只是提高循环上限。", "follow": "重复查询可能是正常轮询，如何与死循环区分？", "pitfall": "单纯增加迭代次数，或者用随机延迟掩盖逻辑问题。"}, {"id": "Q036", "category": "故障与实战", "level": "高级", "chapter": 36, "question": "Worker 在写入业务系统后崩溃，恢复方案是什么？", "answer": "接管者读取持久任务和操作账本，通过幂等键查询已执行动作；确认成功就补记结果继续，未知状态进入对账。任务租约和隔离旧 worker 的机制防止双重执行，外部业务约束防重复副作用。恢复演练应覆盖“提交成功但回执未保存”这一窗口。", "follow": "如果检查点刚好在写操作之前，能直接重放吗？", "pitfall": "只回答“从最近 checkpoint 恢复”，没有处理已提交副作用。"}, {"id": "Q037", "category": "故障与实战", "level": "高级", "chapter": 35, "question": "上线后成本翻倍，如何定位？", "answer": "比较发布前后同任务类型的调用次数、输入输出长度、缓存命中、模型路由、重试和成功率；区分流量增长与单位任务变贵。检查工具失败引发循环、检索上下文扩张、并行子 Agent 数量和计费变化。先限额与止损，再用独立回归确认修复，避免为了成本降低任务质量。", "follow": "月总成本增长但单位成功成本下降，如何解释？", "pitfall": "只看账单总额，不按任务、版本和成功率分解。"}, {"id": "Q038", "category": "故障与实战", "level": "高级", "chapter": 34, "question": "如何设计一个能查询知识并创建工单的 Agent？", "answer": "查询阶段按用户授权检索并附证据；模型生成工单提案，服务端校验必填项、资源权限和重复工单。根据风险确认后，以幂等键调用工单 API，保存操作状态和工单 ID。对超时查询结果，对失败给出明确状态，不能只生成“已创建”的文本。评测覆盖缺信息、重复提交、越权和下游故障。", "follow": "什么情况下可免除逐次人工确认？", "pitfall": "让模型直接决定写入权限，或在 API 成功前告诉用户完成。"}, {"id": "Q039", "category": "故障与实战", "level": "进阶", "chapter": 27, "question": "如何将 Coding Agent 推广为团队工程能力？", "answer": "建立项目约定、明确任务输入与验收、隔离工作环境、可执行测试和人工评审；新项目强调边界，老项目先识别既有行为和约束。把规则与检查纳入版本管理和 CI，记录产物与验证证据。按任务复杂度比较交付周期、缺陷、返工和审查耗时，采用率不能代替收益。", "follow": "Agent 提交的测试全部通过，为什么仍需要评审？", "pitfall": "把使用覆盖率或生成代码量当生产力提升证明。"}, {"id": "Q040", "category": "架构与选型", "level": "高级", "chapter": 37, "question": "面试中如何评价一个新框架或“下一代 Agent 架构”？", "answer": "先澄清它解决哪个已验证瓶颈，再看执行语义、权限、数据边界、评测证据、运维与退出成本。区分官方弃用公告、实现方式变化和趋势判断；新项目仍需固定版本与兼容测试。可以提出隔离试点，设定增益指标与退出条件，而不是因为新或热门就替换生产系统。", "follow": "如果候选方案只有演示视频，如何推进决策？", "pitfall": "绝对宣称某技术已过时或必成主流，却没有事实依据和适用范围。"}]}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('guide-data').textContent);
const chapters=DATA.chapters,concepts=DATA.concepts,sources=DATA.sources;
const $=id=>document.getElementById(id),esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groups=[{title:'认识 Agent',label:'从能力边界开始',desc:'弄清模型、Agent 与工作流的区别，建立推理和指令的基本认识。',chs:[1,2,3,4],range:[1,18],outcome:'能判断任务是否需要 Agent'},{title:'知识与上下文',label:'让回答有据可查',desc:'理解上下文、记忆、RAG 与业务事实源，避免把所有数据塞进模型。',chs:[5,6,7,8],range:[19,42],outcome:'能设计带权限和证据的知识链路'},{title:'工具与协作',label:'从理解走向行动',desc:'掌握工具契约、MCP、A2A、规划和多 Agent，按收益选择复杂度。',chs:[9,10,11,12],range:[43,66],outcome:'能划分工具与 Agent 的职责'},{title:'可靠运行与治理',label:'建立生产边界',desc:'把长任务、恢复、幂等、审批、安全与租户隔离纳入运行体系。',chs:[13,14,15,16],range:[67,90],outcome:'能解释失败时如何安全恢复'},{title:'质量与持续优化',label:'用评测驱动改进',desc:'连接评测、可观测性、发布、成本、微调和 Coding Agent。',chs:[17,18,19,20,21],range:[91,120],outcome:'能量化质量、成本与方案增益'},{title:'企业平台与实践',label:'把概念组合成方案',desc:'用平台架构、运行契约和通用业务案例形成可执行的建设路径。',chs:[22,23,24,25,26,27,28,29],range:null,outcome:'能交付可评审的企业平台方案'}];
groups.push({title:'完整方案与技术选型',label:'从选型到生产',desc:'三套组合、逐层选型、数据与运行契约、评测发布、部署容灾及实施路径。',chs:[30,31,32,33,34,35,36,37],range:null,outcome:'形成可验证、可演进的建设方案'});

const statusText={'基础':['长期基础','能力或原则长期存在，具体实现会更新。'],'增强':['持续发展','值得持续投入的方向，不代表必然成为主流。'],'条件':['条件适用','在特定任务或规模下受益，需要对照验证。'],'探索':['探索阶段','研究或产品形态在变化，先做小范围实验。'],'迁移':['官方迁移','针对特定产品与版本，查看官方生命周期。']};
let store={done:[],saved:[],checks:[],theme:'light'},persistent=true;

function study(){return `<div class="eyebrow">Your learning</div><h1>我的学习</h1><p class="muted">“已理解”是你的自我标记。建议以能够解释取舍、实现验证和演练失败作为掌握标准。</p><div class="two-col"><section class="card"><h2>${store.done.length} <span class="muted" style="font-size:16px">/ 120 个核心概念</span></h2><progress max="120" value="${store.done.length}" aria-label="已理解概念进度"></progress>${groups.slice(0,5).map(g=>{let total=g.range[1]-g.range[0]+1,n=store.done.filter(id=>+id.slice(1)>=g.range[0]&&+id.slice(1)<=g.range[1]).length;return `<div class="study-row"><div><strong>${g.title}</strong><span>${n} / ${total}</span></div><div class="meter"><div style="width:${n/total*100}%"></div></div></div>`}).join('')}<div class="actions" style="margin-top:20px"><button data-go="concepts?mode=todo">继续学习</button><button data-go="concepts?mode=done">查看已理解</button></div></section><section class="card"><h2>收藏 ${store.saved.length} 个概念</h2>${store.saved.length?store.saved.map(id=>`<div class="study-row"><a href="#concept-${id}">${id} ${esc(concept(id).name)}</a><button data-save="${id}" class="small">取消收藏</button></div>`).join(''):'<p class="muted">在概念详情中点击“收藏概念”，留待复习。</p>'}<div class="callout small">${persistent?'进度保存在当前浏览器，可离线使用。更换浏览器或清除本地数据后不会自动同步。':'当前环境不支持持久保存，进度仅在本次打开期间保留。'}</div><button id="exportProgress">导出学习记录</button></section></div><div class="section-head"><h2>用实践检验掌握程度</h2><a href="#ch-28" class="small">查看学习路线 →</a></div><div class="two-col">${['实现带来源、定位和访问权限的检索工具。','实现重试不会重复创建业务记录的写入工具。','实现崩溃恢复后重新验证审批和权限的任务。','建立能发现质量退化的独立评测集。'].map((t,i)=>`<div class="card"><div class="eyebrow">实践 ${i+1}</div><p style="margin:9px 0 0">${t}</p></div>`).join('')}</div>${foot()}`}

const platformProfiles={
minimal:{name:'最小可用平台',tag:'低风险 · 单团队 · 快速验证',stack:'TypeScript 前端 → FastAPI + Pydantic / 有限状态机 → 模型 API 与受控工具 → PostgreSQL + pgvector + 对象存储',note:'先交付只读知识应用。沿用 SSO、容器和监控；暂不增加独立工作流集群和 GPU 池。复杂恢复或多团队治理出现后升级。',chap:30},
standard:{name:'标准生产平台',tag:'默认参考 · 多团队 · 可审计执行',stack:'企业入口与 SSO → 控制面 → LangGraph 执行器 → 模型网关 / 检索 / 工具执行器 → 持久化数据与追踪',note:'显式审批、幂等、版本发布与评测门禁。跨天流程按需增加 Temporal，由其拥有外层业务状态。复用已有生产基础设施。',chap:31},
private:{name:'严格私有化平台',tag:'数据不出域 · 自托管推理 · 专职运维',stack:'标准生产平台 → 内网模型网关 → vLLM 或 SGLang GPU 池 → 内部模型与镜像仓库 / 本地遥测',note:'需要额外建设离线升级、权重许可与 GPU 容量管理。模型质量和总成本均需实测；私有化不等于自动更便宜。',chap:36}
};
function platform(params=new URLSearchParams()){
 const key=Object.hasOwn(platformProfiles,params.get('profile'))?params.get('profile'):'standard',p=platformProfiles[key];
 return `<div class="eyebrow">Enterprise AI · Solution architecture</div><h1>企业 AI / Agent 平台<br>完整方案与技术选型</h1><p class="muted">面向通用企业场景。官方资料核验于 2026.09.11；推荐组合是架构判断，需结合企业约束进行 PoC。</p><div class="chips" aria-label="平台组合选择">${Object.entries(platformProfiles).map(([k,v])=>`<a class="profile-link ${k===key?'chosen':''}" href="#platform?profile=${k}" aria-current="${k===key?'page':'false'}">${esc(v.name)}</a>`).join('')}</div><section class="card"><div class="eyebrow">${p.tag}</div><h2 style="margin-top:10px">${p.name}</h2><div class="platform-flow">${p.stack.split(' → ').map(x=>`<div>${esc(x)}</div>`).join('<span aria-hidden="true">↓</span>')}</div><p>${p.note}</p><a href="#ch-${p.chap}">阅读组合边界与实施说明 →</a></section><div class="callout"><strong>默认原则：</strong>一个主编排框架、一套权威任务状态、独立授权的工具执行器；先建立评测和恢复能力，再增加 Agent 数量。</div><div class="section-head"><h2>八个专题，形成完整建设方案</h2><a href="#ch-30">连续阅读 →</a></div><div class="grid">${[30,31,32,33,34,35,36,37].map((n,i)=>`<a class="card case" href="#ch-${n}"><div class="eyebrow">SOLUTION 0${i+1}</div><h3 style="margin-top:10px">${esc(titleOf(n))}</h3><span class="arrow">技术决策 · 实现边界 · 验收依据 →</span></a>`).join('')}</div><section class="card" style="margin-top:24px"><h2>快速查找技术选型</h2><label for="stackSearch" class="small">输入组件或需求，例如：Python、权限、检索、LangGraph</label><input id="stackSearch" class="platform-input" type="search" placeholder="筛选下方选型表" autocomplete="off"><div id="stackCount" class="small muted" aria-live="polite"></div><div id="stackTable">${chapter('ch-32').sections.map(x=>'<h3>'+esc(x.title)+'</h3>'+x.html).join('')}</div></section><section class="card" style="margin-top:24px"><h2>容量与 Token 用量估算</h2><p class="muted small">调整输入，观察架构成本驱动因素。结果为假设计算，不是价格报价或 GPU 配置建议。</p><div class="two-col">${[['tasks','每日任务量',10000],['calls','每任务模型调用次数',3],['inputTokens','每调用输入 Token',2000],['outputTokens','每调用输出 Token',500],['arrival','到达率（任务/秒）',2],['duration','平均任务耗时（秒）',20]].map(([id,label,v])=>`<label>${label}<input class="platform-input" id="calc-${id}" type="number" min="0" step="any" value="${v}"></label>`).join('')}</div><div id="capacityResult" class="callout" aria-live="polite"></div><a href="#ch-35">查看成本公式、评测与上线门禁 →</a></section><div class="section-head"><h2>决策前的四项检查</h2></div><div class="two-col">${[['先过硬门槛','数据位置、授权、模型许可、必要能力与恢复语义。'],['比较同一基线','相同任务集、硬件、预算和质量下限；保留失败样例。'],['计入运行成本','组件配套存储、GPU、标注、运维、人工接管与许可证。'],['留好退出路径','独立工具契约、原文与版本、可导出产物、回归集和 ADR。']].map(([t,d])=>`<div class="card"><h3>${t}</h3><p class="muted">${d}</p></div>`).join('')}</div>${foot()}`;
}
function bindPlatform(){
 const calc=()=>{const ids=['tasks','calls','inputTokens','outputTokens','arrival','duration'];const v=ids.map(id=>Number($('calc-'+id).value));if(v.some(n=>!Number.isFinite(n)||n<0)){ $('capacityResult').textContent='请输入有效的非负数。';return;}const [t,c,i,o,a,d]=v,fmt=n=>n.toLocaleString('zh-CN',{maximumFractionDigits:2});const output=[t*c*30,t*c*i*30,t*c*o*30,a*d];if(output.some(n=>!Number.isFinite(n))){$('capacityResult').textContent='输入超出可计算范围，请减小数值。';return;}$('capacityResult').textContent=`按 30 天：模型调用 ${fmt(output[0])} 次；输入 ${fmt(output[1]/1e6)} 百万 Token；输出 ${fmt(output[2]/1e6)} 百万 Token。平均在途任务约 ${fmt(output[3])} 个。未计重试、突发与额外工具费用。`;};
 ['tasks','calls','inputTokens','outputTokens','arrival','duration'].forEach(id=>$('calc-'+id).oninput=calc);calc();
 const filterRows=()=>{const q=$('stackSearch').value.toLowerCase().trim();let count=0;document.querySelectorAll('#stackTable tr').forEach(row=>{if(row.querySelector('th'))return;const show=row.textContent.toLowerCase().includes(q);row.hidden=!show;if(show)count++;});$('stackCount').textContent=`匹配 ${count} 项选型`;};$('stackSearch').oninput=filterRows;filterRows();
}


const interviewQuestions=DATA.interview;
function interviewPage(params=new URLSearchParams()){
const categories=[...new Set(interviewQuestions.map(q=>q.category))],cat=categories.includes(params.get('category'))?params.get('category'):'',level=['基础','进阶','高级'].includes(params.get('level'))?params.get('level'):'',term=params.get('q')||'';
return `<div class="eyebrow">Interview preparation · Architecture & engineering</div><h1>Agent 开发建设<br>常见面试题与参考答案</h1><p class="muted">${interviewQuestions.length} 道练习题，覆盖开发工程师、高级工程师与架构师。题目为学习整理，不声称来自具体企业真实题库；参考答案是回答要点，不是唯一标准。更系统的框架与 Python 技术栈练习见<a href="handbook.html">《Agent 框架与 Python 技术栈学习面试手册》</a>（100 题，版本信息截至 2026-09）。</p><div class="callout"><strong>建议回答顺序：</strong>先说结论与适用边界 → 说明实现机制 → 举例解释失败处理 → 给出验证指标。实战题先澄清规模、风险和数据约束，不应虚构个人项目成绩。</div><div class="filters"><input id="interviewSearch" aria-label="搜索面试题与答案" type="search" placeholder="搜索题目或答案，例如：幂等、RAG、成本" value="${esc(term)}"><select id="interviewCategory" aria-label="面试主题"><option value="">全部主题</option>${categories.map(c=>`<option ${cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select id="interviewLevel" aria-label="题目深度"><option value="">全部深度</option>${['基础','进阶','高级'].map(l=>`<option ${level===l?'selected':''}>${l}</option>`).join('')}</select></div><div class="actions"><button id="expandAnswers">展开当前全部答案</button><button id="collapseAnswers">收起当前全部答案</button><button id="randomQuestion">随机抽一道</button><button id="resetInterview">重置筛选</button></div><p id="interviewCount" class="results-meta" aria-live="polite"></p><div id="interviewResults" class="stack"></div><section class="card" style="margin-top:24px"><h2>模拟面试自评</h2><p>每题先用 1–2 分钟口述，再展开参考答案。检查是否说明：适用边界、状态与权限、失败路径、验证指标和技术取舍。参考答案能覆盖核心要点；追问通常有多种合理方案，需要结合约束展开。</p><p class="muted small">产品版本、协议和能力可能变化。涉及选型时结合关联章节及官方资料复核。页面不记录或评分你的口述回答。</p><a href="#platform">回到平台方案与技术选型 →</a></section>${foot()}`;
}
function bindInterview(){
let visible=[];
const update=()=>{const term=$('interviewSearch').value,cat=$('interviewCategory').value,level=$('interviewLevel').value;visible=interviewQuestions.filter(q=>(!cat||q.category===cat)&&(!level||q.level===level)&&matches([q.id,q.question,q.answer,q.follow,q.pitfall].join(' '),term));$('interviewCount').textContent=`当前 ${visible.length} / ${interviewQuestions.length} 题 · 点击题目展开参考答案`;$('interviewResults').innerHTML=visible.length?visible.map(q=>`<details class="card interview-item" id="question-${q.id}"><summary><span class="eyebrow">${q.id} · ${esc(q.category)} · ${q.level}</span><strong>${esc(q.question)}</strong></summary><div class="interview-answer"><h3>参考答案</h3><p>${esc(q.answer)}</p><h3>面试官可能追问</h3><p>${esc(q.follow)}</p><h3>常见失分点</h3><p>${esc(q.pitfall)}</p><a href="#ch-${q.chapter}">深入阅读：${esc(titleOf(q.chapter))} →</a></div></details>`).join(''):'<div class="empty">没有匹配题目，请调整关键词或筛选条件。</div>';const params=new URLSearchParams();if(term)params.set('q',term);if(cat)params.set('category',cat);if(level)params.set('level',level);history.replaceState(null,'','#interview'+(params.size?'?'+params.toString():''));lastRoute=location.hash.slice(1);};
$('interviewSearch').oninput=update;$('interviewCategory').onchange=update;$('interviewLevel').onchange=update;
$('expandAnswers').onclick=()=>document.querySelectorAll('.interview-item').forEach(x=>x.open=true);$('collapseAnswers').onclick=()=>document.querySelectorAll('.interview-item').forEach(x=>x.open=false);
$('randomQuestion').onclick=()=>{if(!visible.length){toast('当前没有可抽取的题目');return;}const q=visible[Math.floor(Math.random()*visible.length)];document.querySelectorAll('.interview-item').forEach(x=>x.open=false);$('question-'+q.id).scrollIntoView({block:'center',behavior:'smooth'});$('question-'+q.id).querySelector('summary').focus();};
$('resetInterview').onclick=()=>{$('interviewSearch').value='';$('interviewCategory').value='';$('interviewLevel').value='';update();};update();
}

function route(){const hash=location.hash.slice(1)||'home';const [path,query='']=hash.split('?');if(path.startsWith('concept-')){if(!$('main').innerHTML){$('main').innerHTML=glossary(new URLSearchParams());updateResults();lastRoute='concepts';history.replaceState(null,'','#'+hash)}modal(path.slice(8));sidebar();return}if($('conceptDialog').open)$('conceptDialog').close();lastRoute=hash;let markup;
if(path==='home')markup=home();else if(path==='concepts')markup=glossary(new URLSearchParams(query));else if(path==='evolution')markup=evolution();else if(path==='practice')markup=practice();else if(path==='platform')markup=platform(new URLSearchParams(query));else if(path==='interview')markup=interviewPage(new URLSearchParams(query));else if(path==='study')markup=study();else if(path==='sources'||path.startsWith('source-'))markup=sourcePage(path);else if(chapter(path))markup=reader(chapter(path));else markup=home();$('main').innerHTML=markup;sidebar();if(path==='concepts'){updateResults();bindFilters()}if(path==='platform')bindPlatform();if(path==='interview')bindInterview();document.querySelectorAll('.architecture-slot').forEach(el=>el.innerHTML=arch());if($('textSize'))$('textSize').onchange=e=>document.documentElement.style.setProperty('--body-size',e.target.value+'px');document.body.classList.remove('menu-open');$('menuButton').setAttribute('aria-expanded','false');window.scrollTo(0,0);if(path.startsWith('source-'))requestAnimationFrame(()=>$(path)?.scrollIntoView({block:'center'}));document.title=(chapter(path)?.title||({home:'学习地图',concepts:'概念词典',evolution:'技术演进',practice:'企业实践',platform:'平台方案与选型',interview:'面试题与参考答案',study:'我的学习',sources:'参考资料'}[path]||'Agent 指南'))+' · Agent 建设指南';}
function bindFilters(){$('conceptSearch').oninput=e=>{filter.q=e.target.value;updateResults()};$('groupFilter').onchange=e=>{filter.group=e.target.value;updateResults()};$('studyFilter').onchange=e=>{filter.mode=e.target.value;updateResults()};$('resetFilters').onclick=()=>{filter={q:'',status:'',group:'',mode:''};$('conceptSearch').value='';$('groupFilter').value='';$('studyFilter').value='';updateResults()}}
function toggle(id,key){if(store[key].includes(id))store[key]=store[key].filter(x=>x!==id);else store[key].push(id);save();sidebar();document.querySelectorAll(`[data-${key==='done'?'done':'save'}="${id}"]`).forEach(b=>{b.textContent=key==='done'?(store.done.includes(id)?'✓ 已理解':'标记为已理解'):(store.saved.includes(id)?'★ 已收藏':'收藏概念');b.setAttribute('aria-pressed',String(store[key].includes(id)))});if(location.hash.startsWith('#study'))route()}
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){location.hash=go.dataset.go;return}const st=e.target.closest('[data-status-filter]');if(st){filter.status=st.dataset.statusFilter;updateResults();return}const done=e.target.closest('[data-done]');if(done){toggle(done.dataset.done,'done');return}const saved=e.target.closest('[data-save]');if(saved){toggle(saved.dataset.save,'saved');return}const scroll=e.target.closest('[data-scroll]');if(scroll){e.preventDefault();$(scroll.dataset.scroll)?.scrollIntoView({behavior:'smooth'});return}const layer=e.target.closest('[data-layer]');if(layer){const block=layer.closest('.architecture');block.querySelectorAll('[data-layer]').forEach(b=>{b.classList.toggle('active',b===layer);b.setAttribute('aria-pressed',String(b===layer))});const a=archLayers[+layer.dataset.layer];block.nextElementSibling.innerHTML=`<p><strong>${a[0]}：</strong>${a[2]} <a href="#${a[3]}">阅读相关章节 →</a></p>`;return}if(e.target.id==='exportProgress'){const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),understood:store.done.map(id=>({id,name:concept(id).name})),saved:store.saved.map(id=>({id,name:concept(id).name})),reviewedItems:store.checks.map(i=>reviewQuestions()[i])},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Agent学习记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}});
document.addEventListener('change',e=>{if(e.target.matches('[data-check]')){const n=+e.target.dataset.check;store.checks=e.target.checked?[...new Set([...store.checks,n])]:store.checks.filter(i=>i!==n);save();$('checkCount').textContent=`已检查 ${store.checks.length} / 10 项`}});
$('globalForm').onsubmit=e=>{e.preventDefault();location.hash='concepts?q='+encodeURIComponent($('globalSearch').value)};$('themeButton').onclick=()=>{store.theme=store.theme==='dark'?'light':'dark';setTheme();save()};$('printButton').onclick=()=>window.print();$('menuButton').onclick=()=>{$('menuButton').setAttribute('aria-expanded',String(document.body.classList.toggle('menu-open')))};
$('conceptDialog').addEventListener('cancel',e=>{e.preventDefault();closeModal()});$('conceptDialog').addEventListener('click',e=>{if(e.target===$('conceptDialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!$('conceptDialog').open){e.preventDefault();$('globalSearch').focus()}if(e.key==='Escape'&&document.body.classList.contains('menu-open')){document.body.classList.remove('menu-open');$('menuButton').setAttribute('aria-expanded','false')}});
window.addEventListener('hashchange',route);route();
</script></body></html>
