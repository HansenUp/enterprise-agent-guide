版本和迁移窗口。\n\n## 应持续投入的能力\n\n高置信判断：权限与工具契约、证据与数据治理、评测与可观测性、任务状态与可靠执行仍是企业基础。中等置信判断：上下文工程、技能复用、托管运行时及 Agent 与流程组合会进一步发展。具体产品份额、统一记忆协议和完全自主多 Agent 组织仍有较高不确定性。\n\n## 需要减少依赖的做法\n\n超长万能 Prompt、无约束自动循环、把向量库当全部记忆、仅靠模型自评、无证据的自报置信度、让 Agent 自改安全门槛，以及为了角色数量拆分任务，均不宜作为平台默认设计。这是工程适用性判断，不是宣布对应技术已经被官方弃用。\n\n## 掌握标准\n\n能定义概念只是第一步。达到架构师要求，需要解释替代方案、指出失败模式、设计验证方法并给出迁移路径；达到高级开发要求，需要能够实现、观测、故障演练并维护这些边界。"}, {"id": "supplement-1", "number": null, "title": "补充概念一 模型与可信输出", "intro": "", "sections": [{"id": "supplement-1-s0", "title": "Transformer / Attention / MoE（Transformer 架构／注意力机制／Mixture of Experts 混合专家） 【基础】", "html": "<p>Transformer 通过注意力等模块组织 token 之间的信息；Attention 的 Q、K、V 用于计算关联与汇聚表示。RoPE 是一种位置编码方法。MoE 通过路由选择部分专家网络参与计算，“专家”是模型内部参数模块，不是多个业务 Agent。架构影响推理资源与部署，应用选型仍须实测。<a class=\"ref\" href=\"#source-S40\" aria-label=\"查看来源 S40\">[S40]<\/a><\/p>"}, {"id": "supplement-1-s1", "title": "Pre-training / Post-training / In-Context Learning（预训练／后训练／上下文学习） 【基础】", "html": "<p>预训练学习广泛统计模式；后训练进一步调整指令遵循、偏好或推理等行为；上下文学习通过当前示例影响本次输出，通常不更新权重。把知识放进 Prompt 不等于训练模型，购买基础模型也不等于获得完整可运行 Agent。<\/p>"}, {"id": "supplement-1-s2", "title": "RLHF / RLAIF / RLVR（基于人类反馈／AI 反馈／可验证奖励的强化学习） 【条件】", "html": "<p>RLHF 使用人类反馈，RLAIF 使用 AI 反馈，RLVR 使用可验证奖励。PPO 是一种策略优化算法，GRPO 利用组内相对奖励构造优化信号；具体训练方法并不能单独保证业务能力。企业应用团队通常先完善数据和评测，再决定是否有必要进入训练层。<a class=\"ref\" href=\"#source-S42\" aria-label=\"查看来源 S42\">[S42]<\/a><\/p>"}, {"id": "supplement-1-s3", "title": "Hallucination / Grounding / Abstention（幻觉／事实依据／拒答） 【基础】", "html": "<p>幻觉是生成不受事实支持的内容；Grounding 将输出约束到给定证据或环境；Abstention 在证据不足时拒绝下确定结论。低温、引用、微调和多个模型表决都不能完全消除幻觉。平台应能返回“证据不足”和待确认事项，而不是强迫每次填满所有字段。<\/p>"}, {"id": "supplement-1-s4", "title": "Self-Consistency / Best-of-N（自洽采样／多候选择优） 【条件】", "html": "<p>Self Consistency 采样多条推理路径并汇聚答案；Best of N 生成多个候选，再由评分器选取。收益依赖候选多样性和评判可靠性，会增加成本；它们与多 Agent 协作并非同义。同一偏差下的多数票不能替代事实核验。<a class=\"ref\" href=\"#source-S41\" aria-label=\"查看来源 S41\">[S41]<\/a><\/p>"}, {"id": "supplement-1-s5", "title": "Benchmark / Data Contamination（基准测试／数据污染） 【基础】", "html": "<p>公开基准便于比较某类能力，但任务分布、工具环境和评分方式可能不匹配企业应用。训练见过题目、评测泄漏或只挑选成功运行都会造成高估。架构选型应以业务保留集和故障测试为主，公开分数用于筛选候选而非直接验收。<\/p>"}], "search": "# 补充概念一 模型与可信输出\n\n## Transformer / Attention / MoE（Transformer 架构／注意力机制／Mixture of Experts 混合专家） 【基础】\n\nTransformer 通过注意力等模块组织 token 之间的信息；Attention 的 Q、K、V 用于计算关联与汇聚表示。RoPE 是一种位置编码方法。MoE 通过路由选择部分专家网络参与计算，“专家”是模型内部参数模块，不是多个业务 Agent。架构影响推理资源与部署，应用选型仍须实测。[S40]\n\n## Pre-training / Post-training / In-Context Learning（预训练／后训练／上下文学习） 【基础】\n\n预训练学习广泛统计模式；后训练进一步调整指令遵循、偏好或推理等行为；上下文学习通过当前示例影响本次输出，通常不更新权重。把知识放进 Prompt 不等于训练模型，购买基础模型也不等于获得完整可运行 Agent。\n\n## RLHF / RLAIF / RLVR（基于人类反馈／AI 反馈／可验证奖励的强化学习） 【条件】\n\nRLHF 使用人类反馈，RLAIF 使用 AI 反馈，RLVR 使用可验证奖励。PPO 是一种策略优化算法，GRPO 利用组内相对奖励构造优化信号；具体训练方法并不能单独保证业务能力。企业应用团队通常先完善数据和评测，再决定是否有必要进入训练层。[S42]\n\n## Hallucination / Grounding / Abstention（幻觉／事实依据／拒答） 【基础】\n\n幻觉是生成不受事实支持的内容；Grounding 将输出约束到给定证据或环境；Abstention 在证据不足时拒绝下确定结论。低温、引用、微调和多个模型表决都不能完全消除幻觉。平台应能返回“证据不足”和待确认事项，而不是强迫每次填满所有字段。\n\n## Self-Consistency / Best-of-N（自洽采样／多候选择优） 【条件】\n\nSelf Consistency 采样多条推理路径并汇聚答案；Best of N 生成多个候选，再由评分器选取。收益依赖候选多样性和评判可靠性，会增加成本；它们与多 Agent 协作并非同义。同一偏差下的多数票不能替代事实核验。[S41]\n\n## Benchmark / Data Contamination（基准测试／数据污染） 【基础】\n\n公开基准便于比较某类能力，但任务分布、工具环境和评分方式可能不匹配企业应用。训练见过题目、评测泄漏或只挑选成功运行都会造成高估。架构选型应以业务保留集和故障测试为主，公开分数用于筛选候选而非直接验收。"}, {"id": "supplement-2", "number": null, "title": "补充概念二 平台与交互", "intro": "", "sections": [{"id": "supplement-2-s0", "title": "RBAC / ABAC / ReBAC（基于角色／属性／关系的访问控制） 【基础】", "html": "<p>RBAC 按角色授权；ABAC 按用户、资源、时间等属性决策；ReBAC 按对象关系授权，例如销售与客户归属。企业可能组合使用。模型只表达申请，可信权限服务作最终判断；属性或关系变化后，长期任务和缓存必须重新验证。<\/p>"}, {"id": "supplement-2-s1", "title": "LLMOps / AgentOps / FinOps（模型运维／Agent 运维／成本运营） 【基础】", "html": "<p>LLMOps 管理模型应用的版本、数据、评测和运行；AgentOps 进一步关注多步动作、轨迹、工具与任务恢复；FinOps 关注成本分配与业务价值。这些是职责组织方式，边界并无统一定义。没有必要因此建设三套重复平台，关键是负责人和数据能闭环。<\/p>"}, {"id": "supplement-2-s2", "title": "Model Gateway / Semantic Router（模型网关／语义路由） 【增强】", "html": "<p>模型网关统一接入、凭证、配额、路由和计费记录；语义路由根据请求含义选择模型或业务流程。网关不应隐去模型差异，路由也需要准确率与回退测试。供应商服务不可用和任务不适合某模型，是不同路由原因。<\/p>"}, {"id": "supplement-2-s3", "title": "Ontology / Knowledge Graph / Semantic Layer（本体／知识图谱／语义层） 【基础】", "html": "<p>本体定义实体、关系及约束；知识图谱保存具体实体关系；语义层统一业务指标与查询含义。品牌、菜品、原料关系可用图表达，“销售额”口径由业务语义层确定。GraphRAG 是利用图结构支持检索的一类方法，不等于所有知识图谱应用。<\/p>"}, {"id": "supplement-2-s4", "title": "Realtime Voice / VAD / Barge-in（实时语音／语音活动检测／插话打断） 【条件】", "html": "<p>实时语音 Agent 需要语音活动检测、轮次判断、打断处理和低时延反馈。用户打断后应停止旧响应，并检查已触发动作是否仍应继续。销售录音离线分析不需要全部实时机制；从录音分析升级为自主外呼，会显著增加交互与动作治理要求。<\/p>"}, {"id": "supplement-2-s5", "title": "AG-UI / A2UI / Generative UI（Agent 前端交互协议／声明式界面描述／生成式界面） 【探索】", "html": "<p>AG-UI 规范 Agent 与前端之间的事件和状态交互；A2UI 用声明式描述传递可渲染界面，两者可以组合。它们与 MCP Apps 的集成边界不同，不能因名称相似而混用。界面组件应由受控渲染器校验，确认动作必须落到服务端审批记录；还需验证断线、取消与状态同步。<a class=\"ref\" href=\"#source-S43\" aria-label=\"查看来源 S43\">[S43]<\/a><a class=\"ref\" href=\"#source-S44\" aria-label=\"查看来源 S44\">[S44]<\/a><\/p>"}], "search": "# 补充概念二 平台与交互\n\n## RBAC / ABAC / ReBAC（基于角色／属性／关系的访问控制） 【基础】\n\nRBAC 按角色授权；ABAC 按用户、资源、时间等属性决策；ReBAC 按对象关系授权，例如销售与客户归属。企业可能组合使用。模型只表达申请，可信权限服务作最终判断；属性或关系变化后，长期任务和缓存必须重新验证。\n\n## LLMOps / AgentOps / FinOps（模型运维／Agent 运维／成本运营） 【基础】\n\nLLMOps 管理模型应用的版本、数据、评测和运行；AgentOps 进一步关注多步动作、轨迹、工具与任务恢复；FinOps 关注成本分配与业务价值。这些是职责组织方式，边界并无统一定义。没有必要因此建设三套重复平台，关键是负责人和数据能闭环。\n\n## Model Gateway / Semantic Router（模型网关／语义路由） 【增强】\n\n模型网关统一接入、凭证、配额、路由和计费记录；语义路由根据请求含义选择模型或业务流程。网关不应隐去模型差异，路由也需要准确率与回退测试。供应商服务不可用和任务不适合某模型，是不同路由原因。\n\n## Ontology / Knowledge Graph / Semantic Layer（本体／知识图谱／语义层） 【基础】\n\n本体定义实体、关系及约束；知识图谱保存具体实体关系；语义层统一业务指标与查询含义。品牌、菜品、原料关系可用图表达，“销售额”口径由业务语义层确定。GraphRAG 是利用图结构支持检索的一类方法，不等于所有知识图谱应用。\n\n## Realtime Voice / VAD / Barge-in（实时语音／语音活动检测／插话打断） 【条件】\n\n实时语音 Agent 需要语音活动检测、轮次判断、打断处理和低时延反馈。用户打断后应停止旧响应，并检查已触发动作是否仍应继续。销售录音离线分析不需要全部实时机制；从录音分析升级为自主外呼，会显著增加交互与动作治理要求。\n\n## AG-UI / A2UI / Generative UI（Agent 前端交互协议／声明式界面描述／生成式界面） 【探索】\n\nAG-UI 规范 Agent 与前端之间的事件和状态交互；A2UI 用声明式描述传递可渲染界面，两者可以组合。它们与 MCP Apps 的集成边界不同，不能因名称相似而混用。界面组件应由受控渲染器校验，确认动作必须落到服务端审批记录；还需验证断线、取消与状态同步。[S43][S44]"}, {"id": "ch-30", "number": 30, "title": "30 企业 AI 能力平台：范围与三套参考组合", "intro": "<p>本方案面向多团队共享的知识问答、信息抽取、流程执行、研究分析与软件工程场景。技术资料核验于 2026 年 9 月 11 日。下文“推荐”是基于约束的架构判断，不是市占率排名或经实测证明的全球最佳；未指定企业规模、预算及合规边界，因此先给可裁剪的参考架构。<\/p>", "sections": [{"id": "ch-30-s0", "title": "AI 平台与 Agent 平台的关系", "html": "<p>AI 能力平台统一模型接入、数据处理、推理服务、模型资产、权限、评测和资源治理。Agent 能力平台在其上增加任务状态、工具执行、上下文、人工审批、长任务恢复和产物管理。预测、推荐、OCR、ASR、传统分类器应作为能力服务接入，不必全部包装成自主 Agent。<\/p>\n<p>业务入口包含聊天、表单、批量导入、业务系统 API 与事件触发。平台产出应是可验证的回答、结构化数据或业务动作，而不是只有聊天消息。确定性流程、单 Agent 与多 Agent 共存，共用治理和能力目录。<\/p>"}, {"id": "ch-30-s1", "title": "三套组合：选一套起步", "html": "<div class=\"table-scroll\"><table>\n<tr><th>组合<\/th><th>推荐配置<\/th><th>适用边界与升级触发<\/th><\/tr>\n<tr><td>A 最小可用平台<\/td><td>TypeScript 前端；Python FastAPI + Pydantic；一个有限循环或显式状态机；PostgreSQL + pgvector；对象存储；已批准模型 API；现有 SSO；基础追踪和评测<\/td><td>单团队、低风险、短任务。已有容器服务即可。跨天审批或复杂恢复出现后增加持久化编排；不按人数机械升级<\/td><\/tr>\n<tr><td>B 标准生产平台（默认参考）<\/td><td>A + LangGraph；独立任务与工具服务；模型网关；身份和策略执行；离线知识流水线；OTel + Langfuse；按需引入 Temporal；现有生产容器平台<\/td><td>多团队共享、有写操作、需审计恢复。检索、推理、采集按负载独立扩容；高可用数据服务是前提<\/td><\/tr>\n<tr><td>C 严格私有化平台<\/td><td>B + 内网模型服务 vLLM 或 SGLang；GPU 资源池；内部镜像/依赖仓库；离线模型资产；全链路本地评测和遥测<\/td><td>数据禁止外发或持续稳定负载。需承担模型许可、GPU容量、升级、容灾和质量责任；开源权重不等于无限制商用<\/td><\/tr>\n<\/table><\/div>\n<p>三套组合描述组件职责，不要求每项都是单独微服务。先用模块化单体加独立 worker，按隔离、扩容、责任归属再拆分。若已有成熟 Java 或 .NET 平台，业务控制面沿用现有技术，AI 执行面通过契约接入。<\/p>"}, {"id": "ch-30-s2", "title": "建设与采购边界", "html": "<p>自建企业特有的授权映射、业务工具、领域知识治理、评测数据、发布门禁和产品交互。优先复用数据库、身份、消息、可观测性和工作流设施。托管模型、托管运行平台或低代码平台可加速交付，但必须验证私网连接、数据保留、任务导出、审计和退出能力。<\/p>\n<p>Dify 可作为业务人员创建知识应用与流程的入口；工程团队保留核心工具权限及发布管控。n8n 可作为连接与自动化候选，不应直接承载未经审批的高权限动作。两者许可都不能简单等同于无条件 Apache/MIT；对外 SaaS 或嵌入产品前检查实际许可。<a class=\"ref\" href=\"#source-S60\" aria-label=\"查看来源 S60\">[S60]<\/a><a class=\"ref\" href=\"#source-S61\" aria-label=\"查看来源 S61\">[S61]<\/a><\/p>"}], "search": "# 30 企业 AI 能力平台：范围与三套参考组合\n\n本方案面向多团队共享的知识问答、信息抽取、流程执行、研究分析与软件工程场景。技术资料核验于 2026 年 9 月 11 日。下文“推荐”是基于约束的架构判断，不是市占率排名或经实测证明的全球最佳；未指定企业规模、预算及合规边界，因此先给可裁剪的参考架构。\n\n## AI 平台与 Agent 平台的关系\n\nAI 能力平台统一模型接入、数据处理、推理服务、模型资产、权限、评测和资源治理。Agent 能力平台在其上增加任务状态、工具执行、上下文、人工审批、长任务恢复和产物管理。预测、推荐、OCR、ASR、传统分类器应作为能力服务接入，不必全部包装成自主 Agent。\n\n业务入口包含聊天、表单、批量导入、业务系统 API 与事件触发。平台产出应是可验证的回答、结构化数据或业务动作，而不是只有聊天消息。确定性流程、单 Agent 与多 Agent 共存，共用治理和能力目录。\n\n## 三套组合：选一套起步\n\n| 组合 | 推荐配置 | 适用边界与升级触发 |\n|---|---|---|\n| A 最小可用平台 | TypeScript 前端；Python FastAPI + Pydantic；一个有限循环或显式状态机；PostgreSQL + pgvector；对象存储；已批准模型 API；现有 SSO；基础追踪和评测 | 单团队、低风险、短任务。已有容器服务即可。跨天审批或复杂恢复出现后增加持久化编排；不按人数机械升级 |\n| B 标准生产平台（默认参考） | A + LangGraph；独立任务与工具服务；模型网关；身份和策略执行；离线知识流水线；OTel + Langfuse；按需引入 Temporal；现有生产容器平台 | 多团队共享、有写操作、需审计恢复。检索、推理、采集按负载独立扩容；高可用数据服务是前提 |\n| C 严格私有化平台 | B + 内网模型服务 vLLM 或 SGLang；GPU 资源池；内部镜像/依赖仓库；离线模型资产；全链路本地评测和遥测 | 数据禁止外发或持续稳定负载。需承担模型许可、GPU容量、升级、容灾和质量责任；开源权重不等于无限制商用 |\n\n三套组合描述组件职责，不要求每项都是单独微服务。先用模块化单体加独立 worker，按隔离、扩容、责任归属再拆分。若已有成熟 Java 或 .NET 平台，业务控制面沿用现有技术，AI 执行面通过契约接入。\n\n## 建设与采购边界\n\n自建企业特有的授权映射、业务工具、领域知识治理、评测数据、发布门禁和产品交互。优先复用数据库、身份、消息、可观测性和工作流设施。托管模型、托管运行平台或低代码平台可加速交付，但必须验证私网连接、数据保留、任务导出、审计和退出能力。\n\nDify 可作为业务人员创建知识应用与流程的入口；工程团队保留核心工具权限及发布管控。n8n 可作为连接与自动化候选，不应直接承载未经审批的高权限动作。两者许可都不能简单等同于无条件 Apache/MIT；对外 SaaS 或嵌入产品前检查实际许可。[S60][S61]"}, {"id": "ch-31", "number": 31, "title": "31 分层架构与端到端执行链路", "intro": "", "sections": [{"id": "ch-31-s0", "title": "八层架构与所有权", "html": "<div class=\"table-scroll\"><table>\n<tr><th>层<\/th><th>核心职责<\/th><th>推荐实现与边界<\/th><\/tr>\n<tr><td>体验与接入<\/td><td>聊天、任务、审批、产物、管理员门户<\/td><td>TypeScript + React；现有企业门户优先；HTTPS API 与可恢复事件流<\/td><\/tr>\n<tr><td>控制面<\/td><td>租户、应用、版本、配额、策略、目录、发布<\/td><td>FastAPI 或存量 Spring Boot/.NET；PostgreSQL 元数据；不在控制面运行长任务<\/td><\/tr>\n<tr><td>执行面<\/td><td>状态机、Agent 循环、检查点、预算、取消<\/td><td>LangGraph 或轻量类型化 Agent；长事务按需 Temporal；worker 读取不可变发布版本<\/td><\/tr>\n<tr><td>能力面<\/td><td>模型、检索、OCR、ASR、排序、传统 ML<\/td><td>统一契约和能力清单；模型网关与推理池；模型提供方差异由适配器处理<\/td><\/tr>\n<tr><td>工具面<\/td><td>内部业务 API、MCP、外部系统、代码沙箱<\/td><td>独立工具执行器进行授权、校验、幂等、限流；第三方输入不具备授权能力<\/td><\/tr>\n<tr><td>数据面<\/td><td>原文、结构化事实、索引、记忆、任务产物<\/td><td>PostgreSQL + 对象存储起步；检索按需独立；事实归业务系统<\/td><\/tr>\n<tr><td>质量与运维<\/td><td>评测、追踪、成本、告警、事故、反馈<\/td><td>OpenTelemetry；LLM 追踪与人工标注；现有监控体系；发布回归<\/td><\/tr>\n<tr><td>安全与治理<\/td><td>身份、最小权限、隔离、数据生命周期<\/td><td>现有 IdP 或 Keycloak；策略服务；密钥管理；网络出口约束<\/td><\/tr>\n<\/table><\/div>\n<p>推荐各服务通过 OpenAPI/JSON Schema 定义同步接口，异步结果包含任务 ID、事件序号、状态和产物引用。只有跨组织或独立运行的 Agent 协作才评估 A2A；内部普通函数无需额外协议层。<\/p>"}, {"id": "ch-31-s1", "title": "一次“查询并申请业务变更”的完整路径", "html": "<ol><li>网关验证用户身份；服务端确定 tenant_id、用户与应用权限；限制输入尺寸并创建 run_id、trace_id、预算和截止时间。<\/li><li>执行器读取固定 application_version，按数据分级选择允许的模型与工具；建立只包含授权数据的上下文。<\/li><li>检索服务先做可访问范围过滤，再召回、排序、重排；返回 doc_id、版本、片段位置、证据与授权上下文。<\/li><li>Agent 形成结构化结果或工具提案。工具执行器重新验证业务条件，不能仅依赖提示词中的规则。<\/li><li>写操作生成明确变更摘要与参数哈希；按风险取得审批，审批绑定用户、租户、工具版本、参数、有效期。<\/li><li>执行时再次检查当前权限及业务状态；以幂等键提交。超时但可能成功时先查询执行记录，禁止盲目重试。<\/li><li>结果经业务规则校验，保存产物与证据；提交任务状态和 outbox 事件；前端通过带序号事件恢复显示。<\/li><li>记录脱敏追踪、费用、人工修改和业务反馈。用户取消停止后续工作，但已产生的外部副作用需要补偿流程。<\/li><\/ol>"}, {"id": "ch-31-s2", "title": "LangGraph 与 Temporal 如何分工", "html": "<p>LangGraph 适合图内状态、上下文、暂停和检查点；Temporal 适合跨服务、长时间等待、重试和业务生命周期。<a class=\"ref\" href=\"#source-S45\" aria-label=\"查看来源 S45\">[S45]<\/a><a class=\"ref\" href=\"#source-S30\" aria-label=\"查看来源 S30\">[S30]<\/a><\/p>\n<p>补充：以统一 Runtime 接入多个 Harness 时，先逐个声明各实现的恢复和拦截能力；消息重建不能自动替代框架内部状态与业务动作对账。<\/p>\n<p>若同用：Temporal 拥有外层业务任务状态，Activity 调用有界 Agent 子任务；子任务拥有独立 subrun_id。重试先按 subrun_id 查完成记录。模型调用置于 Activity 或受控执行层，避免工作流重放触发新的模型请求。不要让两套引擎同时决定同一个业务动作是否重试。<\/p>\n<p>如果只需要短任务或单图恢复，先用一种状态所有者。检查点和 durable execution 都不能单独保证外部副作用“恰好一次”；数据库唯一约束、业务幂等与对账仍然必需。<\/p>"}], "search": "# 31 分层架构与端到端执行链路\n\n## 八层架构与所有权\n\n| 层 | 核心职责 | 推荐实现与边界 |\n|---|---|---|\n| 体验与接入 | 聊天、任务、审批、产物、管理员门户 | TypeScript + React；现有企业门户优先；HTTPS API 与可恢复事件流 |\n| 控制面 | 租户、应用、版本、配额、策略、目录、发布 | FastAPI 或存量 Spring Boot/.NET；PostgreSQL 元数据；不在控制面运行长任务 |\n| 执行面 | 状态机、Agent 循环、检查点、预算、取消 | LangGraph 或轻量类型化 Agent；长事务按需 Temporal；worker 读取不可变发布版本 |\n| 能力面 | 模型、检索、OCR、ASR、排序、传统 ML | 统一契约和能力清单；模型网关与推理池；模型提供方差异由适配器处理 |\n| 工具面 | 内部业务 API、MCP、外部系统、代码沙箱 | 独立工具执行器进行授权、校验、幂等、限流；第三方输入不具备授权能力 |\n| 数据面 | 原文、结构化事实、索引、记忆、任务产物 | PostgreSQL + 对象存储起步；检索按需独立；事实归业务系统 |\n| 质量与运维 | 评测、追踪、成本、告警、事故、反馈 | OpenTelemetry；LLM 追踪与人工标注；现有监控体系；发布回归 |\n| 安全与治理 | 身份、最小权限、隔离、数据生命周期 | 现有 IdP 或 Keycloak；策略服务；密钥管理；网络出口约束 |\n\n推荐各服务通过 OpenAPI/JSON Schema 定义同步接口，异步结果包含任务 ID、事件序号、状态和产物引用。只有跨组织或独立运行的 Agent 协作才评估 A2A；内部普通函数无需额外协议层。\n\n## 一次“查询并申请业务变更”的完整路径\n\n1. 网关验证用户身份；服务端确定 tenant_id、用户与应用权限；限制输入尺寸并创建 run_id、trace_id、预算和截止时间。\n2. 执行器读取固定 application_version，按数据分级选择允许的模型与工具；建立只包含授权数据的上下文。\n3. 检索服务先做可访问范围过滤，再召回、排序、重排；返回 doc_id、版本、片段位置、证据与授权上下文。\n4. Agent 形成结构化结果或工具提案。工具执行器重新验证业务条件，不能仅依赖提示词中的规则。\n5. 写操作生成明确变更摘要与参数哈希；按风险取得审批，审批绑定用户、租户、工具版本、参数、有效期。\n6. 执行时再次检查当前权限及业务状态；以幂等键提交。超时但可能成功时先查询执行记录，禁止盲目重试。\n7. 结果经业务规则校验，保存产物与证据；提交任务状态和 outbox 事件；前端通过带序号事件恢复显示。\n8. 记录脱敏追踪、费用、人工修改和业务反馈。用户取消停止后续工作，但已产生的外部副作用需要补偿流程。\n\n## LangGraph 与 Temporal 如何分工\n\nLangGraph 适合图内状态、上下文、暂停和检查点；Temporal 适合跨服务、长时间等待、重试和业务生命周期。[S45][S30]\n\n补充：以统一 Runtime 接入多个 Harness 时，先逐个声明各实现的恢复和拦截能力；消息重建不能自动替代框架内部状态与业务动作对账。\n\n若同用：Temporal 拥有外层业务任务状态，Activity 调用有界 Agent 子任务；子任务拥有独立 subrun_id。重试先按 subrun_id 查完成记录。模型调用置于 Activity 或受控执行层，避免工作流重放触发新的模型请求。不要让两套引擎同时决定同一个业务动作是否重试。\n\n如果只需要短任务或单图恢复，先用一种状态所有者。检查点和 durable execution 都不能单独保证外部副作用“恰好一次”；数据库唯一约束、业务幂等与对账仍然必需。"}, {"id": "ch-32", "number": 32, "title": "32 语言、框架与开源项目选型矩阵", "intro": "", "sections": [{"id": "ch-32-s0", "title": "开发语言：按边界选择", "html": "<div class=\"table-scroll\"><table>\n<tr><th>层<\/th><th>默认建议<\/th><th>替代条件<\/th><th>不建议的做法<\/th><\/tr>\n<tr><td>AI 编排、评测、数据处理<\/td><td>Python + 类型校验；FastAPI 服务接口<\/td><td>全栈 TypeScript 团队可沿用 JS/TS SDK；JVM 团队评估 Spring AI/LangChain4j<\/td><td>为追求“统一语言”重写成熟业务系统<\/td><\/tr>\n<tr><td>产品交互<\/td><td>TypeScript + React，优先沿用企业设计系统<\/td><td>已有 Vue 等体系直接复用<\/td><td>把模型密钥或权限判断放前端<\/td><\/tr>\n<tr><td>业务控制面与工具适配<\/td><td>现有 Java/Spring Boot、.NET 或 Python<\/td><td>新平台以团队维护能力决定<\/td><td>一开始同时引入四种后端语言<\/td><\/tr>\n<tr><td>高并发基础组件<\/td><td>直接采用成熟网关、推理和队列项目<\/td><td>只有性能瓶颈证据充分才用 Go/Rust 定制<\/td><td>用语言性能口号替代链路分析<\/td><\/tr>\n<\/table><\/div>\n<p>FastAPI 提供类型驱动的接口开发与 OpenAPI 能力，但业务授权、持久化任务和故障恢复仍需平台实现。<a class=\"ref\" href=\"#source-S56\" aria-label=\"查看来源 S56\">[S56]<\/a><\/p>"}, {"id": "ch-32-s1", "title": "Agent 框架：同一层通常只选一个主框架", "html": "<div class=\"table-scroll\"><table>\n<tr><th>选择<\/th><th>推荐用途<\/th><th>必须验证<\/th><th>替代或退出方式<\/th><\/tr>\n<tr><td>显式状态机 + 模型 SDK<\/td><td>固定流程、少量工具、低依赖<\/td><td>有界循环、错误分类、预算与状态保存<\/td><td>保留业务契约，后续换编排器<\/td><\/tr>\n<tr><td>LangGraph<\/td><td>复杂有状态流程，显式图、检查点和人工中断<\/td><td>存储后端、恢复语义、副作用重复、版本升级<\/td><td>核心业务工具不耦合图对象 <a class=\"ref\" href=\"#source-S45\" aria-label=\"查看来源 S45\">[S45]<\/a><\/td><\/tr>\n<tr><td>Claude Agent SDK<\/td><td>需要现成工具循环与 Hooks 的应用候选<\/td><td>按具体版本验证工具控制、子任务、会话和部署边界<\/td><td>独立运行契约与恢复等级 <a class=\"ref\" href=\"#source-S68\" aria-label=\"查看来源 S68\">[S68]<\/a><\/td><\/tr>\n<tr><td>Pydantic AI<\/td><td>Python 类型化输入输出、较轻量的 Agent 服务<\/td><td>目标模型能力、工具行为与持久化需求<\/td><td>独立工具协议、结构化输出契约 <a class=\"ref\" href=\"#source-S46\" aria-label=\"查看来源 S46\">[S46]<\/a><\/td><\/tr>\n<tr><td>Spring AI / LangChain4j<\/td><td>JVM 原生系统，团队不希望新增 AI 服务语言<\/td><td>模型接入、工具、RAG、追踪与状态治理<\/td><td>用接口隔离框架，避免同时采用两套 <a class=\"ref\" href=\"#source-S36\" aria-label=\"查看来源 S36\">[S36]<\/a><a class=\"ref\" href=\"#source-S37\" aria-label=\"查看来源 S37\">[S37]<\/a><\/td><\/tr>\n<tr><td>Microsoft Agent Framework / Google ADK<\/td><td>已采用对应生态且平台集成收益明显<\/td><td>当前 SDK 语言、版本成熟度、运行环境与迁移<\/td><td>先做兼容性验证，外置任务与工具契约 <a class=\"ref\" href=\"#source-S10\" aria-label=\"查看来源 S10\">[S10]<\/a><a class=\"ref\" href=\"#source-S39\" aria-label=\"查看来源 S39\">[S39]<\/a><\/td><\/tr>\n<tr><td>Dify<\/td><td>可视化构建和部门应用试验<\/td><td>授权粒度、发布审核、数据迁移、许可证<\/td><td>用受控 API 接业务能力，不直接开放数据库 <a class=\"ref\" href=\"#source-S60\" aria-label=\"查看来源 S60\">[S60]<\/a><\/td><\/tr>\n<\/table><\/div>\n<p>“多 Agent”不是框架选择理由。先比较单 Agent、固定工作流与多 Agent 在同一任务集上的质量、人工成本与延迟。框架自带 UI、商业托管版和社区 SDK 也不能混为同一产品。<\/p>"}, {"id": "ch-32-s2", "title": "数据、能力与治理组件", "html": "<div class=\"table-scroll\"><table>\n<tr><th>环节<\/th><th>默认建议<\/th><th>何时采用替代方案<\/th><th>验收重点<\/th><\/tr>\n<tr><td>关系数据与初期向量检索<\/td><td>PostgreSQL + pgvector<\/td><td>独立向量扩容需求选 Qdrant；强全文/复杂混合搜索选 OpenSearch<\/td><td>权限过滤后召回率、更新删除、一致性与 p95 <a class=\"ref\" href=\"#source-S47\" aria-label=\"查看来源 S47\">[S47]<\/a><a class=\"ref\" href=\"#source-S48\" aria-label=\"查看来源 S48\">[S48]<\/a><a class=\"ref\" href=\"#source-S57\" aria-label=\"查看来源 S57\">[S57]<\/a><\/td><\/tr>\n<tr><td>文档解析<\/td><td>Docling，难例增加专门 OCR/表格服务<\/td><td>已有文档中台优先复用<\/td><td>扫描件、表格、阅读顺序、页码证据 <a class=\"ref\" href=\"#source-S49\" aria-label=\"查看来源 S49\">[S49]<\/a><\/td><\/tr>\n<tr><td>模型网关<\/td><td>多提供方时评估 LiteLLM；单提供方可薄适配<\/td><td>企业已有 AI 网关时复用<\/td><td>预算、路由、请求差异、审计脱敏；企业功能另核 <a class=\"ref\" href=\"#source-S50\" aria-label=\"查看来源 S50\">[S50]<\/a><\/td><\/tr>\n<tr><td>自托管推理<\/td><td>vLLM<\/td><td>SGLang 做同模型同硬件对照<\/td><td>工具调用、结构化输出、长上下文、吞吐与显存 <a class=\"ref\" href=\"#source-S33\" aria-label=\"查看来源 S33\">[S33]<\/a><a class=\"ref\" href=\"#source-S62\" aria-label=\"查看来源 S62\">[S62]<\/a><\/td><\/tr>\n<tr><td>身份<\/td><td>企业现有 SSO；无统一体系时 Keycloak<\/td><td>托管 IdP<\/td><td>用户身份与工具委托权限不能混同 <a class=\"ref\" href=\"#source-S52\" aria-label=\"查看来源 S52\">[S52]<\/a><\/td><\/tr>\n<tr><td>策略<\/td><td>简单策略用服务端代码；跨服务规则再引入 OPA；应用授权可评估 Cedar<\/td><td>资源关系复杂时另评估关系授权引擎；审批状态由平台管理<\/td><td>默认拒绝、规则版本与策略失效 <a class=\"ref\" href=\"#source-S53\" aria-label=\"查看来源 S53\">[S53]<\/a><\/td><\/tr>\n<tr><td>遥测与 LLM 追踪<\/td><td>OTel + 现有监控；Langfuse 作 LLM 追踪候选<\/td><td>既有平台或其他符合需求的追踪工具<\/td><td>数据脱敏、留存、跨链路关联和运行成本 <a class=\"ref\" href=\"#source-S51\" aria-label=\"查看来源 S51\">[S51]<\/a><a class=\"ref\" href=\"#source-S58\" aria-label=\"查看来源 S58\">[S58]<\/a><\/td><\/tr>\n<tr><td>评测<\/td><td>pytest/任务断言 + 人工标注；Ragas 辅助 RAG 评测<\/td><td>自定义领域指标<\/td><td>自动评分不能替代业务正确性和权限测试 <a class=\"ref\" href=\"#source-S59\" aria-label=\"查看来源 S59\">[S59]<\/a><\/td><\/tr>\n<tr><td>模型训练与资产<\/td><td>有微调或传统 ML 需求再评估 MLflow<\/td><td>现有 MLOps 平台<\/td><td>数据版本、训练可复现、模型审批与回滚 <a class=\"ref\" href=\"#source-S63\" aria-label=\"查看来源 S63\">[S63]<\/a><\/td><\/tr>\n<\/table><\/div>\n<p>对象存储、队列、缓存、CI/CD、密钥管理优先复用企业标准。没有既有标准时，可先采用托管 PostgreSQL、S3 兼容对象存储与云密钥服务；严格内网由基础设施团队提供同等能力。不要为了“全开源”临时拼装无人维护的存储集群。<\/p>"}, {"id": "ch-32-s3", "title": "基础设施的具体候选与默认边界", "html": "<div class=\"table-scroll\"><table>\n<tr><th>环节<\/th><th>推荐候选<\/th><th>采用条件与边界<\/th><\/tr>\n<tr><td>后台任务分发<\/td><td>低负载可用数据库任务表；需要专门消息代理时 RabbitMQ<\/td><td>确认消息、死信、幂等和重放；使用 Temporal 的任务调度时不重复引入同用途队列 <a class=\"ref\" href=\"#source-S64\" aria-label=\"查看来源 S64\">[S64]<\/a><\/td><\/tr>\n<tr><td>缓存与短期计数<\/td><td>Valkey<\/td><td>用于短期缓存与限流候选；持久任务状态和最终费用账本留在数据库，验证客户端兼容 <a class=\"ref\" href=\"#source-S67\" aria-label=\"查看来源 S67\">[S67]<\/a><\/td><\/tr>\n<tr><td>发布交付<\/td><td>企业现有 CI + Kubernetes 环境的 Argo CD<\/td><td>Git 中保存声明式配置；配置同步不能替代业务审批、数据库回滚与评测门禁 <a class=\"ref\" href=\"#source-S65\" aria-label=\"查看来源 S65\">[S65]<\/a><\/td><\/tr>\n<tr><td>运行监控<\/td><td>Prometheus + 企业现有可视化/告警系统<\/td><td>基础指标和 SLO；LLM 语义追踪另接追踪平台；避免每次新增组件都引入新仪表盘 <a class=\"ref\" href=\"#source-S66\" aria-label=\"查看来源 S66\">[S66]<\/a><\/td><\/tr>\n<\/table><\/div>\n<p>这些候选补齐新建平台的基础组件入口；已有可靠同类设施时默认复用。每新增一个有状态服务，都要明确其备份、升级、容量、值班和恢复负责人。<\/p>"}], "search": "# 32 语言、框架与开源项目选型矩阵\n\n## 开发语言：按边界选择\n\n| 层 | 默认建议 | 替代条件 | 不建议的做法 |\n|---|---|---|---|\n| AI 编排、评测、数据处理 | Python + 类型校验；FastAPI 服务接口 | 全栈 TypeScript 团队可沿用 JS/TS SDK；JVM 团队评估 Spring AI/LangChain4j | 为追求“统一语言”重写成熟业务系统 |\n| 产品交互 | TypeScript + React，优先沿用企业设计系统 | 已有 Vue 等体系直接复用 | 把模型密钥或权限判断放前端 |\n| 业务控制面与工具适配 | 现有 Java/Spring Boot、.NET 或 Python | 新平台以团队维护能力决定 | 一开始同时引入四种后端语言 |\n| 高并发基础组件 | 直接采用成熟网关、推理和队列项目 | 只有性能瓶颈证据充分才用 Go/Rust 定制 | 用语言性能口号替代链路分析 |\n\nFastAPI 提供类型驱动的接口开发与 OpenAPI 能力，但业务授权、持久化任务和故障恢复仍需平台实现。[S56]\n\n## Agent 框架：同一层通常只选一个主框架\n\n| 选择 | 推荐用途 | 必须验证 | 替代或退出方式 |\n|---|---|---|---|\n| 显式状态机 + 模型 SDK | 固定流程、少量工具、低依赖 | 有界循环、错误分类、预算与状态保存 | 保留业务契约，后续换编排器 |\n| LangGraph | 复杂有状态流程，显式图、检查点和人工中断 | 存储后端、恢复语义、副作用重复、版本升级 | 核心业务工具不耦合图对象 [S45] |\n| Claude Agent SDK | 需要现成工具循环与 Hooks 的应用候选 | 按具体版本验证工具控制、子任务、会话和部署边界 | 独立运行契约与恢复等级 [S68] |\n| Pydantic AI | Python 类型化输入输出、较轻量的 Agent 服务 | 目标模型能力、工具行为与持久化需求 | 独立工具协议、结构化输出契约 [S46] |\n| Spring AI / LangChain4j | JVM 原生系统，团队不希望新增 AI 服务语言 | 模型接入、工具、RAG、追踪与状态治理 | 用接口隔离框架，避免同时采用两套 [S36][S37] |\n| Microsoft Agent Framework / Google ADK | 已采用对应生态且平台集成收益明显 | 当前 SDK 语言、版本成熟度、运行环境与迁移 | 先做兼容性验证，外置任务与工具契约 [S10][S39] |\n| Dify | 可视化构建和部门应用试验 | 授权粒度、发布审核、数据迁移、许可证 | 用受控 API 接业务能力，不直接开放数据库 [S60] |\n\n“多 Agent”不是框架选择理由。先比较单 Agent、固定工作流与多 Agent 在同一任务集上的质量、人工成本与延迟。框架自带 UI、商业托管版和社区 SDK 也不能混为同一产品。\n\n## 数据、能力与治理组件\n\n| 环节 | 默认建议 | 何时采用替代方案 | 验收重点 |\n|---|---|---|---|\n| 关系数据与初期向量检索 | PostgreSQL + pgvector | 独立向量扩容需求选 Qdrant；强全文/复杂混合搜索选 OpenSearch | 权限过滤后召回率、更新删除、一致性与 p95 [S47][S48][S57] |\n| 文档解析 | Docling，难例增加专门 OCR/表格服务 | 已有文档中台优先复用 | 扫描件、表格、阅读顺序、页码证据 [S49] |\n| 模型网关 | 多提供方时评估 LiteLLM；单提供方可薄适配 | 企业已有 AI 网关时复用 | 预算、路由、请求差异、审计脱敏；企业功能另核 [S50] |\n| 自托管推理 | vLLM | SGLang 做同模型同硬件对照 | 工具调用、结构化输出、长上下文、吞吐与显存 [S33][S62] |\n| 身份 | 企业现有 SSO；无统一体系时 Keycloak | 托管 IdP | 用户身份与工具委托权限不能混同 [S52] |\n| 策略 | 简单策略用服务端代码；跨服务规则再引入 OPA；应用授权可评估 Cedar | 资源关系复杂时另评估关系授权引擎；审批状态由平台管理 | 默认拒绝、规则版本与策略失效 [S53] |\n| 遥测与 LLM 追踪 | OTel + 现有监控；Langfuse 作 LLM 追踪候选 | 既有平台或其他符合需求的追踪工具 | 数据脱敏、留存、跨链路关联和运行成本 [S51][S58] |\n| 评测 | pytest/任务断言 + 人工标注；Ragas 辅助 RAG 评测 | 自定义领域指标 | 自动评分不能替代业务正确性和权限测试 [S59] |\n| 模型训练与资产 | 有微调或传统 ML 需求再评估 MLflow | 现有 MLOps 平台 | 数据版本、训练可复现、模型审批与回滚 [S63] |\n\n对象存储、队列、缓存、CI/CD、密钥管理优先复用企业标准。没有既有标准时，可先采用托管 PostgreSQL、S3 兼容对象存储与云密钥服务；严格内网由基础设施团队提供同等能力。不要为了“全开源”临时拼装无人维护的存储集群。\n\n## 基础设施的具体候选与默认边界\n\n| 环节 | 推荐候选 | 采用条件与边界 |\n|---|---|---|\n| 后台任务分发 | 低负载可用数据库任务表；需要专门消息代理时 RabbitMQ | 确认消息、死信、幂等和重放；使用 Temporal 的任务调度时不重复引入同用途队列 [S64] |\n| 缓存与短期计数 | Valkey | 用于短期缓存与限流候选；持久任务状态和最终费用账本留在数据库，验证客户端兼容 [S67] |\n| 发布交付 | 企业现有 CI + Kubernetes 环境的 Argo CD | Git 中保存声明式配置；配置同步不能替代业务审批、数据库回滚与评测门禁 [S65] |\n| 运行监控 | Prometheus + 企业现有可视化/告警系统 | 基础指标和 SLO；LLM 语义追踪另接追踪平台；避免每次新增组件都引入新仪表盘 [S66] |\n\n这些候选补齐新建平台的基础组件入口；已有可靠同类设施时默认复用。每新增一个有状态服务，都要明确其备份、升级、容量、值班和恢复负责人。"}, {"id": "ch-33", "number": 33, "title": "33 模型、知识、记忆与数据工程方案", "intro": "", "sections": [{"id": "ch-33-s0", "title": "模型选型不能只看排行榜", "html": "<p>建立任务能力矩阵：中文与领域理解、结构化输出合法率、工具参数正确率、长上下文证据定位、多模态、拒答质量、延迟、可用区域和数据使用条款。使用企业脱敏独立测试集比较已批准的商业 API 与开源权重模型；不固定某个型号为长期最优。<\/p>\n<p>推荐先用质量达标的强模型建立基线，再把分类、路由和摘要迁移到小模型；嵌入模型与重排模型独立评测。模型路由必须同时检查数据分级、能力和成本，故障降级不能绕过数据出境或任务安全边界。<\/p>\n<p>自托管比较 vLLM 与 SGLang 时固定权重、量化、输入输出分布、并发、GPU 与精度要求。观测首 token 时间、每 token 时间、吞吐、错误和 OOM。OpenAI 兼容接口不代表工具调用、缓存、推理预算等语义完全一致。<a class=\"ref\" href=\"#source-S33\" aria-label=\"查看来源 S33\">[S33]<\/a><a class=\"ref\" href=\"#source-S62\" aria-label=\"查看来源 S62\">[S62]<\/a><\/p>"}, {"id": "ch-33-s1", "title": "知识入库流水线", "html": "<p>数据源授权 → 拉取或变更同步 → 原文对象存储 → 解析/OCR → 清洗去重 → 结构化分块 → 分类与敏感字段识别 → 嵌入 → 索引构建 → 小流量检索验收 → 原子切换知识版本。<\/p>\n<p>每个 chunk 保存 tenant_id、doc_id、revision、页码/坐标、hash、source_uri、ACL 引用、parser_version、embedding_version、有效时间和删除状态。索引是派生物；保留原文与解析产物才能重建与迁移。<\/p>\n<p>Docling 是解析候选而非所有文档的通用解法；用真实合同、扫描件、表格、图文混排建立解析基准。<a class=\"ref\" href=\"#source-S49\" aria-label=\"查看来源 S49\">[S49]<\/a> 删除与权限撤销必须传播到索引、缓存、摘要和产物，并测试传播延迟。<\/p>"}, {"id": "ch-33-s2", "title": "检索执行链与升级依据", "html": "<p>先确定用户授权范围和结构化过滤条件，再做关键词与向量召回，融合排序后可选重排，最终返回有定位的证据。pgvector 支持在 PostgreSQL 中进行相似检索；近似索引与过滤组合需要实测，不可只测无过滤 top-k。<a class=\"ref\" href=\"#source-S47\" aria-label=\"查看来源 S47\">[S47]<\/a><\/p>\n<p>中文关键词检索需验证分词与同义词；PostgreSQL 全文默认配置不能直接假定满足所有中文需求。当关键词、过滤聚合或搜索团队能力要求更高时评估 OpenSearch；向量负载独立增长时比较 Qdrant。<a class=\"ref\" href=\"#source-S48\" aria-label=\"查看来源 S48\">[S48]<\/a><a class=\"ref\" href=\"#source-S57\" aria-label=\"查看来源 S57\">[S57]<\/a><\/p>\n<p>只有基准表明跨实体、多跳关系问题无法通过普通检索解决，再引入 GraphRAG/知识图谱；把抽取、更新、实体消歧、权限和图索引费用纳入总成本。长上下文也需与 RAG 对照，不自动替代权限过滤与数据更新。<\/p>"}, {"id": "ch-33-s3", "title": "记忆与训练数据", "html": "<p>会话状态存在任务数据库；长期用户偏好是带来源、有效期和删除能力的独立记录；业务事实在主系统；可检索知识在知识服务；过程产物在对象存储。检索历史摘要时重新校验权限，不能因为“曾经可见”而继续展示。<\/p>\n<p>用户反馈先去标识、授权审查和去重，再进入评测或训练。训练集与测试集严格隔离；时间切分检查漂移。微调适合稳定格式、风格与任务行为，持续变化的业务事实优先检索或工具查询。<\/p>"}], "search": "# 33 模型、知识、记忆与数据工程方案\n\n## 模型选型不能只看排行榜\n\n建立任务能力矩阵：中文与领域理解、结构化输出合法率、工具参数正确率、长上下文证据定位、多模态、拒答质量、延迟、可用区域和数据使用条款。使用企业脱敏独立测试集比较已批准的商业 API 与开源权重模型；不固定某个型号为长期最优。\n\n推荐先用质量达标的强模型建立基线，再把分类、路由和摘要迁移到小模型；嵌入模型与重排模型独立评测。模型路由必须同时检查数据分级、能力和成本，故障降级不能绕过数据出境或任务安全边界。\n\n自托管比较 vLLM 与 SGLang 时固定权重、量化、输入输出分布、并发、GPU 与精度要求。观测首 token 时间、每 token 时间、吞吐、错误和 OOM。OpenAI 兼容接口不代表工具调用、缓存、推理预算等语义完全一致。[S33][S62]\n\n## 知识入库流水线\n\n数据源授权 → 拉取或变更同步 → 原文对象存储 → 解析/OCR → 清洗去重 → 结构化分块 → 分类与敏感字段识别 → 嵌入 → 索引构建 → 小流量检索验收 → 原子切换知识版本。\n\n每个 chunk 保存 tenant_id、doc_id、revision、页码/坐标、hash、source_uri、ACL 引用、parser_version、embedding_version、有效时间和删除状态。索引是派生物；保留原文与解析产物才能重建与迁移。\n\nDocling 是解析候选而非所有文档的通用解法；用真实合同、扫描件、表格、图文混排建立解析基准。[S49] 删除与权限撤销必须传播到索引、缓存、摘要和产物，并测试传播延迟。\n\n## 检索执行链与升级依据\n\n先确定用户授权范围和结构化过滤条件，再做关键词与向量召回，融合排序后可选重排，最终返回有定位的证据。pgvector 支持在 PostgreSQL 中进行相似检索；近似索引与过滤组合需要实测，不可只测无过滤 top-k。[S47]\n\n中文关键词检索需验证分词与同义词；PostgreSQL 全文默认配置不能直接假定满足所有中文需求。当关键词、过滤聚合或搜索团队能力要求更高时评估 OpenSearch；向量负载独立增长时比较 Qdrant。[S48][S57]\n\n只有基准表明跨实体、多跳关系问题无法通过普通检索解决，再引入 GraphRAG/知识图谱；把抽取、更新、实体消歧、权限和图索引费用纳入总成本。长上下文也需与 RAG 对照，不自动替代权限过滤与数据更新。\n\n## 记忆与训练数据\n\n会话状态存在任务数据库；长期用户偏好是带来源、有效期和删除能力的独立记录；业务事实在主系统；可检索知识在知识服务；过程产物在对象存储。检索历史摘要时重新校验权限，不能因为“曾经可见”而继续展示。\n\n用户反馈先去标识、授权审查和去重，再进入评测或训练。训练集与测试集严格隔离；时间切分检查漂移。微调适合稳定格式、风格与任务行为，持续变化的业务事实优先检索或工具查询。"}, {"id": "ch-34", "number": 34, "title": "34 服务契约、状态与安全实现", "intro": "", "sections": [{"id": "ch-34-s0", "title": "最小服务接口", "html": "<div class=\"table-scroll\"><table>\n<tr><th>接口示例<\/th><th>用途<\/th><th>必需约束<\/th><\/tr>\n<tr><td>POST /v1/runs<\/td><td>提交任务，返回 202 与 run_id<\/td><td>服务端解析租户；Idempotency-Key；版本与预算快照<\/td><\/tr>\n<tr><td>GET /v1/runs/{id}<\/td><td>查询状态、错误和产物引用<\/td><td>对象级授权；不返回其他用户上下文<\/td><\/tr>\n<tr><td>GET /v1/runs/{id}/events<\/td><td>可恢复的流式进度<\/td><td>事件序号、断线续传；连接断开不等于取消任务<\/td><\/tr>\n<tr><td>POST /v1/runs/{id}/cancel<\/td><td>请求取消<\/td><td>明确 cancel_requested 与已取消；说明副作用状态<\/td><\/tr>\n<tr><td>POST /v1/approvals/{id}/decision<\/td><td>批准或拒绝提案<\/td><td>审批者权限、参数哈希、有效期、防重放<\/td><\/tr>\n<tr><td>POST /v1/tools/{name}/execute<\/td><td>内部执行已授权工具<\/td><td>不直接暴露给匿名前端；独立校验与操作记录<\/td><\/tr>\n<tr><td>POST /v1/knowledge/search<\/td><td>授权检索<\/td><td>ACL 先过滤；证据与知识版本；查询预算<\/td><\/tr>\n<\/table><\/div>\n<p>以上是参考契约，非特定产品现成 API。若暴露 A2A，需增加协议适配与授权范围约定。模型生成的 tenant_id、user_id、role 等字段不得覆盖可信身份上下文。<\/p>"}, {"id": "ch-34-s1", "title": "核心数据实体", "html": "<p>Tenant / Application / Release：租户、应用、不可变配置和策略引用。Run / Step / Event：任务状态、尝试次数、owner lease、截止时间与事件序号。ToolOperation：幂等键、参数摘要、业务返回、状态和对账记录。Approval：提案哈希、审批身份、期限与撤销信息。Artifact / Evidence：对象路径、版本、来源、ACL 和留存期限。EvalDataset / EvalRun：数据集快照、评测配置、结果和评审人。<\/p>\n<p>Run 状态建议：queued → running → waiting_approval → running → succeeded；同时支持 failed、cancel_requested、cancelled、expired。数据库事务与条件更新限制状态跃迁；worker lease 过期后由新 worker 接管，旧 worker 需通过 fencing token 等机制避免重复提交。<\/p>"}, {"id": "ch-34-s2", "title": "权限与隔离必须落到执行层", "html": "<p>SSO 解决身份，策略服务判断动作是否允许，工具执行器在动作发生时执法。Keycloak 与 OPA 分别可承担身份和策略能力，但领域权限映射需要企业实现。<a class=\"ref\" href=\"#source-S52\" aria-label=\"查看来源 S52\">[S52]<\/a><a class=\"ref\" href=\"#source-S53\" aria-label=\"查看来源 S53\">[S53]<\/a><\/p>\n<p>共享数据库至少包含 tenant_id、复合唯一约束和访问约束；高隔离租户可使用独立数据库/部署。缓存键包括租户、权限版本、知识版本与模型配置；输出日志同样受数据权限与留存控制。<\/p>\n<p>Kubernetes namespace 不是完整安全边界；需要网络策略、服务身份、资源配额与适当的运行隔离。<a class=\"ref\" href=\"#source-S54\" aria-label=\"查看来源 S54\">[S54]<\/a> 不可信代码使用短生命周期沙箱、只读基础镜像、受限网络、资源限额和临时凭据。gVisor 可增加内核接口隔离，但仍需验证系统调用兼容性并控制数据与出口。<a class=\"ref\" href=\"#source-S55\" aria-label=\"查看来源 S55\">[S55]<\/a><\/p>"}, {"id": "ch-34-s3", "title": "提示注入与供应链", "html": "<p>把检索文档、网页、邮件、工具结果视为数据来源；来源文本不能授予权限。固定可用工具集合，输出参数校验，工具执行前校验身份和业务条件。内容检测可辅助拦截，不作为唯一防线。依赖、模型、MCP 服务和技能建立来源登记、版本锁定、审查、签名或校验与撤销机制。<\/p>\n<p>禁止在日志保存长期密钥或默认保存完整敏感提示。秘密由可信服务获取，按任务注入短期凭据。对外工具实行域名白名单和数据分类检查，防止借合法 HTTP 工具泄露数据。<\/p>"}], "search": "# 34 服务契约、状态与安全实现\n\n## 最小服务接口\n\n| 接口示例 | 用途 | 必需约束 |\n|---|---|---|\n| POST /v1/runs | 提交任务，返回 202 与 run_id | 服务端解析租户；Idempotency-Key；版本与预算快照 |\n| GET /v1/runs/{id} | 查询状态、错误和产物引用 | 对象级授权；不返回其他用户上下文 |\n| GET /v1/runs/{id}/events | 可恢复的流式进度 | 事件序号、断线续传；连接断开不等于取消任务 |\n| POST /v1/runs/{id}/cancel | 请求取消 | 明确 cancel_requested 与已取消；说明副作用状态 |\n| POST /v1/approvals/{id}/decision | 批准或拒绝提案 | 审批者权限、参数哈希、有效期、防重放 |\n| POST /v1/tools/{name}/execute | 内部执行已授权工具 | 不直接暴露给匿名前端；独立校验与操作记录 |\n| POST /v1/knowledge/search | 授权检索 | ACL 先过滤；证据与知识版本；查询预算 |\n\n以上是参考契约，非特定产品现成 API。若暴露 A2A，需增加协议适配与授权范围约定。模型生成的 tenant_id、user_id、role 等字段不得覆盖可信身份上下文。\n\n## 核心数据实体\n\nTenant / Application / Release：租户、应用、不可变配置和策略引用。Run / Step / Event：任务状态、尝试次数、owner lease、截止时间与事件序号。ToolOperation：幂等键、参数摘要、业务返回、状态和对账记录。Approval：提案哈希、审批身份、期限与撤销信息。Artifact / Evidence：对象路径、版本、来源、ACL 和留存期限。EvalDataset / EvalRun：数据集快照、评测配置、结果和评审人。\n\nRun 状态建议：queued → running → waiting_approval → running → succeeded；同时支持 failed、cancel_requested、cancelled、expired。数据库事务与条件更新限制状态跃迁；worker lease 过期后由新 worker 接管，旧 worker 需通过 fencing token 等机制避免重复提交。\n\n## 权限与隔离必须落到执行层\n\nSSO 解决身份，策略服务判断动作是否允许，工具执行器在动作发生时执法。Keycloak 与 OPA 分别可承担身份和策略能力，但领域权限映射需要企业实现。[S52][S53]\n\n共享数据库至少包含 tenant_id、复合唯一约束和访问约束；高隔离租户可使用独立数据库/部署。缓存键包括租户、权限版本、知识版本与模型配置；输出日志同样受数据权限与留存控制。\n\nKubernetes namespace 不是完整安全边界；需要网络策略、服务身份、资源配额与适当的运行隔离。[S54] 不可信代码使用短生命周期沙箱、只读基础镜像、受限网络、资源限额和临时凭据。gVisor 可增加内核接口隔离，但仍需验证系统调用兼容性并控制数据与出口。[S55]\n\n## 提示注入与供应链\n\n把检索文档、网页、邮件、工具结果视为数据来源；来源文本不能授予权限。固定可用工具集合，输出参数校验，工具执行前校验身份和业务条件。内容检测可辅助拦截，不作为唯一防线。依赖、模型、MCP 服务和技能建立来源登记、版本锁定、审查、签名或校验与撤销机制。\n\n禁止在日志保存长期密钥或默认保存完整敏感提示。秘密由可信服务获取，按任务注入短期凭据。对外工具实行域名白名单和数据分类检查，防止借合法 HTTP 工具泄露数据。"}, {"id": "ch-35", "number": 35, "title": "35 评测、发布、可观测性与成本闭环", "intro": "", "sections": [{"id": "ch-35-s0", "title": "评测分层与发布门禁", "html": "<div class=\"table-scroll\"><table>\n<tr><th>层<\/th><th>评测内容<\/th><th>失败处理<\/th><\/tr>\n<tr><td>契约<\/td><td>JSON Schema、工具参数、超时和错误类别<\/td><td>阻断发布<\/td><\/tr>\n<tr><td>知识<\/td><td>解析、权限过滤、召回、来源定位、引用与回答一致<\/td><td>分析数据/检索/生成各自责任<\/td><\/tr>\n<tr><td>Agent<\/td><td>任务完成、工具序列、预算、循环、恢复与审批<\/td><td>比较基线；关键安全失败阻断<\/td><\/tr>\n<tr><td>业务<\/td><td>核心结果正确性、人工修正、误操作损失<\/td><td>领域专家确认，不能由 LLM 单独验收<\/td><\/tr>\n<tr><td>系统<\/td><td>并发、队列积压、依赖失效、租户越权、恢复<\/td><td>演练后修复，再小流量发布<\/td><\/tr>\n<\/table><\/div>\n<p>Ragas 可辅助 RAG 指标；自动 judge 需用人工标注校准，记录 judge 版本、误判与置信区间。<a class=\"ref\" href=\"#source-S59\" aria-label=\"查看来源 S59\">[S59]<\/a> 首批评测集覆盖常规、边界、长尾和攻击样例；样本量按覆盖与统计要求确定，不能把“几百条”当充分性保证。<\/p>\n<p>Release 固定代码、提示、模型、工具 schema、策略、知识快照和评测集版本。流程为提交 → 单元/契约检查 → 离线回归 → 安全测试 → 人工审批 → shadow → canary → 全量。回滚恢复整套 release；进行中的长任务保持原版本或明确迁移，不直接混用新旧图结构。<\/p>"}, {"id": "ch-35-s1", "title": "遥测与故障定位", "html": "<p>同一 trace 关联网关、run、模型、检索和工具调用。OTel 用于统一追踪、指标与日志关联；采用现有监控系统，不另建一套孤立告警。<a class=\"ref\" href=\"#source-S58\" aria-label=\"查看来源 S58\">[S58]<\/a> Langfuse 可作为 LLM 追踪、评测与提示管理候选；自托管要评估配套存储、worker、升级与企业功能成本。<a class=\"ref\" href=\"#source-S51\" aria-label=\"查看来源 S51\">[S51]<\/a><\/p>\n<p>面板至少分开：用户请求成功率、业务任务成功率、人工接管率、依赖错误、首响应和总完成延迟、队列等待、token/费用、审批等待。长任务 SLO 不宜和聊天首字时间混合计算。日志按敏感等级采样和脱敏，事故证据保留也需授权。<\/p>"}, {"id": "ch-35-s2", "title": "成本与容量：可计算而非拍脑袋", "html": "<p>月度模型成本 = 输入 token/百万 × 输入单价 + 输出 token/百万 × 输出单价 + 缓存/工具/嵌入等费用。平台总成本再加入基础设施、标注、研发运维与失败补救；单位成功成本 = 同一周期总成本 / 经业务验证的成功任务数。<\/p>\n<p>演示假设：每日 10,000 次任务，每任务平均 3 次模型调用，每调用输入 2,000、输出 500 token，30 天约产生输入 18 亿、输出 4.5 亿 token。价格使用采购时有效报价；这是容量示例，不是业务预测。重试和多 Agent 会放大用量。<\/p>\n<p>Little 定律估算在途量：到达率 2 任务/秒、平均耗时 20 秒，对应平均 40 个在途任务；突发、长尾和排队需额外压测。GPU 数量应由目标模型、上下文、量化和实测吞吐决定，不能由员工人数推算。<\/p>\n<p>缓存不得跨权限复用；预算在平台账本预留并结算，不能只依赖提供方最终账单。超过预算优先停止新增调用或转人工；降低模型质量前重新确认该类任务的能力下限。<\/p>"}], "search": "# 35 评测、发布、可观测性与成本闭环\n\n## 评测分层与发布门禁\n\n| 层 | 评测内容 | 失败处理 |\n|---|---|---|\n| 契约 | JSON Schema、工具参数、超时和错误类别 | 阻断发布 |\n| 知识 | 解析、权限过滤、召回、来源定位、引用与回答一致 | 分析数据/检索/生成各自责任 |\n| Agent | 任务完成、工具序列、预算、循环、恢复与审批 | 比较基线；关键安全失败阻断 |\n| 业务 | 核心结果正确性、人工修正、误操作损失 | 领域专家确认，不能由 LLM 单独验收 |\n| 系统 | 并发、队列积压、依赖失效、租户越权、恢复 | 演练后修复，再小流量发布 |\n\nRagas 可辅助 RAG 指标；自动 judge 需用人工标注校准，记录 judge 版本、误判与置信区间。[S59] 首批评测集覆盖常规、边界、长尾和攻击样例；样本量按覆盖与统计要求确定，不能把“几百条”当充分性保证。\n\nRelease 固定代码、提示、模型、工具 schema、策略、知识快照和评测集版本。流程为提交 → 单元/契约检查 → 离线回归 → 安全测试 → 人工审批 → shadow → canary → 全量。回滚恢复整套 release；进行中的长任务保持原版本或明确迁移，不直接混用新旧图结构。\n\n## 遥测与故障定位\n\n同一 trace 关联网关、run、模型、检索和工具调用。OTel 用于统一追踪、指标与日志关联；采用现有监控系统，不另建一套孤立告警。[S58] Langfuse 可作为 LLM 追踪、评测与提示管理候选；自托管要评估配套存储、worker、升级与企业功能成本。[S51]\n\n面板至少分开：用户请求成功率、业务任务成功率、人工接管率、依赖错误、首响应和总完成延迟、队列等待、token/费用、审批等待。长任务 SLO 不宜和聊天首字时间混合计算。日志按敏感等级采样和脱敏，事故证据保留也需授权。\n\n## 成本与容量：可计算而非拍脑袋\n\n月度模型成本 = 输入 token/百万 × 输入单价 + 输出 token/百万 × 输出单价 + 缓存/工具/嵌入等费用。平台总成本再加入基础设施、标注、研发运维与失败补救；单位成功成本 = 同一周期总成本 / 经业务验证的成功任务数。\n\n演示假设：每日 10,000 次任务，每任务平均 3 次模型调用，每调用输入 2,000、输出 500 token，30 天约产生输入 18 亿、输出 4.5 亿 token。价格使用采购时有效报价；这是容量示例，不是业务预测。重试和多 Agent 会放大用量。\n\nLittle 定律估算在途量：到达率 2 任务/秒、平均耗时 20 秒，对应平均 40 个在途任务；突发、长尾和排队需额外压测。GPU 数量应由目标模型、上下文、量化和实测吞吐决定，不能由员工人数推算。\n\n缓存不得跨权限复用；预算在平台账本预留并结算，不能只依赖提供方最终账单。超过预算优先停止新增调用或转人工；降低模型质量前重新确认该类任务的能力下限。"}, {"id": "ch-36", "number": 36, "title": "36 部署、容灾与 90 天实施计划", "intro": "", "sections": [{"id": "ch-36-s0", "title": "生产部署拓扑", "html": "<p>接入区运行前端和 API 网关；应用区运行控制面、Agent worker、检索与工具适配；数据区运行数据库、对象存储、索引；受限执行区运行沙箱；自托管场景增加 GPU 推理区。开发、测试、生产的凭据和数据分别管理。<\/p>\n<p>已有 Kubernetes 平台时复用其发布与监控能力；没有运维团队时，托管容器和托管数据库通常更适合起步。CI/CD 使用企业现有工具，部署描述、数据库迁移与策略均版本化；镜像固定 digest，禁止生产自动跟随 latest。<\/p>\n<p>无状态 API 多副本，worker 按队列等待和吞吐扩容；GPU 按模型负载扩容。数据库与状态存储提供备份、故障切换与恢复演练；索引可重建，但原文、ACL、业务操作账本不能依赖索引恢复。<\/p>"}, {"id": "ch-36-s1", "title": "恢复目标与故障演练", "html": "<p>示例目标可设核心任务元数据 RPO ≤ 5 分钟、RTO ≤ 60 分钟，但这是待业务确认的设计目标，不是软件开箱保证。业务写操作需按外部系统交易记录对账，即使任务状态丢失也不能重复扣减或发起审批。<\/p>\n<p>演练 worker 在工具提交后崩溃、数据库主节点失效、模型 API 429/超时、向量索引落后、权限撤销、审批过期、对象存储不可用及密钥轮换。每类故障明确停止、降级、重试、补偿与人工接管条件。<\/p>\n<p>严格内网环境还需镜像/包/模型离线更新流程、许可证镜像留档、漏洞修补、GPU 驱动兼容验证。自托管不消除供应链风险，也不会自动带来低成本。<\/p>"}, {"id": "ch-36-s2", "title": "分阶段交付与责任", "html": "<div class=\"table-scroll\"><table>\n<tr><th>阶段<\/th><th>交付<\/th><th>验收与责任<\/th><\/tr>\n<tr><td>第 1–2 周<\/td><td>场景与风险分级、数据地图、评测种子集、模型/框架 PoC<\/td><td>业务负责人定义成功；架构与安全确认边界<\/td><\/tr>\n<tr><td>第 3–4 周<\/td><td>一个只读知识应用、身份接入、证据链、基础追踪<\/td><td>领域专家验证事实；数据负责人验证权限和删除<\/td><\/tr>\n<tr><td>第 5–8 周<\/td><td>受控写工具、审批、任务恢复、版本化发布、成本看板<\/td><td>平台与 SRE 演练故障；业务验收误操作边界<\/td><\/tr>\n<tr><td>第 9–12 周<\/td><td>第二种场景复用、灰度、容灾演练、运营机制<\/td><td>用复用率和业务收益证明平台价值；评审下一阶段<\/td><\/tr>\n<\/table><\/div>\n<p>90 天是首批闭环的参考节奏，不保证所有企业能同期交付完整平台；完整建设方案的多阶段范围更大，应以能力出口重新估算。关键角色包括业务产品、平台后端、数据/检索、AI 评测、前端、SRE、安全与领域专家；可由同一成员兼任，但职责不能缺失。<\/p>"}, {"id": "ch-36-s3", "title": "平台交付物清单", "html": "<p>应用模板、开发 SDK、工具目录、知识接入规范、版本化 Agent 定义、任务/审批契约、权限矩阵、评测数据与流水线、追踪看板、容量与成本模型、发布回滚手册、事故与恢复手册、数据删除流程、组件许可证与版本清单。<\/p>\n<p>平台成功标准是第二和第三个业务应用能复用上述资产，并保持质量与权限标准。只交付聊天门户和一组模型 API 还不构成完整企业能力平台。<\/p>"}], "search": "# 36 部署、容灾与 90 天实施计划\n\n## 生产部署拓扑\n\n接入区运行前端和 API 网关；应用区运行控制面、Agent worker、检索与工具适配；数据区运行数据库、对象存储、索引；受限执行区运行沙箱；自托管场景增加 GPU 推理区。开发、测试、生产的凭据和数据分别管理。\n\n已有 Kubernetes 平台时复用其发布与监控能力；没有运维团队时，托管容器和托管数据库通常更适合起步。CI/CD 使用企业现有工具，部署描述、数据库迁移与策略均版本化；镜像固定 digest，禁止生产自动跟随 latest。\n\n无状态 API 多副本，worker 按队列等待和吞吐扩容；GPU 按模型负载扩容。数据库与状态存储提供备份、故障切换与恢复演练；索引可重建，但原文、ACL、业务操作账本不能依赖索引恢复。\n\n## 恢复目标与故障演练\n\n示例目标可设核心任务元数据 RPO ≤ 5 分钟、RTO ≤ 60 分钟，但这是待业务确认的设计目标，不是软件开箱保证。业务写操作需按外部系统交易记录对账，即使任务状态丢失也不能重复扣减或发起审批。\n\n演练 worker 在工具提交后崩溃、数据库主节点失效、模型 API 429/超时、向量索引落后、权限撤销、审批过期、对象存储不可用及密钥轮换。每类故障明确停止、降级、重试、补偿与人工接管条件。\n\n严格内网环境还需镜像/包/模型离线更新流程、许可证镜像留档、漏洞修补、GPU 驱动兼容验证。自托管不消除供应链风险，也不会自动带来低成本。\n\n## 分阶段交付与责任\n\n| 阶段 | 交付 | 验收与责任 |\n|---|---|---|\n| 第 1–2 周 | 场景与风险分级、数据地图、评测种子集、模型/框架 PoC | 业务负责人定义成功；架构与安全确认边界 |\n| 第 3–4 周 | 一个只读知识应用、身份接入、证据链、基础追踪 | 领域专家验证事实；数据负责人验证权限和删除 |\n| 第 5–8 周 | 受控写工具、审批、任务恢复、版本化发布、成本看板 | 平台与 SRE 演练故障；业务验收误操作边界 |\n| 第 9–12 周 | 第二种场景复用、灰度、容灾演练、运营机制 | 用复用率和业务收益证明平台价值；评审下一阶段 |\n\n90 天是首批闭环的参考节奏，不保证所有企业能同期交付完整平台；完整建设方案的多阶段范围更大，应以能力出口重新估算。关键角色包括业务产品、平台后端、数据/检索、AI 评测、前端、SRE、安全与领域专家；可由同一成员兼任，但职责不能缺失。\n\n## 平台交付物清单\n\n应用模板、开发 SDK、工具目录、知识接入规范、版本化 Agent 定义、任务/审批契约、权限矩阵、评测数据与流水线、追踪看板、容量与成本模型、发布回滚手册、事故与恢复手册、数据删除流程、组件许可证与版本清单。\n\n平台成功标准是第二和第三个业务应用能复用上述资产，并保持质量与权限标准。只交付聊天门户和一组模型 API 还不构成完整企业能力平台。"}, {"id": "ch-37", "number": 37, "title": "37 选型决策记录、生命周期与演进路线", "intro": "", "sections": [{"id": "ch-37-s0", "title": "用可解释的决策代替“最流行”", "html": "<p>先设硬门槛：数据部署位置、模型许可、语言支持、身份隔离、必要工具能力、恢复语义与预算；未通过者不进入评分。再以同一测试集评估业务质量、可靠性、安全、开发效率、总成本和退出能力。<\/p>\n<p>参考权重可以是质量 30%、安全治理 20%、可靠性 20%、团队适配 15%、成本 10%、退出能力 5%，由业务风险调整。记录样本、环境、日期与失败案例；未知项留空，不把宣传资料当满分。分数只辅助判断，不能抵消硬门槛失败。<\/p>"}, {"id": "ch-37-s1", "title": "每项选择都留一份 ADR", "html": "<p>决策记录包含：场景与约束、考虑的替代、证据和压测结果、采用方案、放弃方案的原因、所有者、版本/许可、可接受风险、复审日期和触发条件。例如“先用 pgvector；当授权过滤后的检索 p95 超过目标且优化无效，或检索负载需独立扩容时，评估 Qdrant/OpenSearch”。<\/p>"}, {"id": "ch-37-s2", "title": "生命周期标记", "html": "<div class=\"table-scroll\"><table>\n<tr><th>标记<\/th><th>处理方式<\/th><th>典型含义<\/th><\/tr>\n<tr><td>长期基础<\/td><td>持续建设，降低产品耦合<\/td><td>契约、权限、幂等、证据、评测、可观测性<\/td><\/tr>\n<tr><td>持续发展方向（判断）<\/td><td>重点跟踪，用结果验证<\/td><td>上下文工程、可靠运行、类型化工具、人机协作、模型路由<\/td><\/tr>\n<tr><td>条件采用<\/td><td>满足约束并证明增益再上<\/td><td>多 Agent、GraphRAG、微调、自托管 GPU、A2A<\/td><\/tr>\n<tr><td>探索<\/td><td>隔离试验，不承载核心承诺<\/td><td>全自主长程任务、自我修改、多智能体开放协商<\/td><\/tr>\n<tr><td>官方迁移/停用<\/td><td>按公告与兼容测试迁移<\/td><td>查本指南技术演进及具体产品官方公告；不要把某版本弃用扩展成概念消失<\/td><\/tr>\n<\/table><\/div>\n<p>新框架持续变化，但企业资产应保持可导出：工具采用独立 schema，知识保存原文和版本，评测可重跑，任务有通用状态和产物，模型调用保留提供方能力差异。升级模型、框架、协议或嵌入模型，都属于需要回归测试的发布。<\/p>"}, {"id": "ch-37-s3", "title": "许可证与版本验收", "html": "<p>Dify 使用附加条件的许可；n8n 使用 Sustainable Use License 等许可机制，不能在技术目录中不加区分地标为宽松开源。<a class=\"ref\" href=\"#source-S60\" aria-label=\"查看来源 S60\">[S60]<\/a><a class=\"ref\" href=\"#source-S61\" aria-label=\"查看来源 S61\">[S61]<\/a> 各组件社区版、商业功能和托管服务的权利与能力分别确认；模型权重、训练数据和依赖包也各有条款。<\/p>\n<p>本文不给未经组合验证的“全栈最新版本号”。上线时维护 BOM：项目 URL、实际版本/commit、许可证、漏洞检查日期、支持周期、负责人、升级回归和回滚路径。官方文档说明能力；本方案中的推荐组合还需企业 PoC 和生产压测证明。<\/p>"}], "search": "# 37 选型决策记录、生命周期与演进路线\n\n## 用可解释的决策代替“最流行”\n\n先设硬门槛：数据部署位置、模型许可、语言支持、身份隔离、必要工具能力、恢复语义与预算；未通过者不进入评分。再以同一测试集评估业务质量、可靠性、安全、开发效率、总成本和退出能力。\n\n参考权重可以是质量 30%、安全治理 20%、可靠性 20%、团队适配 15%、成本 10%、退出能力 5%，由业务风险调整。记录样本、环境、日期与失败案例；未知项留空，不把宣传资料当满分。分数只辅助判断，不能抵消硬门槛失败。\n\n## 每项选择都留一份 ADR\n\n决策记录包含：场景与约束、考虑的替代、证据和压测结果、采用方案、放弃方案的原因、所有者、版本/许可、可接受风险、复审日期和触发条件。例如“先用 pgvector；当授权过滤后的检索 p95 超过目标且优化无效，或检索负载需独立扩容时，评估 Qdrant/OpenSearch”。\n\n## 生命周期标记\n\n| 标记 | 处理方式 | 典型含义 |\n|---|---|---|\n| 长期基础 | 持续建设，降低产品耦合 | 契约、权限、幂等、证据、评测、可观测性 |\n| 持续发展方向（判断） | 重点跟踪，用结果验证 | 上下文工程、可靠运行、类型化工具、人机协作、模型路由 |\n| 条件采用 | 满足约束并证明增益再上 | 多 Agent、GraphRAG、微调、自托管 GPU、A2A |\n| 探索 | 隔离试验，不承载核心承诺 | 全自主长程任务、自我修改、多智能体开放协商 |\n| 官方迁移/停用 | 按公告与兼容测试迁移 | 查本指南技术演进及具体产品官方公告；不要把某版本弃用扩展成概念消失 |\n\n新框架持续变化，但企业资产应保持可导出：工具采用独立 schema，知识保存原文和版本，评测可重跑，任务有通用状态和产物，模型调用保留提供方能力差异。升级模型、框架、协议或嵌入模型，都属于需要回归测试的发布。\n\n## 许可证与版本验收\n\nDify 使用附加条件的许可；n8n 使用 Sustainable Use License 等许可机制，不能在技术目录中不加区分地标为宽松开源。[S60][S61] 各组件社区版、商业功能和托管服务的权利与能力分别确认；模型权重、训练数据和依赖包也各有条款。\n\n本文不给未经组合验证的“全栈最新版本号”。上线时维护 BOM：项目 URL、实际版本/commit、许可证、漏洞检查日期、支持周期、负责人、升级回归和回滚路径。官方文档说明能力；本方案中的推荐组合还需企业 PoC 和生产压测证明。"}, {"id": "glossary", "number": null, "title": "英文术语与命名约定", "intro": "", "sections": [{"id": "glossary-s0", "title": "术语展示规则", "html": "<p>概念名称使用英文在前，中文解释放在括号内；缩写首次出现时补充英文全称。正文仍用中文解释，避免每次重复全称影响阅读。多个概念用 / 分隔，括号中的中文按顺序对应。<\/p>\n<p>ReAct（Reasoning and Acting，推理与行动）是 Agent 执行模式；React 是前端 UI 库，两者大小写与含义不同。Function Calling（函数调用）是结构化调用机制，Tool Use（工具使用）是使用工具完成任务的总体能力，Tool Calling（工具调用）是常见相关称呼。<\/p>\n<p>产品名、项目名和没有稳定全称的专有名称保留原名，不编造缩写展开。文件名、API 路径、Schema 字段、源文档标题和官方来源名称保持原样。旧中文概念名继续作为搜索别名保留。<\/p>"}, {"id": "glossary-s1", "title": "常用缩写补充", "html": "<div class=\"table-scroll\"><table>\n<tr><th>英文标识<\/th><th>英文全称<\/th><th>中文释义<\/th><\/tr>\n<tr><td>LLM<\/td><td>Large Language Model<\/td><td>大语言模型<\/td><\/tr>\n<tr><td>JSON<\/td><td>JavaScript Object Notation<\/td><td>JavaScript 对象表示法<\/td><\/tr>\n<tr><td>SQL<\/td><td>Structured Query Language<\/td><td>结构化查询语言<\/td><\/tr>\n<tr><td>SDK<\/td><td>Software Development Kit<\/td><td>软件开发工具包<\/td><\/tr>\n<tr><td>UI<\/td><td>User Interface<\/td><td>用户界面<\/td><\/tr>\n<tr><td>SSO<\/td><td>Single Sign-On<\/td><td>单点登录<\/td><\/tr>\n<tr><td>OIDC<\/td><td>OpenID Connect<\/td><td>基于 OpenID 的身份认证协议<\/td><\/tr>\n<tr><td>JWT<\/td><td>JSON Web Token<\/td><td>JSON 网络令牌<\/td><\/tr>\n<tr><td>SSE<\/td><td>Server-Sent Events<\/td><td>服务端发送事件<\/td><\/tr>\n<tr><td>OTLP<\/td><td>OpenTelemetry Protocol<\/td><td>OpenTelemetry 传输协议<\/td><\/tr>\n<tr><td>RPO<\/td><td>Recovery Point Objective<\/td><td>恢复点目标<\/td><\/tr>\n<tr><td>RTO<\/td><td>Recovery Time Objective<\/td><td>恢复时间目标<\/td><\/tr>\n<tr><td>ADR<\/td><td>Architecture Decision Record<\/td><td>架构决策记录<\/td><\/tr>\n<tr><td>PoC<\/td><td>Proof of Concept<\/td><td>概念验证<\/td><\/tr>\n<tr><td>CI/CD<\/td><td>Continuous Integration / Continuous Delivery or Deployment<\/td><td>持续集成／持续交付或部署<\/td><\/tr>\n<\/table><\/div>"}], "search": "# 英文术语与命名约定\n\n## 术语展示规则\n\n概念名称使用英文在前，中文解释放在括号内；缩写首次出现时补充英文全称。正文仍用中文解释，避免每次重复全称影响阅读。多个概念用 / 分隔，括号中的中文按顺序对应。\n\nReAct（Reasoning and Acting，推理与行动）是 Agent 执行模式；React 是前端 UI 库，两者大小写与含义不同。Function Calling（函数调用）是结构化调用机制，Tool Use（工具使用）是使用工具完成任务的总体能力，Tool Calling（工具调用）是常见相关称呼。\n\n产品名、项目名和没有稳定全称的专有名称保留原名，不编造缩写展开。文件名、API 路径、Schema 字段、源文档标题和官方来源名称保持原样。旧中文概念名继续作为搜索别名保留。\n\n## 常用缩写补充\n\n| 英文标识 | 英文全称 | 中文释义 |\n|---|---|---|\n| LLM | Large Language Model | 大语言模型 |\n| JSON | JavaScript Object Notation | JavaScript 对象表示法 |\n| SQL | Structured Query Language | 结构化查询语言 |\n| SDK | Software Development Kit | 软件开发工具包 |\n| UI | User Interface | 用户界面 |\n| SSO | Single Sign-On | 单点登录 |\n| OIDC | OpenID Connect | 基于 OpenID 的身份认证协议 |\n| JWT | JSON Web Token | JSON 网络令牌 |\n| SSE | Server-Sent Events | 服务端发送事件 |\n| OTLP | OpenTelemetry Protocol | OpenTelemetry 传输协议 |\n| RPO | Recovery Point Objective | 恢复点目标 |\n| RTO | Recovery Time Objective | 恢复时间目标 |\n| ADR | Architecture Decision Record | 架构决策记录 |\n| PoC | Proof of Concept | 概念验证 |\n| CI/CD | Continuous Integration / Continuous Delivery or Deployment | 持续集成／持续交付或部署 |"}, {"id": "references-1", "number": null, "title": "参考资料一", "intro": "<p>资料核验日期为 2026 年 9 月 11 日。以下优先列官方文档、官方工程文章及原始论文。工程文章体现作者经验，论文结果有实验边界；文中的架构组合与趋势分级属于综合判断。<\/p>\n<p><a class=\"ref\" href=\"#source-S01\" aria-label=\"查看来源 S01\">[S01]<\/a> Anthropic Building effective agents 2024<\/p>\n<p><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.anthropic.com/engineering/building-effective-agents<\/a><\/p>\n<p><a class=\"ref\" href=\"#source-S02\" aria-label=\"查看来源 S02\">[S02]<\/a> Anthropic Effective context engineering for AI agents 2025<\/p>\n< ification/2026-07-28/changelog\" target=\"_blank\" rel=\"noopener noreferrer\">https://modelcontextprotocol.io/specification/2026-07-28/changelog<\/a><\/p>\n<p><a class=\"ref\" href=\"#source-S09\" aria-label=\"查看来源 S09\">[S09]<\/a> Microsoft AutoGen official repository<\/p>\n<p><a href=\"https://github.com/microsoft/autogen\" target=\"_blank\" rel=\"noopener noreferrer\">https://github.com/microsoft/autogen<\/a><\/p>\n<p><a class=\"ref\" href=\"#source-S10\" aria-label=\"查看来源 S10\">[S10]<\/a> Microsoft Agent Framework overview<\/p>\n<p><a href=\"https://learn.microsoft.com/en-us/agent-framework/overview/\" target=\"_blank\" rel=\"noopener noreferrer\">https://learn.microsoft.com/en-us/agent-framework/overview/<\/a><\/p>\n<p><a class=\"ref\" href=\"#source-S11\" aria-label=\"查看来源 S11\">[S11]<\/a> OpenAI Reasoning best practices<\/p>\n<p><a href=\"https://developers.openai.com/api/docs/guides/reasoning-best-practices\" target=\"_blank\" rel=\"noopener noreferrer\">https://developers.openai.com/api/docs/guides/reasoning-best-practices<\/a><\/p>\n<p><a class=\"ref\" href=\"#source-S12\" aria-label=\"查看来源 S12\">[S12]<\/a> OpenAI Structured outputs<\/p>\n<p><a href=\"https://developers.openai.com/api/docs/guides/structured-outputs\" target=\"_blank\" rel=\"noopener noreferrer\">https://developers.openai.com/api/docs/guides/structured-outputs<\/a><\/p>\n<p><a class=\"ref\" href=\"#source-S13\" aria-label=\"查看来源 S13\">[S13]<\/a> DSPy GEPA optimization<\/p>\n<p><a href=\"https://dspy.ai/getting-started/gepa-optimization/\" target=\"_blank\" rel=\"noopener noreferrer\">https://dspy.ai/getting-started/gepa-optimization/<\/a><\/p>", "sections": [], "search": "# 参考资料一\n\n资料核验日期为 2026 年 9 月 11 日。以下优先列官方文档、官方工程文章及原始论文。工程文章体现作者经验，论文结果有实验边界；文中的架构组合与趋势分级属于综合判断。\n\n[S01] Anthropic Building effective agents 2024\n\nhttps://www.anthropic.com/engineering/building-effective-agents\n\n[S02] Anthropic Effective context engineering for AI agents 2025\n\nhttps://www.anthropic.com/engineering s=\"ref\" href=\"#source-S43\" aria-label=\"查看来源 S43\">[S43]<\/a> AG-UI Introduction<\/p>\n<p><a href=\"https://docs.ag-ui.com/introduction\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.ag-ui.com/introduction<\/a><\/p>\n<p><a class=\"ref\" href=\"#source-S44\" aria-label=\"查看来源 S44\">[S44]<\/a> A2UI Documentation<\/p>\n<p><a href=\"https://a2ui.org/\" target=\"_blank\" rel=\"noopener noreferrer\">https://a2ui.org/<\/a><\/p>", "sections": [{"id": "references-4-s0", "title": "如何维护这份知识体系", "html": "<p>每季度检查协议版本、弃用公告、SDK 支持范围和关键依赖；模型变更时运行企业评测集。为每次技术判断保留日期、来源和适用任务，不把动态的 latest 链接当永久版本标识。<\/p>\n<p>建立三份独立清单：概念与设计原则、当前技术组件及版本、企业任务上的实验结果。第一份相对稳定，第二份跟随官方生命周期，第三份决定是否投入生产。发现新术语时，先判断它新增了能力、改进了成本，还是重新命名了既有模式。<\/p>"}, {"id": "references-4-s1", "title": "阅读论文时检查什么", "html": "<p>任务及数据是否接近企业场景；对照基线是否足够强；是否包含失败、时延和成本；优势能否在独立任务重现；是否需要企业不具备的训练数据或算力。摘要中的效果不宜直接转化为平台承诺。<\/p>"}, {"id": "references-4-s2", "title": "维护职责", "html": "<p>平台团队维护接口、运行、安全和版本；业务团队维护成功定义、知识口径及失败案例；数据团队维护质量、血缘和删除传播；研发团队共同维护评测与运行手册。技术趋势由实验验证，平台能力由可重复交付检验。<\/p>"}], "search": "# 参考资料四与持续更新方法\n\n[S40] Vaswani et al Attention Is All You Need 2017\n\nhttps://arxiv.org/abs/1706.03762\n\n[S41] Wang et al Self Consistency 2022\n\nhttps://arxiv.org/abs/2203.11171\n\n[S42] Shao et al DeepSeekMath and GRPO 2024\n\nhttps://arxiv.org/abs/2402.03300\n\n[S43] AG-UI Introduction\n\nhttps://docs.ag-ui.com/introduction\n\n[S44] A2UI Documentation\n\nhttps://a2ui.org/\n\n## 如何维护这份知识体系\n\n每季度检查协议版本、弃用公告、SDK 支持范围和关键依赖；模型变更时运行企业评测集。为每次技术判断保留日期、来源和适用任务，不把动态的 latest 链接当永久版本标识。\n\n建立三份独立清单：概念与设计原则、当前技术组件及版本、企业任务上的实验结果。第一份相对稳定，第二份跟随官方生命周期，第三份决定是否投入生产。发现新术语时，先判断它新增了能力、改进了成本，还是重新命名了既有模式。\n\n## 阅读论文时检查什么\n\n任务及数据是否接近企业场景；对照基线是否足够强；是否包含失败、时延和成本；优势能否在独立任务重现；是否需要企业不具备的训练数据或算力。摘要中的效果不宜直接转化为平台承诺。\n\n## 维护职责\n\n平台团队维护接口、运行、安全和版本；业务团队维护成功定义、知识口径及失败案例；数据团队维护质量、血缘和删除传播；研发团队共同维护评测与运行手册。技术趋势由实验验证，平台能力由可重复交付检验。"}, {"id": "references-5", "number": null, "title": "参考资料五 平台技术选型", "intro": "<p>以下为新增技术选型的官方入口；核验日期 2026-09-11。推荐组合为架构判断，非官方联合认证。<\/p>\
