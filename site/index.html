<script id="guide-data" type="application/json">{"chapters": [{"id": "intro", "number": null, "title": "企业 Agent 架构与能力平台建设指南", "intro": "<p>从核心概念和技术演进到生产架构与业务落地<\/p>\n<p>资料核验日期 2026 年 9 月 11 日；2026 年 10 月发布前抽查更新了 A2A 版本与失效链接<\/p>\n<p>面向企业架构师、高级 Agent 开发工程师及 AI 平台负责人。本指南围绕企业软件型 Agent，组织 120 个核心概念条目，解释它们解决什么问题、如何组合、常见误区及技术方向，并提供平台蓝图、数据契约、业务案例和建设路线。<\/p>\n<p>核心判断：企业 AI 平台的长期资产是业务工具、权限、知识与数据质量、任务状态、评测集及交付机制。模型、提示词、框架和编排策略应可替换。先用最简单的可验证方案解决业务问题，再增加自主规划、多 Agent 或训练环节。<\/p>", "sections": [{"id": "intro-s0", "title": "阅读方法", "html": "<p>第一次通读第 1–3 章，建立概念和演进地图；随后按当前问题查阅第 4–21 章；准备平台方案时重点使用第 22–29 章与第 30–37 章。概念编号 C001–C120 可全文检索；交互版可通过左侧目录、章节导航和概念搜索跳转。<\/p>\n<p>每个概念包含定义、工程取舍和方向判断。案例与推荐架构采用通用企业场景，是待验证的设计方案。示例阈值和计划也不是行业统一标准。<\/p>"}, {"id": "intro-s1", "title": "状态标签如何理解", "html": "<p>【基础】长期存在的能力或工程原则，具体实现仍会变化。<\/p>\n<p>【增强】已具备实际应用基础，本文判断值得持续投入；不是市场份额预测。<\/p>\n<p>【条件】只在特定任务、规模或约束下有收益，必须对照简单基线验证。<\/p>\n<p>【探索】研究或产品形态仍在变化，宜以小范围试验评估。<\/p>\n<p>【迁移】已找到官方弃用、移除或维护状态依据，正文会说明具体产品及版本。<\/p>\n<p>“概念过时”“某种实现不再推荐”“某个 API 正式下线”是三件不同的事。资料日期越新，也不意味着方法越适合你的业务。本文不把所有论文术语、供应商商品名、具身机器人控制理论都纳入“Agent 建设”；需要这些方向时应另设专题。<\/p>"}, {"id": "intro-s2", "title": "章节导航", "html": "<p>1 技术演进与迁移判断　2 基本构成　3 模型与推理<\/p>\n<p>4 指令工程　5 上下文工程　6 记忆与知识边界<\/p>\n<p>7 检索基础　8 检索增强　9 工具工程　10 协议与互操作<\/p>\n<p>11 规划与控制　12 多 Agent　13 运行时　14 分布式执行<\/p>\n<p>15 安全边界　16 身份与治理　17 评测　18 观测与发布<\/p>\n<p>19 性能与成本　20 模型优化　21 Coding 与前沿形态<\/p>\n<p>22 平台蓝图　23 数据与执行契约　24 技术选型<\/p>\n<p>25 CRM 案例　26 推荐与打标案例　27 Coding 平台化<\/p>\n<p>28 建设路线　29 架构评审清单<\/p>\n<p>30–37 企业 AI 平台建设方案：总体结论、分层架构、选型、数据与运行契约、评测发布、部署容灾、实施路径<\/p>\n<p>附录：补充概念、英文术语与命名约定、参考资料一至五<\/p>"}], "search": "# 企业 Agent 架构与能力平台建设指南\n\n从核心概念和技术演进到生产架构与业务落地\n\n资料核验日期 2026 年 9 月 11 日；2026 年 10 月发布前抽查更新了 A2A 版本与失效链接\n\n面向企业架构师、高级 Agent 开发工程师及 AI 平台负责人。本指南围绕企业软件型 Agent，组织 120 个核心概念条目，解释它们解决什么问题、如何组合、常见误区及技术方向，并提供平台蓝图、数据契约、业务案例和建设路线。\n\n核心判断：企业 AI 平台的长期资产是业务工具、权限、知识与数据质量、任务状态、评测集及交付机制。模型、提示词、框架和编排策略应可替换。先用最简单的可验证方案解决业务问题，再增加自主规划、多 Agent 或训练环节。\n\n## 阅读方法\n\n第一次通读第 1–3 章，建立概念和演进地图；随后按当前问题查阅第 4–21 章；准备平台方案时重点使用第 22–29 章与第 30–37 章。概念编号 C001–C120 可全文检索；交互版可通过左侧目录、章节导航和概念搜索跳转。\n\n每个概念包含定义、工程取舍和方向判断。案例与推荐架构采用通用企业场景，是待验证的设计方案。示例阈值和计划也不是行业统一标准。\n\n## 状态标签如何理解\n\n【基础】长期存在的能力或工程原则，具体实现仍会变化。\n\n【增强】已具备实际应用基础，本文判断值得持续投入；不是市场份额预测。\n\n【条件】只在特定任务、规模或约束下有收益，必须对照简单基线验证。\n\n【探索】研究或产品形态仍在变化，宜以小范围试验评估。\n\n【迁移】已找到官方弃用、移除或维护状态依据，正文会说明具体产品及版本。\n\n“概念过时”“某种实现不再推荐”“某个 API 正式下线”是三件不同的事。资料日期越新，也不意味着方法越适合你的业务。本文不把所有论文术语、供应商商品名、具身机器人控制理论都纳入“Agent 建设”；需要这些方向时应另设专题。\n\n## 章节导航\n\n1 技术演进与迁移判断　2 基本构成　3 模型与推理\n\n4 指令工程　5 上下文工程　6 记忆与知识边界\n\n7 检索基础　8 检索增强　9 工具工程　10 协议与互操作\n\n11 规划与控制　12 多 Agent　13 运行时　14 分布式执行\n\n15 安全边界　16 身份与治理　17 评测　18 观测与发布\n\n19 性能与成本　20 模型优化　21 Coding 与前沿形态\n\n22 平台蓝图　23 数据与执行契约　24 技术选型\n\n25 CRM 案例　26 推荐与打标案例　27 Coding 平台化\n\n28 建设路线　29 架构评审清单\n\n30–37 企业 AI 平台建设方案：总体结论、分层架构、选型、数据与运行契约、评测发布、部署容灾、实施路径\n\n附录：补充概念、英文术语与命名约定、参考资料一至五"}, {"id": "ch-1", "number": 1, "title": "1 技术演进与迁移判断", "intro": "", "sections": [{"id": "ch-1-s0", "title": "演进不是简单的替代链", "html": "<p>早期专家系统、规则引擎和工作流解决明确规则下的自动化。LLM 增加了自然语言理解与生成，RAG 增加外部知识，工具调用增加操作能力；Agent Loop 再依据环境反馈选择下一步。生产化阶段进一步补上持久状态、权限、验证、恢复和治理。它们可以组合，后一个阶段不会自动淘汰前一个阶段。<a class=\"ref\" href=\"#source-S01\" aria-label=\"查看来源 S01\">[S01]<\/a><a class=\"ref\" href=\"#source-S02\" aria-label=\"查看来源 S02\">[S02]<\/a><a class=\"ref\" href=\"#source-S03\" aria-label=\"查看来源 S03\">[S03]<\/a><\/p>\n<p>2022—2023 年的 ReAct、思维树和反思方法把推理、动作及反馈组织起来。2024—2025 年，结构化工具调用、可组合工作流、检索与工具协议逐步降低接入成本。2025—2026 年，工程重点进一步转向上下文、长期任务、评测、执行隔离和可替换的 Harness。<a class=\"ref\" href=\"#source-S01\" aria-label=\"查看来源 S01\">[S01]<\/a><a class=\"ref\" href=\"#source-S03\" aria-label=\"查看来源 S03\">[S03]<\/a><a class=\"ref\" href=\"#source-S04\" aria-label=\"查看来源 S04\">[S04]<\/a><a class=\"ref\" href=\"#source-S05\" aria-label=\"查看来源 S05\">[S05]<\/a><\/p>"}, {"id": "ch-1-s1", "title": "有官方依据的迁移事项", "html": "<ul><li>OpenAI Assistants API：官方列出的关闭日期是 2026 年 8 月 26 日，该日期已过；新方案应采用其推荐的 Responses 与 Conversations 接口。这里引用官方生命周期记录，并非对每个旧账户做实际探测。<a class=\"ref\" href=\"#source-S06\" aria-label=\"查看来源 S06\">[S06]<\/a><\/li><li>MCP：本次核验 latest 指向 2026-07-28。新规范与 2025-11-25 存在实质差异；不要拼接两个时代的握手、会话、通知和任务示例。<a class=\"ref\" href=\"#source-S07\" aria-label=\"查看来源 S07\">[S07]<\/a><a class=\"ref\" href=\"#source-S08\" aria-label=\"查看来源 S08\">[S08]<\/a><\/li><li>MCP 旧 HTTP+SSE 传输，以及 Roots、Sampling、Logging 功能在所核验规范中列为 Deprecated；“旧 HTTP+SSE 被弃用”不等于 SSE 技术被淘汰。迁移细节见第 10 章。<a class=\"ref\" href=\"#source-S08\" aria-label=\"查看来源 S08\">[S08]<\/a><\/li><li>Microsoft AutoGen 官方仓库标为维护模式，不再增加功能，建议新项目采用 Microsoft Agent Framework。Semantic Kernel 的继任方向也指向该框架，但不能据此一概声称全部旧能力已停止运行。<a class=\"ref\" href=\"#source-S09\" aria-label=\"查看来源 S09\">[S09]<\/a><a class=\"ref\" href=\"#source-S10\" aria-label=\"查看来源 S10\">[S10]<\/a><\/li><\/ul>"}, {"id": "ch-1-s2", "title": "应减少默认使用但并未正式弃用", "html": "<p>超长万能 Prompt、无限自我反思、所有任务都开多 Agent、把全部历史塞进上下文、仅靠向量相似度决定业务事实、让模型自由拼接并执行写库 SQL：这些做法的适用范围应收窄。原因是可验证性、成本和权限边界，而不是名称不够新。<\/p>\n<p>RAG、BPMN、传统 NLP、规则引擎、单 Agent 与微调都没有整体过时。品牌打标可以用 LLM 解决复杂语义，再让规则或小模型处理稳定部分；CRM 查询常常只需要受控工具和短工作流。<\/p>"}, {"id": "ch-1-s3", "title": "值得持续投入的方向", "html": "<p>高置信度工程方向：受控工具、业务身份、持久执行、证据链、评测回归和可观测性。<\/p>\n<p>中等置信度发展方向：动态上下文、按需工具发现、技能包、程序化工具编排和独立运行时。<\/p>\n<p>条件性前沿方向：跨组织 Agent 协作、递归上下文处理、长时自主任务和策略学习。是否成为主流仍取决于业务收益、互操作成熟度及治理成本。<\/p>"}], "search": "# 1 技术演进与迁移判断\n\n## 演进不是简单的替代链\n\n早期专家系统、规则引擎和工作流解决明确规则下的自动化。LLM 增加了自然语言理解与生成，RAG 增加外部知识，工具调用增加操作能力；Agent Loop 再依据环境反馈选择下一步。生产化阶段进一步补上持久状态、权限、验证、恢复和治理。它们可以组合，后一个阶段不会自动淘汰前一个阶段。[S01][S02][S03]\n\n2022—2023 年的 ReAct、思维树和反思方法把推理、动作及反馈组织起来。2024—2025 年，结构化工具调用、可组合工作流、检索与工具协议逐步降低接入成本。2025—2026 年，工程重点进一步转向上下文、长期任务、评测、执行隔离和可替换的 Harness。[S01][S03][S04][S05]\n\n## 有官方依据的迁移事项\n\n- OpenAI Assistants API：官方列出的关闭日期是 2026 年 8 月 26 日，该日期已过；新方案应采用其推荐的 Responses 与 Conversations 接口。这里引用官方生命周期记录，并非对每个旧账户做实际探测。[S06]\n- MCP：本次核验 latest 指向 2026-07-28。新规范与 2025-11-25 存在实质差异；不要拼接两个时代的握手、会话、通知和任务示例。[S07][S08]\n- MCP 旧 HTTP+SSE 传输，以及 Roots、Sampling、Logging 功能在所核验规范中列为 Deprecated；“旧 HTTP+SSE 被弃用”不等于 SSE 技术被淘汰。迁移细节见第 10 章。[S08]\n- Microsoft AutoGen 官方仓库标为维护模式，不再增加功能，建议新项目采用 Microsoft Agent Framework。Semantic Kernel 的继任方向也指向该框架，但不能据此一概声称全部旧能力已停止运行。[S09][S10]\n\n## 应减少默认使用但并未正式弃用\n\n超长万能 Prompt、无限自我反思、所有任务都开多 Agent、把全部历史塞进上下文、仅靠向量相似度决定业务事实、让模型自由拼接并执行写库 SQL：这些做法的适用范围应收窄。原因是可验证性、成本和权限边界，而不是名称不够新。\n\nRAG、BPMN、传统 NLP、规则引擎、单 Agent 与微调都没有整体过时。品牌打标可以用 LLM 解决复杂语义，再让规则或小模型处理稳定部分；CRM 查询常常只需要受控工具和短工作流。\n\n## 值得持续投入的方向\n\n高置信度工程方向：受控工具、业务身份、持久执行、证据链、评测回归和可观测性。\n\n中等置信度发展方向：动态上下文、按需工具发现、技能包、程序化工具编排和独立运行时。\n\n条件性前沿方向：跨组织 Agent 协作、递归上下文处理、长时自主任务和策略学习。是否成为主流仍取决于业务收益、互操作成熟度及治理成本。"}, {"id": "ch-2", "number": 2, "title": "2 基本构成与能力边界", "intro": "", "sections": [{"id": "C001", "title": "C001 Agent（智能体） 【基础】", "html": "<p>Agent 是围绕目标观察环境、选择动作、使用工具并根据结果继续行动的软件系统。企业讨论中宜把“模型能否决定下一步”作为边界，而不只看是否有聊天界面。给菜单打标的一次模型调用是 AI 应用，但未必需要自治 Agent。<a class=\"ref\" href=\"#source-S01\" aria-label=\"查看来源 S01\">[S01]<\/a><\/p>"}, {"id": "C002", "title": "C002 Agentic Workflow / Deterministic Workflow（智能体工作流／确定性工作流） 【基础】", "html": "<p>工作流预先规定步骤和分支，模型完成其中的理解、生成或局部决策；Agentic Workflow 是较宽泛称呼，并无全行业统一定义。审批、结算、入库等硬规则应落在代码或流程引擎中。可预测业务采用工作流通常更容易验收，不是落后方案。<\/p>"}, {"id": "C003", "title": "C003 Copilot / Autonomy Levels（协作助手／自主等级） 【基础】", "html": "<p>Copilot 通常把建议交给人执行；自主 Agent 可以在授权范围内执行动作。推荐自行划分“只读分析、生成草稿、确认后写入、限额自动执行”四级，它是平台治理分级，不是通用国际标准。级别应按动作风险设置，而不是给整个模型贴一个权限标签。<\/p>"}, {"id": "C004", "title": "C004 Agent Loop（智能体观察、决策与行动循环） 【基础】", "html": "<p>一次循环包含获取任务状态、构建上下文、模型决策、验证调用、执行工具及检查结果。停止条件包括成功证据、预算耗尽、取消、等待输入或不可恢复故障。while 循环只是代码外观；最大步数、失败判定、状态落盘才决定能否可靠运行。<\/p>"}, {"id": "C005", "title": "C005 Harness（运行约束与执行框架） 【增强】", "html": "<p>Harness 包含模型外部的任务推进、上下文组装、工具分派、验证、恢复和预算控制；术语在不同项目中边界略有差异。它不同于一份 Prompt，也不要求固定节点或角色数量。用评测证明每个节点的作用，模型升级后删除无收益的补丁。<a class=\"ref\" href=\"#source-S03\" aria-label=\"查看来源 S03\">[S03]<\/a><a class=\"ref\" href=\"#source-S04\" aria-label=\"查看来源 S04\">[S04]<\/a><\/p>"}, {"id": "C006", "title": "C006 Model / Tool / Environment（模型／工具／环境） 【基础】", "html": "<p>模型提出动作；工具提供可执行契约；环境保存真实资源和反馈；运行时控制能否执行。模型声称“客户已更新”不构成成功，必须由 CRM 的结果或后续查询验证。把这四者分离，可单独升级模型、替换连接器或重建沙箱，避免把全部状态绑定在一个进程。<a class=\"ref\" href=\"#source-S05\" aria-label=\"查看来源 S05\">[S05]<\/a><\/p>\n<p>工程练习：把“分析客户并安排回访”拆成只读数据获取、建议生成、用户确认、创建回访任务和结果核验；指出哪些步骤需要模型，哪些不需要。<\/p>"}], "search": "# 2 基本构成与能力边界\n\n## C001 Agent（智能体） 【基础】\n\nAgent 是围绕目标观察环境、选择动作、使用工具并根据结果继续行动的软件系统。企业讨论中宜把“模型能否决定下一步”作为边界，而不只看是否有聊天界面。给菜单打标的一次模型调用是 AI 应用，但未必需要自治 Agent。[S01]\n\n## C002 Agentic Workflow / Deterministic Workflow（智能体工作流／确定性工作流） 【基础】\n\n工作流预先规定步骤和分支，模型完成其中的理解、生成或局部决策；Agentic Workflow 是较宽泛称呼，并无全行业统一定义。审批、结算、入库等硬规则应落在代码或流程引擎中。可预测业务采用工作流通常更容易验收，不是落后方案。\n\n## C003 Copilot / Autonomy Levels（协作助手／自主等级） 【基础】\n\nCopilot 通常把建议交给人执行；自主 Agent 可以在授权范围内执行动作。推荐自行划分“只读分析、生成草稿、确认后写入、限额自动执行”四级，它是平台治理分级，不是通用国际标准。级别应按动作风险设置，而不是给整个模型贴一个权限标签。\n\n## C004 Agent Loop（智能体观察、决策与行动循环） 【基础】\n\n一次循环包含获取任务状态、构建上下文、模型决策、验证调用、执行工具及检查结果。停止条件包括成功证据、预算耗尽、取消、等待输入或不可恢复故障。while 循环只是代码外观；最大步数、失败判定、状态落盘才决定能否可靠运行。\n\n## C005 Harness（运行约束与执行框架） 【增强】\n\nHarness 包含模型外部的任务推进、上下文组装、工具分派、验证、恢复和预算控制；术语在不同项目中边界略有差异。它不同于一份 Prompt，也不要求固定节点或角色数量。用评测证明每个节点的作用，模型升级后删除无收益的补丁。[S03][S04]\n\n## C006 Model / Tool / Environment（模型／工具／环境） 【基础】\n\n模型提出动作；工具提供可执行契约；环境保存真实资源和反馈；运行时控制能否执行。模型声称“客户已更新”不构成成功，必须由 CRM 的结果或后续查询验证。把这四者分离，可单独升级模型、替换连接器或重建沙箱，避免把全部状态绑定在一个进程。[S05]\n\n工程练习：把“分析客户并安排回访”拆成只读数据获取、建议生成、用户确认、创建回访任务和结果核验；指出哪些步骤需要模型，哪些不需要。"}, {"id": "ch-3", "number": 3, "title": "3 模型与推理的基础", "intro": "", "sections": [{"id": "C007", "title": "C007 Token / Context Window（词元／上下文窗口） 【基础】", "html": "<p>Token 是模型处理文本等输入的计量单元，不等于汉字或单词。上下文窗口是一次推理可处理的输入与相关输出容量约束，规则依模型而异。容量大不代表所有位置的信息都能同样可靠地利用；平台要预算系统指令、工具定义、检索内容、历史和输出。<\/p>"}, {"id": "C008", "title": "C008 Autoregressive Generation / Sampling（自回归生成／采样） 【基础】", "html": "<p>常见语言模型逐步生成后续 Token。Temperature、top_p 等参数影响输出分布，但可用参数和语义因模型而异。temperature 为零不保证跨版本、跨服务实例绝对确定，也不能使错误事实变正确。稳定生产应依靠结构校验、版本固定与回归测试。<\/p>"}, {"id": "C009", "title": "C009 Reasoning Model / Reasoning Budget（推理模型／推理预算） 【增强】", "html": "<p>推理模型可能在回答前投入更多内部计算；可配置的推理强度是质量、时延和成本的取舍。复杂分析可以受益，简单打标未必需要最高档。内部推理过程不等于可审计业务依据；向用户提供来源、约束、结论和可验证步骤即可。<a class=\"ref\" href=\"#source-S11\" aria-label=\"查看来源 S11\">[S11]<\/a><\/p>"}, {"id": "C010", "title": "C010 Multimodality（多模态）/ ASR（Automatic Speech Recognition，自动语音识别）/ OCR（Optical Character Recognition，光学字符识别） 【基础】", "html": "<p>多模态模型可以处理文字、图像、音频等；ASR 将语音转文本，OCR 提取图中文字。CRM 录音还涉及说话人分离、时间戳、专有名词纠错与实体关联。转写是有误差的数据源，客户承诺、数量和商品名要能定位回原录音片段，不应被当成绝对事实。<\/p>"}, {"id": "C011", "title": "C011 Embedding / Reranker（嵌入表示／重排模型） 【基础】", "html": "<p>Embedding 把文本等映射为向量，便于相似性检索；Reranker 对候选与问题的相关程度重新评分。两者通常不是同一模型。向量距离不等于业务置信概率。更换 Embedding 后一般需要版本化索引并重建相应向量，不能无验证混用不同向量空间。<\/p>"}, {"id": "C012", "title": "C012 Model Routing / Capability Matrix（模型路由／能力矩阵） 【增强】", "html": "<p>按任务复杂度、隐私要求、语言、结构化输出、工具能力与成本选模型。网关应维护能力矩阵，而不是把所有供应商当作同一个接口。主模型失败时，降级模型可能不支持相同 Schema、上下文或工具并发，需要回退到受限方案而非悄悄降质。<\/p>\n<p>架构建议：不要在指南中永久固定“最强模型”。维护带日期的企业评测榜，至少比较完成率、错误动作率、p95 完成时延与每次成功任务成本。<\/p>"}], "search": "# 3 模型与推理的基础\n\n## C007 Token / Context Window（词元／上下文窗口） 【基础】\n\nToken 是模型处理文本等输入的计量单元，不等于汉字或单词。上下文窗口是一次推理可处理的输入与相关输出容量约束，规则依模型而异。容量大不代表所有位置的信息都能同样可靠地利用；平台要预算系统指令、工具定义、检索内容、历史和输出。\n\n## C008 Autoregressive Generation / Sampling（自回归生成／采样） 【基础】\n\n常见语言模型逐步生成后续 Token。Temperature、top_p 等参数影响输出分布，但可用参数和语义因模型而异。temperature 为零不保证跨版本、跨服务实例绝对确定，也不能使错误事实变正确。稳定生产应依靠结构校验、版本固定与回归测试。\n\n## C009 Reasoning Model / Reasoning Budget（推理模型／推理预算） 【增强】\n\n推理模型可能在回答前投入更多内部计算；可配置的推理强度是质量、时延和成本的取舍。复杂分析可以受益，简单打标未必需要最高档。内部推理过程不等于可审计业务依据；向用户提供来源、约束、结论和可验证步骤即可。[S11]\n\n## C010 Multimodality（多模态）/ ASR（Automatic Speech Recognition，自动语音识别）/ OCR（Optical Character Recognition，光学字符识别） 【基础】\n\n多模态模型可以处理文字、图像、音频等；ASR 将语音转文本，OCR 提取图中文字。CRM 录音还涉及说话人分离、时间戳、专有名词纠错与实体关联。转写是有误差的数据源，客户承诺、数量和商品名要能定位回原录音片段，不应被当成绝对事实。\n\n## C011 Embedding / Reranker（嵌入表示／重排模型） 【基础】\n\nEmbedding 把文本等映射为向量，便于相似性检索；Reranker 对候选与问题的相关程度重新评分。两者通常不是同一模型。向量距离不等于业务置信概率。更换 Embedding 后一般需要版本化索引并重建相应向量，不能无验证混用不同向量空间。\n\n## C012 Model Routing / Capability Matrix（模型路由／能力矩阵） 【增强】\n\n按任务复杂度、隐私要求、语言、结构化输出、工具能力与成本选模型。网关应维护能力矩阵，而不是把所有供应商当作同一个接口。主模型失败时，降级模型可能不支持相同 Schema、上下文或工具并发，需要回退到受限方案而非悄悄降质。\n\n架构建议：不要在指南中永久固定“最强模型”。维护带日期的企业评测榜，至少比较完成率、错误动作率、p95 完成时延与每次成功任务成本。"}, {"id": "ch-4", "number": 4, "title": "4 指令工程", "intro": "", "sections": [{"id": "C013", "title": "C013 System / Developer / User Instructions（系统／开发者／用户指令） 【基础】", "html": "<p>不同角色表达平台规则、应用规则和用户目标，具体优先级由模型供应商定义。企业业务授权必须由服务端校验，不能仅靠高优先级提示词。网页、知识库、录音转写中的“请忽略规则”属于数据，不能升级成平台指令。<\/p>"}, {"id": "C014", "title": "C014 Prompt Template / Prompt Versioning（提示词模板／版本管理） 【基础】", "html": "<p>Prompt 定义任务、输入边界、输出契约和异常处理。建议将其作为配置资产纳入代码审查、版本发布、回滚和评测，而不是让每个销售或开发人员各自维护一份万能提示词。模板中留出受控变量，防止把用户内容直接拼入系统规则区。<\/p>"}, {"id": "C015", "title": "C015 Zero-shot / Few-shot Prompting（零样本／少样本提示） 【基础】", "html": "<p>Zero shot 不提供示例；Few shot 用少量输入输出示例表达标准。菜单打标可提供易混品牌、同名菜及未知类别示例。示例要覆盖边界而非重复常见样本，并与正式标签表同步。示例数量不是越多越好，应以独立测试集效果判断。<a class=\"ref\" href=\"#source-S11\" aria-label=\"查看来源 S11\">[S11]<\/a><\/p>"}, {"id": "C016", "title": "C016 CoT（Chain of Thought，思维链）/ Explainable Results（可解释结果） 【条件】", "html": "<p>Chain of Thought 指通过中间推理组织求解的方法。显式要求“逐步思考”在部分早期模型有效，但推理模型未必需要，官方亦可能建议避免此类提示。不能将模型生成的思路当作真实因果或审计记录。保留事实依据、工具结果和决策摘要更实用。<a class=\"ref\" href=\"#source-S11\" aria-label=\"查看来源 S11\">[S11]<\/a><\/p>"}, {"id": "C017", "title": "C017 Structured Output / JSON Schema（结构化输出／JSON 结构规范） 【基础】", "html": "<p>结构化输出约束字段、类型、枚举等，通常比“请输出 JSON”更可靠。JSON 语法正确、Schema 合法、业务值正确是三层不同标准。Schema 能限制 stage 为枚举，却不能证明客户真的处于该阶段；还需业务规则、来源核验及拒答处理。<a class=\"ref\" href=\"#source-S12\" aria-label=\"查看来源 S12\">[S12]<\/a><\/p>"}, {"id": "C018", "title": "C018 Prompt Optimization / Prompt Injection（提示词优化／提示注入） 【增强】", "html": "<p>手工或自动优化 Prompt，应先定义指标、训练样例和保留测试集。避免针对同一批测试题反复调参而报告虚高收益。Prompt injection 是不可信数据诱导越权，不是简单的“提示词写得不好”；它需要执行边界与权限控制，不能用更长 Prompt 根治。<a class=\"ref\" href=\"#source-S13\" aria-label=\"查看来源 S13\">[S13]<\/a><a class=\"ref\" href=\"#source-S14\" aria-label=\"查看来源 S14\">[S14]<\/a><\/p>\n<p>实践要求：每份项目级 Prompt 至少说明输入来源、允许工具、事实与推断的表达方式、缺失信息处理、输出字段和禁止的动作，并配对应失败样例。<\/p>"}], "search": "# 4 指令工程\n\n## C013 System / Developer / User Instructions（系统／开发者／用户指令） 【基础】\n\n不同角色表达平台规则、应用规则和用户目标，具体优先级由模型供应商定义。企业业务授权必须由服务端校验，不能仅靠高优先级提示词。网页、知识库、录音转写中的“请忽略规则”属于数据，不能升级成平台指令。\n\n## C014 Prompt Template / Prompt Versioning（提示词模板／版本管理） 【基础】\n\nPrompt 定义任务、输入边界、输出契约和异常处理。建议将其作为配置资产纳入代码审查、版本发布、回滚和评测，而不是让每个销售或开发人员各自维护一份万能提示词。模板中留出受控变量，防止把用户内容直接拼入系统规则区。\n\n## C015 Zero-shot / Few-shot Prompting（零样本／少样本提示） 【基础】\n\nZero shot 不提供示例；Few shot 用少量输入输出示例表达标准。菜单打标可提供易混品牌、同名菜及未知类别示例。示例要覆盖边界而非重复常见样本，并与正式标签表同步。示例数量不是越多越好，应以独立测试集效果判断。[S11]\n\n## C016 CoT（Chain of Thought，思维链）/ Explainable Results（可解释结果） 【条件】\n\nChain of Thought 指通过中间推理组织求解的方法。显式要求“逐步思考”在部分早期模型有效，但推理模型未必需要，官方亦可能建议避免此类提示。不能将模型生成的思路当作真实因果或审计记录。保留事实依据、工具结果和决策摘要更实用。[S11]\n\n## C017 Structured Output / JSON Schema（结构化输出／JSON 结构规范） 【基础】\n\n结构化输出约束字段、类型、枚举等，通常比“请输出 JSON”更可靠。JSON 语法正确、Schema 合法、业务值正确是三层不同标准。Schema 能限制 stage 为枚举，却不能证明客户真的处于该阶段；还需业务规则、来源核验及拒答处理。[S12]\n\n## C018 Prompt Optimization / Prompt Injection（提示词优化／提示注入） 【增强】\n\n手工或自动优化 Prompt，应先定义指标、训练样例和保留测试集。避免针对同一批测试题反复调参而报告虚高收益。Prompt injection 是不可信数据诱导越权，不是简单的“提示词写得不好”；它需要执行边界与权限控制，不能用更长 Prompt 根治。[S13][S14]\n\n实践要求：每份项目级 Prompt 至少说明输入来源、允许工具、事实与推断的表达方式、缺失信息处理、输出字段和禁止的动作，并配对应失败样例。"}, {"id": "ch-5", "number": 5, "title": "5 Context Engineering（上下文工程）", "intro": "", "sections": [{"id": "C019", "title": "C019 Context Engineering（上下文工程） 【增强】", "html": "<p>上下文工程决定每轮模型实际看到什么，包括规则、工具、任务状态、证据、历史和记忆。Prompt 工程是其中一部分，并未被替代。CRM 场景应按客户、时间范围与访问权限组装材料，优先放任务所需证据，而非一次塞入所有销售记录。<a class=\"ref\" href=\"#source-S02\" aria-label=\"查看来源 S02\">[S02]<\/a><\/p>"}, {"id": "C020", "title": "C020 Context Budget / Information Density（上下文预算／信息密度） 【基础】", "html": "<p>为不同上下文组成分配容量，并为模型输出预留空间。预算策略应依据任务测试调整，不宜用固定比例套所有场景。检索结果可返回摘要加定位符；大型报表先计算聚合再送模型。压缩 Token 的同时不能丢失否定词、时间、单位和来源。<\/p>"}, {"id": "C021", "title": "C021 Just-in-Time Retrieval / Progressive Disclosure（即时检索／渐进披露） 【增强】", "html": "<p>先给模型目录、工具摘要或证据引用，需要时再加载细节。适合代码仓库、大知识库与复杂客户档案。收益是降低上下文负担，代价是额外调用和搜索失败。高频必需数据可预取，未知部分再探索；权限检查必须随每次读取执行。<a class=\"ref\" href=\"#source-S02\" aria-label=\"查看来源 S02\">[S02]<\/a><\/p>"}, {"id": "C022", "title": "C022 Compaction / Summary Distortion（上下文压缩／摘要失真） 【增强】", "html": "<p>Compaction 用摘要或结构化状态替换部分历史，帮助长任务继续。应保留目标、已验证事实、未决问题、产物位置和不可逆动作记录，并允许回查原始事件。不要只保存模型自由总结：它可能把推断变事实，或忘记已执行过一次写操作。<a class=\"ref\" href=\"#source-S05\" aria-label=\"查看来源 S05\">[S05]<\/a><\/p>"}, {"id": "C023", "title": "C023 Context Rot / Lost in the Middle（上下文退化／中间信息遗漏） 【条件】", "html": "<p>这些术语描述长上下文下性能下降或信息位置影响，不代表每个模型在所有任务中有同样退化。通过打乱证据位置、加入干扰文本、延长历史来测试自己的任务。更大的窗口能缓解容量不足，却不能解决权限、数据过期和来源冲突。<a class=\"ref\" href=\"#source-S02\" aria-label=\"查看来源 S02\">[S02]<\/a><\/p>"}, {"id": "C024", "title": "C024 Citation / Context Provenance（证据引用／上下文来源追踪） 【基础】", "html": "<p>每个重要事实应关联原文片段、业务对象、时间戳与版本。摘要保留引用，推荐区分“客户说过”“CRM 已确认”“模型推断”。引用只是定位能力，仍需检查来源是否支持结论；指向正确文件但错误段落也不能算事实正确。<\/p>\n<p>平台建议：设计 Context Builder 服务，在模型前统一执行身份过滤、来源选择、去重、长度控制和引用分配；记录所用材料版本，但不要默认把全部敏感原文写入普通日志。<\/p>"}], "search": "# 5 Context Engineering（上下文工程）\n\n## C019 Context Engineering（上下文工程） 【增强】\n\n上下文工程决定每轮模型实际看到什么，包括规则、工具、任务状态、证据、历史和记忆。Prompt 工程是其中一部分，并未被替代。CRM 场景应按客户、时间范围与访问权限组装材料，优先放任务所需证据，而非一次塞入所有销售记录。[S02]\n\n## C020 Context Budget / Information Density（上下文预算／信息密度） 【基础】\n\n为不同上下文组成分配容量，并为模型输出预留空间。预算策略应依据任务测试调整，不宜用固定比例套所有场景。检索结果可返回摘要加定位符；大型报表先计算聚合再送模型。压缩 Token 的同时不能丢失否定词、时间、单位和来源。\n\n## C021 Just-in-Time Retrieval / Progressive Disclosure（即时检索／渐进披露） 【增强】\n\n先给模型目录、工具摘要或证据引用，需要时再加载细节。适合代码仓库、大知识库与复杂客户档案。收益是降低上下文负担，代价是额外调用和搜索失败。高频必需数据可预取，未知部分再探索；权限检查必须随每次读取执行。[S02]\n\n## C022 Compaction / Summary Distortion（上下文压缩／摘要失真） 【增强】\n\nCompaction 用摘要或结构化状态替换部分历史，帮助长任务继续。应保留目标、已验证事实、未决问题、产物位置和不可逆动作记录，并允许回查原始事件。不要只保存模型自由总结：它可能把推断变事实，或忘记已执行过一次写操作。[S05]\n\n## C023 Context Rot / Lost in the Middle（上下文退化／中间信息遗漏） 【条件】\n\n这些术语描述长上下文下性能下降或信息位置影响，不代表每个模型在所有任务中有同样退化。通过打乱证据位置、加入干扰文本、延长历史来测试自己的任务。更大的窗口能缓解容量不足，却不能解决权限、数据过期和来源冲突。[S02]\n\n## C024 Citation / Context Provenance（证据引用／上下文来源追踪） 【基础】\n\n每个重要事实应关联原文片段、业务对象、时间戳与版本。摘要保留引用，推荐区分“客户说过”“CRM 已确认”“模型推断”。引用只是定位能力，仍需检查来源是否支持结论；指向正确文件但错误段落也不能算事实正确。\n\n平台建议：设计 Context Builder 服务，在模型前统一执行身份过滤、来源选择、去重、长度控制和引用分配；记录所用材料版本，但不要默认把全部敏感原文写入普通日志。"}, {"id": "ch-6", "number": 6, "title": "6 记忆与知识边界", "intro": "", "sections": [{"id": "C025", "title": "C025 Session / Thread / Run（会话／对话线程／任务运行） 【基础】", "html": "<p>Session 或 Thread 通常承载连续交互，Run 表示一次任务执行；供应商命名不完全一致。它们不等于模型上下文窗口。一次会话可跨多次任务，多轮模型调用也可服务同一任务。企业平台应自定义稳定标识，避免把业务数据主键绑定到供应商线程 ID。<\/p>"}, {"id": "C026", "title": "C026 Working Memory（工作记忆） 【基础】", "html": "<p>保存当前任务的临时状态、已读证据、工具结果与未完成步骤。适合放在结构化任务状态和可恢复存储中，部分内容按需进入 Prompt。缓存被清理不应导致任务事实永久丢失；短期记忆也应有租户和会话隔离。<a class=\"ref\" href=\"#source-S15\" aria-label=\"查看来源 S15\">[S15]<\/a><\/p>"}, {"id": "C027", "title": "C027 Semantic Memory / Episodic Memory（语义记忆／情景记忆） 【条件】", "html": "<p>语义记忆保存相对稳定的事实；情景记忆保存某次交互或事件经历。客户主营川菜可以是待确认事实，上次因配送范围未成交是带时间的事件。保存来源、有效期和确认状态，客户变更经营方向后应覆盖或失效旧信息。<a class=\"ref\" href=\"#source-S15\" aria-label=\"查看来源 S15\">[S15]<\/a><\/p>"}, {"id": "C028", "title": "C028 Procedural Memory / Skill（程序性记忆／技能） 【增强】", "html": "<p>程序性记忆保存做事方法，如新品分析流程或发布检查清单。可实现为经审查的技能包、规则或模板，不必采用向量库。将单次成功经验直接推广为通用规范容易误导；需要适用条件、反例、版本与维护人。<a class=\"ref\" href=\"#source-S15\" aria-label=\"查看来源 S15\">[S15]<\/a><a class=\"ref\" href=\"#source-S16\" aria-label=\"查看来源 S16\">[S16]<\/a><\/p>"}, {"id": "C029", "title": "C029 Memory Lifecycle（记忆写入、合并与遗忘） 【基础】", "html": "<p>记忆生命周期包括候选提取、验证、去重、冲突处理、更新、过期与删除。模型说“用户喜欢高价商品”不应自动成为客户永久标签。建议敏感或影响业务判断的事实经过业务确认，并让删除同步到缓存、向量索引和衍生摘要。<\/p>"}, {"id": "C030", "title": "C030 Source of Truth / Knowledge Base / Memory（权威事实源／知识库／记忆） 【基础】", "html": "<p>业务事实源如 CRM、ERP 保存权威状态；知识库提供制度和参考资料；Agent 记忆保存交互经验。三者不能合并为一张“万能向量表”。库存、价格、授信与合同状态查询应回到业务系统，记忆可辅助理解但不能覆盖权威记录。<\/p>\n<p>设计例：客户画像表同时保存“事实字段”“推断字段”“最后验证时间”。跟进建议引用事实，但不把建议自动回写成已发生事件。<\/p>"}], "search": "# 6 记忆与知识边界\n\n## C025 Session / Thread / Run（会话／对话线程／任务运行） 【基础】\n\nSession 或 Thread 通常承载连续交互，Run 表示一次任务执行；供应商命名不完全一致。它们不等于模型上下文窗口。一次会话可跨多次任务，多轮模型调用也可服务同一任务。企业平台应自定义稳定标识，避免把业务数据主键绑定到供应商线程 ID。\n\n## C026 Working Memory（工作记忆） 【基础】\n\n保存当前任务的临时状态、已读证据、工具结果与未完成步骤。适合放在结构化任务状态和可恢复存储中，部分内容按需进入 Prompt。缓存被清理不应导致任务事实永久丢失；短期记忆也应有租户和会话隔离。[S15]\n\n## C027 Semantic Memory / Episodic Memory（语义记忆／情景记忆） 【条件】\n\n语义记忆保存相对稳定的事实；情景记忆保存某次交互或事件经历。客户主营川菜可以是待确认事实，上次因配送范围未成交是带时间的事件。保存来源、有效期和确认状态，客户变更经营方向后应覆盖或失效旧信息。[S15]\n\n## C028 Procedural Memory / Skill（程序性记忆／技能） 【增强】\n\n程序性记忆保存做事方法，如新品分析流程或发布检查清单。可实现为经审查的技能包、规则或模板，不必采用向量库。将单次成功经验直接推广为通用规范容易误导；需要适用条件、反例、版本与维护人。[S15][S16]\n\n## C029 Memory Lifecycle（记忆写入、合并与遗忘） 【基础】\n\n记忆生命周期包括候选提取、验证、去重、冲突处理、更新、过期与删除。模型说“用户喜欢高价商品”不应自动成为客户永久标签。建议敏感或影响业务判断的事实经过业务确认，并让删除同步到缓存、向量索引和衍生摘要。\n\n## C030 Source of Truth / Knowledge Base / Memory（权威事实源／知识库／记忆） 【基础】\n\n业务事实源如 CRM、ERP 保存权威状态；知识库提供制度和参考资料；Agent 记忆保存交互经验。三者不能合并为一张“万能向量表”。库存、价格、授信与合同状态查询应回到业务系统，记忆可辅助理解但不能覆盖权威记录。\n\n设计例：客户画像表同时保存“事实字段”“推断字段”“最后验证时间”。跟进建议引用事实，但不把建议自动回写成已发生事件。"}, {"id": "ch-7", "number": 7, "title": "7 检索与知识工程基础", "intro": "", "sections": [{"id": "C031", "title": "C031 RAG（Retrieval-Augmented Generation，检索增强生成） 【基础】", "html": "<p>先从外部数据检索相关证据，再让模型生成答案。RAG 的核心价值是可更新的外部知识和证据，而不只是向量数据库。权限、时效与可追溯仍使它有价值；长上下文和微调不会自动替代这些能力。<a class=\"ref\" href=\"#source-S17\" aria-label=\"查看来源 S17\">[S17]<\/a><\/p>"}, {"id": "C032", "title": "C032 Ingestion（数据摄取）/ ETL（Extract, Transform, Load，抽取、转换与加载）/ CDC（Change Data Capture，变更数据捕获） 【基础】", "html": "<p>Ingestion 把文件与业务数据纳入知识管道；ETL 做抽取转换加载，CDC 捕获增量变更。必须处理解析失败、重复文档、版本更新和删除传播。记录来源 ID、租户、权限和更新时间，避免源文件删了而索引仍可检索。<\/p>"}, {"id": "C033", "title": "C033 Chunking（文档切分） 【基础】", "html": "<p>按段落、标题、语义或结构切分材料，控制检索粒度。太小会丢失上下文，太大增加噪声。父子块可用小块检索、较大段落回答；表格应保留列名、单位与表头，合同应保留条款归属。切分策略是数据工程选择，不是一个万能固定字数。<\/p>"}, {"id": "C034", "title": "C034 Dense Retrieval / Sparse Retrieval / Hybrid Search（稠密检索／稀疏检索／混合搜索） 【基础】", "html": "<p>Dense 检索利用向量语义相似度；Sparse 如 BM25 利用词项匹配；Hybrid 综合两类候选。商品型号、品牌名和内部编码常需要精确匹配。RRF 按排名融合，不直接假设两种分数可相加；召回结果仍要权限过滤与后续排序。<a class=\"ref\" href=\"#source-S18\" aria-label=\"查看来源 S18\">[S18]<\/a><\/p>"}, {"id": "C035", "title": "C035 ANN（Approximate Nearest Neighbor，近似最近邻）/ HNSW（Hierarchical Navigable Small World，分层可导航小世界）/ Vector Index（向量索引） 【基础】", "html": "<p>近似最近邻检索用速度和内存换取一定召回损失，HNSW 是常见索引方法。评估必须在真实过滤条件、数据量和并发下进行。索引参数提高并不必然提升最终回答质量；瓶颈也可能是切分、Embedding、权限过滤或问题理解。<\/p>"}, {"id": "C036", "title": "C036 Metadata Filter（元数据过滤）/ ACL（Access Control List，访问控制列表） 【基础】", "html": "<p>元数据过滤用于限定客户、部门、时间、文档状态等；ACL 表达访问权限。权限必须来自受信身份，不能让模型自行填 tenant_id 决定范围。检索、缓存、引用和答案导出应保持同一权限约束，防止过滤前的候选通过日志或摘要泄露。<\/p>\n<p>工程练习：构造两个租户拥有同名商品的测试，验证检索、答案缓存、引用下载和历史会话均不会串租户。<\/p>"}], "search": "# 7 检索与知识工程基础\n\n## C031 RAG（Retrieval-Augmented Generation，检索增强生成） 【基础】\n\n先从外部数据检索相关证据，再让模型生成答案。RAG 的核心价值是可更新的外部知识和证据，而不只是向量数据库。权限、时效与可追溯仍使它有价值；长上下文和微调不会自动替代这些能力。[S17]\n\n## C032 Ingestion（数据摄取）/ ETL（Extract, Transform, Load，抽取、转换与加载）/ CDC（Change Data Capture，变更数据捕获） 【基础】\n\nIngestion 把文件与业务数据纳入知识管道；ETL 做抽取转换加载，CDC 捕获增量变更。必须处理解析失败、重复文档、版本更新和删除传播。记录来源 ID、租户、权限和更新时间，避免源文件删了而索引仍可检索。\n\n## C033 Chunking（文档切分） 【基础】\n\n按段落、标题、语义或结构切分材料，控制检索粒度。太小会丢失上下文，太大增加噪声。父子块可用小块检索、较大段落回答；表格应保留列名、单位与表头，合同应保留条款归属。切分策略是数据工程选择，不是一个万能固定字数。\n\n## C034 Dense Retrieval / Sparse Retrieval / Hybrid Search（稠密检索／稀疏检索／混合搜索） 【基础】\n\nDense 检索利用向量语义相似度；Sparse 如 BM25 利用词项匹配；Hybrid 综合两类候选。商品型号、品牌名和内部编码常需要精确匹配。RRF 按排名融合，不直接假设两种分数可相加；召回结果仍要权限过滤与后续排序。[S18]\n\n## C035 ANN（Approximate Nearest Neighbor，近似最近邻）/ HNSW（Hierarchical Navigable Small World，分层可导航小世界）/ Vector Index（向量索引） 【基础】\n\n近似最近邻检索用速度和内存换取一定召回损失，HNSW 是常见索引方法。评估必须在真实过滤条件、数据量和并发下进行。索引参数提高并不必然提升最终回答质量；瓶颈也可能是切分、Embedding、权限过滤或问题理解。\n\n## C036 Metadata Filter（元数据过滤）/ ACL（Access Control List，访问控制列表） 【基础】\n\n元数据过滤用于限定客户、部门、时间、文档状态等；ACL 表达访问权限。权限必须来自受信身份，不能让模型自行填 tenant_id 决定范围。检索、缓存、引用和答案导出应保持同一权限约束，防止过滤前的候选通过日志或摘要泄露。\n\n工程练习：构造两个租户拥有同名商品的测试，验证检索、答案缓存、引用下载和历史会话均不会串租户。"}, {"id": "ch-8", "number": 8, "title": "8 检索增强与事实校验", "intro": "", "sections": [{"id": "C037", "title": "C037 Query Rewriting / Query Decomposition（查询改写／查询分解） 【条件】", "html": "<p>查询改写把口语问题转为更适合检索的表达；分解将复杂问题拆成子问题。客户说“上次那个货”时可结合近期记录定位商品。改写必须保留原始约束，不能将“不含辣椒”变成“辣椒相关”。衡量召回收益及增加的时延，而非改写次数。<\/p>"}, {"id": "C038", "title": "C038 Reranking / Contextual Compression（重排／上下文压缩） 【增强】", "html": "<p>重排提高候选相关性；上下文压缩删除无关片段。它们解决的不是同一个问题。推荐先保证召回，再用重排和证据级筛选控制输入长度。压缩应保留原文引用和数值，避免“符合条件的证据”被压成“模型认为符合”。<\/p>"}, {"id": "C039", "title": "C039 Agentic RAG / Adaptive Retrieval（智能体驱动的检索增强生成／自适应检索） 【条件】", "html": "<p>由 Agent 决定查什么源、是否继续查、何时停止。适合多跳或来源不明确的问题；固定 FAQ 常用两阶段 RAG 更便宜。设置最大检索轮数、证据覆盖要求及失败出口。Agentic RAG 是编排模式，不是必须使用某一款新数据库。<\/p>"}, {"id": "C040", "title": "C040 Self-RAG / Corrective RAG（自反思检索增强生成／纠正式检索增强生成） 【条件】", "html": "<p>Self-RAG 的原始研究把检索与自评信号纳入模型训练；工程界也常用相似名称表示“检索后检查再补查”。两者不能混为一谈。纠正性检索关注检测低质量材料后补查或换源。仅让同一模型反复说“答案正确”不能构成独立验证。<a class=\"ref\" href=\"#source-S19\" aria-label=\"查看来源 S19\">[S19]<\/a><\/p>"}, {"id": "C041", "title": "C041 GraphRAG / Ontology（图检索增强生成／本体） 【条件】", "html": "<p>GraphRAG 利用实体关系及相关摘要辅助跨文档分析；Ontology 定义业务实体、关系和约束。适合品牌归属、供应关系、跨客户关联等问题，不必用于每个问答。图抽取错误会传播，构图与更新也有成本；先证明多跳或全局问题优于普通检索。<a class=\"ref\" href=\"#source-S20\" aria-label=\"查看来源 S20\">[S20]<\/a><\/p>"}, {"id": "C042", "title": "C042 Text-to-SQL / Semantic Layer（自然语言转 SQL／语义层） 【条件】", "html": "<p>Text-to-SQL 将自然语言转为查询，语义层定义指标、维度及统一口径。企业应优先暴露经过审查的查询工具和只读视图，限制表、列、扫描量与执行时间。SQL 语法正确不代表口径正确，例如销售额是否扣退款、按下单还是履约日期计算。<\/p>\n<p>业务原则：销售统计交给 SQL 或分析引擎计算，LLM 负责解释、发现待验证问题及生成建议；不要让模型从大量流水文本中心算营业额。<\/p>"}], "search": "# 8 检索增强与事实校验\n\n## C037 Query Rewriting / Query Decomposition（查询改写／查询分解） 【条件】\n\n查询改写把口语问题转为更适合检索的表达；分解将复杂问题拆成子问题。客户说“上次那个货”时可结合近期记录定位商品。改写必须保留原始约束，不能将“不含辣椒”变成“辣椒相关”。衡量召回收益及增加的时延，而非改写次数。\n\n## C038 Reranking / Contextual Compression（重排／上下文压缩） 【增强】\n\n重排提高候选相关性；上下文压缩删除无关片段。它们解决的不是同一个问题。推荐先保证召回，再用重排和证据级筛选控制输入长度。压缩应保留原文引用和数值，避免“符合条件的证据”被压成“模型认为符合”。\n\n## C039 Agentic RAG / Adaptive Retrieval（智能体驱动的检索增强生成／自适应检索） 【条件】\n\n由 Agent 决定查什么源、是否继续查、何时停止。适合多跳或来源不明确的问题；固定 FAQ 常用两阶段 RAG 更便宜。设置最大检索轮数、证据覆盖要求及失败出口。Agentic RAG 是编排模式，不是必须使用某一款新数据库。\n\n## C040 Self-RAG / Corrective RAG（自反思检索增强生成／纠正式检索增强生成） 【条件】\n\nSelf-RAG 的原始研究把检索与自评信号纳入模型训练；工程界也常用相似名称表示“检索后检查再补查”。两者不能混为一谈。纠正性检索关注检测低质量材料后补查或换源。仅让同一模型反复说“答案正确”不能构成独立验证。[S19]\n\n## C041 GraphRAG / Ontology（图检索增强生成／本体） 【条件】\n\nGraphRAG 利用实体关系及相关摘要辅助跨文档分析；Ontology 定义业务实体、关系和约束。适合品牌归属、供应关系、跨客户关联等问题，不必用于每个问答。图抽取错误会传播，构图与更新也有成本；先证明多跳或全局问题优于普通检索。[S20]\n\n## C042 Text-to-SQL / Semantic Layer（自然语言转 SQL／语义层） 【条件】\n\nText-to-SQL 将自然语言转为查询，语义层定义指标、维度及统一口径。企业应优先暴露经过审查的查询工具和只读视图，限制表、列、扫描量与执行时间。SQL 语法正确不代表口径正确，例如销售额是否扣退款、按下单还是履约日期计算。\n\n业务原则：销售统计交给 SQL 或分析引擎计算，LLM 负责解释、发现待验证问题及生成建议；不要让模型从大量流水文本中心算营业额。"}, {"id": "ch-9", "number": 9, "title": "9 Tool Engineering（工具工程）", "intro": "", "sections": [{"id": "C043", "title": "C043 Function Calling / Tool Use（函数调用／工具使用） 【基础】", "html": "<p>模型输出工具名及参数，运行时执行后把结果送回模型，随后继续或结束。Function Calling 是交互机制，不等于模型能直接获得数据库权限。服务端必须验证参数、身份、业务约束与结果。调用函数成功与完成用户任务是两个指标。<a class=\"ref\" href=\"#source-S21\" aria-label=\"查看来源 S21\">[S21]<\/a><\/p>"}, {"id": "C044", "title": "C044 Tool Schema / Business Semantics（工具结构规范／业务语义） 【基础】", "html": "<p>工具需定义输入输出、必填字段、单位、枚举、异常及副作用。相比含糊的 operate_customer，拆为查询档案、预览修改、提交修改更容易控制。Schema 验证解决格式问题；客户是否属于当前销售、价格是否仍有效，需要业务系统判断。<\/p>"}, {"id": "C045", "title": "C045 Tool Discovery / Tool Search（工具发现／工具搜索） 【增强】", "html": "<p>大量工具不应全部塞进每轮 Prompt。先按权限和业务域筛选，再按任务检索少量候选；真正调用前仍需验证工具版本和授权。描述应说明适用与不适用场景。工具发现失败会变成任务失败，因此要有可控回退和调用覆盖测试。<\/p>"}, {"id": "C046", "title": "C046 Programmatic Tool Calling / Code Mode（程序化工具调用／代码模式） 【增强】", "html": "<p>模型生成短程序组合查询、循环、过滤与聚合，执行环境只返回必要结果，可减少逐个工具往返及中间数据进入上下文。它把风险从“参数调用”扩展到“代码执行”，必须配沙箱、调用白名单和预算。不能直接把生产凭证交给生成的程序。<a class=\"ref\" href=\"#source-S22\" aria-label=\"查看来源 S22\">[S22]<\/a><\/p>"}, {"id": "C047", "title": "C047 Tool Idempotency / Structured Errors（工具幂等／结构化错误） 【基础】", "html": "<p>幂等保证同一业务意图重试不会重复产生副作用；结构化错误区分参数错误、权限不足、业务冲突、限流及结果未知。幂等键应来自稳定业务操作 ID，而不是每次重试生成。模型可以修正参数，但不能通过反复重试绕过业务限制。<\/p>"}, {"id": "C048", "title": "C048 API（Application Programming Interface，应用程序接口）/ RPA（Robotic Process Automation，机器人流程自动化）/ Computer Use（计算机操作） 【条件】", "html": "<p>有稳定 API 时优先使用 API；没有接口时可考虑 RPA 或基于屏幕的操作。Computer Use 可适应界面变化，但会受窗口状态、截图理解和焦点影响。关键动作应在执行前确认目标、执行后核验结果，并避免只根据点击动作判断业务成功。<\/p>\n<p>工具设计例：recommend_products 返回候选商品、库存时间、价格版本和推荐原因；create_order 单独存在，并要求已确认的购物清单与授权凭据。推荐工具不隐式下单。<\/p>"}], "search": "# 9 Tool Engineering（工具工程）\n\n## C043 Function Calling / Tool Use（函数调用／工具使用） 【基础】\n\n模型输出工具名及参数，运行时执行后把结果送回模型，随后继续或结束。Function Calling 是交互机制，不等于模型能直接获得数据库权限。服务端必须验证参数、身份、业务约束与结果。调用函数成功与完成用户任务是两个指标。[S21]\n\n## C044 Tool Schema / Business Semantics（工具结构规范／业务语义） 【基础】\n\n工具需定义输入输出、必填字段、单位、枚举、异常及副作用。相比含糊的 operate_customer，拆为查询档案、预览修改、提交修改更容易控制。Schema 验证解决格式问题；客户是否属于当前销售、价格是否仍有效，需要业务系统判断。\n\n## C045 Tool Discovery / Tool Search（工具发现／工具搜索） 【增强】\n\n大量工具不应全部塞进每轮 Prompt。先按权限和业务域筛选，再按任务检索少量候选；真正调用前仍需验证工具版本和授权。描述应说明适用与不适用场景。工具发现失败会变成任务失败，因此要有可控回退和调用覆盖测试。\n\n## C046 Programmatic Tool Calling / Code Mode（程序化工具调用／代码模式） 【增强】\n\n模型生成短程序组合查询、循环、过滤与聚合，执行环境只返回必要结果，可减少逐个工具往返及中间数据进入上下文。它把风险从“参数调用”扩展到“代码执行”，必须配沙箱、调用白名单和预算。不能直接把生产凭证交给生成的程序。[S22]\n\n## C047 Tool Idempotency / Structured Errors（工具幂等／结构化错误） 【基础】\n\n幂等保证同一业务意图重试不会重复产生副作用；结构化错误区分参数错误、权限不足、业务冲突、限流及结果未知。幂等键应来自稳定业务操作 ID，而不是每次重试生成。模型可以修正参数，但不能通过反复重试绕过业务限制。\n\n## C048 API（Application Programming Interface，应用程序接口）/ RPA（Robotic Process Automation，机器人流程自动化）/ Computer Use（计算机操作） 【条件】\n\n有稳定 API 时优先使用 API；没有接口时可考虑 RPA 或基于屏幕的操作。Computer Use 可适应界面变化，但会受窗口状态、截图理解和焦点影响。关键动作应在执行前确认目标、执行后核验结果，并避免只根据点击动作判断业务成功。\n\n工具设计例：recommend_products 返回候选商品、库存时间、价格版本和推荐原因；create_order 单独存在，并要求已确认的购物清单与授权凭据。推荐工具不隐式下单。"}, {"id": "ch-10", "number": 10, "title": "10 协议与互操作的现行边界", "intro": "", "sections": [{"id": "C049", "title": "C049 MCP（Model Context Protocol，模型上下文协议） 【增强】", "html": "<p>MCP 用共同消息约定连接 Host、Client 与 Server，并暴露 Tools、Resources 和 Prompts。Host 是应用，Client 是连接侧组件，Server 提供能力。它减少集成格式差异，但不自动解决业务权限、工具质量、持久任务及事务一致性。<a class=\"ref\" href=\"#source-S07\" aria-label=\"查看来源 S07\">[S07]<\/a><\/p>"}, {"id": "C050", "title": "C050 MCP Transport / Capability Negotiation（MCP 传输／能力协商） 【迁移】", "html": "<p>核验的 2026-07-28 规范采用无状态请求与每请求能力元数据，并提供 server/discover；不应继续把旧 initialize 握手和 Mcp-Session-Id 当作新实现前提。stdio 适合本地子进程，Streamable HTTP 适合服务连接；可含 SSE 响应流，区别于旧 HTTP+SSE 传输。<a class=\"ref\" href=\"#source-S08\" aria-label=\"查看来源 S08\">[S08]<\/a><a class=\"ref\" href=\"#source-S23\" aria-label=\"查看来源 S23\">[S23]<\/a><\/p>"}, {"id": "C051", "title": "C051 Roots / Sampling / Logging（根目录声明／采样请求／日志） 【迁移】", "html": "<p>Roots 原用于描述根目录范围，Sampling 允许服务侧请求模型采样，Logging 是协议日志能力。这三项在核验版本中进入弃用期，并非立刻在所有客户端消失。新实现优先采用显式资源参数、直接模型调用和独立日志观测；不要依赖 Roots 作为操作系统沙箱。<a class=\"ref\" href=\"#source-S08\" aria-label=\"查看来源 S08\">[S08]<\/a><\/p>"}, {"id": "C052", "title": "C052 Tasks / Elicitation / MCP Apps（任务／信息征询／MCP 应用） 【增强】", "html": "<p>Tasks 提供长操作句柄，现行规范把它移入扩展；Elicitation 获取缺失信息，MRTR 将补充输入组织为请求重试；Apps 提供会话内交互 UI。它们都不能替代企业任务库和审批账本。扩展需核验双方实现，不能根据“支持 MCP”推定全部可用。<a class=\"ref\" href=\"#source-S07\" aria-label=\"查看来源 S07\">[S07]<\/a><a class=\"ref\" href=\"#source-S08\" aria-label=\"查看来源 S08\">[S08]<\/a><\/p>"}, {"id": "C053", "title": "C053 A2A（Agent2Agent，智能体间协议）/ Agent Card（智能体能力卡片） 【增强】", "html": "<p>A2A 面向独立 Agent 之间的发现、消息、任务及产物交换，Agent Card 描述能力与接口。规范已发布 1.0 系列（2026 年 10 月复核时最新为 v1.0.1），协议交互使用主次版本如 1.0；0.3 示例不能直接当 1.0 使用。它与 MCP 可互补，但内部子 Agent 不必经过 A2A。<a class=\"ref\" href=\"#source-S24\" aria-label=\"查看来源 S24\">[S24]<\/a><\/p>"}, {"id": "C054", "title": "C054 Agent Skills / Plugin / Registry（智能体技能／插件／注册目录） 【增强】", "html": "<p>Skill 是任务知识、指令及可选脚本资源的可复用包，Agent Skills 规范以 SKILL.md 等组织并支持渐进加载；Plugin 是产品级包装，可能含技能和连接器；Registry 负责发现与版本信息。可发现不等于可信，应审查来源、依赖、权限和适用边界。<a class=\"ref\" href=\"#source-S16\" aria-label=\"查看来源 S16\">[S16]<\/a><\/p>\n<p>迁移提醒：MCP DCR 在所核验版本中被弃用但保留兼容，推荐方向包括 Client ID Metadata Documents；授权实现按具体规范和服务能力匹配。<a class=\"ref\" href=\"#source-S25\" aria-label=\"查看来源 S25\">[S25]<\/a><\/p>"}], "search": "# 10 协议与互操作的现行边界\n\n## C049 MCP（Model Context Protocol，模型上下文协议） 【增强】\n\nMCP 用共同消息约定连接 Host、Client 与 Server，并暴露 Tools、Resources 和 Prompts。Host 是应用，Client 是连接侧组件，Server 提供能力。它减少集成格式差异，但不自动解决业务权限、工具质量、持久任务及事务一致性。[S07]\n\n## C050 MCP Transport / Capability Negotiation（MCP 传输／能力协商） 【迁移】\n\n核验的 2026-07-28 规范采用无状态请求与每请求能力元数据，并提供 server/discover；不应继续把旧 initialize 握手和 Mcp-Session-Id 当作新实现前提。stdio 适合本地子进程，Streamable HTTP 适合服务连接；可含 SSE 响应流，区别于旧 HTTP+SSE 传输。[S08][S23]\n\n## C051 Roots / Sampling / Logging（根目录声明／采样请求／日志） 【迁移】\n\nRoots 原用于描述根目录范围，Sampling 允许服务侧请求模型采样，Logging 是协议日志能力。这三项在核验版本中进入弃用期，并非立刻在所有客户端消失。新实现优先采用显式资源参数、直接模型调用和独立日志观测；不要依赖 Roots 作为操作系统沙箱。[S08]\n\n## C052 Tasks / Elicitation / MCP Apps（任务／信息征询／MCP 应用） 【增强】\n\nTasks 提供长操作句柄，现行规范把它移入扩展；Elicitation 获取缺失信息，MRTR 将补充输入组织为请求重试；Apps 提供会话内交互 UI。它们都不能替代企业任务库和审批账本。扩展需核验双方实现，不能根据“支持 MCP”推定全部可用。[S07][S08]\n\n## C053 A2A（Agent2Agent，智能体间协议）/ Agent Card（智能体能力卡片） 【增强】\n\nA2A 面向独立 Agent 之间的发现、消息、任务及产物交换，Agent Card 描述能力与接口。规范已发布 1.0 系列（2026 年 10 月复核时最新为 v1.0.1），协议交互使用主次版本如 1.0；0.3 示例不能直接当 1.0 使用。它与 MCP 可互补，但内部子 Agent 不必经过 A2A。[S24]\n\n## C054 Agent Skills / Plugin / Registry（智能体技能／插件／注册目录） 【增强】\n\nSkill 是任务知识、指令及可选脚本资源的可复用包，Agent Skills 规范以 SKILL.md 等组织并支持渐进加载；Plugin 是产品级包装，可能含技能和连接器；Registry 负责发现与版本信息。可发现不等于可信，应审查来源、依赖、权限和适用边界。[S16]\n\n迁移提醒：MCP DCR 在所核验版本中被弃用但保留兼容，推荐方向包括 Client ID Metadata Documents；授权实现按具体规范和服务能力匹配。[S25]"}, {"id": "ch-11", "number": 11, "title": "11 Planning and Control Patterns（规划与控制模式）", "intro": "", "sections": [{"id": "C055", "title": "C055 ReAct（Reasoning and Acting，推理与行动） 【基础】", "html": "<p>ReAct 将推理与动作交替，让环境反馈影响下一步。今天可以由原生工具调用表达，不必用正则解析 Thought / Action 字符串。应继承“行动后看真实反馈”的思想，避免把某种早期文本模板当成永久协议。<a class=\"ref\" href=\"#source-S26\" aria-label=\"查看来源 S26\">[S26]<\/a><\/p>"}, {"id": "C056", "title": "C056 Plan-and-Execute（规划与执行） 【条件】", "html": "<p>先形成计划，再逐步执行并按反馈重规划。适合跨系统、多步骤任务；简单查询无需单独规划模型。计划应记录目标、依赖和成功条件，不能把计划本身当作事实。客户资料变化或工具失败后，重新规划范围必须受原授权约束。<\/p>"}, {"id": "C057", "title": "C057 Routing / Chaining（路由／链式调用） 【基础】", "html": "<p>Routing 把请求分到合适分支，Chaining 串联固定步骤。可先判断是客户查询、商品推荐还是工单操作，再进入不同流程。对低置信路由增加澄清或人工入口。不要为了所有分支统一而制造一个包含全部业务规则的巨型 Agent。<a class=\"ref\" href=\"#source-S01\" aria-label=\"查看来源 S01\">[S01]<\/a><\/p>"}, {"id": "C058", "title": "C058 FSM（Finite State Machine，有限状态机）/ DAG（Directed Acyclic Graph，有向无环图）/ BPMN（Business Process Model and Notation，业务流程模型与标记） 【基础】", "html": "<p>有限状态机表达合法状态转移，DAG 表达无环依赖，BPMN 常用于业务流程与人工作业。Agent 会有循环与等待，纯 DAG 未必够用。建议用确定性外层处理审批、超时和补偿，模型在有限节点中决策；图节点多不等于架构先进。<\/p>"}, {"id": "C059", "title": "C059 Reflection / Evaluator-Optimizer（反思／评估器与优化器） 【条件】", "html": "<p>Reflection 根据反馈改进；Evaluator-Optimizer 由评估者提供改进方向。原始 Reflexion 研究使用反馈文本与记忆，不等于模型权重更新。应优先使用单测、业务规则、可信检索或人工反馈；仅让同模型互相夸赞会形成虚假闭环。<a class=\"ref\" href=\"#source-S27\" aria-label=\"查看来源 S27\">[S27]<\/a><\/p>"}, {"id": "C060", "title": "C060 ToT（Tree of Thoughts，思维树）/ Search / Test-Time Compute（搜索／测试时计算） 【条件】", "html": "<p>思维树探索多个候选路径；搜索可能加入剪枝、评分或回溯。推理时增加计算有时提高成功率，却也增加成本并可能优化错误指标。适合可评分的复杂规划；企业常规任务先比较强模型单次方案与少量候选验证，避免默认大规模树搜索。<a class=\"ref\" href=\"#source-S28\" aria-label=\"查看来源 S28\">[S28]<\/a><\/p>\n<p>控制原则：探索自由度可以增加，但写操作的权限边界、预算上限与成功判定不能交给同一轮自然语言自评。<\/p>"}], "search": "# 11 Planning and Control Patterns（规划与控制模式）\n\n## C055 ReAct（Reasoning and Acting，推理与行动） 【基础】\n\nReAct 将推理与动作交替，让环境反馈影响下一步。今天可以由原生工具调用表达，不必用正则解析 Thought / Action 字符串。应继承“行动后看真实反馈”的思想，避免把某种早期文本模板当成永久协议。[S26]\n\n## C056 Plan-and-Execute（规划与执行） 【条件】\n\n先形成计划，再逐步执行并按反馈重规划。适合跨系统、多步骤任务；简单查询无需单独规划模型。计划应记录目标、依赖和成功条件，不能把计划本身当作事实。客户资料变化或工具失败后，重新规划范围必须受原授权约束。\n\n## C057 Routing / Chaining（路由／链式调用） 【基础】\n\nRouting 把请求分到合适分支，Chaining 串联固定步骤。可先判断是客户查询、商品推荐还是工单操作，再进入不同流程。对低置信路由增加澄清或人工入口。不要为了所有分支统一而制造一个包含全部业务规则的巨型 Agent。[S01]\n\n## C058 FSM（Finite State Machine，有限状态机）/ DAG（Directed Acyclic Graph，有向无环图）/ BPMN（Business Process Model and Notation，业务流程模型与标记） 【基础】\n\n有限状态机表达合法状态转移，DAG 表达无环依赖，BPMN 常用于业务流程与人工作业。Agent 会有循环与等待，纯 DAG 未必够用。建议用确定性外层处理审批、超时和补偿，模型在有限节点中决策；图节点多不等于架构先进。\n\n## C059 Reflection / Evaluator-Optimizer（反思／评估器与优化器） 【条件】\n\nReflection 根据反馈改进；Evaluator-Optimizer 由评估者提供改进方向。原始 Reflexion 研究使用反馈文本与记忆，不等于模型权重更新。应优先使用单测、业务规则、可信检索或人工反馈；仅让同模型互相夸赞会形成虚假闭环。[S27]\n\n## C060 ToT（Tree of Thoughts，思维树）/ Search / Test-Time Compute（搜索／测试时计算） 【条件】\n\n思维树探索多个候选路径；搜索可能加入剪枝、评分或回溯。推理时增加计算有时提高成功率，却也增加成本并可能优化错误指标。适合可评分的复杂规划；企业常规任务先比较强模型单次方案与少量候选验证，避免默认大规模树搜索。[S28]\n\n控制原则：探索自由度可以增加，但写操作的权限边界、预算上限与成功判定不能交给同一轮自然语言自评。"}, {"id": "ch-12", "number": 12, "title": "12 多 Agent 的边界与协作", "intro": "", "sections": [{"id": "C061", "title": "C061 Single-Agent / Multi-Agent（单智能体／多智能体） 【条件】", "html": "<p>多 Agent 是多个执行角色或实例协作，不一定使用不同模型。合理动因包括上下文隔离、专业工具权限隔离和独立并行工作。多个角色共享同一偏差时不会自然提升正确率。先有单 Agent 基线，再用相同预算衡量多 Agent 的收益。<\/p>"}, {"id": "C062", "title": "C062 Orchestrator-Workers（编排器与执行者） 【条件】", "html": "<p>协调者拆解任务、委派并汇总结果，工作者完成受限子任务。适合需求动态变化、可分工的研究或开发任务。给工作者明确输入、输出、完成条件及预算；汇总者应检查冲突和缺失，不能把每个子结论直接拼成最终答案。<\/p>"}, {"id": "C063", "title": "C063 Handoff / Agent-as-Tool（任务交接／智能体作为工具） 【基础】", "html": "<p>Handoff 是把对话或任务控制权交给另一 Agent；Agent as Tool 则由父 Agent 调用子能力并收回结果。客服转专家可用交接，商品分析可用工具式调用。设计必须明确责任归属、继承哪些上下文，以及授权是否继续有效，不能默认把父级全部权限传下去。<\/p>"}, {"id": "C064", "title": "C064 Parallelism / MapReduce（并行／映射归约） 【基础】", "html": "<p>将独立任务分发并行，再汇总结果。适合分析多个客户、分片打标或读取独立资料。限制并发避免击穿模型额度和业务系统。存在前置依赖的任务不能强行并行；共享文件或数据库写入还需锁、版本控制或合并策略。<\/p>"}, {"id": "C065", "title": "C065 Blackboard / Shared State（黑板模式／共享状态） 【条件】", "html": "<p>Blackboard 以共享结构承载多 Agent 的发现、计划及产物。它比互相广播完整聊天记录更可控，但需要字段所有权、冲突检测和版本。建议子任务写独立产物，协调者合并；禁止多个 Agent 无约束覆盖同一个客户结论字段。<\/p>"}, {"id": "C066", "title": "C066 Debate / Voting / Independent Verification（辩论／投票／独立验证） 【条件】", "html": "<p>辩论、投票和交叉审查可暴露部分错误，但多个模型同意不代表证据可靠。应追求独立数据来源、不同校验方法和明确判定规则。对标签分类可比较模型与人工抽检；对金额计算应使用程序核验，而不是让三个 Agent 表决数字。<\/p>\n<p>架构建议：Coding Harness 中的多个角色可以保留为能力目录，不必每次全部启动。根据风险和任务类型按需加载，并测试角色数减少后的完成率与成本。<\/p>"}], "search": "# 12 多 Agent 的边界与协作\n\n## C061 Single-Agent / Multi-Agent（单智能体／多智能体） 【条件】\n\n多 Agent 是多个执行角色或实例协作，不一定使用不同模型。合理动因包括上下文隔离、专业工具权限隔离和独立并行工作。多个角色共享同一偏差时不会自然提升正确率。先有单 Agent 基线，再用相同预算衡量多 Agent 的收益。\n\n## C062 Orchestrator-Workers（编排器与执行者） 【条件】\n\n协调者拆解任务、委派并汇总结果，工作者完成受限子任务。适合需求动态变化、可分工的研究或开发任务。给工作者明确输入、输出、完成条件及预算；汇总者应检查冲突和缺失，不能把每个子结论直接拼成最终答案。\n\n## C063 Handoff / Agent-as-Tool（任务交接／智能体作为工具） 【基础】\n\nHandoff 是把对话或任务控制权交给另一 Agent；Agent as Tool 则由父 Agent 调用子能力并收回结果。客服转专家可用交接，商品分析可用工具式调用。设计必须明确责任归属、继承哪些上下文，以及授权是否继续有效，不能默认把父级全部权限传下去。\n\n## C064 Parallelism / MapReduce（并行／映射归约） 【基础】\n\n将独立任务分发并行，再汇总结果。适合分析多个客户、分片打标或读取独立资料。限制并发避免击穿模型额度和业务系统。存在前置依赖的任务不能强行并行；共享文件或数据库写入还需锁、版本控制或合并策略。\n\n## C065 Blackboard / Shared State（黑板模式／共享状态） 【条件】\n\nBlackboard 以共享结构承载多 Agent 的发现、计划及产物。它比互相广播完整聊天记录更可控，但需要字段所有权、冲突检测和版本。建议子任务写独立产物，协调者合并；禁止多个 Agent 无约束覆盖同一个客户结论字段。\n\n## C066 Debate / Voting / Independent Verification（辩论／投票／独立验证） 【条件】\n\n辩论、投票和交叉审查可暴露部分错误，但多个模型同意不代表证据可靠。应追求独立数据来源、不同校验方法和明确判定规则。对标签分类可比较模型与人工抽检；对金额计算应使用程序核验，而不是让三个 Agent 表决数字。\n\n架构建议：Coding Harness 中的多个角色可以保留为能力目录，不必每次全部启动。根据风险和任务类型按需加载，并测试角色数减少后的完成率与成本。"}, {"id": "ch-13", "number": 13, "title": "13 运行时与长期任务", "intro": "", "sections": [{"id": "C067", "title": "C067 Agent Runtime（智能体运行时） 【基础】", "html": "<p>Runtime 管理任务接收、循环执行、并发、暂停恢复、预算、工具路由与产物。SDK 提供构建接口，不自动等于完整生产运行时。企业需明确哪些职责由框架承担，哪些由平台服务承担，避免把进程内存中的聊天历史当成持久执行。<\/p>"}, {"id": "C068", "title": "C068 Durable Execution（持久化执行） 【增强】", "html": "<p>持久执行在进程故障、网络中断或长时间等待后恢复任务。检查点、事件历史和幂等副作用共同实现它。LangGraph 提供持久化机制，Temporal 提供可恢复工作流；二者抽象不同，不应不加设计地同时管理同一层重试。<a class=\"ref\" href=\"#source-S29\" aria-label=\"查看来源 S29\">[S29]<\/a><a class=\"ref\" href=\"#source-S30\" aria-label=\"查看来源 S30\">[S30]<\/a><\/p>"}, {"id": "C069", "title": "C069 Checkpoint / Resume / Replay（检查点／恢复／重放） 【基础】", "html": "<p>Checkpoint 保存状态，Resume 从可恢复点继续，Replay 根据已记录事件重建执行。恢复模型请求若重新采样，可能产生不同计划；关键响应应记录版本和原始结果。重放不应重复发送邮件、创建订单或执行支付，需要副作用账本配合。<\/p>"}, {"id": "C070", "title": "C070 HITL（Human-in-the-Loop，人在回路） 【基础】", "html": "<p>人在关键节点提供澄清、审批或纠正。审批应绑定具体对象、参数、版本和有效期；批准一份推荐不等于批准以后所有订单。流程暂停不能持有数据库事务。恢复时重查身份和业务状态，防止审批期间客户归属或价格已经改变。<\/p>"}, {"id": "C071", "title": "C071 Artifact（执行产物） 【基础】", "html": "<p>Artifact 是结构化报告、代码、文件、清单或可验证业务结果。它应独立于临时聊天保存，包含版本、归属、来源和访问策略。长期任务以产物交接比口头总结可靠，但产物仍需检查完整性；文件存在不等于任务通过验收。<\/p>"}, {"id": "C072", "title": "C072 Scheduling / Budgeting / Cancellation（调度／预算／取消） 【基础】", "html": "<p>调度处理优先级、队列、公平性和工作者分配；预算限制 Token、工具次数、运行时间及金额。取消要向下游传播，但“收到取消”不代表远端副作用撤销。设置明确的等待、超时、已取消及结果未知状态，让业务人员能辨认真实进度。<\/p>\n<p>运行时最小验收：杀死执行进程后恢复任务，确认不会重复创建业务记录；暂停一天后恢复，确认权限和业务数据会重新核验。<\/p>"}], "search": "# 13 运行时与长期任务\n\n## C067 Agent Runtime（智能体运行时） 【基础】\n\nRuntime 管理任务接收、循环执行、并发、暂停恢复、预算、工具路由与产物。SDK 提供构建接口，不自动等于完整生产运行时。企业需明确哪些职责由框架承担，哪些由平台服务承担，避免把进程内存中的聊天历史当成持久执行。\n\n## C068 Durable Execution（持久化执行） 【增强】\n\n持久执行在进程故障、网络中断或长时间等待后恢复任务。检查点、事件历史和幂等副作用共同实现它。LangGraph 提供持久化机制，Temporal 提供可恢复工作流；二者抽象不同，不应不加设计地同时管理同一层重试。[S29][S30]\n\n## C069 Checkpoint / Resume / Replay（检查点／恢复／重放） 【基础】\n\nCheckpoint 保存状态，Resume 从可恢复点继续，Replay 根据已记录事件重建执行。恢复模型请求若重新采样，可能产生不同计划；关键响应应记录版本和原始结果。重放不应重复发送邮件、创建订单或执行支付，需要副作用账本配合。\n\n## C070 HITL（Human-in-the-Loop，人在回路） 【基础】\n\n人在关键节点提供澄清、审批或纠正。审批应绑定具体对象、参数、版本和有效期；批准一份推荐不等于批准以后所有订单。流程暂停不能持有数据库事务。恢复时重查身份和业务状态，防止审批期间客户归属或价格已经改变。\n\n## C071 Artifact（执行产物） 【基础】\n\nArtifact 是结构化报告、代码、文件、清单或可验证业务结果。它应独立于临时聊天保存，包含版本、归属、来源和访问策略。长期任务以产物交接比口头总结可靠，但产物仍需检查完整性；文件存在不等于任务通过验收。\n\n## C072 Scheduling / Budgeting / Cancellation（调度／预算／取消） 【基础】\n\n调度处理优先级、队列、公平性和工作者分配；预算限制 Token、工具次数、运行时间及金额。取消要向下游传播，但“收到取消”不代表远端副作用撤销。设置明确的等待、超时、已取消及结果未知状态，让业务人员能辨认真实进度。\n\n运行时最小验收：杀死执行进程后恢复任务，确认不会重复创建业务记录；暂停一天后恢复，确认权限和业务数据会重新核验。"}, {"id": "ch-14", "number": 14, "title": "14 分布式执行与一致性", "intro": "", "sections": [{"id": "C073", "title": "C073 Event Log / State Store（事件日志／状态存储） 【基础】", "html": "<p>事件日志记录发生过什么，状态库提供当前任务的可查询视图。建议事件追加写，状态更新带版本号；模型上下文是从中选择的材料，不是唯一账本。事件记录应遵守敏感数据保留策略，不能以可追溯为由无限保存所有客户原文。<\/p>"}, {"id": "C074", "title": "C074 At-Least-Once / Exactly-Once（至少一次／恰好一次） 【基础】", "html": "<p>跨服务通常可能重复投递或出现结果未知。Exactly Once 的承诺必须限定作用范围；模型调用、消息投递和外部订单不共享一个天然原子事务。落地重点是业务幂等、唯一约束、状态查询和对账，而非在架构图上写“只执行一次”。<\/p>"}, {"id": "C075", "title": "C075 Saga / Compensation（Saga 模式／补偿操作） 【基础】", "html": "<p>Saga 把跨系统流程拆成局部事务，失败时按业务规则补偿。撤销预留库存可以补偿，已发给客户的信息不能真正撤回。Agent 可以解释异常，但补偿动作应有明确契约和权限，不能让模型临时发明一条“逆操作”。<\/p>"}, {"id": "C076", "title": "C076 Outbox / Inbox / Deduplication（发件箱模式／收件箱模式／去重） 【基础】", "html": "<p>Outbox 将业务状态与待发送事件写入同一事务，后台可靠投递；Inbox 记录已处理事件以防重复。适合 CRM 任务创建、标签批量入库等链路。消息 ID 用于投递去重，业务操作 ID 用于语义幂等，两者不要混用。<\/p>"}, {"id": "C077", "title": "C077 Retry / Circuit Breaker / Bulkhead（重试／熔断器／舱壁隔离） 【基础】", "html": "<p>重试应区分可恢复故障与永久错误，使用上限、退避和抖动。熔断防止持续冲击故障服务，舱壁隔离防止某租户或工具拖垮全部任务。参数非法不能靠原样重试解决；写请求超时必须先核查结果，不能直接换模型再执行。<\/p>"}, {"id": "C078", "title": "C078 Optimistic Locking / Approval Expiry（乐观锁／审批过期）/ TOCTOU（Time of Check to Time of Use，检查与使用之间的时间差） 【基础】", "html": "<p>TOCTOU 指检查与使用之间状态发生变化。生成菜单时有货，审批后可能缺货；查看客户时有权限，写入时可能已转交。使用 version、更新时间或条件写入重新校验。审批凭据绑定动作摘要，参数变化后重新确认，避免批准 A 却执行 B。<\/p>\n<p>可靠性例：create_followup 超时后先以 operation_id 查询是否已创建；查不到且服务仍不确定时标为 pending_reconciliation，而不是立即重发三次。<\/p>"}], "search": "# 14 分布式执行与一致性\n\n## C073 Event Log / State Store（事件日志／状态存储） 【基础】\n\n事件日志记录发生过什么，状态库提供当前任务的可查询视图。建议事件追加写，状态更新带版本号；模型上下文是从中选择的材料，不是唯一账本。事件记录应遵守敏感数据保留策略，不能以可追溯为由无限保存所有客户原文。\n\n## C074 At-Least-Once / Exactly-Once（至少一次／恰好一次） 【基础】\n\n跨服务通常可能重复投递或出现结果未知。Exactly Once 的承诺必须限定作用范围；模型调用、消息投递和外部订单不共享一个天然原子事务。落地重点是业务幂等、唯一约束、状态查询和对账，而非在架构图上写“只执行一次”。\n\n## C075 Saga / Compensation（Saga 模式／补偿操作） 【基础】\n\nSaga 把跨系统流程拆成局部事务，失败时按业务规则补偿。撤销预留库存可以补偿，已发给客户的信息不能真正撤回。Agent 可以解释异常，但补偿动作应有明确契约和权限，不能让模型临时发明一条“逆操作”。\n\n## C076 Outbox / Inbox / Deduplication（发件箱模式／收件箱模式／去重） 【基础】\n\nOutbox 将业务状态与待发送事件写入同一事务，后台可靠投递；Inbox 记录已处理事件以防重复。适合 CRM 任务创建、标签批量入库等链路。消息 ID 用于投递去重，业务操作 ID 用于语义幂等，两者不要混用。\n\n## C077 Retry / Circuit Breaker / Bulkhead（重试／熔断器／舱壁隔离） 【基础】\n\n重试应区分可恢复故障与永久错误，使用上限、退避和抖动。熔断防止持续冲击故障服务，舱壁隔离防止某租户或工具拖垮全部任务。参数非法不能靠原样重试解决；写请求超时必须先核查结果，不能直接换模型再执行。\n\n## C078 Optimistic Locking / Approval Expiry（乐观锁／审批过期）/ TOCTOU（Time of Check to Time of Use，检查与使用之间的时间差） 【基础】\n\nTOCTOU 指检查与使用之间状态发生变化。生成菜单时有货，审批后可能缺货；查看客户时有权限，写入时可能已转交。使用 version、更新时间或条件写入重新校验。审批凭据绑定动作摘要，参数变化后重新确认，避免批准 A 却执行 B。\n\n可靠性例：create_followup 超时后先以 operation_id 查询是否已创建；查不到且服务仍不确定时标为 pending_reconciliation，而不是立即重发三次。"}, {"id": "ch-15", "number": 15, "title": "15 安全与执行边界", "intro": "", "sections": [{"id": "C079", "title": "C079 Prompt Injection（提示注入） 【基础】", "html": "<p>攻击或意外文本把数据伪装成指令，来源可能是网页、录音转写、邮件、知识片段或工具描述。隔离指令与数据、限制可用工具、验证每次动作和减少可读取凭证是基础。检测模型只能降低风险，不能保证识别所有注入。<a class=\"ref\" href=\"#source-S14\" aria-label=\"查看来源 S14\">[S14]<\/a><\/p>"}, {"id": "C080", "title": "C080 Least Privilege / Capability Boundary（最小权限／能力边界） 【基础】", "html": "<p>最小权限把 Agent 能做的事限制在当前任务所需范围。优先授予具体工具动作和资源范围，而非整个管理员账号。权限由受信身份服务计算；模型可以提出请求，但不能给自己扩权。工具列表隐藏是减少误用，真正授权仍需服务端执行。<\/p>"}, {"id": "C081", "title": "C081 Sandbox / Egress Control（沙箱／出站控制） 【基础】", "html": "<p>沙箱隔离生成代码的文件、网络和进程访问；出站控制约束数据发送目的地。容器只是隔离手段之一，不自动保证安全。按风险选进程隔离、容器或更强虚拟化，限制资源，避免暴露宿主控制接口。将凭证存放在沙箱外代理中更利于控制。<a class=\"ref\" href=\"#source-S05\" aria-label=\"查看来源 S05\">[S05]<\/a><\/p>"}, {"id": "C082", "title": "C082 Tool Poisoning / Supply Chain Security（工具投毒／供应链安全） 【基础】", "html": "<p>工具或技能描述、依赖包、返回内容可能被篡改并诱导越权。注册中心应保存发布者、版本、哈希、审查记录和撤销状态；变更工具描述也应触发评测。签名证明来源与完整性，不证明内容本身正确或无害。<\/p>"}, {"id": "C083", "title": "C083 Guardrail / Policy as Code（护栏／策略即代码） 【基础】", "html": "<p>Guardrail 是输入、输出或过程检查；Policy as Code 用确定性规则表达授权、限额、数据范围和发布门槛。两者可以组合。把“不能下单”写进 Prompt 是行为引导，撤销下单工具权限才是执行约束；规则失败应进入明确的拒绝或人工流程。<\/p>"}, {"id": "C084", "title": "C084 Data Exfiltration / Output Handling（数据外泄／输出处理） 【基础】", "html": "<p>数据外泄可能通过工具参数、网页请求、附件或日志发生。检查输出目的地与数据类别，对下载链接、HTML、SQL 和代码按其使用环境处理。模型生成的文本不能直接拼接成 shell 或数据库指令。防护应覆盖“读到什么”和“能发到哪里”。<\/p>\n<p>评测要求：模拟恶意知识文档请求导出客户表，检查系统是否在工具执行层阻断；不要只看模型回复中有没有说“我不能”。<\/p>"}], "search": "# 15 安全与执行边界\n\n## C079 Prompt Injection（提示注入） 【基础】\n\n攻击或意外文本把数据伪装成指令，来源可能是网页、录音转写、邮件、知识片段或工具描述。隔离指令与数据、限制可用工具、验证每次动作和减少可读取凭证是基础。检测模型只能降低风险，不能保证识别所有注入。[S14]\n\n## C080 Least Privilege / Capability Boundary（最小权限／能力边界） 【基础】\n\n最小权限把 Agent 能做的事限制在当前任务所需范围。优先授予具体工具动作和资源范围，而非整个管理员账号。权限由受信身份服务计算；模型可以提出请求，但不能给自己扩权。工具列表隐藏是减少误用，真正授权仍需服务端执行。\n\n## C081 Sandbox / Egress Control（沙箱／出站控制） 【基础】\n\n沙箱隔离生成代码的文件、网络和进程访问；出站控制约束数据发送目的地。容器只是隔离手段之一，不自动保证安全。按风险选进程隔离、容器或更强虚拟化，限制资源，避免暴露宿主控制接口。将凭证存放在沙箱外代理中更利于控制。[S05]\n\n## C082 Tool Poisoning / Supply Chain Security（工具投毒／供应链安全） 【基础】\n\n工具或技能描述、依赖包、返回内容可能被篡改并诱导越权。注册中心应保存发布者、版本、哈希、审查记录和撤销状态；变更工具描述也应触发评测。签名证明来源与完整性，不证明内容本身正确或无害。\n\n## C083 Guardrail / Policy as Code（护栏／策略即代码） 【基础】\n\nGuardrail 是输入、输出或过程检查；Policy as Code 用确定性规则表达授权、限额、数据范围和发布门槛。两者可以组合。把“不能下单”写进 Prompt 是行为引导，撤销下单工具权限才是执行约束；规则失败应进入明确的拒绝或人工流程。\n\n## C084 Data Exfiltration / Output Handling（数据外泄／输出处理） 【基础】\n\n数据外泄可能通过工具参数、网页请求、附件或日志发生。检查输出目的地与数据类别，对下载链接、HTML、SQL 和代码按其使用环境处理。模型生成的文本不能直接拼接成 shell 或数据库指令。防护应覆盖“读到什么”和“能发到哪里”。\n\n评测要求：模拟恶意知识文档请求导出客户表，检查系统是否在工具执行层阻断；不要只看模型回复中有没有说“我不能”。"}, {"id": "ch-16", "number": 16, "title": "16 身份与治理", "intro": "", "sections": [{"id": "C085", "title": "C085 Authentication / Authorization（身份认证／访问授权） 【基础】", "html": "<p>认证回答“你是谁”，授权回答“你可以对什么做什么”。服务账号、用户代理身份和 Agent 实例应可追踪关联。MCP 的 OAuth 流程提供连接授权机制，不能替代 CRM 的行级与字段级权限。OAuth 2.1 的标准状态以所引用规范为准，不能随意称为已发布 RFC。<a class=\"ref\" href=\"#source-S25\" aria-label=\"查看来源 S25\">[S25]<\/a><\/p>"}, {"id": "C086", "title": "C086 Delegation（委托授权）/ OBO（On-Behalf-Of，代表用户执行） 【基础】", "html": "<p>委托让系统代表用户执行限定操作。应记录原始用户、当前执行服务、授权范围和期限；跨 Agent 委派不能隐式放大权限。机器人发起的任务与员工发起的任务可能有不同政策，审计中必须能辨认主体与责任人。<\/p>"}, {"id": "C087", "title": "C087 Multi-Tenancy / Isolation（多租户／隔离） 【基础】", "html": "<p>租户隔离覆盖任务、知识、向量索引、记忆、缓存、对象存储、配额和日志。共享物理资源可以降低成本，但隔离逻辑必须集中实现并测试。tenant_id 不应信任模型输出；异步消息携带的租户上下文也需要校验来源。<\/p>"}, {"id": "C088", "title": "C088 Secrets Management / Vault / Credential Broker（秘密管理／凭据保险库／凭据代理） 【基础】", "html": "<p>凭证不进入 Prompt、工具描述或普通日志。短期令牌、外部密钥库与代理调用可减少泄露范围。凭证轮换或撤销后，恢复中的长期任务应重新获取授权；不能把“任务开始时可用的令牌”视为整个生命周期永远有效。<\/p>"}, {"id": "C089", "title": "C089 Data Classification / Retention / Deletion（数据分级／保留／删除） 【基础】", "html": "<p>区分公开、内部、客户敏感及受限数据，定义可用模型部署位置、日志保留与访问规则。删除应传播到源数据副本、向量、摘要、记忆和缓存。数据驻留不等于所有风险消失；本地模型同样需要防止内部越权和不当导出。<\/p>"}, {"id": "C090", "title": "C090 Control Plane / Data Plane（控制面／数据面） 【基础】", "html": "<p>控制平面管理配置、策略、模型路由、工具注册和发布；数据平面执行任务与业务访问。控制平面变更需审批和审计，数据平面需要低时延与故障隔离。分离两者有助于共享治理、独立扩容，并防止业务 Agent 改写自身安全策略。<\/p>\n<p>制度建议：为每个 Agent 指定业务负责人、技术负责人、风险等级、可写工具、数据范围、验收指标、应急停用方式和下线计划。<\/p>"}], "search": "# 16 身份与治理\n\n## C085 Authentication / Authorization（身份认证／访问授权） 【基础】\n\n认证回答“你是谁”，授权回答“你可以对什么做什么”。服务账号、用户代理身份和 Agent 实例应可追踪关联。MCP 的 OAuth 流程提供连接授权机制，不能替代 CRM 的行级与字段级权限。OAuth 2.1 的标准状态以所引用规范为准，不能随意称为已发布 RFC。[S25]\n\n## C086 Delegation（委托授权）/ OBO（On-Behalf-Of，代表用户执行） 【基础】\n\n委托让系统代表用户执行限定操作。应记录原始用户、当前执行服务、授权范围和期限；跨 Agent 委派不能隐式放大权限。机器人发起的任务与员工发起的任务可能有不同政策，审计中必须能辨认主体与责任人。\n\n## C087 Multi-Tenancy / Isolation（多租户／隔离） 【基础】\n\n租户隔离覆盖任务、知识、向量索引、记忆、缓存、对象存储、配额和日志。共享物理资源可以降低成本，但隔离逻辑必须集中实现并测试。tenant_id 不应信任模型输出；异步消息携带的租户上下文也需要校验来源。\n\n## C088 Secrets Management / Vault / Credential Broker（秘密管理／凭据保险库／凭据代理） 【基础】\n\n凭证不进入 Prompt、工具描述或普通日志。短期令牌、外部密钥库与代理调用可减少泄露范围。凭证轮换或撤销后，恢复中的长期任务应重新获取授权；不能把“任务开始时可用的令牌”视为整个生命周期永远有效。\n\n## C089 Data Classification / Retention / Deletion（数据分级／保留／删除） 【基础】\n\n区分公开、内部、客户敏感及受限数据，定义可用模型部署位置、日志保留与访问规则。删除应传播到源数据副本、向量、摘要、记忆和缓存。数据驻留不等于所有风险消失；本地模型同样需要防止内部越权和不当导出。\n\n## C090 Control Plane / Data Plane（控制面／数据面） 【基础】\n\n控制平面管理配置、策略、模型路由、工具注册和发布；数据平面执行任务与业务访问。控制平面变更需审批和审计，数据平面需要低时延与故障隔离。分离两者有助于共享治理、独立扩容，并防止业务 Agent 改写自身安全策略。\n\n制度建议：为每个 Agent 指定业务负责人、技术负责人、风险等级、可写工具、数据范围、验收指标、应急停用方式和下线计划。"}, {"id": "ch-17", "number": 17, "title": "17 评测体系", "intro": "", "sections": [{"id": "C091", "title": "C091 Task Success / Trajectory Evaluation（任务成功／执行轨迹评测） 【基础】", "html": "<p>结果评测检查任务是否完成，轨迹评测检查工具调用、权限、步骤和副作用是否正确。回答正确但读取了其他租户数据，仍然失败。为不确定系统做重复试验：pass@k 关注多次尝试至少一次成功，pass^k 关注多次全部成功；企业自动执行更需要稳定成功而非偶尔成功。<a class=\"ref\" href=\"#source-S31\" aria-label=\"查看来源 S31\">[S31]<\/a><\/p>"}, {"id": "C092", "title": "C092 Golden Set / Holdout Set / Data Leakage（基准集／留出集／数据泄漏） 【基础】", "html": "<p>黄金集是人工核验的代表性样本；开发集用于迭代，保留测试集用于最终验证。按客户、时间或业务实体切分，避免同一客户相似记录同时进入训练和测试。数据集应包含正常、歧义、缺失、拒绝和异常样本，并按难度与风险分层。<\/p>"}, {"id": "C093", "title": "C093 Retrieval Metrics / Generation Metrics（检索指标／生成指标） 【基础】", "html": "<p>Recall@k 衡量需要的相关材料是否被召回，Precision@k 衡量前 k 条有多少相关；MRR 看首条相关结果位置，nDCG 考虑排序和分级相关性。生成层另外评估事实正确、证据支持、引用定位和覆盖率。检索好不保证回答好，答案流畅也不能反证检索准确。<\/p>"}, {"id": "C094", "title": "C094 Classification Metrics / Calibration / Selective Prediction（分类指标／校准／选择性预测） 【基础】", "html": "<p>Accuracy 容易被大类别占比掩盖；Precision、Recall、F1 和混淆矩阵应按类别报告，宏平均用于观察小类别。Calibration 检查置信程度与实际正确率是否匹配。不能直接把模型自报“98% 确信”当概率；可以用验证集校准并设拒答、人工复核区间。<\/p>"}, {"id": "C095", "title": "C095 LLM-as-a-Judge（Large Language Model as a Judge，大语言模型评审）/ Human Review（人工评审） 【条件】", "html": "<p>模型裁判适合规模化检查主观质量，但存在位置、表达长度、自偏好和评分漂移。制定可操作评分表，随机化顺序，与盲评人工样本校准；关键权限与财务状态用确定性检查。裁判、业务模型和数据集均需版本化，不能只保存一个总分。<\/p>"}, {"id": "C096", "title": "C096 Regression Testing / Red Teaming / Ablation Study（回归测试／红队测试／消融实验） 【基础】", "html": "<p>回归集保留历史失败，红队主动设计恶意输入与边界攻击；消融实验逐项移除检索、反思、子 Agent 等机制，检验其实际贡献。上线前同时检查正常任务表现和越权阻断。失败样本修复后回归，不能通过删除难例让评分变好。<\/p>\n<p>验收表应同时记录：任务成功率、严重错误率、人工接管率、每次成功成本、P95 时延、样本数、测试时间及版本。没有分母和切分方式的百分比不宜作为架构优劣依据。<\/p>"}], "search": "# 17 评测体系\n\n## C091 Task Success / Trajectory Evaluation（任务成功／执行轨迹评测） 【基础】\n\n结果评测检查任务是否完成，轨迹评测检查工具调用、权限、步骤和副作用是否正确。回答正确但读取了其他租户数据，仍然失败。为不确定系统做重复试验：pass@k 关注多次尝试至少一次成功，pass^k 关注多次全部成功；企业自动执行更需要稳定成功而非偶尔成功。[S31]\n\n## C092 Golden Set / Holdout Set / Data Leakage（基准集／留出集／数据泄漏） 【基础】\n\n黄金集是人工核验的代表性样本；开发集用于迭代，保留测试集用于最终验证。按客户、时间或业务实体切分，避免同一客户相似记录同时进入训练和测试。数据集应包含正常、歧义、缺失、拒绝和异常样本，并按难度与风险分层。\n\n## C093 Retrieval Metrics / Generation Metrics（检索指标／生成指标） 【基础】\n\nRecall@k 衡量需要的相关材料是否被召回，Precision@k 衡量前 k 条有多少相关；MRR 看首条相关结果位置，nDCG 考虑排序和分级相关性。生成层另外评估事实正确、证据支持、引用定位和覆盖率。检索好不保证回答好，答案流畅也不能反证检索准确。\n\n## C094 Classification Metrics / Calibration / Selective Prediction（分类指标／校准／选择性预测） 【基础】\n\nAccuracy 容易被大类别占比掩盖；Precision、Recall、F1 和混淆矩阵应按类别报告，宏平均用于观察小类别。Calibration 检查置信程度与实际正确率是否匹配。不能直接把模型自报“98% 确信”当概率；可以用验证集校准并设拒答、人工复核区间。\n\n## C095 LLM-as-a-Judge（Large Language Model as a Judge，大语言模型评审）/ Human Review（人工评审） 【条件】\n\n模型裁判适合规模化检查主观质量，但存在位置、表达长度、自偏好和评分漂移。制定可操作评分表，随机化顺序，与盲评人工样本校准；关键权限与财务状态用确定性检查。裁判、业务模型和数据集均需版本化，不能只保存一个总分。\n\n## C096 Regression Testing / Red Teaming / Ablation Study（回归测试／红队测试／消融实验） 【基础】\n\n回归集保留历史失败，红队主动设计恶意输入与边界攻击；消融实验逐项移除检索、反思、子 Agent 等机制，检验其实际贡献。上线前同时检查正常任务表现和越权阻断。失败样本修复后回归，不能通过删除难例让评分变好。\n\n验收表应同时记录：任务成功率、严重错误率、人工接管率、每次成功成本、P95 时延、样本数、测试时间及版本。没有分母和切分方式的百分比不宜作为架构优劣依据。"}, {"id": "ch-18", "number": 18, "title": "18 可观测性与发布", "intro": "", "sections": [{"id": "C097", "title": "C097 Trace / Span / Correlation ID（调用链／追踪单元／关联标识） 【基础】", "html": "<p>Trace 连接一次任务的模型、检索、工具和子任务；Span 表达其中一段工作。记录耗时、token、输入输出摘要、错误码和版本，敏感内容按策略脱敏。OpenTelemetry 适合统一链路；GenAI 语义约定仍需按实际版本管理，不能假定所有厂商字段已稳定互通。<a class=\"ref\" href=\"#source-S32\" aria-label=\"查看来源 S32\">[S32]<\/a><\/p>"}, {"id": "C098", "title": "C098 Observability / Evaluation（可观测性／评测） 【基础】", "html": "<p>可观测性解释“发生了什么”，评测判断“做得好不好”。日志无报错不等于任务成功；评测下降也需要链路定位究竟是召回、模型、工具还是数据变化。将失败类别与 Trace 关联，建立可复现的问题单，而不是保存全部 Prompt 后无法检索。<\/p>"}, {"id": "C099", "title": "C099 Versioning / Reproducibility（版本管理／可复现性） 【基础】", "html": "<p>记录模型标识、采样配置、Prompt、技能、工具 schema、检索配置、索引或数据快照、策略和代码版本。即使温度为零，也不保证跨后端完全重现。目标是能够解释与近似重放，并隔离外部副作用；必要时用录制的工具返回做测试替身。<\/p>"}, {"id": "C100", "title": "C100 Shadow Testing / Canary Release / A/B Testing（影子测试／金丝雀发布／A/B 测试） 【基础】", "html": "<p>影子运行复制输入但禁止真实写入，用来比较候选版本；灰度按小范围逐步放量；A/B 使用合理分流与统计方法验证业务效果。影子环境要阻断发信、下单等工具，不只是隐藏结果。模型或知识更新也应进入发布流程，且能够回滚组合版本。<\/p>"}, {"id": "C101", "title": "C101 SLO（Service Level Objective，服务等级目标）/ Error Budget / Kill Switch（错误预算／停用开关） 【基础】", "html": "<p>服务目标同时覆盖可用性、时延和任务质量。例如技术接口可用但建议严重错误，业务仍不可用。预算耗尽时限制扩量或回退。为模型、单个工具、单类写操作和租户设置可独立停用的开关；高风险动作异常时优先阻断该动作，保留安全查询能力。<\/p>"}, {"id": "C102", "title": "C102 Feedback / Business Attribution（反馈／业务归因） 【基础】", "html": "<p>用户点赞、建议采纳、最终成交和工时节省是不同信号。采纳不一定正确，成交也可能由价格和活动驱动。保存采纳原因、修改内容及最终结果，区分相关性与因果。ROI 应计入人工复核、运维、标注和错误处置成本，必要时通过对照试验归因。<\/p>\n<p>上线资产建议：一份发布清单关联模型、Prompt、数据、工具、策略与评测报告。负责人能够从任意用户投诉定位对应运行，而不是只找到当前版本代码。<\/p>"}], "search": "# 18 可观测性与发布\n\n## C097 Trace / Span / Correlation ID（调用链／追踪单元／关联标识） 【基础】\n\nTrace 连接一次任务的模型、检索、工具和子任务；Span 表达其中一段工作。记录耗时、token、输入输出摘要、错误码和版本，敏感内容按策略脱敏。OpenTelemetry 适合统一链路；GenAI 语义约定仍需按实际版本管理，不能假定所有厂商字段已稳定互通。[S32]\n\n## C098 Observability / Evaluation（可观测性／评测） 【基础】\n\n可观测性解释“发生了什么”，评测判断“做得好不好”。日志无报错不等于任务成功；评测下降也需要链路定位究竟是召回、模型、工具还是数据变化。将失败类别与 Trace 关联，建立可复现的问题单，而不是保存全部 Prompt 后无法检索。\n\n## C099 Versioning / Reproducibility（版本管理／可复现性） 【基础】\n\n记录模型标识、采样配置、Prompt、技能、工具 schema、检索配置、索引或数据快照、策略和代码版本。即使温度为零，也不保证跨后端完全重现。目标是能够解释与近似重放，并隔离外部副作用；必要时用录制的工具返回做测试替身。\n\n## C100 Shadow Testing / Canary Release / A/B Testing（影子测试／金丝雀发布／A/B 测试） 【基础】\n\n影子运行复制输入但禁止真实写入，用来比较候选版本；灰度按小范围逐步放量；A/B 使用合理分流与统计方法验证业务效果。影子环境要阻断发信、下单等工具，不只是隐藏结果。模型或知识更新也应进入发布流程，且能够回滚组合版本。\n\n## C101 SLO（Service Level Objective，服务等级目标）/ Error Budget / Kill Switch（错误预算／停用开关） 【基础】\n\n服务目标同时覆盖可用性、时延和任务质量。例如技术接口可用但建议严重错误，业务仍不可用。预算耗尽时限制扩量或回退。为模型、单个工具、单类写操作和租户设置可独立停用的开关；高风险动作异常时优先阻断该动作，保留安全查询能力。\n\n## C102 Feedback / Business Attribution（反馈／业务归因） 【基础】\n\n用户点赞、建议采纳、最终成交和工时节省是不同信号。采纳不一定正确，成交也可能由价格和活动驱动。保存采纳原因、修改内容及最终结果，区分相关性与因果。ROI 应计入人工复核、运维、标注和错误处置成本，必要时通过对照试验归因。\n\n上线资产建议：一份发布清单关联模型、Prompt、数据、工具、策略与评测报告。负责人能够从任意用户投诉定位对应运行，而不是只找到当前版本代码。"}, {"id": "ch-19", "number": 19, "title": "19 性能与成本", "intro": "", "sections": [{"id": "C103", "title": "C103 TTFT（Time to First Token，首个词元时间）/ End-to-End Latency（端到端时延） 【基础】", "html": "<p>TTFT 是首个 token 返回时间；用户实际等待还包括排队、检索、工具、审批和多轮推理。流式输出改善感知，不一定缩短完成时间。先画关键路径，减少串行依赖与无效轮次；只有独立且权限允许的子任务才并行，不能并发修改同一订单状态。<\/p>"}, {"id": "C104", "title": "C104 Prefix Cache（前缀缓存）/ KV Cache（Key-Value Cache，键值缓存）/ Semantic Cache（语义缓存） 【条件】", "html": "<p>KV cache 复用注意力计算的键值状态；前缀缓存复用公共输入前缀；语义缓存按相似问题复用答案。三者的正确性边界不同。业务答案缓存必须包含租户、用户权限、数据版本和有效期，库存、价格等实时事实不宜因语义相近而复用旧结果。<\/p>"}, {"id": "C105", "title": "C105 Batch Processing / Asynchronous Tasks / Backpressure（批处理／异步任务／背压） 【基础】", "html": "<p>离线标签和批量摘要可以排队合批，交互查询则受用户等待限制。背压通过限制队列、并发和速率，阻止流量把模型与工具拖垮。批任务需要逐条状态、失败重试、幂等和取消；“提交成功”不能等同于整批业务完成。<\/p>"}, {"id": "C106", "title": "C106 Model Serving / Quantization / Scheduling（推理服务／量化／调度） 【条件】", "html": "<p>Continuous batching 动态合并推理请求，PagedAttention 改善 KV 内存管理，量化降低权重或缓存精度以节省资源。自建推理服务需评估硬件利用率、长上下文、并发和质量变化，不能只比较单请求 token 速度。vLLM 是可评估的服务引擎之一。<a class=\"ref\" href=\"#source-S33\" aria-label=\"查看来源 S33\">[S33]<\/a><\/p>"}, {"id": "C107", "title": "C107 Cost per Successful Task（单位成功任务成本） 【基础】", "html": "<p>每次成功成本＝同一评测窗口的全部相关成本／通过验收的任务数。分子包含失败重试、模型与工具、基础设施和人工复核；不要只算成功请求 token。预算按任务、租户和时间窗分配，设最大轮数与支出。省模型单价却增加失败次数，可能更贵。<\/p>"}, {"id": "C108", "title": "C108 Fallback / Graceful Degradation / Model Routing（故障回退／服务降级／模型路由） 【基础】", "html": "<p>模型不可用、预算不足或置信不足时，回退到另一模型、检索原文、确定性流程或人工处理。降级输出需要明确状态。不同模型的工具 schema、上下文能力和拒绝行为可能不同，应分别验证；不能因主模型失败就允许备用模型绕过权限或质量门槛。<\/p>\n<p>优化顺序建议：删除无效步骤 → 减少输入和输出 → 合理检索与缓存 → 可并行工作并行 → 模型路由 → 评估专用微调或自建推理。顺序可因业务约束调整，但每次都应测量质量变化。<\/p>"}], "search": "# 19 性能与成本\n\n## C103 TTFT（Time to First Token，首个词元时间）/ End-to-End Latency（端到端时延） 【基础】\n\nTTFT 是首个 token 返回时间；用户实际等待还包括排队、检索、工具、审批和多轮推理。流式输出改善感知，不一定缩短完成时间。先画关键路径，减少串行依赖与无效轮次；只有独立且权限允许的子任务才并行，不能并发修改同一订单状态。\n\n## C104 Prefix Cache（前缀缓存）/ KV Cache（Key-Value Cache，键值缓存）/ Semantic Cache（语义缓存） 【条件】\n\nKV cache 复用注意力计算的键值状态；前缀缓存复用公共输入前缀；语义缓存按相似问题复用答案。三者的正确性边界不同。业务答案缓存必须包含租户、用户权限、数据版本和有效期，库存、价格等实时事实不宜因语义相近而复用旧结果。\n\n## C105 Batch Processing / Asynchronous Tasks / Backpressure（批处理／异步任务／背压） 【基础】\n\n离线标签和批量摘要可以排队合批，交互查询则受用户等待限制。背压通过限制队列、并发和速率，阻止流量把模型与工具拖垮。批任务需要逐条状态、失败重试、幂等和取消；“提交成功”不能等同于整批业务完成。\n\n## C106 Model Serving / Quantization / Scheduling（推理服务／量化／调度） 【条件】\n\nContinuous batching 动态合并推理请求，PagedAttention 改善 KV 内存管理，量化降低权重或缓存精度以节省资源。自建推理服务需评估硬件利用率、长上下文、并发和质量变化，不能只比较单请求 token 速度。vLLM 是可评估的服务引擎之一。[S33]\n\n## C107 Cost per Successful Task（单位成功任务成本） 【基础】\n\n每次成功成本＝同一评测窗口的全部相关成本／通过验收的任务数。分子包含失败重试、模型与工具、基础设施和人工复核；不要只算成功请求 token。预算按任务、租户和时间窗分配，设最大轮数与支出。省模型单价却增加失败次数，可能更贵。\n\n## C108 Fallback / Graceful Degradation / Model Routing（故障回退／服务降级／模型路由） 【基础】\n\n模型不可用、预算不足或置信不足时，回退到另一模型、检索原文、确定性流程或人工处理。降级输出需要明确状态。不同模型的工具 schema、上下文能力和拒绝行为可能不同，应分别验证；不能因主模型失败就允许备用模型绕过权限或质量门槛。\n\n优化顺序建议：删除无效步骤 → 减少输入和输出 → 合理检索与缓存 → 可并行工作并行 → 模型路由 → 评估专用微调或自建推理。顺序可因业务约束调整，但每次都应测量质量变化。"}, {"id": "ch-20", "number": 20, "title": "20 模型与系统优化", "intro": "", "sections": [{"id": "C109", "title": "C109 SFT（Supervised Fine-Tuning，监督微调）/ Behavior Adaptation（行为适配） 【条件】", "html": "<p>监督微调用输入与理想输出训练模型，适合稳定任务格式、领域表达和行为模式。最新库存或权限不应靠微调维护，应查询业务系统。先验证问题来自模型能力而非缺失上下文或错误工具；保留独立测试集，评估领域收益和通用能力回退。<\/p>"}, {"id": "C110", "title": "C110 LoRA（Low-Rank Adaptation，低秩适配）/ QLoRA（Quantized Low-Rank Adaptation，量化低秩适配）/ PEFT（Parameter-Efficient Fine-Tuning，参数高效微调） 【条件】", "html": "<p>PEFT 是参数高效微调方法族；LoRA 训练低秩适配参数，QLoRA 将量化基础模型与适配训练结合。它们降低部分训练资源需求，但不自动提高数据质量或效果。部署前需确认基础模型、适配器、量化方式及推理服务兼容，并管理其授权与版本。<a class=\"ref\" href=\"#source-S34\" aria-label=\"查看来源 S34\">[S34]<\/a><\/p>"}, {"id": "C111", "title": "C111 DPO（Direct Preference Optimization，直接偏好优化）/ RL（Reinforcement Learning，强化学习）/ RFT（Reinforcement Fine-Tuning，强化微调） 【条件】", "html": "<p>DPO 直接使用偏好对优化；强化学习通过奖励信号优化策略，RFT 常用于以可评分任务进行强化微调。奖励设计错误会导致“刷分”而非业务进步。确定性、可验证任务更适合起步；开放销售建议难以仅用成交结果作为即时奖励，存在延迟和归因问题。<\/p>"}, {"id": "C112", "title": "C112 Distillation / Specialized Model（蒸馏／专用模型） 【条件】", "html": "<p>蒸馏用强模型的输出或行为指导更小模型，可降低稳定子任务的成本。教师错误会传递，生成样本需要去重、筛选和人工抽检。适合大量且边界明确的分类、抽取和标准化；不应假设小模型能完整继承教师的开放推理和安全行为。<\/p>"}, {"id": "C113", "title": "C113 DSPy / GEPA（框架与优化器名称）/ System-Level Optimization（系统级优化） 【增强】", "html": "<p>把 Prompt、示例与模块组合视为可优化程序，用开发集和评测器搜索配置。GEPA 通过反思反馈改进候选方案，DSPy 提供相应优化支持。收益依赖可靠评测及搜索预算；测试集必须隔离，自动找到的 Prompt 仍应接受安全和维护性检查。<a class=\"ref\" href=\"#source-S13\" aria-label=\"查看来源 S13\">[S13]<\/a><\/p>"}, {"id": "C114", "title": "C114 Active Learning / Drift / Continuous Improvement（主动学习／漂移／持续改进） 【基础】", "html": "<p>主动学习优先选择不确定或有代表性的样本标注；漂移监控观察输入、标签分布及业务关系变化。持续改进可以是更新知识、修复工具、调整 Prompt 或训练模型，不能统称“Agent 自动学习”。生产反馈先进入待审核数据池，避免恶意反馈污染模型与记忆。<\/p>\n<p>选择原则：事实更新用知识和工具；固定步骤用流程；输出行为问题先改提示和示例；稳定规模化能力缺口才评估微调。记住用户偏好、优化 Prompt 和更新模型权重，是三个不同层次。<\/p>"}], "search": "# 20 模型与系统优化\n\n## C109 SFT（Supervised Fine-Tuning，监督微调）/ Behavior Adaptation（行为适配） 【条件】\n\n监督微调用输入与理想输出训练模型，适合稳定任务格式、领域表达和行为模式。最新库存或权限不应靠微调维护，应查询业务系统。先验证问题来自模型能力而非缺失上下文或错误工具；保留独立测试集，评估领域收益和通用能力回退。\n\n## C110 LoRA（Low-Rank Adaptation，低秩适配）/ QLoRA（Quantized Low-Rank Adaptation，量化低秩适配）/ PEFT（Parameter-Efficient Fine-Tuning，参数高效微调） 【条件】\n\nPEFT 是参数高效微调方法族；LoRA 训练低秩适配参数，QLoRA 将量化基础模型与适配训练结合。它们降低部分训练资源需求，但不自动提高数据质量或效果。部署前需确认基础模型、适配器、量化方式及推理服务兼容，并管理其授权与版本。[S34]\n\n## C111 DPO（Direct Preference Optimization，直接偏好优化）/ RL（Reinforcement Learning，强化学习）/ RFT（Reinforcement Fine-Tuning，强化微调） 【条件】\n\nDPO 直接使用偏好对优化；强化学习通过奖励信号优化策略，RFT 常用于以可评分任务进行强化微调。奖励设计错误会导致“刷分”而非业务进步。确定性、可验证任务更适合起步；开放销售建议难以仅用成交结果作为即时奖励，存在延迟和归因问题。\n\n## C112 Distillation / Specialized Model（蒸馏／专用模型） 【条件】\n\n蒸馏用强模型的输出或行为指导更小模型，可降低稳定子任务的成本。教师错误会传递，生成样本需要去重、筛选和人工抽检。适合大量且边界明确的分类、抽取和标准化；不应假设小模型能完整继承教师的开放推理和安全行为。\n\n## C113 DSPy / GEPA（框架与优化器名称）/ System-Level Optimization（系统级优化） 【增强】\n\n把 Prompt、示例与模块组合视为可优化程序，用开发集和评测器搜索配置。GEPA 通过反思反馈改进候选方案，DSPy 提供相应优化支持。收益依赖可靠评测及搜索预算；测试集必须隔离，自动找到的 Prompt 仍应接受安全和维护性检查。[S13]\n\n## C114 Active Learning / Drift / Continuous Improvement（主动学习／漂移／持续改进） 【基础】\n\n主动学习优先选择不确定或有代表性的样本标注；漂移监控观察输入、标签分布及业务关系变化。持续改进可以是更新知识、修复工具、调整 Prompt 或训练模型，不能统称“Agent 自动学习”。生产反馈先进入待审核数据池，避免恶意反馈污染模型与记忆。\n\n选择原则：事实更新用知识和工具；固定步骤用流程；输出行为问题先改提示和示例；稳定规模化能力缺口才评估微调。记住用户偏好、优化 Prompt 和更新模型权重，是三个不同层次。"}, {"id": "ch-21", "number": 21, "title": "21 Coding Agent 与前沿方向", "intro": "", "sections": [{"id": "C115", "title": "C115 Coding Agent（编程智能体）/ ACI（Agent-Computer Interface，智能体与计算机交互接口） 【增强】", "html": "<p>Coding Agent 能读写仓库、运行工具并根据结果迭代；Agent Computer Interface 指为 Agent 设计的工具和环境交互界面。清晰错误、精确差异、可定位测试结果往往比增加角色更有用。沙箱、分支隔离、代码审查和发布权限决定其能安全做到哪里。<\/p>"}, {"id": "C116", "title": "C116 AGENTS.md / Skills / Hooks（项目指令文件／技能／钩子） 【增强】", "html": "<p>仓库说明表达项目约定，技能封装可复用任务知识，Hooks 在事件点执行自动动作。名称和加载规则因产品而异；开放技能格式不保证完整运行时一致。项目规则应有作用域与优先级，Hooks 的权限和失败处理需审计，不能让可编辑规则关闭强制检查。<a class=\"ref\" href=\"#source-S16\" aria-label=\"查看来源 S16\">[S16]<\/a><\/p>"}, {"id": "C117", "title": "C117 Spec-Driven Development / Validation Gates（规格驱动开发／验证门槛） 【基础】", "html": "<p>先给出验收标准，再约束实现、测试和发布。TDD 可用于可明确测试的功能，但模型自己写且自己通过的测试不足以证明正确。用独立验收样本、回归、静态检查和必要人工评审补足。高风险变更的发布许可应由可信流程控制。<\/p>"}, {"id": "C118", "title": "C118 Long-Running Agent / Loop Harness（长时运行智能体／循环执行框架） 【增强】", "html": "<p>长任务需要增量目标、进度文件、外部状态、恢复、预算及停止条件。社区所谓 Ralph 类循环通常是重复执行直至条件满足的工程模式，不是统一协议或质量保证。无限重试可能掩盖根因；达到预算、重复失败或需要新授权时应暂停并报告。<a class=\"ref\" href=\"#source-S03\" aria-label=\"查看来源 S03\">[S03]<\/a><a class=\"ref\" href=\"#source-S04\" aria-label=\"查看来源 S04\">[S04]<\/a><\/p>"}, {"id": "C119", "title": "C119 RLM（Recursive Language Model，递归语言模型）/ Recursive Context（递归上下文） 【探索】", "html": "<p>RLM 研究让模型通过程序化访问外部上下文，并递归调用子模型处理片段，以应对超长输入。它与简单增加上下文窗口不同，也不等于所有递归 Agent。潜力在分解与按需读取，但工具安全、递归预算、评测泛化和运行成本仍需按任务验证。<a class=\"ref\" href=\"#source-S35\" aria-label=\"查看来源 S35\">[S35]<\/a><\/p>"}, {"id": "C120", "title": "C120 Managed Runtime / Agent UI / Proactive Tasks（托管运行时／智能体界面／主动任务） 【增强】", "html": "<p>托管运行时将会话、执行环境和调度交给平台；Agent UI 呈现计划、进度、证据、审批和产物；主动任务由事件或定时器触发。三者正在汇合，但协议和产品尚不统一。企业应保留任务状态与产物导出能力，避免将业务唯一记录锁在某个会话接口。<a class=\"ref\" href=\"#source-S05\" aria-label=\"查看来源 S05\">[S05]<\/a><\/p>\n<p>前沿判断：上下文组织、工具契约、长任务恢复和可验证交付的需求具有持续性；具体 Harness 结构、通信字段、记忆框架及多 Agent 角色划分更容易变化。投资接口与评测资产，比追逐角色数量更耐久。<\/p>"}], "search": "# 21 Coding Agent 与前沿方向\n\n## C115 Coding Agent（编程智能体）/ ACI（Agent-Computer Interface，智能体与计算机交互接口） 【增强】\n\nCoding Agent 能读写仓库、运行工具并根据结果迭代；Agent Computer Interface 指为 Agent 设计的工具和环境交互界面。清晰错误、精确差异、可定位测试结果往往比增加角色更有用。沙箱、分支隔离、代码审查和发布权限决定其能安全做到哪里。\n\n## C116 AGENTS.md / Skills / Hooks（项目指令文件／技能／钩子） 【增强】\n\n仓库说明表达项目约定，技能封装可复用任务知识，Hooks 在事件点执行自动动作。名称和加载规则因产品而异；开放技能格式不保证完整运行时一致。项目规则应有作用域与优先级，Hooks 的权限和失败处理需审计，不能让可编辑规则关闭强制检查。[S16]\n\n## C117 Spec-Driven Development / Validation Gates（规格驱动开发／验证门槛） 【基础】\n\n先给出验收标准，再约束实现、测试和发布。TDD 可用于可明确测试的功能，但模型自己写且自己通过的测试不足以证明正确。用独立验收样本、回归、静态检查和必要人工评审补足。高风险变更的发布许可应由可信流程控制。\n\n## C118 Long-Running Agent / Loop Harness（长时运行智能体／循环执行框架） 【增强】\n\n长任务需要增量目标、进度文件、外部状态、恢复、预算及停止条件。社区所谓 Ralph 类循环通常是重复执行直至条件满足的工程模式，不是统一协议或质量保证。无限重试可能掩盖根因；达到预算、重复失败或需要新授权时应暂停并报告。[S03][S04]\n\n## C119 RLM（Recursive Language Model，递归语言模型）/ Recursive Context（递归上下文） 【探索】\n\nRLM 研究让模型通过程序化访问外部上下文，并递归调用子模型处理片段，以应对超长输入。它与简单增加上下文窗口不同，也不等于所有递归 Agent。潜力在分解与按需读取，但工具安全、递归预算、评测泛化和运行成本仍需按任务验证。[S35]\n\n## C120 Managed Runtime / Agent UI / Proactive Tasks（托管运行时／智能体界面／主动任务） 【增强】\n\n托管运行时将会话、执行环境和调度交给平台；Agent UI 呈现计划、进度、证据、审批和产物；主动任务由事件或定时器触发。三者正在汇合，但协议和产品尚不统一。企业应保留任务状态与产物导出能力，避免将业务唯一记录锁在某个会话接口。[S05]\n\n前沿判断：上下文组织、工具契约、长任务恢复和可验证交付的需求具有持续性；具体 Harness 结构、通信字段、记忆框架及多 Agent 角色划分更容易变化。投资接口与评测资产，比追逐角色数量更耐久。"}, {"id": "ch-22", "number": 22, "title": "22 企业 AI 能力平台参考架构", "intro": "<p>平台服务业务团队复用能力，业务系统继续承担权威交易与规则。建议以可组合模块开始，不必先建齐所有模块再交付应用。<\/p>\n<div class=\"architecture-slot\"><\/div>", "sections": [{"id": "ch-22-s0", "title": "核心边界", "html": "<p>入口层携带用户与租户身份；任务层保存目标、预算、审批与状态；执行层选择确定性流程或 Agent 循环；能力层提供统一模型、知识、记忆及工具接口；业务层负责真实数据与交易。身份、策略、评测和审计贯穿每层。<\/p>\n<p>控制平面发布模型配置、工具目录、Prompt、技能、策略和评测基线。数据平面只读取已发布配置执行任务；Agent 可以提出改进建议，不能自行扩大权限或直接发布新安全规则。<\/p>"}, {"id": "ch-22-s1", "title": "平台最小可交付范围", "html": "<p>第一阶段复用身份与权限、模型网关、工具适配、运行记录、任务预算和评测流水线，选择一个业务应用验证闭环。第二阶段按重复需求抽取知识、技能、长任务和多租户配额。没有两个以上应用复用的专用逻辑，先留在业务模块。<\/p>"}, {"id": "ch-22-s2", "title": "资产归属", "html": "<p>企业拥有原始数据、索引重建能力、工具契约、评测集、业务指标、状态及产物。框架承担编排便利性，模型供应商承担推理。为模型、编排、向量库和可观测后端设置适配层，但只抽象真实存在的差异，避免提前造全能框架。<\/p>"}], "search": "# 22 企业 AI 能力平台参考架构\n\n平台服务业务团队复用能力，业务系统继续承担权威交易与规则。建议以可组合模块开始，不必先建齐所有模块再交付应用。\n\n[ARCHITECTURE]\n\n## 核心边界\n\n入口层携带用户与租户身份；任务层保存目标、预算、审批与状态；执行层选择确定性流程或 Agent 循环；能力层提供统一模型、知识、记忆及工具接口；业务层负责真实数据与交易。身份、策略、评测和审计贯穿每层。\n\n控制平面发布模型配置、工具目录、Prompt、技能、策略和评测基线。数据平面只读取已发布配置执行任务；Agent 可以提出改进建议，不能自行扩大权限或直接发布新安全规则。\n\n## 平台最小可交付范围\n\n第一阶段复用身份与权限、模型网关、工具适配、运行记录、任务预算和评测流水线，选择一个业务应用验证闭环。第二阶段按重复需求抽取知识、技能、长任务和多租户配额。没有两个以上应用复用的专用逻辑，先留在业务模块。\n\n## 资产归属\n\n企业拥有原始数据、索引重建能力、工具契约、评测集、业务指标、状态及产物。框架承担编排便利性，模型供应商承担推理。为模型、编排、向量库和可观测后端设置适配层，但只抽象真实存在的差异，避免提前造全能框架。"}, {"id": "ch-23", "number": 23, "title": "23 运行契约与可靠执行", "intro": "<p>以下是平台设计示例，字段名不是行业标准；可以映射到企业已有消息、工作流和审计规范。<\/p>\n<div class=\"table-scroll\"><table>\n<tr><th>对象<\/th><th>至少需要的字段<\/th><th>作用<\/th><\/tr>\n<tr><td>Task<\/td><td>task_id tenant_id actor goal status deadline budget version<\/td><td>定义任务责任与边界<\/td><\/tr>\n<tr><td>ToolCall<\/td><td>call_id task_id tool_version args idempotency_key<\/td><td>定位调用和重复执行<\/td><\/tr>\n<tr><td>Evidence<\/td><td>source_id source_version locator retrieved_at acl_scope<\/td><td>支持核验与权限追踪<\/td><\/tr>\n<tr><td>Approval<\/td><td>approver action_digest scope expires_at decision<\/td><td>把批准绑定到具体动作<\/td><\/tr>\n<tr><td>Result<\/td><td>status output evidence_ids side_effects error_code<\/td><td>区分成功及部分完成<\/td><\/tr>\n<tr><td>Release<\/td><td>model prompt skill tool policy dataset code_version<\/td><td>支持回归和回滚<\/td><\/tr>\n<\/table><\/div>", "sections": [{"id": "ch-23-s0", "title": "一次写操作的推荐顺序", "html": "<ol><li>验证调用主体、租户、工具权限和参数 schema，检查业务规则及预算。<\/li><li>如需审批，冻结操作对象、参数和摘要；审批通过后再检查有效期与当前业务状态。<\/li><li>使用幂等键调用业务接口，事务内保存结果或进入可核对状态；工具返回业务凭证。<\/li><li>保存审计与证据，更新任务状态；超时不能直接判定写入失败，应查询业务凭证。<\/li><li>未知结果进入人工核对或补偿流程，不能盲目重复扣款、下单或发送通知。<\/li><\/ol>"}, {"id": "ch-23-s1", "title": "状态机示例", "html": "<p>CREATED → RUNNING → WAITING_APPROVAL → RUNNING → SUCCEEDED。<\/p>\n<p>RUNNING 也可进入 WAITING_TOOL、FAILED、CANCELLED 或 NEEDS_REVIEW。暂停和终态的定义必须固定；取消不能自动撤回已发生的外部动作。<\/p>"}, {"id": "ch-23-s2", "title": "错误契约", "html": "<p>区分 INVALID_INPUT、PERMISSION_DENIED、RATE_LIMITED、TRANSIENT_FAILURE、BUSINESS_CONFLICT 和 UNKNOWN_OUTCOME。只有已确认可安全重试的错误才自动重试。错误信息应能帮助模型修正输入，但不要把堆栈中的凭证或内部敏感数据回传。<\/p>"}], "search": "# 23 运行契约与可靠执行\n\n以下是平台设计示例，字段名不是行业标准；可以映射到企业已有消息、工作流和审计规范。\n\n| 对象 | 至少需要的字段 | 作用 |\n|---|---|---|\n| Task | task_id tenant_id actor goal status deadline budget version | 定义任务责任与边界 |\n| ToolCall | call_id task_id tool_version args idempotency_key | 定位调用和重复执行 |\n| Evidence | source_id source_version locator retrieved_at acl_scope | 支持核验与权限追踪 |\n| Approval | approver action_digest scope expires_at decision | 把批准绑定到具体动作 |\n| Result | status output evidence_ids side_effects error_code | 区分成功及部分完成 |\n| Release | model prompt skill tool policy dataset code_version | 支持回归和回滚 |\n\n## 一次写操作的推荐顺序\n\n1. 验证调用主体、租户、工具权限和参数 schema，检查业务规则及预算。\n2. 如需审批，冻结操作对象、参数和摘要；审批通过后再检查有效期与当前业务状态。\n3. 使用幂等键调用业务接口，事务内保存结果或进入可核对状态；工具返回业务凭证。\n4. 保存审计与证据，更新任务状态；超时不能直接判定写入失败，应查询业务凭证。\n5. 未知结果进入人工核对或补偿流程，不能盲目重复扣款、下单或发送通知。\n\n## 状态机示例\n\nCREATED → RUNNING → WAITING_APPROVAL → RUNNING → SUCCEEDED。\n\nRUNNING 也可进入 WAITING_TOOL、FAILED、CANCELLED 或 NEEDS_REVIEW。暂停和终态的定义必须固定；取消不能自动撤回已发生的外部动作。\n\n## 错误契约\n\n区分 INVALID_INPUT、PERMISSION_DENIED、RATE_LIMITED、TRANSIENT_FAILURE、BUSINESS_CONFLICT 和 UNKNOWN_OUTCOME。只有已确认可安全重试的错误才自动重试。错误信息应能帮助模型修正输入，但不要把堆栈中的凭证或内部敏感数据回传。"}, {"id": "ch-24", "number": 24, "title": "24 技术选型与协议边界", "intro": "<p>先选控制模式和运行需求，再选框架。已有 Java 团队可以保留交易与权限体系，把模型能力接入现有服务；是否增加 Python 由生态收益、人员能力和运维成本决定。<\/p>\n<div class=\"table-scroll\"><table>\n<tr><th>选项<\/th><th>适合评估的用途<\/th><th>需要补齐或验证<\/th><\/tr>\n<tr><td>Spring AI 或 LangChain4j<\/td><td>Java 应用接入模型 工具 RAG<\/td><td>任务持久化 策略和发布治理<\/td><\/tr>\n<tr><td>LangGraph<\/td><td>有状态编排 中断恢复 Agent 图<\/td><td>外部副作用幂等 租户隔离<\/td><\/tr>\n<tr><td>Microsoft Agent Framework<\/td><td>采用微软生态的 Agent 与工作流<\/td><td>版本兼容 迁移成本 部署约束<\/td><\/tr>\n<tr><td>Google ADK<\/td><td>Google 生态或多语言 Agent 开发<\/td><td>目标运行环境和治理集成<\/td><\/tr>\n<tr><td>Dify<\/td><td>快速验证知识问答和可视化流程<\/td><td>权限颗粒度 复杂状态 可迁移性<\/td><\/tr>\n<tr><td>Temporal 或现有 BPMN 平台<\/td><td>跨服务长事务 定时 重试 审批<\/td><td>模型与上下文管理需另行实现<\/td><\/tr>\n<\/table><\/div>\n<p>表中是评估方向，不是产品排名或功能穷举。官方入口见 <a class=\"ref\" href=\"#source-S10\" aria-label=\"查看来源 S10\">[S10]<\/a><a class=\"ref\" href=\"#source-S29\" aria-label=\"查看来源 S29\">[S29]<\/a><a class=\"ref\" href=\"#source-S30\" aria-label=\"查看来源 S30\">[S30]<\/a><a class=\"ref\" href=\"#source-S36\" aria-label=\"查看来源 S36\">[S36]<\/a><a class=\"ref\" href=\"#source-S37\" aria-label=\"查看来源 S37\">[S37]<\/a><a class=\"ref\" href=\"#source-S38\" aria-label=\"查看来源 S38\">[S38]<\/a><a class=\"ref\" href=\"#source-S39\" aria-label=\"查看来源 S39\">[S39]<\/a>。不要把 Temporal 的持久化执行与模型推理能力混为一谈，也不要把框架 checkpoint 当成跨系统交易保证。<\/p>", "sections": [{"id": "ch-24-s0", "title": "四类协议或封装的关系", "html": "<p>Tool schema 定义一个函数怎么调用；MCP 定义能力如何暴露与交互；A2A 定义独立 Agent 如何交换任务和产物；Skill 封装任务知识与可复用流程。它们可共存，并不构成必须按顺序引入的技术栈。<\/p>"}, {"id": "ch-24-s1", "title": "六项选型验收", "html": "<p>验证真实业务成功率、故障恢复、权限与数据隔离、每次成功成本、调试维护效率、迁移与退出能力。对候选框架用同一任务集和约束测试；演示顺利、星标数量及“支持多 Agent”不能替代验收。<\/p>"}, {"id": "ch-24-s2", "title": "存量系统的渐进接入建议", "html": "<p>现有认证和网关 + 业务工具适配（使用存量系统语言） + 一种模型接入框架 + 数据库任务状态 + 现有消息队列 + 评测流水线。确实存在跨天恢复或复杂补偿时再引入持久化工作流；出现实测收益时再增加独立 Agent。<\/p>"}], "search": "# 24 技术选型与协议边界\n\n先选控制模式和运行需求，再选框架。已有 Java 团队可以保留交易与权限体系，把模型能力接入现有服务；是否增加 Python 由生态收益、人员能力和运维成本决定。\n\n| 选项 | 适合评估的用途 | 需要补齐或验证 |\n|---|---|---|\n| Spring AI 或 LangChain4j | Java 应用接入模型 工具 RAG | 任务持久化 策略和发布治理 |\n| LangGraph | 有状态编排 中断恢复 Agent 图 | 外部副作用幂等 租户隔离 |\n| Microsoft Agent Framework | 采用微软生态的 Agent 与工作流 | 版本兼容 迁移成本 部署约束 |\n| Google ADK | Google 生态或多语言 Agent 开发 | 目标运行环境和治理集成 |\n| Dify | 快速验证知识问答和可视化流程 | 权限颗粒度 复杂状态 可迁移性 |\n| Temporal 或现有 BPMN 平台 | 跨服务长事务 定时 重试 审批 | 模型与上下文管理需另行实现 |\n\n表中是评估方向，不是产品排名或功能穷举。官方入口见 [S10][S29][S30][S36–S39]。不要把 Temporal 的持久化执行与模型推理能力混为一谈，也不要把框架 checkpoint 当成跨系统交易保证。\n\n## 四类协议或封装的关系\n\nTool schema 定义一个函数怎么调用；MCP 定义能力如何暴露与交互；A2A 定义独立 Agent 如何交换任务和产物；Skill 封装任务知识与可复用流程。它们可共存，并不构成必须按顺序引入的技术栈。\n\n## 六项选型验收\n\n验证真实业务成功率、故障恢复、权限与数据隔离、每次成功成本、调试维护效率、迁移与退出能力。对候选框架用同一任务集和约束测试；演示顺利、星标数量及“支持多 Agent”不能替代验收。\n\n## 存量系统的渐进接入建议\n\n现有认证和网关 + 业务工具适配（使用存量系统语言） + 一种模型接入框架 + 数据库任务状态 + 现有消息队列 + 评测流水线。确实存在跨天恢复或复杂补偿时再引入持久化工作流；出现实测收益时再增加独立 Agent。"}, {"id": "ch-25", "number": 25, "title": "25 CRM 线索旅程 Agent 的设计示例", "intro": "<p>通用客户服务场景：结合授权录音、转写和 CRM 记录，形成事件摘要与服务建议。以下为参考设计，业务效果需要独立验证。<\/p>", "sections": [{"id": "ch-25-s0", "title": "数据与证据链", "html": "<p>录音保存权限、客户关联和时间信息；ASR 输出带时间戳的片段，保留低置信识别供复核。将“客户明确说过”“销售记录”“系统推断”分开存储。CRM 中的客户归属、交易状态和授权信息以实时查询为准，摘要只用于辅助理解。<\/p>"}, {"id": "ch-25-s1", "title": "推荐执行流程", "html": "<p>先用确定性流程收集该用户有权访问的数据，再进行事件抽取与时间排序，检索相关销售知识，生成结构化建议。输出包括当前阶段、证据定位、待确认问题、建议动作及适用条件。需要补充事实时允许有限工具循环；形成建议后进入业务校验。<\/p>"}, {"id": "ch-25-s2", "title": "自主性分配", "html": "<p>画像摘要和下一步建议可自动生成；更新客户阶段、创建任务可按风险设置确认；外呼、发信、改价及承诺条款使用单独权限与审批。不要把“客户想再考虑”直接转换为确定成交概率，也不要允许录音中的指令调用 CRM 管理工具。<\/p>"}, {"id": "ch-25-s3", "title": "记忆设计", "html": "<p>短期上下文保存本次分析；长期客户事实归入 CRM 或受控客户知识层，带来源和更新时间。销售人员偏好可以作为可删除的用户记忆。不同销售权限切换时重新检索，不能复用含有原权限范围数据的会话摘要。<\/p>"}, {"id": "ch-25-s4", "title": "评测与业务效果", "html": "<p>离线检查转写关键实体、时间线、事实归因、建议可执行性及越权；线上记录销售准备耗时、建议采纳与修改原因。复购率和成交率需结合客户分层及对照设计观察，不能将所有变化归因于 Agent。<\/p>\n<p>起步方案通常是受控流程加一个有限循环的分析 Agent。只有证据显示复杂客户分析存在可并行且相对独立的子任务，再评估多个 Agent；保留与单 Agent 的质量和成本对照。<\/p>"}], "search": "# 25 CRM 线索旅程 Agent 的设计示例\n\n通用客户服务场景：结合授权录音、转写和 CRM 记录，形成事件摘要与服务建议。以下为参考设计，业务效果需要独立验证。\n\n## 数据与证据链\n\n录音保存权限、客户关联和时间信息；ASR 输出带时间戳的片段，保留低置信识别供复核。将“客户明确说过”“销售记录”“系统推断”分开存储。CRM 中的客户归属、交易状态和授权信息以实时查询为准，摘要只用于辅助理解。\n\n## 推荐执行流程\n\n先用确定性流程收集该用户有权访问的数据，再进行事件抽取与时间排序，检索相关销售知识，生成结构化建议。输出包括当前阶段、证据定位、待确认问题、建议动作及适用条件。需要补充事实时允许有限工具循环；形成建议后进入业务校验。\n\n## 自主性分配\n\n画像摘要和下一步建议可自动生成；更新客户阶段、创建任务可按风险设置确认；外呼、发信、改价及承诺条款使用单独权限与审批。不要把“客户想再考虑”直接转换为确定成交概率，也不要允许录音中的指令调用 CRM 管理工具。\n\n## 记忆设计\n\n短期上下文保存本次分析；长期客户事实归入 CRM 或受控客户知识层，带来源和更新时间。销售人员偏好可以作为可删除的用户记忆。不同销售权限切换时重新检索，不能复用含有原权限范围数据的会话摘要。\n\n## 评测与业务效果\n\n离线检查转写关键实体、时间线、事实归因、建议可执行性及越权；线上记录销售准备耗时、建议采纳与修改原因。复购率和成交率需结合客户分层及对照设计观察，不能将所有变化归因于 Agent。\n\n起步方案通常是受控流程加一个有限循环的分析 Agent。只有证据显示复杂客户分析存在可并行且相对独立的子任务，再评估多个 Agent；保留与单 Agent 的质量和成本对照。"}, {"id": "ch-26", "number": 26, "title": "26 推荐、研究与批量分类的设计示例", "intro": "", "sections": [{"id": "ch-26-s0", "title": "通用商品推荐", "html": "<p>将客户类型、业务定位、地域、价格带、历史销量与实时商品约束合并，检索产品知识和有来源的消费趋势。推荐先满足库存、供货范围和商品适配规则，再由模型解释组合理由、生成商品组合建议。市场热度、企业销量和某个客户适用性应分别表达。<\/p>\n<p>推荐可采用“规则过滤 + 检索或排序 + LLM 解释”。排名质量用客户接受度、有效推荐占比、缺货推荐率和后续业务指标验证；不必让 LLM 独自承担全量商品排序。商品规格和使用限制应来自可核验商品数据，缺失时标记待确认。<\/p>"}, {"id": "ch-26-s1", "title": "市场研究与产品机会", "html": "<p>把趋势、销售变化、客户反馈和竞品信息转换为有证据的机会假设，按目标客群、成本约束、差异点和验证方式输出。模型建议的“潜力爆品”不是已证明畅销；进入原型验证、评审、小范围试销及数据回收后再决定投入。<\/p>\n<p>研发需要更丰富的探索，但仍应限制来源、预算和结论强度。可以把市场检索与内部销售分析并行，最后统一核对口径；不存在独立数据源或专业判断时，拆成多个角色只会重复同一信息。<\/p>"}, {"id": "ch-26-s2", "title": "文档、商品与客户反馈分类", "html": "<p>先建立标签字典、层级关系、互斥规则、别名及版本，明确多标签还是单标签。模型进行抽取和分类后，由规则验证标签合法性；低置信、冲突及新类别进入人工队列。批量处理适合异步任务，结果须关联输入和标签体系版本。<\/p>\n<p>分类工程验收需要补齐测试样本量、抽样时间、类别分布、标注规则及是否独立测试集。多标签任务还应区分逐标签正确率、样本完全匹配率和宏平均 F1，避免不同口径混用。<\/p>"}, {"id": "ch-26-s3", "title": "从高成本模型到规模化服务", "html": "<p>先用强模型与人工建立可信基线，再比较传统 NLP、规则、小模型或蒸馏方案。高频稳定类别可由低成本方案处理，复杂长尾交给强模型。LLM 改善语义关系识别，并不意味着正则、词典和传统分类器全部失效。<\/p>"}], "search": "# 26 推荐、研究与批量分类的设计示例\n\n## 通用商品推荐\n\n将客户类型、业务定位、地域、价格带、历史销量与实时商品约束合并，检索产品知识和有来源的消费趋势。推荐先满足库存、供货范围和商品适配规则，再由模型解释组合理由、生成商品组合建议。市场热度、企业销量和某个客户适用性应分别表达。\n\n推荐可采用“规则过滤 + 检索或排序 + LLM 解释”。排名质量用客户接受度、有效推荐占比、缺货推荐率和后续业务指标验证；不必让 LLM 独自承担全量商品排序。商品规格和使用限制应来自可核验商品数据，缺失时标记待确认。\n\n## 市场研究与产品机会\n\n把趋势、销售变化、客户反馈和竞品信息转换为有证据的机会假设，按目标客群、成本约束、差异点和验证方式输出。模型建议的“潜力爆品”不是已证明畅销；进入原型验证、评审、小范围试销及数据回收后再决定投入。\n\n研发需要更丰富的探索，但仍应限制来源、预算和结论强度。可以把市场检索与内部销售分析并行，最后统一核对口径；不存在独立数据源或专业判断时，拆成多个角色只会重复同一信息。\n\n## 文档、商品与客户反馈分类\n\n先建立标签字典、层级关系、互斥规则、别名及版本，明确多标签还是单标签。模型进行抽取和分类后，由规则验证标签合法性；低置信、冲突及新类别进入人工队列。批量处理适合异步任务，结果须关联输入和标签体系版本。\n\n分类工程验收需要补齐测试样本量、抽样时间、类别分布、标注规则及是否独立测试集。多标签任务还应区分逐标签正确率、样本完全匹配率和宏平均 F1，避免不同口径混用。\n\n## 从高成本模型到规模化服务\n\n先用强模型与人工建立可信基线，再比较传统 NLP、规则、小模型或蒸馏方案。高频稳定类别可由低成本方案处理，复杂长尾交给强模型。LLM 改善语义关系识别，并不意味着正则、词典和传统分类器全部失效。"}, {"id": "ch-27", "number": 27, "title": "27 将 AI Coding 变成团队工程能力", "intro": "<p>企业推广 AI Coding 时，应同时建设项目规范、隔离运行环境、验证流水线与人工评审机制。采用覆盖率不等于工程收益，需要记录交付周期、缺陷、返工和评审负担。<\/p>", "sections": [{"id": "ch-27-s0", "title": "新项目规范", "html": "<p>提供明确业务范围、架构边界、目录约定、接口契约、测试方式和发布步骤。将稳定约定放入版本管理的项目说明和技能，将必须执行的检查放入 CI 或可信 Hooks。Agent 完成后交付代码差异、验证证据、遗留问题和回滚说明。<\/p>"}, {"id": "ch-27-s1", "title": "老项目规范", "html": "<p>先识别现有行为、依赖、数据迁移和隐藏约束，必要时建立特征测试；限定修改范围，避免无关重构。对权限、支付、库存等路径设置更严格验收。仓库中已有约定与通用技能冲突时，明确作用域和优先级，而不是让模型自行猜测。<\/p>"}, {"id": "ch-27-s2", "title": "减少能力和 Prompt 差异", "html": "<p>把高频需求做成输入模板和可执行流程，让开发人员提交目标、约束与验收条件；把检查工具标准化。提示词范例可以降低差异，但只有可验证的约束、测试和评审才能控制最终质量。保留人工对方案取舍和业务正确性的责任。<\/p>"}, {"id": "ch-27-s3", "title": "Harness 的效果验证", "html": "<p>如果采用多节点、多个子 Agent 和多级门禁，逐项说明每个节点解决哪类失败。用消融测试比较：基础单 Agent、加入项目规则、加入验证门槛、加入子 Agent后的成功率、成本及时延。节点数量本身不代表成熟度。<\/p>"}, {"id": "ch-27-s4", "title": "推荐度量", "html": "<p>采用率观察普及；从需求到可验收产物的周期观察效率；上线缺陷及返工观察质量；人工审查耗时观察协作成本。按新老项目、任务复杂度和人员经验分组，避免用简单任务的收益外推全部研发工作。<\/p>\n<p>企业平台可以将仓库接入、技能目录、沙箱、验证门槛、产物及审计做成共享服务；业务应用 Agent 则复用身份、工具、评测和运行治理，两者不必共用所有编排逻辑。<\/p>"}], "search": "# 27 将 AI Coding 变成团队工程能力\n\n企业推广 AI Coding 时，应同时建设项目规范、隔离运行环境、验证流水线与人工评审机制。采用覆盖率不等于工程收益，需要记录交付周期、缺陷、返工和评审负担。\n\n## 新项目规范\n\n提供明确业务范围、架构边界、目录约定、接口契约、测试方式和发布步骤。将稳定约定放入版本管理的项目说明和技能，将必须执行的检查放入 CI 或可信 Hooks。Agent 完成后交付代码差异、验证证据、遗留问题和回滚说明。\n\n## 老项目规范\n\n先识别现有行为、依赖、数据迁移和隐藏约束，必要时建立特征测试；限定修改范围，避免无关重构。对权限、支付、库存等路径设置更严格验收。仓库中已有约定与通用技能冲突时，明确作用域和优先级，而不是让模型自行猜测。\n\n## 减少能力和 Prompt 差异\n\n把高频需求做成输入模板和可执行流程，让开发人员提交目标、约束与验收条件；把检查工具标准化。提示词范例可以降低差异，但只有可验证的约束、测试和评审才能控制最终质量。保留人工对方案取舍和业务正确性的责任。\n\n## Harness 的效果验证\n\n如果采用多节点、多个子 Agent 和多级门禁，逐项说明每个节点解决哪类失败。用消融测试比较：基础单 Agent、加入项目规则、加入验证门槛、加入子 Agent后的成功率、成本及时延。节点数量本身不代表成熟度。\n\n## 推荐度量\n\n采用率观察普及；从需求到可验收产物的周期观察效率；上线缺陷及返工观察质量；人工审查耗时观察协作成本。按新老项目、任务复杂度和人员经验分组，避免用简单任务的收益外推全部研发工作。\n\n企业平台可以将仓库接入、技能目录、沙箱、验证门槛、产物及审计做成共享服务；业务应用 Agent 则复用身份、工具、评测和运行治理，两者不必共用所有编排逻辑。"}, {"id": "ch-28", "number": 28, "title": "28 建设路线与学习顺序", "intro": "<p>以下 90 天是参考节奏，需按团队规模、数据和审批条件调整；每个阶段以退出条件决定能否推进。<\/p>", "sections": [{"id": "ch-28-s0", "title": "第 1 至 15 天建立基线", "html": "<p>选择一个价值明确、权限可控的场景，例如 CRM 只读分析。梳理任务、数据来源、业务约束与人工流程，建立代表性评测集和简单实现。交付：场景说明、权限矩阵、失败分类、基线质量及成本。能解释失败原因后再扩大技术复杂度。<\/p>"}, {"id": "ch-28-s1", "title": "第 16 至 35 天建立可运行闭环", "html": "<p>完成模型适配、工具 schema、检索权限、结构化结果、链路记录和预算。引入异常、恶意文档及缺失数据测试。交付：可重复部署版本、离线评测报告、故障处理和回退方案。先验证只读功能，再开放受控写入。<\/p>"}, {"id": "ch-28-s2", "title": "第 36 至 60 天建立生产治理", "html": "<p>补齐审批、幂等、恢复、配额、凭证管理、灰度和回滚。通过进程崩溃、工具超时、审批过期及权限撤销演练。交付：运行手册、值班职责、业务验收及回归门槛。关键风险未关闭时，不扩大自动执行范围。<\/p>"}, {"id": "ch-28-s3", "title": "第 61 至 90 天形成复用平台", "html": "<p>接入第二个场景，识别真正可共用的模型、工具、知识、技能和评测服务。比较多 Agent、优化器或微调的增量价值。交付：共享能力目录、第二场景上线记录、迁移清单和成本账单。复用减少接入工作量后，才说明平台化产生效果。<\/p>"}, {"id": "ch-28-s4", "title": "架构师学习路径", "html": "<p>先掌握 C001–C018、C043–C048 和 C073–C090，理解能力与责任边界；再学习上下文、知识、记忆和编排；随后掌握评测、成本、发布与模型优化。协议以版本化实现为单位学习，前沿论文以可复现实验为单位学习。<\/p>"}, {"id": "ch-28-s5", "title": "高级开发人员的四个实践作业", "html": "<p>实现一个带证据的检索工具；实现一个重试不会重复写入的业务工具；实现一个崩溃后可恢复且审批不会越权的任务；建立一套能发现退化的独立评测。完成这四项，再扩展多 Agent 与自动优化，基础会更稳。<\/p>"}], "search": "# 28 建设路线与学习顺序\n\n以下 90 天是参考节奏，需按团队规模、数据和审批条件调整；每个阶段以退出条件决定能否推进。\n\n## 第 1 至 15 天建立基线\n\n选择一个价值明确、权限可控的场景，例如 CRM 只读分析。梳理任务、数据来源、业务约束与人工流程，建立代表性评测集和简单实现。交付：场景说明、权限矩阵、失败分类、基线质量及成本。能解释失败原因后再扩大技术复杂度。\n\n## 第 16 至 35 天建立可运行闭环\n\n完成模型适配、工具 schema、检索权限、结构化结果、链路记录和预算。引入异常、恶意文档及缺失数据测试。交付：可重复部署版本、离线评测报告、故障处理和回退方案。先验证只读功能，再开放受控写入。\n\n## 第 36 至 60 天建立生产治理\n\n补齐审批、幂等、恢复、配额、凭证管理、灰度和回滚。通过进程崩溃、工具超时、审批过期及权限撤销演练。交付：运行手册、值班职责、业务验收及回归门槛。关键风险未关闭时，不扩大自动执行范围。\n\n## 第 61 至 90 天形成复用平台\n\n接入第二个场景，识别真正可共用的模型、工具、知识、技能和评测服务。比较多 Agent、优化器或微调的增量价值。交付：共享能力目录、第二场景上线记录、迁移清单和成本账单。复用减少接入工作量后，才说明平台化产生效果。\n\n## 架构师学习路径\n\n先掌握 C001–C018、C043–C048 和 C073–C090，理解能力与责任边界；再学习上下文、知识、记忆和编排；随后掌握评测、成本、发布与模型优化。协议以版本化实现为单位学习，前沿论文以可复现实验为单位学习。\n\n## 高级开发人员的四个实践作业\n\n实现一个带证据的检索工具；实现一个重试不会重复写入的业务工具；实现一个崩溃后可恢复且审批不会越权的任务；建立一套能发现退化的独立评测。完成这四项，再扩展多 Agent 与自动优化，基础会更稳。"}, {"id": "ch-29", "number": 29, "title": "29 架构评审与趋势判断清单", "intro": "", "sections": [{"id": "ch-29-s0", "title": "十个必须能回答的问题", "html": "<ol><li>哪些步骤需要模型判断，哪些步骤可以确定性执行？最简单基线是什么？<\/li><li>事实来自哪里，如何检查更新时间、证据位置和访问权限？<\/li><li>Agent 代表谁执行，允许读什么、写什么，怎样撤销授权？<\/li><li>工具超时、重复消息和任务恢复后，如何避免重复副作用？<\/li><li>上下文、业务状态和长期记忆分别存在哪里，怎样删除与隔离？<\/li><li>成功如何定义，测试集是否独立，哪些错误绝不能接受？<\/li><li>每次成功成本和尾部时延是多少，预算不足如何安全降级？<\/li><li>发布哪些组合版本，如何灰度、追溯、回滚及停用？<\/li><li>增加子 Agent、反思、图检索或微调后，有什么实测增益？<\/li><li>模型或框架停止服务时，状态、知识、工具及评测能否迁移？<\/li><\/ol>"}, {"id": "ch-29-s1", "title": "趋势判断的证据层级", "html": "<p>官方公告决定“已弃用或到期”；规范及产品文档说明“当前支持”；论文证明“特定设置下可行”；跨任务企业实测才支持“适合本业务”。技术流行度和市场主流预测不等于这些证据。每季度复核依赖版本和迁移窗口。<\/p>"}, {"id": "ch-29-s2", "title": "应持续投入的能力", "html": "<p>高置信判断：权限与工具契约、证据与数据治理、评测与可观测性、任务状态与可靠执行仍是企业基础。中等置信判断：上下文工程、技能复用、托管运行时及 Agent 与流程组合会进一步发展。具体产品份额、统一记忆协议和完全自主多 Agent 组织仍有较高不确定性。<\/p>"}, {"id": "ch-29-s3", "title": "需要减少依赖的做法", "html": "<p>超长万能 Prompt、无约束自动循环、把向量库当全部记忆、仅靠模型自评、无证据的自报置信度、让 Agent 自改安全门槛，以及为了角色数量拆分任务，均不宜作为平台默认设计。这是工程适用性判断，不是宣布对应技术已经被官方弃用。<\/p>"}, {"id": "ch-29-s4", "title": "掌握标准", "html": "<p>能定义概念只是第一步。达到架构师要求，需要解释替代方案、指出失败模式、设计验证方法并给出迁移路径；达到高级开发要求，需要能够实现、观测、故障演练并维护这些边界。<\/p>"}], "search": "# 29 架构评审与趋势判断清单\n\n## 十个必须能回答的问题\n\n1. 哪些步骤需要模型判断，哪些步骤可以确定性执行？最简单基线是什么？\n2. 事实来自哪里，如何检查更新时间、证据位置和访问权限？\n3. Agent 代表谁执行，允许读什么、写什么，怎样撤销授权？\n4. 工具超时、重复消息和任务恢复后，如何避免重复副作用？\n5. 上下文、业务状态和长期记忆分别存在哪里，怎样删除与隔离？\n6. 成功如何定义，测试集是否独立，哪些错误绝不能接受？\n7. 每次成功成本和尾部时延是多少，预算不足如何安全降级？\n8. 发布哪些组合版本，如何灰度、追溯、回滚及停用？\n9. 增加子 Agent、反思、图检索或微调后，有什么实测增益？\n10. 模型或框架停止服务时，状态、知识、工具及评测能否迁移？\n\n## 趋势判断的证据层级\n\n官方公告决定“已弃用或到期”；规范及产品文档说明“当前支持”；论文证明“特定设置下可行”；跨任务企业实测才支持“适合本业务”。技术流行度和市场主流预测不等于这些证据。每季度复核依赖
